<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地方特考三等｜資訊處理・資訊管理 考古題詳解</title>
<style>/* ===== 關務四等考古題複習系統 — 樣式 ===== */

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink:        #1a1f2c;
  --ink-soft:   #3d4456;
  --paper:      #f4f1ea;
  --paper-warm: #ece6d8;
  --card:       #fffdf8;
  --line:       #d8d0bf;
  --accent:     #8a3324;   /* 朱紅 — 印章色 */
  --accent-2:   #1f5673;   /* 靛藍 */
  --gold:       #a07e2c;
  --shadow:     rgba(40,32,20,0.13);

  /* 主題分類色 */
  --t-db:   #1f5673;
  --t-ds:   #6a4c93;
  --t-prog: #2d6a4f;
  --t-sec:  #8a3324;
  --t-net:  --t-net;
  --t-net-c:#b5651d;
  --t-mis:  #4a5859;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(138,51,36,0.025) 31px, rgba(138,51,36,0.025) 32px);
}

/* ===== 頁首 ===== */
.site-header {
  background: var(--ink);
  color: var(--paper);
  padding: 2.4rem 1.5rem 2rem;
  text-align: center;
  border-bottom: 4px solid var(--accent);
  position: relative;
}
.site-header .kicker {
  font-size: .78rem; letter-spacing: .55em; text-indent: .55em;
  color: var(--gold); font-weight: 700; margin-bottom: .7rem;
}
.site-header h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900; font-size: clamp(1.6rem, 4.4vw, 2.7rem);
  letter-spacing: .06em; line-height: 1.3;
}
.site-header h1 .stamp {
  display: inline-block; border: 2.5px solid var(--accent);
  color: var(--accent); padding: .05em .3em; border-radius: 6px;
  transform: rotate(-4deg); margin: 0 .15em;
  font-size: .82em; background: rgba(244,241,234,0.06);
}
.site-header .sub {
  margin-top: .8rem; font-size: .9rem; color: #b8bcca; font-weight: 400;
  letter-spacing: .04em;
}

/* ===== 統計列 ===== */
.stat-bar {
  display: flex; justify-content: center; gap: 2.5rem; flex-wrap: wrap;
  background: var(--paper-warm); padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.stat-bar .stat { text-align: center; }
.stat-bar .num {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1.7rem; color: var(--accent); line-height: 1;
}
.stat-bar .lbl {
  font-size: .72rem; color: var(--ink-soft); letter-spacing: .15em;
  margin-top: .25rem;
}

/* ===== 控制列 ===== */
.controls {
  position: sticky; top: 0; z-index: 50;
  background: rgb(244,241,234);
  border-bottom: 1.5px solid var(--line);
  padding: .9rem 1.5rem;
  box-shadow: 0 3px 14px var(--shadow);
}
.controls-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.mode-switch {
  display: flex; border: 2px solid var(--ink); border-radius: 8px;
  overflow: hidden;
}
.mode-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem 1.1rem; font-size: .88rem; font-weight: 700;
  color: var(--ink); transition: all .18s;
}
.mode-switch button.active { background: var(--ink); color: var(--paper); }

.search-box {
  flex: 1; min-width: 180px; position: relative;
}
.search-box input {
  width: 100%; font-family: 'Noto Sans TC', sans-serif;
  padding: .55rem .9rem .55rem 2.2rem; font-size: .9rem;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink);
}
.search-box input:focus { outline: 2px solid var(--accent-2); border-color: transparent; }
.search-box::before {
  content: '🔍'; position: absolute; left: .7rem; top: 50%;
  transform: translateY(-50%); font-size: .85rem; opacity: .5;
}
.btn-expand {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--ink-soft); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 8px;
  padding: .5rem .9rem; font-size: .82rem; font-weight: 500;
  white-space: nowrap; transition: all .15s;
}
.btn-expand:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ===== 篩選晶片 ===== */
.filter-row {
  max-width: 1080px; margin: .7rem auto 0;
  display: flex; gap: .45rem; flex-wrap: wrap;
}
.chip {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 20px;
  padding: .3rem .85rem; font-size: .8rem; font-weight: 500;
  transition: all .15s;
}
.chip:hover { border-color: var(--ink-soft); }
.chip.active {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
}
.chip .c-count { opacity: .6; font-size: .92em; margin-left: .2em; }

/* ===== 主內容 ===== */
.wrap { max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

/* 群組標題（年度 / 主題） */
.group {
  margin-bottom: 2.6rem;
}
.group-head {
  display: flex; align-items: center; gap: .9rem;
  margin-bottom: 1.1rem; padding-bottom: .6rem;
  border-bottom: 2.5px solid var(--ink);
}
.group-head .g-badge {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  background: var(--ink); color: var(--paper);
  padding: .35rem .8rem; border-radius: 6px; font-size: 1.05rem;
  white-space: nowrap;
}
.group-head .g-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.15rem; color: var(--ink);
}
.group-head .g-meta {
  margin-left: auto; font-size: .76rem; color: var(--ink-soft);
  text-align: right; line-height: 1.5;
}
.group-note {
  font-size: .8rem; color: var(--accent-2); font-style: italic;
  margin: -.5rem 0 1rem; padding-left: .2rem;
}

/* ===== 題目卡 ===== */
.q-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 10px; margin-bottom: .9rem;
  box-shadow: 0 2px 8px var(--shadow);
  overflow: hidden; transition: box-shadow .2s;
}
.q-card:hover { box-shadow: 0 4px 16px var(--shadow); }

.q-header {
  display: flex; align-items: flex-start; gap: .8rem;
  padding: 1rem 1.2rem; cursor: pointer;
  border-left: 5px solid var(--line);
  transition: background .15s;
}
.q-card.t-db   .q-header { border-left-color: var(--t-db); }
.q-card.t-ds   .q-header { border-left-color: var(--t-ds); }
.q-card.t-prog .q-header { border-left-color: var(--t-prog); }
.q-card.t-sec  .q-header { border-left-color: var(--t-sec); }
.q-card.t-net  .q-header { border-left-color: var(--t-net-c); }
.q-card.t-mis  .q-header { border-left-color: var(--t-mis); }
.q-header:hover { background: var(--paper-warm); }

.q-no {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1rem; color: var(--paper); background: var(--ink-soft);
  min-width: 2.4rem; height: 2.4rem; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.q-headmain { flex: 1; min-width: 0; }
.q-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.02rem; color: var(--ink); line-height: 1.5;
}
.q-tags {
  display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .4rem;
  align-items: center;
}
.tag {
  font-size: .7rem; font-weight: 700; padding: .12rem .55rem;
  border-radius: 4px; letter-spacing: .03em;
}
.tag-topic { color: #fff; }
.t-db   .tag-topic, .tag.topic-db   { background: var(--t-db); }
.t-ds   .tag-topic, .tag.topic-ds   { background: var(--t-ds); }
.t-prog .tag-topic, .tag.topic-prog { background: var(--t-prog); }
.t-sec  .tag-topic, .tag.topic-sec  { background: var(--t-sec); }
.t-net  .tag-topic, .tag.topic-net  { background: var(--t-net-c); }
.t-mis  .tag-topic, .tag.topic-mis  { background: var(--t-mis); }
.tag-year {
  background: var(--paper-warm); color: var(--ink-soft);
  border: 1px solid var(--line);
}
.tag-score {
  background: transparent; color: var(--gold);
  border: 1px solid var(--gold);
}
.tag-part {
  background: var(--accent-2); color: #fff;
  font-weight: 500;
}
.q-toggle {
  flex-shrink: 0; font-size: 1.3rem; color: var(--ink-soft);
  transition: transform .25s; line-height: 1; margin-top: .4rem;
}
.q-card.open .q-toggle { transform: rotate(45deg); }

/* ===== 題目展開內容 ===== */
.q-body { display: none; padding: 0 1.2rem 1.4rem; }
.q-card.open .q-body { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.section-label {
  display: inline-block; font-family: 'Noto Serif TC', serif;
  font-weight: 700; font-size: .82rem; letter-spacing: .1em;
  padding: .25rem .8rem; border-radius: 4px; margin: 1.1rem 0 .6rem;
}
.section-label.q { background: var(--ink); color: var(--paper); }
.section-label.a { background: var(--accent); color: var(--paper); }

.q-question {
  background: var(--paper-warm); border-left: 3px solid var(--ink-soft);
  padding: .9rem 1.1rem; border-radius: 0 6px 6px 0;
  font-size: .93rem; white-space: pre-wrap; color: var(--ink-soft);
  font-feature-settings: "tnum";
}
.q-answer {
  font-size: .95rem; color: var(--ink);
}
.q-answer h4 {
  font-family: 'Noto Serif TC', serif; color: var(--accent);
  font-size: 1rem; margin: 1.1rem 0 .4rem;
  border-bottom: 1px dashed var(--line); padding-bottom: .2rem;
}
.q-answer p { margin: .55rem 0; }
.q-answer ul, .q-answer ol { margin: .5rem 0 .5rem 1.4rem; }
.q-answer li { margin: .3rem 0; }
.q-answer strong { color: var(--accent-2); font-weight: 700; }
.q-answer code {
  font-family: 'JetBrains Mono', monospace; font-size: .86em;
  background: var(--paper-warm); padding: .1em .35em;
  border-radius: 3px; color: var(--accent);
}
.q-answer table {
  border-collapse: collapse; width: 100%; margin: .8rem 0;
  font-size: .86rem;
  display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;  /* MOBILE_TABLE：手機寬度下表格可左右捲動 */
}
.q-figure { max-width: 100%; overflow-x: auto; }
.q-answer th, .q-answer td {
  border: 1px solid var(--line); padding: .4rem .6rem;
  text-align: left;
}
.q-answer th {
  background: var(--ink); color: var(--paper); font-weight: 700;
}
.q-answer tr:nth-child(even) td { background: var(--paper-warm); }

/* 程式碼/ASCII 區塊 */
.q-answer pre {
  background: #2b303b; color: #f2f0e9;
  font-family: 'JetBrains Mono', monospace; font-size: .85rem;
  line-height: 1.7; padding: 1rem 1.2rem; border-radius: 8px;
  overflow-x: auto; margin: .8rem 0;
  border-left: 3px solid var(--gold);
}
.q-answer pre code { background: none; color: inherit; padding: 0; }

/* 獨立程式碼區（code 欄位） */
.code-block {
  margin: 1rem 0; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--ink);
}
.code-head {
  background: var(--ink); color: var(--gold);
  font-family: 'JetBrains Mono', monospace; font-size: .76rem;
  padding: .4rem .9rem; font-weight: 500;
  display: flex; justify-content: space-between; align-items: center;
}
.code-head .dots { display: flex; gap: .3rem; }
.code-head .dots span {
  width: .6rem; height: .6rem; border-radius: 50%; display: block;
}
.code-head .dots span:nth-child(1) { background: #d4554a; }
.code-head .dots span:nth-child(2) { background: #d9a441; }
.code-head .dots span:nth-child(3) { background: #5a9e6f; }
.code-block pre {
  margin: 0; border-radius: 0; border-left: none;
  background: #2b303b;            /* 提亮背景，降低與文字的明度落差刺眼感 */
  color: #f2f0e9;                 /* 預設文字（變數、標點）改為近白，清楚可見 */
  font-size: .86rem; line-height: 1.7;
  padding: 1.1rem 1.3rem 1.1rem 1.7rem;   /* 左側多留白，程式碼不貼邊、不壓迫 */
}
/* 語法highlight — 高對比配色，深背景下皆清晰 */
.tok-kw  { color: #ff9d6f; font-weight: 700; }   /* 關鍵字：亮橘，最醒目 */
.tok-str { color: #b8e986; }                      /* 字串：亮綠 */
.tok-com { color: #9aa6b8; font-style: italic; }  /* 註解：提亮的灰藍，不再灰到看不見 */
.tok-num { color: #f7d56e; }                      /* 數字：亮黃 */
.tok-fn  { color: #82c8ff; }                      /* 函式：亮藍 */
.tok-typ { color: #ffd166; }                      /* 型別：金黃 */

/* ===== HTML 圖表（取代易跑版的 ASCII 圖）===== */
.html-diagram {
  margin: 1.1rem 0; padding: 1.3rem 1rem;
  background: var(--paper-warm);
  border: 1.5px solid var(--line); border-radius: 10px;
  overflow-x: auto;
}
/* 通用方框節點 */
.dg-box {
  display: inline-flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center;
  border: 2px solid var(--ink); border-radius: 8px;
  background: var(--card); padding: .55rem .9rem;
  font-size: .86rem; line-height: 1.5; font-weight: 500;
  min-width: 5.5rem;
}
.dg-box .dg-sub { font-size: .73rem; color: var(--ink-soft); font-weight: 400; }
.dg-box.accent { border-color: var(--accent); background: #fbf3f0; }
.dg-box.blue   { border-color: var(--accent-2); background: #eef4f7; }
.dg-box.gold   { border-color: var(--gold); background: #faf5e6; }
.dg-box.ink    { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dg-box.ink .dg-sub { color: #b8bcca; }

/* 排列容器 */
.dg-row { display: flex; align-items: center; justify-content: center;
  gap: .5rem; flex-wrap: wrap; }
.dg-col { display: flex; flex-direction: column; align-items: center;
  gap: .5rem; }
.dg-center { justify-content: center; }

/* 箭頭 */
.dg-arrow { font-size: 1.3rem; color: var(--accent); font-weight: 700;
  line-height: 1; padding: 0 .15rem; }
.dg-arrow.v { transform: rotate(90deg); margin: .1rem 0; }
.dg-arrow.bi::before { content: '◀▶'; }
.dg-arrow.down::before { content: '▼'; }
.dg-arrow.right::before { content: '▶'; }

/* 流程圖專用 */
.flow { display: flex; flex-direction: column; align-items: center; gap: 0; }
.flow-node {
  border: 2px solid var(--ink); background: var(--card);
  padding: .55rem 1.1rem; font-size: .86rem; text-align: center;
  font-weight: 500; max-width: 32rem; line-height: 1.55;
}
.flow-node.start, .flow-node.end {
  border-radius: 22px; background: var(--ink); color: var(--paper);
  font-weight: 700;
}
.flow-node.process { border-radius: 6px; }
.flow-node.io {
  border-radius: 6px; background: var(--paper-warm);
  border-style: dashed;
}
.flow-node.decision {
  background: #faf5e6; border-color: var(--gold);
  border-radius: 6px; font-weight: 700;
}
/* 連接線（直線 + 箭頭） */
.flow-conn { width: 2px; height: 1.6rem; background: var(--ink-soft);
  position: relative; }
.flow-conn::after {
  content: '▼'; position: absolute; bottom: -.3rem; left: 50%;
  transform: translateX(-50%); color: var(--ink-soft); font-size: .68rem;
}
/* 連接線旁的小標籤（如「否」「未出貨訂單」） */
.flow-edge {
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.flow-edge .lbl {
  font-size: .74rem; font-weight: 700; padding: .08rem .55rem;
  border-radius: 4px; position: relative; z-index: 1;
}
.flow-edge .lbl.yes { background: #2d6a4f; color: #fff; }
.flow-edge .lbl.no  { background: var(--accent); color: #fff; }
.flow-edge .lbl.plain {
  background: var(--card); color: var(--accent-2);
  border: 1px solid var(--line);
}
.flow-conn.short { height: .7rem; }
.flow-conn.short::after { display: none; }

/* 迴圈返回標記 —— 掛在決策節點下方，明確標示「往回」 */
.flow-loop {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .76rem; font-weight: 700;
  background: #eef4f7; color: var(--accent-2);
  border: 1.5px dashed var(--accent-2); border-radius: 20px;
  padding: .25rem .8rem; margin: .35rem 0;
}
.flow-loop::before { content: '⟲'; font-size: 1.05rem; }

.flow-label {
  font-size: .73rem; color: var(--accent-2); font-weight: 600;
  background: var(--card); padding: 0 .4rem; margin: .15rem 0;
}
/* 舊版分支樣式（保留相容，僅用於少數真正左右並排的場景） */
.flow-branch { display: flex; align-items: flex-start; gap: 2.5rem;
  justify-content: center; }
.flow-branch-arm { display: flex; flex-direction: column;
  align-items: center; gap: 0; }
.flow-yes, .flow-no {
  font-size: .76rem; font-weight: 700; padding: .1rem .5rem;
  border-radius: 4px; margin: .2rem 0;
}
.flow-yes { background: #2d6a4f; color: #fff; }
.flow-no  { background: var(--accent); color: #fff; }

/* ERD 專用形狀 */
.erd-entity {
  border: 2px solid var(--ink); background: var(--card);
  padding: .5rem 1.1rem; font-weight: 700; font-size: .9rem;
  border-radius: 4px; text-align: center;
}
.erd-rel {
  display: inline-flex; align-items: center; justify-content: center;
  width: 7rem; height: 4rem; background: #faf5e6;
  border: 2px solid var(--gold);
  transform: rotate(45deg); margin: 1rem;
}
.erd-rel > span {
  transform: rotate(-45deg); font-size: .8rem; font-weight: 700;
  text-align: center; line-height: 1.3;
}
.erd-attr {
  display: inline-block; border: 1.5px solid var(--accent-2);
  background: #eef4f7; border-radius: 50%;
  padding: .35rem .8rem; font-size: .76rem; text-align: center;
  color: var(--accent-2);
}
.empty .big { font-size: 2.5rem; margin-bottom: .5rem; }

/* 回頂部 */
.to-top {
  position: fixed; right: 1.5rem; bottom: 1.5rem;
  width: 3rem; height: 3rem; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 14px var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .25s;
  z-index: 60;
}
.to-top.show { opacity: 1; pointer-events: auto; }

/* 頁尾 */
.site-footer {
  background: var(--ink); color: #9aa0b0;
  text-align: center; padding: 2rem 1.5rem;
  font-size: .8rem; line-height: 1.8;
}
.site-footer strong { color: var(--gold); }

/* 手機 */
@media (max-width: 640px) {
  .stat-bar { gap: 1.4rem; }
  .controls-inner { gap: .6rem; }
  .search-box { order: 3; flex-basis: 100%; }
  .group-head { flex-wrap: wrap; }
  .group-head .g-meta { margin-left: 0; flex-basis: 100%; text-align: left; }
  .q-answer table { font-size: .78rem; }
  .q-answer pre, .code-block pre { font-size: .74rem; }
}

/* ===== 搜尋強化 / 跳轉面板（新增） ===== */
.search-box input { padding-right: 2.2rem; }
.search-clear {
  position: absolute; right: .35rem; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; color: var(--ink-soft);
  font-size: 1.05rem; line-height: 1; cursor: pointer;
  padding: .25rem .45rem; border-radius: 50%; display: none;
}
.search-clear.show { display: block; }
.search-clear:hover { background: var(--paper-warm); }
.search-info {
  max-width: 1100px; margin: .55rem auto 0;
  font-size: .8rem; color: var(--ink-soft); display: none;
}
.search-info.show { display: block; }

#### 二、為何需要雙軸轉型

1. **法規與市場壓力**：歐盟碳邊境調整機制（CBAM）、供應鏈減碳要求、上市櫃公司永續資訊揭露與溫室氣體盤查時程，使碳排放成為進入市場與維持訂單的條件。
2. **投資人與客戶期待**：ESG 評等影響融資成本與品牌，品牌客戶要求供應商提供產品碳足跡。
3. **只做單軸效果有限**：只做數位化，可能增加資料中心與設備耗能；只做減碳，若缺乏即時數據，就難以量測、驗證與持續改善。
4. **成本與韌性**：能源價格波動、極端氣候造成營運中斷，需要用數據與智慧化提高資源使用效率與營運韌性。
5. **機會面**：綠色產品與服務、碳資產管理、循環經濟可成為新商業模式，而數位平台是承載這些模式的基礎。

#### 三、兩軸之間的關聯

| 方向 | 說明 | 例子 |
| --- | --- | --- |
| 數位賦能綠色 | 以感測、數據與 AI 讓排放可量測、可預測、可最佳化 | IoT 電表與能源管理系統（EMS）、AI 空調與製程最佳化、碳盤查與產品碳足跡系統、智慧物流減少空駛 |
| 綠色牽引數位 | 減碳與揭露需求帶動資料整合與系統投資 | 為了取得供應商排放資料，而建置供應鏈平台；為了 ESG 報告，而建置統一資料倉儲 |
| 數位本身的環境成本 | 資料中心、AI 訓練、電子廢棄物也會產生碳排 | 選用節能雲端區域、虛擬化整併、延長設備壽命、綠色採購 |
| 共同基礎 | 兩者都靠治理、數據品質、人才與高階承諾 | 同一個數據平台同時支援營運分析與碳管理 |

簡言之，兩軸是「雙向強化、但也有取捨」的關係：數位是工具、綠色是目標之一，而數位自身也要綠色化。

#### 四、推動時最常遇到的挑戰

| 挑戰面向 | 具體問題 | 因應方向 |
| --- | --- | --- |
| 策略與治理 | 數位與永續由不同部門主導，目標與預算衝突，缺少高階統籌 | 成立跨部門委員會，由高階主管負責，設定整合 KPI（例如每單位產出的碳排） |
| 數據 | 資料分散、格式不一，排放係數與範疇三（供應鏈）資料難取得，數據可信度不足 | 建立資料治理與主數據、導入碳管理平台、供應商資料協作、第三方查證 |
| 資金與投資報酬 | 初期投資高，效益（尤其是環境效益）難以貨幣化 | 分階段試點、以節能與效率回收效益、運用政府補助與綠色融資、內部碳定價 |
| 技術與人才 | 同時懂數位、能源與永續的人才稀少，既有系統老舊 | 內部培訓、外部顧問與生態系夥伴、模組化架構 |

| 供應鏈 | 中小供應商能力不足，難以配合 | 提供工具與輔導、共同投資、分級管理 |

#### 五、結論

雙軸轉型不是兩個專案，而是同一個企業策略的兩個面向：以數位工具使減碳「看得見、管得動」，再以永續需求為數位投資提供明確目標。建議企業先以高排放或高耗能流程作為示範場域，建立共同數據平台與治理機制，再逐步擴大至供應鏈。`

      question: `人工智慧治理（AI Governance，以下簡稱 AI 治理）是目前政府與企業無法迴避的重要議題之一。請問何謂 AI 治理？為何需要 AI 治理？AI 治理的核心原則有那些？推動 AI 治理最常遇見的困難有那些？（25 分）`,
      answer: `#### 一、何謂 AI 治理

AI 治理（AI Governance）是指組織或政府針對 AI 系統的**整個生命週期**（規劃、資料、開發、驗證、部署、監控、退場），建立的政策、組織角色、流程、技術控制與法規框架，目的是讓 AI 的使用**合法、負責、安全、可信**，並與組織目標及社會價值一致。它包含兩個層次：

| 層次 | 內容 | 例子 |
| --- | --- | --- |
| 國家與政府層 | 立法、監管、標準與公共採購規範 | 歐盟 AI 法（依風險分級管理）、我國人工智慧基本法（114 年 12 月三讀通過）與行政院相關指引 |
| 組織層 | 內部政策、治理委員會、風險管理與稽核 | AI 使用政策、模型清冊、影響評估、上線審查、事件通報 |

#### 二、為何需要 AI 治理

1. **AI 的特性帶來新風險**：模型偏誤造成歧視、生成式 AI 的幻覺與錯誤資訊、黑箱難以解釋、資料外洩與個資濫用、智慧財產權爭議、被攻擊（提示注入、資料投毒、模型竊取）。
2. **影響範圍廣、規模化放大**：一個有偏誤的模型會在短時間內影響大量民眾，例如信用評分、社福審查、人力招募。
3. **法規與合規壓力**：隱私、消費者保護、公平交易及各國 AI 規範要求透明與課責。
4. **信任與聲譽**：民眾與客戶是否信任 AI 決策，直接影響採用與品牌。
5. **政府更需要治理**：公部門決策涉及公共利益與人民權利，需符合行政程序、可說明、可救濟。
6. **影子 AI**：員工自行使用外部生成式 AI 工具，可能把機密或個資輸入外部服務。

#### 三、AI 治理的核心原則

各國際組織（OECD AI 原則、歐盟可信賴 AI 倫理準則、我國 AI 研發指引等）用語不同，但歸納如下：

| 原則 | 意義 | 落實做法 |
| --- | --- | --- |
| 公平與不歧視 | 避免對特定族群產生偏見 | 資料代表性檢查、偏誤測試、公平性指標 |
| 透明與可解釋 | 讓使用者知道正在與 AI 互動，且能理解決策依據 | 模型文件（model card）、可解釋 AI（XAI）、AI 生成內容標示 |
| 課責與可歸責 | 明確誰對 AI 結果負責 | 責任矩陣（RACI）、決策留痕、申訴與救濟機制 |
| 隱私與資料治理 | 合法蒐集與使用資料，資料品質可控 | 資料最小化、去識別化、同意管理、資料血緣 |
| 安全與穩健 | 系統可靠、抗攻擊、可持續運作 | 紅隊演練、對抗測試、監控與回退機制、資安防護 |
| 人類監督 | 重要決策保留人為介入與否決 | 人在迴路（human-in-the-loop）、高風險決策人工覆核 |
| 永續與社會福祉 | 考量環境、就業與公共利益 | 能耗評估、影響評估、利害關係人參與 |

#### 四、組織推動 AI 治理的架構

\`\`\`htmldiagram
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:'Noto Sans TC',sans-serif;font-size:13px;margin:.4rem 0"><span style="background:#1f5673;color:#fff;padding:5px 10px;border-radius:6px">策略與政策<br><small>AI 使用政策、風險胃納</small></span><span>→</span><span style="background:#8a3324;color:#fff;padding:5px 10px;border-radius:6px">組織<br><small>治理委員會、角色課責</small></span><span>→</span><span style="background:#2f6b4f;color:#fff;padding:5px 10px;border-radius:6px">風險分級<br><small>依影響程度分級管理</small></span><span>→</span><span style="background:#6a4c93;color:#fff;padding:5px 10px;border-radius:6px">生命週期控制<br><small>資料、開發、驗證、上線</small></span><span>→</span><span style="background:#a07e2c;color:#fff;padding:5px 10px;border-radius:6px">監控稽核<br><small>績效、偏誤、事件、稽核</small></span></div>
\`\`\`

重點做法：建立 AI 資產清冊與風險分級（高風險系統需影響評估與人工覆核）、導入 ISO/IEC 42001（AI 管理系統）與 NIST AI RMF 等框架、採購與委外契約納入 AI 條款、員工教育訓練與生成式 AI 使用規範。

#### 五、最常遇到的困難

#### 一、先釐清責任歸屬：通報義務人是「機關」

#### 二、整體處理流程

#### 三、步驟說明

**步驟 1　受理與紀錄（立即）**

- 記錄接獲時間、通報人、廠商聯絡窗口，並要求廠商先提供：事件發現時間、受影響系統與資料、已採取措施、是否已涉及機關環境（例如維運帳號、VPN、程式碼庫、測試環境含正式資料）。
- 要求廠商**保全證據**（日誌、記憶體映像、受影響主機映像），不要在未採證前重新安裝或刪除檔案。
- 先通知機關資安長、單位主管與系統業務承辦人。

**步驟 2　判斷是否影響本機關，並評估事件等級（第 2 條）**

事件分為一至四級，判斷依據是「資訊或系統的類別」與「受影響程度」：

| 等級 | 判斷條件（摘要） |
| --- | --- |
| 第 1 級 | 非核心業務資訊輕微洩漏；非核心業務資訊或非核心資通系統輕微遭竄改；非核心資通系統停頓但在可容忍中斷時間內恢復 |
| 第 2 級 | 非核心業務資訊嚴重洩漏，或未涉及關鍵基礎設施維運的核心業務資訊輕微洩漏；非核心資訊或系統遭嚴重竄改，或核心資訊／系統輕微遭竄改；非核心系統停頓無法在可容忍時間內恢復，或核心系統受影響但在可容忍時間內恢復 |
| 第 3 級 | 未涉及關鍵基礎設施維運的核心業務資訊嚴重洩漏，或一般公務機密、涉及關鍵基礎設施維運的核心業務資訊輕微洩漏；核心資訊或系統嚴重遭竄改等；核心系統停頓且無法在可容忍時間內恢復 |
| 第 4 級 | 一般公務機密或涉及關鍵基礎設施維運的核心業務資訊嚴重洩漏，或國家機密洩漏；上述資訊遭嚴重竄改或國家機密遭竄改；涉及關鍵基礎設施維運的核心資通系統停頓且無法在可容忍時間內恢復 |

第 3、4 級合稱**重大資通安全事件**（施行細則第 13 條）。若廠商的事件只發生在廠商內部環境、未影響機關資產，仍應判斷是否屬機關的資通系統、資料或服務受影響；難以判斷時，採**從嚴**原則先通報，後續再調整等級。

**步驟 3　知悉後 1 小時內通報（第 6 條）**

- 透過主管機關指定的「資通安全事件通報及應變平臺」通報；
- 通報內容（第 3 條）七項：發生機關、發生或知悉時間、狀況描述、等級評估、已採取的因應措施、外部支援需求評估、其他相關事項；
- 事件等級有變更，需依同樣規定續行通報；
- 若平臺無法使用，在同樣 1 小時內以電話、電子郵件等其他適當方式通報，註明原因，原因排除後補行平臺通報。

**步驟 4　等級審核（第 7 條）**

受通報機關（上級或監督機關）收到後，第 1、2 級事件於 8 小時內、重大事件（第 3、4 級）於 2 小時內完成審核，審核後 1 小時內通知主管機關，主管機關可再覆核並變更等級。機關須配合其指示。

**步驟 5　啟動應變、損害控制（第 5 條應變規範與第 8 條）**

依機關自訂的「資通安全事件應變作業規範」啟動應變小組：

| 面向 | 做法 |
| --- | --- |
| 隔離與阻斷 | 隔離受影響主機與網段，暫停廠商遠端維運通道與 VPN，停用或重設相關帳號、API 金鑰、憑證與密碼 |
| 證據保全 | 保存日誌、映像檔，記錄處理過程，維持證據鏈（雜湊值） |
| 範圍分析 | 與廠商共同分析入侵途徑、受影響程式碼、資料與其他機關系統；確認是否有橫向擴散 |
| 復原 | 自乾淨備份還原，重建主機，修補弱點，更換受影響的金鑰，驗證後才上線 |
| 通知與溝通 | 必要時通知受影響的其他機關或民眾（涉及個資時依個資法通知當事人），並對外統一發言 |
| 外部支援 | 若需要，向上級機關、資通安全署或 CERT/SOC 申請支援 |

**時限**：自知悉事件起算，第 1、2 級事件應於 **72 小時**內完成損害控制或復原，重大事件（第 3、4 級）於 **36 小時**內完成，並依規定方式通知受通報機關。

**步驟 6　重大事件會議**

重大事件發生後，機關資通安全長應召開會議研商應變，必要時邀請相關機關協助。

**步驟 7　調查、處理及改善報告（第 8 條）**

損害控制或復原後，持續調查處理，**於 1 個月內**將調查、處理及改善報告送交受通報機關，經同意可延長。報告內容依施行細則第 12 條：事件發生與知悉時間、損害控制或復原完成時間；影響範圍與損害評估；損害控制與復原過程；調查與處理過程；根本原因分析；防止再發生的措施、完成時程與成效追蹤機制。

#### 四、針對「委外廠商」的管理重點

依《資通安全管理法》委外規定與施行細則（現行第 7 條），機關選任及監督受託者時應：

1. **契約條款**：契約應載明受託者違反資安法令或發生資安事件時，應**立即通知委託機關**並採取補救措施，通報流程、時限（建議短於機關的 1 小時），配合調查、保全證據、提供日誌與人員的義務，以及違約責任與損害賠償。
2. **複委託管理**：確認是否有再委託、範圍與對象，以及再受託者應具備的資安維護措施。
3. **督導**：機關應定期，或於知悉受託者發生可能影響受託業務的資安事件時，以稽核或其他適當方式確認受託業務執行情形，例如審查廠商的根因分析、要求弱點掃描與源碼檢測報告、檢視權限與維運帳號。
4. **系統安全**：客製化系統開發，受託者應提供安全檢測證明；核心資通系統或委託金額達一定額度者，機關須自行或另委託第三方檢測。
5. **終止或解除契約**：確認受託者返還、移交、刪除或銷毀持有的機關資料。

風險的定義：尚未發生、一旦發生會對專案目標（範圍、時程、成本、品質）產生影響的不確定事件。風險由「發生機率」與「影響程度」構成；問題（issue）則是已經發生的風險。

#### 二、風險辨識的方法

| 方法 | 做法 | 特點 |
| --- | --- | --- |
| 腦力激盪（Brainstorming） | 團隊與利害關係人集體提出可能風險 | 快速、廣度大，但受主導者影響 |

| 訪談與專家判斷 | 訪談專案經理、技術人員、使用者、廠商 | 可得到深入細節 |
| SWOT 分析 | 從優勢、劣勢、機會、威脅找出風險 | 適合策略面風險 |
| 假設與限制分析 | 檢視計畫假設是否合理 | 找出隱性風險 |
| 文件與計畫審查 | 檢視需求、WBS、時程、架構、合約 | 發現計畫缺陷 |
| 因果圖（魚骨圖）與根因分析 | 追溯風險成因 | 協助找出系統性風險來源 |
| 原型與模擬 | 先做原型或技術驗證 | 暴露技術與需求風險 |

典型軟體專案風險：需求變動或不明確、人員流失、估算過於樂觀、技術不成熟、介面整合困難、廠商延遲、使用者參與不足、品質與資安缺陷。

#### 三、風險分析與優先順序

**1. 定性分析**：評估發生機率（P）與影響（I），常用 1～5 分等級，以風險矩陣顯示：

| 機率＼影響 | 低 | 中 | 高 |
| --- | --- | --- | --- |
| 高 | 中度 | 高度 | 極高 |
| 中 | 低度 | 中度 | 高度 |
| 低 | 低度 | 低度 | 中度 |

**2. 定量分析**：

- 風險暴露（Risk Exposure, RE）＝ 發生機率 × 損失金額（或天數）。
- 預期貨幣價值（EMV）、決策樹分析、敏感度分析（龍捲風圖）、蒙地卡羅模擬（對時程與成本進行模擬）。

**例子**（簡化示範）：

| 風險 | 機率 | 損失（萬元） | RE（萬元） | 順位 |
| --- | --- | --- | --- | --- |
| 需求大幅變更 | 0.4 | 500 | 200 | 1 |
| 外部介面延遲 | 0.6 | 100 | 60 | 2（與下列同為 60，但發生機率高且較早發生，故優先） |
| 核心人員離職 | 0.2 | 300 | 60 | 3 |

**3. 優先順序排序**：依 RE 由高到低排序，並輔以：
- 發生時間的緊迫性（近期發生者優先）；
- 可偵測性（難以提早發現者提高優先度，如 FMEA 的風險優先數 RPN＝嚴重度×發生度×偵測度）；
- 影響範圍是否為專案關鍵路徑；
- 處置成本與效益（處置成本不應高於風險暴露）；
- 由此產生「前十大風險清單（Top 10 Risk List）」，作為管理重點與定期報告項目。

#### 四、風險處置方法與適用時機

| 方法 | 做法 | 適用時機 | 例子 |
| --- | --- | --- | --- |
| 避免（Avoid） | 改變計畫、範圍或做法，使風險不發生 | 風險機率與影響都很高，且有替代方案、代價可接受 | 不採用尚不成熟的技術，改用成熟產品；縮減範圍 |
| 減輕（Mitigate） | 降低發生機率或影響 | 風險無法避免、但可控；最常見的方法 | 增加原型與測試、導入持續整合、培訓備援人員、分階段交付 |
| 轉移（Transfer） | 將風險或其後果交由第三方承擔 | 損失可以量化，且第三方較有能力承擔；影響大、機率低 | 購買保險、契約採固定價格與保固、委外並明定罰則（責任仍需自行管理） |
| 接受（Accept） | 不採取行動，只監控；或預留應變計畫與預備金 | 影響小、或處置成本高於損失；或無法再降低 | 被動接受並預留時程與成本預備金；主動接受則制定應變計畫（Contingency Plan） |

選擇原則：先看風險等級，再比較處置成本與效益。高風險先考慮避免或減輕；殘餘風險考慮轉移；低風險接受並監控。處置後須重新評估是否產生**次生風險**（因處置而引入的新風險）與**殘餘風險**。

#### 一、防護需求等級分為「普、中、高」三級

| --- | --- |
| 普 | 系統資料或功能遭洩漏、竄改或中斷時，對機關營運、資產或信譽僅造成輕微或短暫的影響；法律遵循性方面，僅屬一般法令規範 |
| 中 | 造成嚴重的不利影響；或未確實遵循法令，將使機關或人員受到行政罰、懲戒或懲處 |
| 高 | 造成非常嚴重或災難性的影響；或未遵循法令導致系統無法完成任務，或機關及其人員須負刑事責任 |

等級關係是**累加**的：中級要執行「普級的所有措施」再加上中級新增措施；高級要執行「中級所有措施」再加上高級新增措施。

#### 二、附表十的構面

防護基準共分七個構面：存取控制、稽核與可歸責性、營運持續計畫、識別與鑑別、系統與服務獲得、系統與通訊保護、系統與資訊完整性。本題問的是第一個與第四個構面。

#### 三、存取控制構面：帳號管理

| 等級 | 防護措施 |
| --- | --- |
| 普 | 建立帳號管理機制，包含帳號的申請、建立、修改、啟用、停用及刪除之程序 |
| 中（本題重點） | 先完成普級所有措施，再加上：（一）已逾期的臨時或緊急帳號應刪除或禁用；（二）資通系統閒置帳號應禁用；（三）定期審核資通系統帳號的申請、建立、修改、啟用、停用及刪除之適當性 |
| 高 | 完成中級所有措施，再加上：定義系統的閒置時間或可使用期限，超過即自動登出；依機關規定的情況及條件（如特定時段、來源 IP）使用系統；監控帳號，發現異常使用時回報管理者 |

中級帳號管理的實務做法：
- **臨時、緊急帳號**：開通時就設定到期日（例如廠商維運帳號、救援帳號），到期自動停用，完成事件後立即移除。
- **閒置帳號**：依機關規定的期間（常見為 90 天或更短）未登入者自動停用；離職、調職人員的帳號即時停用。
- **定期審核**：每季或每半年由系統管理者與業務單位主管清查帳號清冊，確認是否有不當權限、共用帳號、離職未刪除、過高權限，並留存審核紀錄。
- 搭配**最小權限原則**與權限分離。

| 中（本題重點） | 先完成普級所有措施，再加上：（一）身分驗證相關資訊不以明文儲存（密碼應以雜湊並加鹽或加密方式保存）；（二）密碼重設機制，對使用者重新確認身分後，發送一次性且具有時效性的符記（token）；（三）防範自動化程式的登入或密碼更換嘗試（如驗證碼 CAPTCHA、登入速率限制、異常 IP 阻擋） |
| 高 | 完成中級所有措施，再加上：對帳號登入採用多重認證（MFA） 技術 |

#### 三、為什麼要分成不同階段（10 分）

1. **分而治之，降低複雜度**：大型系統一次處理所有問題困難，分階段後每個階段只專注一類問題。
2. **抽象層次逐步細化**：先決定「要什麼」，再決定「邏輯怎麼運作」，最後才決定「用什麼技術」，避免太早陷入技術細節而偏離需求，也使需求不受特定技術綁定。
3. **及早發現錯誤、降低成本**：錯誤越晚發現，修正成本越高（Boehm 的變更成本曲線，需求階段的錯誤到維護階段才發現，成本可能放大數十倍）。分階段並在每階段審查，可及早抓錯。
4. **分工與專業化**：業務人員參與需求，分析師建模，架構師與工程師設計與實作，各自負責明確階段。
5. **里程碑與專案管理**：每階段有明確產出、查核點與簽核，便於估算工作量、排程、控管進度與風險。
6. **契約與驗收依據**：政府採購需要明確的規格與交付物；分階段文件成為付款與驗收依據，也方便稽核與責任歸屬。
7. **可追溯性與文件化**：需求、分析、設計、測試可互相對應（需求追蹤矩陣），利於後續維護與交接。
8. **溝通基礎**：以文件與模型讓使用者、廠商、主管形成共識。

#### 四、限制與適用性

瀑布模型假設需求早期穩定，而且階段間較少回頭修改；若需求變動大、使用者需要早期見到成果，可考慮漸增式、原型或敏捷。縣政府線上申辦系統若法規流程明確、範圍清楚，採瀑布式是合理的，但建議在需求階段加入原型確認，並預留變更管理機制。`

#### 三、兩類的互補與整合

- 實務的智慧城市「營運中心（IOC）」常是**混合式**：資料導向的儀表板讓決策者掌握現況，模式導向的預測與模擬提供預警與方案評估。
- 例如颱風來臨：資料導向系統顯示即時雨量、水位與各區淹水通報；模式導向系統預測 6 小時後的淹水範圍，並計算最佳的抽水機與救災人力配置，最後由決策者決定是否疏散。
- 還可加入知識導向（專家規則）、通訊導向（協同會議）、文件導向（法規與個案查詢）及近年的 AI／生成式 AI 助理，增強決策支援。

#### 四、導入時的注意事項

1. **資料品質與整合**：跨機關資料標準、即時性、準確度。
2. **模型驗證**：模型須以歷史資料回測並持續校正。
3. **人機協作**：DSS 是「支援」而非取代決策者，重大決策仍由人判斷。
4. **隱私與資安**：城市感測與影像資料涉及個資，須最小化蒐集、去識別與存取控制。
5. **可解釋性與透明**：模型建議應能向民眾與議會說明。

#### 五、結論

資料導向 DSS 解決「看得見、看得清」，模式導向 DSS 解決「看得遠、選得準」；智慧城市的交通、能源、防災等領域需要兩者結合，才能同時支援即時營運管理與前瞻性政策決策。`

**位置編號與同位位元擺放**：把 12 個位元由左至右編號 1～12，**位置為 2 的次方（1, 2, 4, 8）放同位位元**，其餘位置（3, 5, 6, 7, 9, 10, 11, 12）依序放 8 個資料位元。

    return chk, chk[8] * 8 + chk[4] * 4 + chk[2] * 2 + chk[1]

#### 二、訓練時為何最後一級用 Softmax

Softmax 把最後一層的 K 個原始分數（logits）z 轉換成機率分布：

p_i = exp(z_i) / Σ_j exp(z_j)

| 理由 | 說明 |
| --- | --- |
| 輸出為機率 | 每個類別的值介於 0～1，總和為 1，可解釋為「屬於各類別的信心」，多類別分類自然適用 |
| 處處可微分 | 整個網路可以端對端以梯度下降法訓練；Softmax 是平滑、連續可微的函數，能讓誤差順利反向傳播到前面的卷積層 |
| 搭配交叉熵損失 | 損失 L = −log p_y（y 為正確類別），等同最大化正確類別的對數概似（最大概似估計） |
| 梯度簡潔穩定 | Softmax 加交叉熵時，對 logits 的梯度為 p − y（預測機率減去 one-hot 標籤），計算簡單，錯得越離譜梯度越大，學習更快 |
| 放大差距 | 指數會放大較大分數與其他分數的差距，使預測更果斷 |

**數值例子**（Python 驗算）：3 類別，logits = [2.0, 1.0, 0.1]，正確類別為第 1 類：

| 項目 | 數值 |
| --- | --- |
| Softmax 機率 | [0.659, 0.242, 0.099] |
| 交叉熵損失 | −ln 0.659 = 0.417 |
| 對 logits 的梯度 p − y | [−0.341, 0.242, 0.099] |

梯度的第 1 項為負，表示要提高第 1 類的分數；其餘為正，要降低。

反觀 SVM（合頁損失 hinge loss）在邊界外的樣本梯度為 0，且沒有機率輸出，雖然也可用於訓練神經網路（Tang, 2013 的 Deep Learning using Linear SVMs），但交叉熵加 Softmax 提供更平滑的梯度與機率，所以是訓練的主流。

#### 三、部署時為何有人改用 SVM

當網路訓練完成後，取出倒數第二層的特徵向量（例如 CNN 的 2048 維特徵），把這些特徵當作輸入，另外訓練一個 SVM 分類器，常見理由如下：

| 理由 | 說明 |
| --- | --- |
| 最大間隔（Maximum Margin） | SVM 尋找使兩類樣本間隔最大的超平面，只受支持向量影響，對雜訊與離群點較不敏感，泛化能力佳；Softmax 只追求降低訓練損失，沒有直接最大化間隔 |
| 小樣本泛化 | 病毒樣本、罕見腫瘤影像等標註資料很少。深度網路參數量大，容易過擬合；特徵固定後，SVM 的容量由間隔與正則化控制，在小樣本、高維度資料上表現穩定 |
| 核方法（Kernel Trick） | 用 RBF、多項式核函數處理非線性可分資料，不用增加網路層數；也可針對特定問題設計核函數 |
| 無需再用大量資料微調 | 使用預訓練模型（如 ImageNet 訓練的 CNN，屬遷移學習）作固定特徵萃取器，不必重新訓練整個網路（需要大量資料與 GPU）；SVM 訓練快速，只需少量標註資料 |
| 分工明確 | CNN 擅長自動學習階層式特徵（邊緣、紋理、形狀），SVM 擅長在特徵空間畫出最佳分隔邊界，可各取所長，也易替換或更新分類器 |
| 易於更新與維護 | 新增類別或更新樣本時，只需重新訓練 SVM，不動 CNN；資料量不大時訓練成本低 |
| 凸最佳化 | SVM 的訓練是凸問題，有全域最佳解，不會卡在區域最小值 |

**應用例**：病毒碼（惡意程式）檢測可把可執行檔轉成灰階影像或 API 序列，經 CNN 萃取特徵後以 SVM 分類；醫學腫瘤影像標註少，用預訓練 CNN 加 SVM 能在有限樣本上有穩定效能。

#### 四、這是「混合做法」，並非必然

1. **CNN＋SVM 只是常見的混合架構**，不是深度學習的標準答案。許多現代系統仍直接使用 Softmax 分類頭，特別是資料量足夠、端對端微調（fine-tuning）的情況，端對端訓練讓特徵與分類器共同最佳化，通常準確度更高。
2. **SVM 的限制**：不直接輸出機率（需額外校準，如 Platt scaling）；多類別需要 one-vs-rest 或 one-vs-one 組合；大資料（數十萬樣本以上）時核 SVM 訓練成本高（時間約 O(n²)～O(n³)），特徵與分類器分開訓練，無法把分類誤差傳回前面層次。
3. **選擇原則**：

| 情境 | 建議 |
| --- | --- |
| 資料量大、運算資源足夠 | 端對端訓練，Softmax 分類頭，必要時微調 |
| 資料少、使用預訓練模型 | 固定特徵＋SVM（或羅吉斯迴歸）通常更穩定 |
| 需要機率與信心程度 | Softmax，或 SVM 加校準 |
| 需要處理非線性但資料小 | 核 SVM |
| 要求即時與低功耗 | 線性 SVM 或小型 Softmax 層皆可 |

#### 五、結論

訓練時用 Softmax，是因為它**可微分、能輸出機率、與交叉熵配合得到簡潔的梯度**，最適合以反向傳播共同學習特徵與分類器；實際應用中在標註資料有限時，把學好的特徵交給 SVM，利用其**最大間隔、小樣本泛化、核方法**及不必大量微調的優點，是一種務實的混合策略，但並非唯一或必然的做法。`

**2. 量子金鑰分發（Quantum Key Distribution, QKD）**：以光子的量子態（如 BB84 協定）在雙方間產生共享的隨機金鑰。竊聽者測量光子會擾動量子態，通訊雙方比對部分位元的錯誤率即可發現竊聽，其安全性建立在物理定律，而非計算複雜度。限制：需專用光纖或衛星設備、傳輸距離有限（需可信中繼）、成本高、速率低；古典通道仍須**認證**（需預共享金鑰或 PQC 簽章）；只解決金鑰分發，不提供數位簽章與完整的 PKI；有側通道與設備實作漏洞。因此許多國家資安機構（如美國 NSA、法國 ANSSI、英國 NCSC）建議以 PQC 為主，QKD 為特定高安全場域的補充。我國也有量子通訊試驗網與衛星研究。

| 比較 | PQC | QKD |
| --- | --- | --- |
| 本質 | 新的數學演算法（軟體） | 物理量子通道（硬體） |
| 部署 | 可在現有網路、軟體升級 | 需專用設備與光纖 |
| 涵蓋功能 | 金鑰交換、簽章 | 只含金鑰分發 |
| 安全基礎 | 數學難題（計算安全） | 量子物理（資訊理論安全） |
| 成本與擴展 | 低、易擴展 | 高、距離受限 |

#### 五、組織的因應步驟（含政府機關）

4. 對稱金鑰改用 AES-256，雜湊使用 SHA-384 以上。
5. 追蹤標準（NIST、國內主管機關指引）、與廠商確認 PQC 支援時程，採購時納入要求。

量子電腦以量子位元的疊加與糾纏進行計算，Shor 演算法將使 RSA 與 ECC 失效，Grover 演算法使對稱金鑰強度減半。由於存在「現在收集、日後解密」的威脅，組織應及早盤點並遷移至 NIST 標準的 ML-KEM／ML-DSA 等後量子密碼，同時使用 AES-256 與更長的雜湊，QKD 則作為特定場域的輔助方案。`

本題沒有官方標準答案。依 ISO/IEC 27005、NIST SP 800-30 等風險評估的共同觀點，風險由三個基本要素構成：

\`\`\`text
風險 (Risk) = 威脅發生的可能性 (Threat/Likelihood) × 弱點被利用的程度 (Vulnerability) × 資產價值或事件衝擊 (Asset value / Impact)

所以風險改變的三項主要情境，就是這三個要素各自改變：**(1) 威脅改變、(2) 弱點改變、(3) 資產價值或業務衝擊改變**。控制措施的有效性改變，則是影響「殘餘風險」的另一個因素，在結論補充。

#### 二、三項情境改變

| 情境 | 說明 | 舉例 | 對風險的影響 |
| --- | --- | --- | --- |
| 1. 威脅改變 | 威脅來源、動機、能力或攻擊手法出現變化，發生機率或強度改變 | 新型勒索軟體流行；針對政府機關的 APT 攻擊；國際情勢使駭客攻擊增加；內部人員離職風險 | 威脅變強，風險升高；威脅消失或被壓制則降低 |
| 2. 弱點改變 | 系統、流程或人員的缺陷被新增、揭露或修補 | 公布新的零時差漏洞或舊系統停止支援；新上線系統組態不當；修補完成；員工受過社交工程訓練 | 弱點增加或被公開，風險升高；修補後降低 |
| 3. 資產價值與衝擊改變 | 系統所承載的資料與服務變得更重要，或相依關係與法規要求改變 | 系統新增個資或金流；改為提供全民線上申辦；個資法、資通安全管理法修正，違規罰則加重；上下游依賴增加 | 事件發生後的損失變大，風險升高；系統退役或資料去識別化則降低 |

#### 三、詳細說明

1. **威脅改變**：威脅是外在環境因素，管理者無法完全控制。要靠情資分享（如 N-ISAC、TWCERT/CC）、威脅建模與紅隊演練持續更新威脅清單，並調整監控規則與防護優先順序。
2. **弱點改變**：弱點隨著系統生命週期持續出現——新版本、新功能、第三方元件、設定變更、組織改組、人員異動都會帶來新弱點。要靠定期弱點掃描、滲透測試、修補管理、組態基準與變更管理來掌握。
3. **資產與衝擊改變**：業務目標、資料分級、法遵義務與外部相依性改變時，同一個漏洞的後果也會不同。要靠資產盤點、資料分級與營運衝擊分析（BIA）重新評估。

另外，**環境與技術變動**（導入雲端、行動辦公、IoT、委外、系統改版）通常同時改變上述三者，所以視為觸發「重新評估風險」的事件。

#### 四、對資安／系統工程師的作法

- 定期（至少每年）與事件觸發（重大變更、重大事件、新漏洞公布）兩種時機啟動風險評估。
- 流程：資產鑑別→威脅鑑別→弱點鑑別→現有控制檢討→風險計算與排序→處理決策（降低、轉移、避免、接受）→驗證殘餘風險並向管理階層報告。
- 風險值變高時：補強控制措施，如修補、分段隔離、強化認證、增加監控與備份、購買保險或調整委外契約。

結論：風險不是固定值。威脅、弱點、衝擊任何一個改變，風險就要重算；控制措施是否仍有效，則決定殘餘風險是否仍在可接受範圍。因此風險評估必須是持續的循環（PDCA），而非一次性專案。`

      question: `請定義大數據（Big Data）中 5V 的意義；以及進行大數據分析（Big Data Analytics）時處理的程序（Process），請依順序說明應含那些步驟以期獲得較佳的分析結果？（25 分）`,
      answer: `#### 一、大數據的 5V

大數據指資料量大、產生快、種類多，傳統資料庫與工具難以在可接受時間內處理的資料集合。常用 5V 描述（早期為 3V，後增為 5V）：

| V | 意義 | 說明與例子 |
| --- | --- | --- |
| Volume 量 | 資料規模龐大（TB～PB 以上） | 社群媒體貼文、感測器紀錄、交通監視影像 |

| Veracity 真實性 | 資料的正確性、可信度與品質 | 雜訊、缺漏、重複、偏誤，假資料與假帳號 |
| Value 價值 | 資料能轉換成決策、服務與效益的程度 | 資料量大不一定有價值，需有明確的應用目標 |

前三項 (3V) 是資料特性，Veracity 與 Value 則是**品質與目的**，提醒分析者資料要可信、分析要有用。

      answer: `#### 一、SDLC 的定義

軟體開發生命週期（SDLC）是把軟體從「構想」到「退役」所經歷的各個階段加以定義的架構，目的是讓開發有秩序、可管理、可預測品質。典型階段如下，各種開發方法只是這些活動的**排列與重複方式**不同：

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:'Noto Sans TC',sans-serif;font-size:13px;margin:.4rem 0"><span style="background:#1f5673;color:#fff;padding:5px 10px;border-radius:6px">規劃<br><small>可行性</small></span><span>→</span><span style="background:#8a3324;color:#fff;padding:5px 10px;border-radius:6px">需求分析<br><small>規格</small></span><span>→</span><span style="background:#2f6b4f;color:#fff;padding:5px 10px;border-radius:6px">設計<br><small>架構</small></span><span>→</span><span style="background:#6a4c93;color:#fff;padding:5px 10px;border-radius:6px">實作<br><small>編碼</small></span><span>→</span><span style="background:#a07e2c;color:#fff;padding:5px 10px;border-radius:6px">測試<br><small>驗證</small></span><span>→</span><span style="background:#b5651d;color:#fff;padding:5px 10px;border-radius:6px">部署<br><small>上線</small></span><span>→</span><span style="background:#1f5673;color:#fff;padding:5px 10px;border-radius:6px">維護<br><small>持續</small></span></div>

| 階段 | 主要成果 |

#### 二、四種開發方法

**(一) 瀑布式（Waterfall）**
- 內涵：各階段像瀑布依序往下，前一階段完成並審查通過才進入下一階段，每階段有明確交付文件。
- 特點：結構清楚、文件完整、里程碑易於管控、容易估算成本；缺點是需求變更困難，使用者要到最後才看到成品，錯誤發現得晚、修正成本高。
- 適用情境：需求明確且穩定、技術成熟、風險低的專案，如政府機關的標準化行政系統、法規對文件與驗收要求嚴格的採購案、硬體相依的嵌入式系統。

**(二) 螺旋式（Spiral，Boehm 提出）**
- 內涵：把開發分為多圈循環，每一圈依序經過四個象限：(1) 決定目標、方案與限制；(2) 評估方案、辨識並化解風險（含原型）；(3) 開發並驗證該圈成果；(4) 規劃下一圈。每圈產出越來越完整的版本。
- 特點：**以風險驅動**，可結合原型與瀑布；適合早期處理高風險因素，缺點是風險分析需要專業、管理成本高、不易定價與簽約。
- 適用情境：大型、複雜、高風險或技術創新的專案，需求一開始不確定，如國防、航太、醫療設備、大型整合平台。

**(三) 敏捷式（Agile）**
- 內涵：依據《敏捷宣言》，重視個人與互動、可運作的軟體、客戶合作、回應變化。以短週期（Scrum 的 Sprint 約 1～4 週）反覆迭代，每次交付可用的增量，常見方法有 Scrum、XP、Kanban。
- 特點：需求可變、使用者持續參與、頻繁交付與回饋、自我管理團隊、每日站會與回顧；缺點是文件較少、範圍與預算較難在合約中固定、需要使用者高度投入與有經驗的團隊。
- 適用情境：需求不明或快速變動、需要快速上市的 App、網站、電子商務、創新服務。政府機關採用時需調整採購與驗收方式。

**(四) DevOps**
- 內涵：把開發（Dev）與維運（Ops）整合成一個文化、流程與工具鏈，以自動化的 CI／CD（持續整合／持續交付）、基礎設施即程式碼、自動測試、監控與回饋，縮短從提交程式到上線的時間。
- 特點：發版頻繁且穩定、問題可快速回復，強調共同責任與自動化；缺點是需要文化轉型、工具與技能投資，對遺留系統導入困難。
- 適用情境：需要持續上線與高可用的線上服務，如電商、行動 App、SaaS、雲端原生系統；常與敏捷搭配，並可加入資安（DevSecOps）。

#### 三、比較表

| 項目 | 瀑布式 | 螺旋式 | 敏捷式 | DevOps |
| --- | --- | --- | --- | --- |
| 開發方式 | 線性、循序 | 多圈循環、風險驅動 | 短週期迭代、增量交付 | 持續整合、交付與維運回饋 |
| 需求變更 | 困難 | 每圈可調整 | 非常容易 | 容易，且可快速上線 |
| 使用者參與 | 前期與驗收 | 每圈評審 | 全程高度參與 | 透過監控與使用回饋 |
| 文件 | 完整 | 依風險 | 精簡、夠用 | 以自動化與程式化文件為主 |
| 風險處理 | 後期才暴露 | 每圈主動分析 | 小步前進、早期回饋 | 自動測試、可快速回復 |
| 適用情境 | 需求穩定的專案 | 大型高風險專案 | 需求多變的專案 | 需頻繁上線的線上服務 |

結論：沒有最好的方法，只有最合適的。需求固定採瀑布，風險大採螺旋，需求多變採敏捷，追求頻繁且穩定的交付則以 DevOps 補強，實務上多採混合式（例如整體以瀑布控管合約，內部以敏捷開發）。`

    {

      score: 25,
      question: `何謂勒索軟體（Ransomware）？通常資料備份是防範勒索軟體攻擊的重要手段，但是許多企業或是組織的備份資料仍可能遭受勒索病毒的攻擊，請先解釋其理由何在？然後詳細說明有那些作法可以降低備份資料遭受勒索攻擊的風險？（25 分）`,
      answer: `#### 一、勒索軟體的定義

勒索軟體是一種惡意程式，入侵後將使用者的檔案或系統**加密（或鎖定）**，再要求支付贖金（多以加密貨幣）換取解密金鑰。近年演變成「雙重勒索」：先竊取資料，再加密，威脅不付贖金就公開資料；甚至「三重勒索」再加上 DDoS 或通知客戶。常見感染途徑：社交工程郵件附件、惡意連結、遠端桌面（RDP）弱密碼、未修補的漏洞、供應鏈攻擊。

#### 二、為何備份資料仍會被攻擊

| 原因 | 說明 |
| --- | --- |
| 1. 備份與正式環境相連 | 備份儲存掛載在同一網域或網路磁碟，勒索軟體會沿著網路磁碟機與共用資料夾一併加密 |
| 2. 攻擊者專門破壞備份 | 取得網域管理員權限後，先刪除磁碟區陰影複本（vssadmin delete shadows）、停止備份服務、刪除備份目錄與快照，再發動加密 |
| 3. 備份系統與帳號缺乏隔離 | 備份伺服器與正式環境共用帳號密碼，備份主控台沒有 MFA，管理介面暴露在內網 |
| 4. 潛伏期長、備份被汙染 | 惡意程式潛伏數週，期間的備份已含惡意程式或已被加密，還原後再次感染 |
| 5. 備份未經驗證 | 從未演練還原，備份損毀或不完整，到要用時才發現無法還原 |
| 6. 備份頻率與保存期過短 | 輪替覆寫太快，乾淨版本已被覆蓋 |
| 7. 雲端同步不等於備份 | 檔案同步服務會把被加密的檔案同步上去，覆蓋原版本 |
| 8. 資料外洩不受備份保護 | 備份救得了可用性，但救不了機密性，雙重勒索仍可威脅公開 |

#### 三、降低備份遭勒索風險的作法

**(一) 備份策略：3-2-1-1-0 原則**

\`\`\`htmldiagram
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:'Noto Sans TC',sans-serif;font-size:13px;margin:.4rem 0"><span style="background:#1f5673;color:#fff;padding:5px 10px;border-radius:6px">3 份<br><small>1 正式 + 2 備份</small></span><span>→</span><span style="background:#8a3324;color:#fff;padding:5px 10px;border-radius:6px">2 種媒體<br><small>磁碟／磁帶／雲端</small></span><span>→</span><span style="background:#2f6b4f;color:#fff;padding:5px 10px;border-radius:6px">1 份異地<br><small>遠端保存</small></span><span>→</span><span style="background:#6a4c93;color:#fff;padding:5px 10px;border-radius:6px">1 份離線或不可變<br><small>air-gap／WORM</small></span><span>→</span><span style="background:#a07e2c;color:#fff;padding:5px 10px;border-radius:6px">0 錯誤<br><small>還原驗證</small></span></div>
\`\`\`

- 3：至少 3 份資料（1 份正式 + 2 份備份）。
- 2：使用至少 2 種不同儲存媒體或型態（如磁碟、磁帶、雲端）。
- 1：至少 1 份**異地**保存（災難時不受同一事件影響）。
- 1：至少 1 份**離線（offline／air-gap）或不可變（immutable）**的備份。
- 0：還原驗證後 **0 錯誤**，確保備份可用。

**(二) 技術與管理措施**

| 面向 | 作法 | 效果 |
| --- | --- | --- |
| 不可變備份 | 使用 WORM（一次寫入多次讀取）、物件鎖定（Object Lock）、儲存快照鎖定，保存期內任何人（含管理員）都無法修改或刪除 | 即使取得最高權限也無法銷毀備份 |
| 離線／空隙隔離 | 磁帶備份後退出磁帶機並離線保存；或以邏輯空隙（Logical air-gap）：僅在備份時短暫連線 | 勒索軟體無法觸及 |
| 網路與帳號隔離 | 備份網路與正式網路分段；備份系統獨立帳號，不加入同一網域；備份管理介面僅允許跳板機存取 | 避免橫向移動 |
| 最小權限與 MFA | 備份管理者採特權帳號管理（PAM）與多因素認證；寫入帳號與刪除帳號分離、重要刪除需雙人覆核 | 防止帳號遭盜用 |
| 備份加密 | 傳輸與儲存皆加密，金鑰與備份分開保管 | 即使備份被竊取也難以公開內容 |
| 備份版本與保存期 | 保留多個時間點版本，保存期長於潛伏期（如 30 天以上） | 可回溯到感染前的乾淨版本 |
| 備份前檢查 | 備份流程加入惡意程式掃描與異常偵測（檔案大量被改寫、熵值異常） | 避免備份被汙染 |

「五個階段」依 PMI 的《專案管理知識體系指南》（PMBOK）專案管理程序群組：**起始（Initiating）、規劃（Planning）、執行（Executing）、監控（Monitoring and Controlling）、結束（Closing）**。「四個目標」採最常見的：**時間（Schedule）、成本（Cost）、範圍（Scope）、品質（Quality）**。

#### 二、五個階段

| 階段 | 主要工作 | 主要產出 |
| --- | --- | --- |
| 1. 起始 | 界定專案目的與商業需求、評估可行性（技術、經濟、營運）、辨識利害關係人、任命專案經理、取得正式授權 | 專案章程、利害關係人登錄表 |

| 3. 執行 | 依計畫開發（需求、設計、編碼、測試）；組織與帶領團隊；進行採購與委外管理；與利害關係人溝通；執行品質保證 | 可交付成果（軟體、文件）、工作績效資料 |

說明：監控階段與執行階段是**並行**的，貫穿專案全程；各階段也非一次性，每個里程碑或迭代都可能重複。

#### 三、四個需滿足的目標

| 目標 | 意義 | 管理方式 | 衡量 |
| --- | --- | --- | --- |
| 時間（Schedule） | 在預定期限內完成並交付 | 里程碑、甘特圖、要徑法，緩衝與進度追蹤 | 進度績效指標 SPI，是否準時 |
| 成本（Cost） | 在核定預算內完成 | 成本估算、預算基準、掙值管理、變更控制 | 成本績效指標 CPI，是否超支 |

四者彼此牽制：例如壓縮時間常需增加成本或縮減範圍，並可能犧牲品質。專案經理要在**取捨**中達成使用者最重要的目標，並以利害關係人的需求為依歸。

#### 四、與使用者需求的關係

資訊系統能否滿足需求，取決於：(1) 起始與規劃階段是否正確掌握需求與範圍；(2) 執行與監控中是否做好變更與品質管理；(3) 結束階段是否做好驗收與知識傳承。因此專案管理的重點是以使用者需求為中心，持續平衡四項目標，並管理風險與利害關係人期望。`

#### 三、重要性

1. **攻擊日益組織化、跨境、自動化**：APT、勒索軟體、供應鏈攻擊都需要集體防禦，單打獨鬥難以抵擋。
2. **數位化政府與關鍵基礎設施**：影響範圍廣，事前預警比事後補救成本低。
3. **資安人力短缺**：靠情資自動化（如 STIX／TAXII 格式、TLP 分級）把有限人力用在處置。
4. **法遵要求**：資通安全管理法要求機關接受情資、依規定處理與通報。

| 面向 | 重點 |

| 品質 | 情資要正確、即時、可行動，避免誤報與雜訊過多 |
| 信任與誘因 | 分享者怕曝光自家受害造成聲譽損害，需有保密、免責與回饋機制 |
| 法制與流程 | 明訂責任、通報與使用規範，納入資安事件應變程序 |

#### 二、事前：評估與選商

| --- | --- |

- 個資處理約定：目的、範圍、安全措施、不得再委託、事故通報義務。
- 資安事件通報：發現事件後的通報時限、配合調查與改善。
- 稽核權：機關得進行或委託第三方進行稽核、查閱紀錄及現場檢查。
- 轉包限制：未經同意不得轉包，轉包須同樣受資安約束。
- 智慧財產權與原始碼、文件交付；資料返還、刪除與銷毀。
- 開發安全需求：依安全軟體開發規範（如 OWASP），交付前經弱點掃描、原始碼檢測與滲透測試。

| 安全開發與交付 | 要求安全需求、程式碼審查、弱點掃描、無後門與惡意程式聲明；原始碼託管與軟體物料清單（SBOM）；驗收時做第三方檢測 |

**(三) 持續監督**
- 定期（至少每年）要求廠商提出資安報告與自評，派員進行實地或書面稽核，追蹤缺失改善。

1. 驗收前完成弱點掃描、原始碼檢測、滲透測試，缺失改善後方可上線。

#### 三、解決巨量資料分析的關鍵技術

1. **分散式儲存與運算（Hadoop）**：把資料切塊存到多個節點，把運算送到資料所在地執行（Map 與 Reduce），以橫向擴充節點取得容量與速度，容錯靠資料多副本。
2. **記憶體內運算（Spark）**：將中間結果放在記憶體，減少磁碟 I/O，適合迭代式與互動式分析、機器學習。
3. **串流處理**：事件進來即處理（滑動視窗、聚合），延遲可低至秒級甚至毫秒，達成即時商業智慧；常用 Lambda 架構（批次層＋速度層＋服務層）或 Kappa 架構（全串流）。
4. **NoSQL 與資料湖**：支援多樣資料與高寫入量，以「讀取時定義結構」（schema-on-read）保持彈性。
5. **雲端的彈性資源**：依負載自動擴縮（Auto Scaling），尖峰時增加節點、離峰時縮減，只付實際使用的費用。

#### 四、雲端服務模式的運用

| 模式 | 說明 | 在即時 BI 的例子 |
| --- | --- | --- |
| IaaS（基礎架構即服務） | 租用虛擬機、儲存、網路，自行安裝與管理軟體 | 在雲端虛擬機上自建 Hadoop／Spark 叢集，自由度最高，管理負擔最重 |
| PaaS（平台即服務） | 供應受管理的大數據平台，不需管 OS 與叢集維運 | 託管型 Hadoop／Spark（如 EMR、Dataproc、HDInsight）、串流與資料倉儲服務 |
| SaaS（軟體即服務） | 直接使用完整的 BI 應用 | 雲端 BI 儀表板、分析與報表服務，使用者只需瀏覽器 |

部署模式亦需考量：公有雲（彈性高、成本低）、私有雲（機敏資料自主控管）、混合雲（敏感資料留地端、運算尖峰借助公有雲），政府機關依資料分級與法規選擇。

#### 五、優點與風險

| 優點 | 風險與對策 |
| --- | --- |
| 彈性擴充，不必預購硬體 | 資安與隱私：資料加密、金鑰自管、存取控制、資料分級，個資去識別化 |
| 縮短建置時間，快速上線 | 資料主權與法規：選擇境內機房或符合規範的雲端服務，契約明訂 |
| 成本由資本支出轉為營運支出 | 供應商綁定：採開放標準、可移轉的架構 |
| 內建高可用與備援 | 網路延遲與頻寬：靠近資料來源處理（邊緣）、壓縮與批次傳輸 |
| 容易整合機器學習服務 | 資料品質與治理：資料血緣、目錄與品質監控 |

#### 六、實例（政府情境）

以智慧交通為例：路側感測器與手機訊號透過 Kafka 進入雲端；Spark Streaming 計算各路段即時車速與壅塞指數；結果寫入雲端資料倉儲；儀表板即時呈現，並預測壅塞，提供號誌調整與使用者導引；歷史資料存入資料湖，供模型訓練。

#### 七、結論

運用雲端科技解決巨量資料的 BI，核心是：**以分散式儲存與運算（Hadoop／Spark）處理量，以串流架構達成速度，以資料湖與 NoSQL 容納多樣性，以雲端彈性與 IaaS／PaaS／SaaS 降低建置與維運成本**，同時兼顧資安、隱私與資料治理，才能提供可信且即時的商業智慧。`

#### 二、面向一：需求與設計階段（威脅建模與安全設計）

1. **安全需求**：與功能需求一同定義，如機密性、完整性、可用性、身分驗證、授權、稽核、法規遵循（個資法、資通系統防護基準）。依資料分級決定防護等級。
2. **威脅建模**：用 STRIDE（偽冒、竄改、否認、資訊洩漏、阻斷服務、權限提升）分析資料流程圖，找出信任邊界與威脅，據此設計對策。
3. **安全設計原則**：最小權限、縱深防禦、預設拒絕（fail-safe defaults）、職責分離、機制經濟（簡單）、完全仲裁（每次存取都檢查）、開放設計、不依賴隱匿；隱私預設（Privacy by Design）。
4. **架構**：分層、隔離敏感元件、將驗證與授權集中化，採成熟的安全元件，不自行發明加密。

#### 三、面向二：安全編碼（實作階段）

依 OWASP Top 10 與 CERT／CWE 常見弱點，落實：

| 風險 | 安全編碼作法 |
| --- | --- |
| 注入（SQL、命令、LDAP） | 參數化查詢（Prepared Statement）、ORM，不以字串拼接組 SQL；輸入白名單驗證 |
| 跨站腳本（XSS） | 輸出編碼（依 HTML、屬性、JS 情境）、內容安全政策（CSP）、避免 innerHTML |
| 跨站請求偽造（CSRF） | CSRF Token、SameSite Cookie、重要操作再驗證 |
| 失效的身分驗證與會話管理 | 密碼雜湊加鹽（bcrypt、Argon2）、MFA、會話逾時與更新 ID、Cookie 設 HttpOnly 與 Secure |
| 存取控制失效 | 伺服器端每次檢查授權，防止越權（IDOR），不信任前端 |
| 敏感資料暴露 | 傳輸用 TLS，儲存加密與金鑰管理，不把密碼、金鑰寫死在程式碼，日誌不記錄敏感資料 |
| 安全設定錯誤 | 關閉除錯與預設帳號、最小化錯誤訊息、安全組態基準 |
| 不安全的反序列化、緩衝區溢位 | 使用記憶體安全語言或邊界檢查、避免不安全函式（strcpy 等） |

另外要做：輸入驗證（長度、型別、格式、白名單）、錯誤處理（不洩露內部資訊）、日誌與稽核、並發與競爭條件處理。使用編碼規範（CERT C、OWASP Secure Coding Practices Checklist）並做同儕程式碼審查。

#### 四、面向三：測試與驗證

| 活動 | 說明 |
| --- | --- |
| SAST 靜態原始碼分析 | 在編碼與 CI 階段掃描原始碼找出弱點 |
| DAST 動態應用程式測試 | 對執行中的系統模擬攻擊（如 OWASP ZAP） |
| IAST／RASP | 在執行環境內偵測與即時防護 |
| 滲透測試與弱點掃描 | 上線前與定期進行，政府系統常依規定做弱點掃描與滲透測試 |
| 模糊測試（Fuzzing） | 以隨機或畸形輸入找出崩潰與漏洞 |
| 安全測試案例 | 針對濫用案例（abuse case）與需求撰寫測試 |
| 缺陷追蹤 | 依嚴重度設定修復期限，嚴重弱點不得上線 |

#### 五、面向四：供應鏈與元件安全（第三方與開源）

- 現代系統大量使用開源函式庫，漏洞（如 Log4Shell、Heartbleed）會直接進入產品。
- 作法：維護軟體物料清單（SBOM）；用 SCA（軟體組成分析）工具掃描已知漏洞與授權；固定版本並及時更新；從可信來源取得套件、驗證簽章與雜湊值；保護建置環境與簽署程式碼。
- 委外開發要在契約中要求安全開發與交付前檢測。

#### 六、面向五：DevSecOps 與維運

- 將安全工具自動化放進 CI／CD 管線（SAST、SCA、容器映像檔掃描、基礎設施即程式碼掃描、密鑰洩漏掃描）；通過品質門檻才可部署。
- 上線後持續監控、日誌集中、WAF 防護、修補管理、漏洞通報管道與事件應變，並回饋到設計。
- 安全組態與秘密管理（Vault）、最小權限的執行環境與容器。

#### 七、面向六：人員與流程

- 開發人員資安教育訓練（OWASP 與安全編碼）；設置資安倡議者（Security Champion）。

安全的軟體需要**需求與設計階段的威脅建模、實作階段的安全編碼、測試階段的多層驗證、供應鏈的元件控管，再加上 DevSecOps 的自動化與持續維運**。其成效要靠人員訓練與管理制度支持，才能真正降低資料外洩風險。`

**1. 採用的說法與依據**

「BPR 四要素」在文獻中有兩種常見說法：
- **Hammer 與 Champy（1993）的定義**：BPR 是「對企業流程做**根本性**（Fundamental）的重新思考與**徹底性**（Radical）的重新設計，以達成成本、品質、服務、速度等**績效的巨幅**（Dramatic）改善」，定義中的四個關鍵字為：根本性、徹底性、巨幅性（劇烈）、**流程**（Process）。
- 另一種是實施面向：流程、組織、人員與文化、技術。

題意問「流程再造包含那四個要素」，最貼近的是 Hammer 與 Champy 的四個關鍵字，故以此為主要答案，再補充四個實施面向作對照，兩者並不衝突。

| 要素 | 意義 | 與 ERP 的關係 |
| --- | --- | --- |
| 1. 根本性（Fundamental） | 回頭問「為何要這樣做？」，不預設現有作法，重新思考企業存在與運作的基本問題 | 導入 ERP 前先檢討現有流程是否合理，不是把舊流程電腦化 |
| 2. 徹底性（Radical） | 從根源重新設計，不是在表面修補或漸進改良，必要時拋棄既有結構 | ERP 提供標準化的最佳實務流程，企業需願意配合調整，而不是大量客製 |
| 3. 劇烈性（Dramatic） | 目標是績效的巨幅躍進（如成本降 30%、週期縮短一半），而非 5%、10% 的小幅改善 | 以訂單處理時間、存貨周轉、結帳天數等指標衡量導入成效 |
| 4. 流程（Process） | 以端到端的流程（如訂單到收款、採購到付款）為對象，而不是部門或功能 | ERP 整合跨部門流程，消除資料孤島與重複輸入 |

| 類別 | 原因 | 說明 |
| --- | --- | --- |
| 管理與策略 | 高階主管支持不足 | 缺乏明確願景與資源承諾，部門衝突無人裁決 |
| 管理與策略 | 目標與範圍不清、需求不明 | 範圍蔓延（scope creep）、預算與期程低估 |
| 流程 | 未做流程再造，只是把舊流程搬進 ERP | 大量客製化導致成本與風險上升，也難以升級 |
| 人員 | 使用者抗拒改變、訓練不足 | 擔心工作被取代，不習慣新流程，以致不使用或錯用 |
| 人員 | 專案團隊不足、關鍵人員不能全職投入 | 業務與 IT 人員仍負擔日常工作 |
| 技術 | 軟體與企業不適配、選型錯誤 | 套裝軟體的流程與產業特性不符 |
| 技術 | 資料品質差、轉檔與整合失敗 | 主檔資料不完整、舊系統整合困難 |
| 專案管理 | 缺乏專案管理與風險控管、測試不足 | 倉促上線（Big Bang），上線後問題多 |
| 外部 | 顧問或廠商能力不足、過度依賴 | 知識沒有移轉給企業，維運困難 |
| 成本 | 隱藏成本 | 訓練、客製化、維護與升級，使總擁有成本高於預期 |

因此多數失敗原因屬於**管理、流程與人員**層面，而非單純技術問題。

- 透明可稽核：程式碼與交易紀錄可供各方檢視。

#### 二、範例（Solidity，在 EVM 上執行）

以下是簡化的託管（escrow）合約：買方付款後鎖在合約中，確認收貨才放款給賣方。

\`\`\`solidity
contract Escrow {
    address public buyer;
    address payable public seller;
    bool public paid;
    constructor(address payable _seller) {
        buyer = msg.sender;
        seller = _seller;
    }
    function pay() external payable {
        require(msg.sender == buyer && !paid);
        paid = true;               // 款項鎖在合約內
    }
    function confirm() external {
        require(msg.sender == buyer && paid);
        seller.transfer(address(this).balance);   // 自動放款
    }
}
\`\`\`

合約被編譯成位元組碼（bytecode），在以太坊虛擬機（EVM）中執行，每一步操作要付 gas 費。

#### 三、與一般應用程式的比較

| 比較項目 | 智慧合約 | 一般應用程式 |
| --- | --- | --- |
| 執行環境 | 區塊鏈上多個節點同時執行並驗證 | 單一伺服器或雲端，由所有者控制 |
| 控制權 | 去中心化，無單一控制者 | 集中式，管理者可隨時修改、停止 |
| 可變更性 | 部署後程式碼不可直接改（需代理合約等設計） | 隨時更新版本、修補 |
| 資料與紀錄 | 狀態與交易寫入鏈上，不可竄改、公開透明 | 存放在資料庫，管理員可修改或刪除 |
| 信任基礎 | 信任程式碼與共識機制 | 信任營運該系統的機構 |
| 執行成本 | 每次運算付 gas，運算與儲存很貴 | 運算成本低，可處理大量資料 |
| 效能 | 吞吐量低（受共識與出塊時間限制） | 高效能、低延遲 |
| 外部資料 | 無法直接讀取鏈外資料，需靠 Oracle | 可直接呼叫外部 API |
| 錯誤處理 | 漏洞一旦上鏈難以回復，常涉及資金損失 | 可熱修補、回滾 |

#### 四、關鍵議題與限制

1. Oracle 問題：智慧合約只能看到鏈上資料，匯率、天氣、航班延誤等鏈外資訊要由 Oracle（預言機）餵入。Oracle 若被操縱或故障，合約就會依錯誤資料執行，形成新的信任點。Chainlink 這類去中心化 Oracle 以多來源彙總降低風險。
2. 程式漏洞：合約碼即法律（code is law），漏洞等於合約漏洞。2016 年 The DAO 事件因重入攻擊（reentrancy）被盜取約 360 萬 ETH，最後以太坊社群以硬分叉處理，並分裂出 Ethereum Classic。因此需要安全審計、形式化驗證與測試。
3. 法律效力與管轄：智慧合約是否等同法律契約、爭議如何處理，各國規範仍在發展；現實的模糊條款難以全以程式碼表達。
4. 隱私：鏈上資料公開，敏感商業資料須搭配零知識證明或鏈下儲存。
5. 擴展性與成本：吞吐量低、gas 費波動。

#### 五、應用與結論

應用包含保險自動理賠（航班延誤即賠）、供應鏈追溯與付款、數位版權分潤、去中心化金融（DeFi）、電子投票與政府補助發放等。

結論：智慧合約的價值在於以程式與共識取代中介信任，帶來自動化與不可竄改；但它缺乏彈性、依賴 Oracle，且漏洞代價高，適合規則明確、需多方互不信任下協作的場景，不能取代所有一般應用程式。`

      answer: `#### 一、背景

內建加解密或數位簽章模組的 IC 卡（如自然人憑證卡、健保卡、金融晶片卡、電子護照）內含微處理器、記憶體與密碼協同處理器，私鑰存於卡內，簽章與解密都在卡片內完成，私鑰理論上不會離開晶片。因此攻擊者的目標是：取得私鑰或 PIN、偽造卡片、冒用交易，或讓卡片做出不該有的行為。卡片又在攻擊者手上（例如借卡、失竊卡），讀卡機與環境也不可信，威脅面比一般系統更大。

| --- | --- | --- |
| 非侵入式（側通道） | 簡單功率分析 SPA | 直接觀察一次運算的功耗曲線，從 RSA 的平方與乘法形態差異讀出私鑰位元 |
| 非侵入式（側通道） | 差分功率分析 DPA | 蒐集大量運算的功耗，以統計方法找出與金鑰假設相關的訊號，雜訊再大也能還原金鑰 |
| 非侵入式（側通道） | 計時攻擊 | 量測運算時間差（如條件分支、模冪運算長短）推算金鑰；另有電磁輻射、聲音攻擊 |
| 半侵入式 | 故障注入（fault injection） | 以電壓突波、時脈干擾、雷射或電磁脈衝使運算出錯，利用錯誤輸出推出金鑰（如 RSA-CRT 的 Bellcore 攻擊），或略過 PIN 檢查 |

| 邏輯攻擊 | 後門 | 製造或開發階段被植入隱藏功能或測試模式，供特定人員繞過驗證 |
| 通訊層 | 重放攻擊（replay） | 錄下合法交易的訊息再重送，冒用交易 |
| 通訊層 | 中間人攻擊 | 在卡與讀卡機之間插入裝置（例如對 EMV 的 relay 攻擊），改變或轉送交易、攔截 PIN |
| 實體與複製 | 卡片複製、側錄（Skimming） | 在讀卡機放置側錄器讀出磁條資料或竊取 PIN 後偽造卡片；磁條卡易複製，晶片卡較難 |
| 其他 | 暴力破解 PIN、竊取卡片冒用 | PIN 空間小，若無錯誤次數限制可窮舉 |

#### 三、攻擊成功的原因

| 原因 | 說明 |
| --- | --- |
| 物理洩漏無法避免 | 晶片以 CMOS 電路實作，功耗、時間、電磁輻射與運算內容有關，演算法在數學上安全並不代表實作安全 |
| 實作缺陷 | 例如密碼運算的時間隨金鑰變化、未檢查輸入、亂數產生器品質不佳、作業系統與 applet 的漏洞、測試模式未關閉 |
| 缺乏防護對策或防護不足 | 未做遮罩（masking）、隱藏（hiding）、隨機延遲、運算結果驗證，也缺少電壓與光線感測器、主動屏蔽層、防篡改封裝 |
| 金鑰與 PIN 管理不當 | 所有卡片使用相同或可推導的主金鑰（一卡被破全系統被破）、金鑰在製卡與傳輸時外洩、PIN 過短或預設值、無錯誤次數鎖卡 |
| 通訊協定缺乏認證與新鮮性 | 沒有雙向認證、沒有挑戰回應（nonce）或序號，使重放與中間人成功 |
| 環境不可信 | 讀卡機、終端與使用者電腦可能被木馬控制，PIN 在鍵盤被竊取，或畫面顯示內容與實際簽署內容不一致 |
| 供應鏈與生命週期風險 | 設計、製造、個人化與銷毀階段如有人為疏失或內部人員作案，後門與金鑰外洩便隨之產生 |

#### 四、防護對策

1. 硬體：防篡改封裝與金屬屏蔽層、電壓與頻率感測器、光感測器、加密匯流排與記憶體；通過 Common Criteria（EAL4+ 以上）與 FIPS 140-2/3 認證。
2. 演算法實作：常數時間運算、遮罩、隨機延遲與雜訊、簽章後驗證結果再輸出（對抗故障注入）、RSA 盲化（blinding）。
3. 協定：雙向認證、挑戰回應、計數器或時間戳避免重放，卡與讀卡機建立安全通道；EMV 的動態資料認證（DDA/CDA）。
4. 金鑰管理：每卡獨立衍生金鑰、密鑰分層、HSM 製卡、PIN 錯誤達次數即鎖卡。
5. 使用面：使用可信讀卡機（含 PIN 輸入鍵盤）、所見即所簽、遺失即掛失與廢止憑證。
6. 開發與稽核：安全審查、滲透測試與側通道評估，關閉測試介面。

#### 五、結論

IC 卡的核心弱點在於「演算法安全不等於實作與環境安全」。攻擊者可透過側通道、故障注入或探測直接攻擊硬體，也可利用協定與管理缺陷。應採縱深防禦：硬體防護、實作對策、協定設計與金鑰生命週期管理並重，並以第三方認證驗證其強度。`

定義：SIS 是用來支援或塑造企業競爭策略的資訊系統，目的是幫助企業取得、維持競爭優勢，或改變企業的產品、服務與經營方式。它不一定是新技術，關鍵是「資訊系統被用來達成策略目標」。

定義：DSS 是協助管理者處理半結構化或非結構化問題決策的互動式電腦系統，結合資料、分析模型與使用者介面，讓管理者以「假設分析（what-if）、敏感度分析、模擬、最佳化」探索方案。

      answer: `#### 一、資料探勘概念

資料探勘是從大量資料中，利用統計、機器學習與資料庫技術找出有價值的、先前未知的樣式與關係，是「資料庫知識發掘（KDD）」的核心步驟。依是否有已知答案（標籤），可分為監督式（分類、迴歸）與非監督式（群集、關聯），再加上序列、異常偵測與摘要等類型。

#### 二、主要分析類型與目的

| 類型 | 學習方式 | 目的 | 常用方法 | 範例 |
| --- | --- | --- | --- | --- |
| 分類（Classification） | 監督式 | 依已知類別的訓練資料建立模型，把新資料歸入預先定義的類別 | 決策樹、貝氏分類、SVM、類神經網路、k-NN | 判斷貸款申請人信用好壞、垃圾郵件辨識 |

| 迴歸／預測（Regression, Prediction） | 監督式 | 建立自變數與連續數值目標的關係，用以預測數值或趨勢 | 線性與非線性迴歸、時間序列、類神經網路 | 預測銷售額、房價、用電量 |
| 關聯分析（Association） | 非監督式 | 找出資料項目之間同時出現的規則，以支持度、信賴度、增益度評估 | Apriori、FP-Growth | 購物籃分析（買尿布也買啤酒）、商品陳列與搭售 |
| 序列分析（Sequential Pattern） | 非監督式 | 找出事件在時間上的先後順序規律 | GSP、PrefixSpan | 顧客先買手機再買配件；網站點擊流程 |
| 異常偵測（Anomaly/Outlier Detection） | 兩者皆可 | 找出與大多數資料不同的少數個案 | 統計檢定、距離與密度法、孤立森林 | 信用卡盜刷、入侵偵測、逃漏稅 |
| 摘要／描述（Summarization, Description） | 非監督式 | 以簡潔的統計量、視覺化或規則描述資料集特徵 | 彙總統計、OLAP、特徵化與區分 | 各區域銷售概況、客群輪廓 |

#### 三、各類型的關係與選用

- 目標是「預測類別」用分類，「預測數值」用迴歸，「不知道有哪些類別」用群集。
- 想了解「同時購買」用關聯，想知道「接著會發生什麼」用序列。

商業理解、資料理解、資料準備（清理、轉換、選取特徵）、建模、評估（準確率、召回率、F1、提升度）、部署。資料品質通常決定結果好壞。

#### 五、政府與企業應用

稅務機關用異常偵測找可疑申報；健保用分類預測高風險族群；零售用關聯與群集設計促銷；電信用分類預測客戶流失。

#### 六、結論

      question: `RFID 在產業界已有廣泛的應用，例如電子票券、物流管理及履歷溯源等，這些應用導入 RFID 固然帶有許多便利，但也可能帶來隱私上的問題。請說明利用 RFID 所可能產生的隱私危害有那些？並說明可能的解決方案。（25 分）`,
      answer: `#### 一、RFID 簡述

RFID 系統由標籤（Tag）、讀取器（Reader）與後端資料庫組成。被動式標籤沒有電池，由讀取器的電磁場供電，被讀到時就會回應固定識別碼（如 EPC）。特色是不需接觸、不需對準、可同時讀取多個標籤。但標籤通常「對任何合法讀取器都會回應」，這就成為隱私問題的根源。

#### 二、隱私危害

| 危害 | 說明 | 範例 |
| --- | --- | --- |
| 被追蹤（Tracking） | 標籤識別碼固定，攻擊者在不同地點部署讀取器，就能辨識並跟蹤同一標籤持有人的行蹤 | 商品標籤留在衣物或鞋子上，離開商店後仍可被追蹤 |
| 洩漏個人資料 | 標籤內或透過識別碼連結的資料庫含姓名、病歷、證件資料等，被未授權讀取 | 電子護照、員工證、藥品標籤暴露疾病資訊 |
| 位置隱私侵害 | 長期累積讀取紀錄，可推知住家、工作地點、作息 | 悠遊卡與電子票券紀錄建立移動軌跡 |
| 資產與持有物掃描（資產盤點式洩漏） | 遠距離掃描他人包包、口袋，得知持有物品（貴重物、藥物、錢幣） | 以讀取器靠近人群，找出攜帶高價商品者 |
| 標籤複製（Clone）與偽造 | 標籤未認證，攻擊者讀出內容再寫入空白標籤，冒用身分或開門 | 門禁卡、停車感應卡被複製 |
| 竊聽與側錄（Skimming、Eavesdropping） | 在讀取器與標籤通訊的距離內截收訊號，或主動靠近讀取 | 非接觸式信用卡被惡意讀取器掃描 |
| 重放與中間人攻擊 | 錄下回應再重送，或攔截轉送 | 電子票券重複使用 |
| 關聯與剖析 | 與其他資料（監視器、信用卡紀錄）關聯後識別個人，建立消費者輪廓並濫用 | 透過商品標籤集合識別特定顧客 |

#### 三、解決方案

| 方案 | 作法 | 效果與限制 |
| --- | --- | --- |
| Kill command（毀滅指令） | 結帳時以密碼令標籤永久失效 | 簡單有效，但標籤無法再用於退貨、保固、回收，不適合需長期使用的場景 |
| 屏蔽（Faraday 籠、鋁箔套） | 用金屬網或鋁箔隔絕電磁波，不用時放入屏蔽套 | 成本低，適用護照、卡片，但需使用者主動配合 |
| 暫時休眠（Sleep） | 讀取需要時才啟動標籤，或以密碼切換 | 需要額外控制機制 |
| 鑑別與加密 | 讀取器與標籤雙向認證（挑戰回應）、對通訊加密，只允許合法讀取器取得資料 | 能防複製與竊聽，但標籤運算資源少，需輕量級密碼（如 AES 精簡版、PRESENT） |
| 可變識別碼：匿名化與假名 | 標籤每次回應不同的假名（雜湊鏈、滾動碼），僅後端可還原 | 防追蹤；要注意同步與資料庫負擔 |
| 隱私保護協定 | 如雜湊鎖定（Hash-lock）、隨機化雜湊鎖、Blocker tag 干擾非授權讀取 | 提升防護，但各有缺點（Blocker 有干擾合法讀取之虞） |
| 距離與場域控制 | 縮短讀取距離，使用近場通訊（NFC），標籤只在近距離回應 | 減少遠距掃描機會 |
| 資料最小化 | 標籤只存無意義的識別碼，個資放在後端並以權限保護，不將姓名等資料寫入標籤 | 即使標籤遭讀取，也難以直接解讀 |
| 透明與告知 | 標示 RFID 使用告知，提供使用者選擇權，標籤可在購買後移除或停用 | 符合隱私設計原則 |
| 法規與政策 | 依個人資料保護法、歐盟 GDPR 要求蒐集目的、同意、最小蒐集、保存期限與安全維護；制定組織使用 RFID 的隱私政策與稽核；隱私影響評估（PIA） | 提供管理與法律約束 |

#### 四、設計原則

採「隱私預設與隱私設計（Privacy by Design）」：在系統規劃階段就考慮資料最小化、用途限定、存取控制與可稽核性，而非事後補救。

#### 五、結論

RFID 的隱私風險來自「固定識別碼＋無差別回應＋遠距讀取」。解決方向是三層並進：技術面（kill、屏蔽、認證加密、假名化），管理面（資料最小化、存取控制、保存期限），以及法規與告知（GDPR、個資法、隱私影響評估）。應依應用情境取捨，例如商品標籤宜在結帳時停用，證件類宜採加密認證加屏蔽套。`

| 模式 | 提供的內容 | 使用者 | 舉例 |

部署模式另有公有雲、私有雲、社群雲與混合雲；政府機關常採用私有雲或政府共用雲（GCB）以兼顧彈性與資料管控。

#### 三、（二）三種服務之核心技術

| 核心技術 | 說明 | 主要支撐 |
| --- | --- | --- |
| 虛擬化（Virtualization） | 以 Hypervisor（VMware ESXi、KVM、Hyper-V、Xen）將一台實體機切成多台虛擬機，提高資源使用率，並支援動態遷移與快照 | IaaS 的基礎，也是 PaaS、SaaS 的底層 |
| 容器技術 | 以作業系統層級隔離（Docker、Kubernetes），啟動快、輕量、可攜 | PaaS 部署與微服務 |
| 分散式儲存與檔案系統 | 如 GFS、HDFS、Ceph、物件儲存，將資料分塊複製到多個節點，提供高可用與擴充 | 雲端儲存、資料庫即服務 |
| 分散式運算與 MapReduce | 把大型工作拆成 Map 與 Reduce 在叢集上平行處理（Hadoop、Spark） | 巨量資料分析平台 |
| 自動化調度與資源管理 | 根據負載自動佈建、彈性擴縮（Auto Scaling）、負載平衡、計費與監控，如 OpenStack、Kubernetes 排程 | 彈性與計量 |
| Web 服務與 API | 以 REST、SOAP、SOA 對外開放功能，使服務可被整合與自動化操作 | PaaS 與 SaaS 的對外介面 |
| 多租戶架構（Multi-tenancy） | 同一套應用或資料庫服務多個客戶，並以邏輯隔離、資料分區與權限保證互不干擾 | SaaS 的關鍵 |
| 網路與資安技術 | 虛擬網路（SDN）、VPN、身分管理、加密 | 所有模式 |

可歸納為：IaaS 重在「虛擬化與資源池管理」，PaaS 重在「執行環境、容器與中介軟體」，SaaS 重在「多租戶應用與 Web 服務」，而分散式儲存及運算、自動調度則是三者共通的基礎。`

| 政策與教育訓練 | 訂定 BYOD 使用政策：適用人員與裝置、可存取資源、禁止行為、員工同意書（含遠端抹除與稽核授權、隱私界線）、離職程序；定期資安教育 |
| 行動裝置管理 MDM | 註冊裝置、強制螢幕鎖與 PIN、OS 版本與修補要求、偵測 Jailbreak/Root、遠端定位、鎖定 |
| 行動應用管理 MAM／容器化 | 在裝置建立受管工作區（Work Profile、Android Enterprise、iOS 受管 APP），公私資料隔離，只管控公務 APP 與資料，降低隱私爭議 |
| 加密 | 裝置儲存加密、公務 APP 內資料加密，傳輸採 TLS |
| VPN 與零信任存取 | 存取內部資源須經 VPN 或零信任代理，按裝置狀態與身分動態授權 |
| 多因素驗證 MFA 與強身分管理 | 密碼加 OTP、憑證或生物辨識，搭配 SSO |
| 網路存取控制 NAC | 裝置連網前檢查合規性（防毒、修補、MDM 註冊），不合規者隔離到受限網段（訪客網路） |
| 資料外洩防護 DLP | 限制複製、截圖、轉寄、列印與上傳至私人雲端，機敏資料加浮水印 |
| 遠端抹除 | 裝置遺失、離職或違規時，可選擇性抹除公務容器，或全機抹除 |
| 防護軟體與弱點管理 | 行動端點防護（MTD）、防毒、App 白名單與來源審查 |
| 日誌與監控 | 蒐集連線與存取紀錄，結合 SIEM 偵測異常 |
| 分級授權 | 依資料機敏程度決定可由 BYOD 存取的範圍，高機敏資料僅限公發裝置或虛擬桌面存取 |

#### 四、結論

BYOD 的核心是在便利與控制之間取得平衡。應採「政策＋技術＋教育」並行：以 MDM/MAM 與容器化隔離公私資料，用 VPN、MFA、NAC 控制進入，以加密、DLP 與遠端抹除保護資料，並依資料等級分級授權；對政府機關尤其要把機敏公文限縮在可控環境。`

      question: `企業與政府組織需要一些決策資訊系統，協助主管做政策決定。請說明：（每小題 10 分，共 20 分）
高階主管支援管理系統。
企業智慧（Business Intelligence）。`,
      answer: `#### 一、（一）高階主管支援系統（Executive Support System, ESS；亦稱 EIS）

定義：ESS 是為高階主管量身設計的資訊系統，整合組織內外部資訊，以簡單的圖形化介面呈現關鍵績效與趨勢，協助其處理非結構化、策略性的決策與監控整體營運。

特性：
- 使用者是高階主管，問題多為非結構化、長期策略性。
- 介面簡潔：儀表板、紅黃綠燈、趨勢圖，可從摘要向下鑽取（drill-down）到明細。
- 整合內部（財務、營運、人力資料）與外部（市場、競爭者、法規、新聞）資料。
- 以例外報告與關鍵成功因素（CSF）、關鍵績效指標（KPI）、平衡計分卡為基礎。
- 強調易用、即時、可行動裝置存取。

功能舉例：經營儀表板、趨勢分析、預算與績效追蹤、政策模擬。政府的首長儀表板（市政指標、預算執行率、民意陳情案件處理狀況）即屬此類。

#### 二、（二）企業智慧／商業智慧（Business Intelligence, BI）

定義：BI 是一套整合的技術、工具與流程，將組織內外大量資料經過擷取、整合、儲存、分析與視覺化，轉換成有意義的資訊與洞察，支援各階層決策與績效管理。

典型架構：資料來源（ERP、CRM、外部資料）→ ETL（擷取、轉換、載入）→ 資料倉儲或資料超市 → 分析（OLAP、資料探勘、報表、預測）→ 呈現（儀表板、視覺化）。

核心功能：報表與查詢、OLAP 多維度分析（上捲、下鑽、切片、切塊）、資料探勘、預測分析、儀表板、記分卡。常見工具有 Power BI、Tableau、Qlik。

#### 三、兩者比較

| 比較項目 | 高階主管支援系統 ESS | 商業智慧 BI |
| --- | --- | --- |
| 性質 | 以使用者（高階主管）區分的系統類型 | 以技術與流程區分的分析平台與方法 |
| 使用對象 | 高階主管 | 各階層：高階、中階主管、分析師、一般員工 |
| 決策類型 | 策略性、非結構化 | 策略、戰術到作業皆可，結構化與半結構化居多 |
| 資料範圍 | 彙總後的關鍵指標，兼含內外部資訊 | 企業資料倉儲內的完整明細與歷史資料 |
| 核心技術 | 儀表板、鑽取、KPI、例外報告 | ETL、資料倉儲、OLAP、資料探勘、視覺化 |
| 重點 | 簡單、直覺、快速掌握全局 | 深度分析、發現原因與規律 |
| 關係 | ESS 常以 BI 平台為資料與分析後盾，BI 的儀表板即可成為 ESS 的介面 | 同左 |

#### 四、結論

ESS 提供高階主管「看得到全貌」的視窗，BI 提供「看得深、找得到原因」的分析能力。兩者結合：以 BI 整合資料倉儲與分析，再用 ESS 的儀表板呈現關鍵指標，政府與企業可據以監控政策績效、及早發現異常，做出有數據依據的決策。`

      title: "IEEE 802.3 與 802.11 的通訊與資安差異",
      score: 20,
      question: `許多公共場所提供無線網路，方便使用者上網。請說明：（每小題 10 分，共 20 分）
以通訊協定角度看，IEEE 802.3 所定義之 LAN 與 IEEE 802.11 所定義之 WLAN 有何差異？
以資訊安全角度看，IEEE 802.3 所定義之 LAN 與 IEEE 802.11 所定義之 WLAN 有何差異？`,
      answer: `#### 一、兩者定位

IEEE 802.3 是乙太網路（Ethernet）標準，以有線（雙絞線、光纖）傳輸；IEEE 802.11 是無線區域網路（Wi-Fi）標準，以無線電波傳輸。兩者都屬於 OSI 的實體層與資料連結層（MAC 子層），上層同樣可跑 TCP/IP，並共用 802.2 LLC 與 48 位元 MAC 位址。

#### 二、（一）通訊協定角度的差異

| 比較項目 | IEEE 802.3 有線 LAN | IEEE 802.11 無線 LAN |
| --- | --- | --- |
| 傳輸媒介 | 雙絞線、同軸電纜、光纖 | 2.4、5、6 GHz 無線電波（共用的空氣） |
| 媒介存取控制 | CSMA/CD（載波感測多重存取／碰撞偵測）：邊傳邊聽，發現碰撞即停止並退避重傳（現代全雙工交換式乙太網路已幾乎沒有碰撞） | CSMA/CA（碰撞避免）：先聽後傳、隨機退避，並可用 RTS/CTS 保留通道；因無線端無法邊傳邊收，無法偵測碰撞 |
| 確認機制 | 一般不需 MAC 層確認，由上層處理 | 每個單播幀都需 ACK，沒收到就重傳 |
| 隱藏節點問題 | 無 | 有：A、C 都能連到 AP 但彼此聽不到對方，同時傳送造成碰撞，需 RTS/CTS 減輕；另有暴露節點問題 |
| MAC 幀格式 | 前導碼、目的／來源位址、類型／長度、資料（46~1500 位元組）、FCS；兩個位址 | 幀控制、持續時間、最多 4 個位址（BSSID、來源、目的、傳送者）、序號控制、資料、FCS；有管理、控制、資料三類幀 |
| 網路架構 | 星狀（交換器）；以連接埠接入 | 基礎架構模式（AP 與 BSS/ESS）與 Ad hoc 模式 |
| 連線程序 | 插線即連，無需關聯 | 需掃描、認證、關聯（Association）、漫遊切換 |
| 速率與可靠性 | 速率高且穩定（1/10/100 Gbps），誤碼率低 | 速率受干擾、距離與共用頻寬影響，變動大；需要較多的重傳與錯誤處理 |
| 移動性 | 固定 | 支援移動與漫遊 |
| 其他 | 有線供電可用 PoE | 需處理省電模式、頻道選擇、干擾 |

#### 三、（二）資訊安全角度的差異

| 比較項目 | IEEE 802.3 有線 LAN | IEEE 802.11 無線 LAN |
| --- | --- | --- |
| 存取門檻 | 需要實體接入網路孔或線路，實體安全可控 | 訊號以廣播方式傳播，穿牆外溢，在停車場或街上也可接收，無需進入建築 |
| 竊聽（嗅探） | 需接上網路線路或鏡射埠；交換器預設只轉送給目的埠 | 同頻道內所有人都能接收空中封包（監聽模式），未加密內容一目了然 |
| 內建保護 | 802.3 本身無加密；常靠 802.1X 連接埠認證、VLAN、MACsec（802.1AE） | 標準內建認證與加密：WEP（RC4，已被破解）、WPA（TKIP）、WPA2（AES-CCMP）、WPA3（SAE、更強加密、前向保密） |
| 認證 | 預設沒有，或用 802.1X | 個人版 PSK（共用密碼）與企業版 802.1X/EAP（RADIUS）；PSK 洩漏則全員受影響 |
| 偽冒與釣魚 | 偽冒需要接線 | 偽冒 AP（Rogue AP、Evil Twin）簡單，使用者連上後遭中間人、釣魚；公共 Wi-Fi 尤其危險 |
| 其他攻擊 | ARP 欺騙、MAC flooding、VLAN hopping | 取消認證（Deauth）攻擊、干擾阻斷服務、WEP/WPA 離線字典攻擊、KRACK、Wi-Fi 蹭網、未授權 AP |
| 管理幀保護 | 無此類 | 舊版管理幀未加密，WPA3 與 802.11w 提供保護 |
| 防護建議 | 實體管控、關閉未用埠、802.1X、Port Security、動態 ARP 檢測 | 使用 WPA3/WPA2-Enterprise、隱藏不等於安全、偵測 Rogue AP（WIPS）、公共場所搭配 VPN、HTTPS、客戶端隔離、SSID 與頻道規劃 |

#### 四、公共 Wi-Fi 的具體建議

1. 使用者端：連線時使用 VPN，只連 HTTPS，關閉自動連線與檔案分享，確認 SSID 與憑證，不在不明熱點輸入敏感資料。
2. 提供者端：採用 WPA3 或 Open 搭配 OWE（機會性加密）、啟用客戶端隔離、入口網頁認證與日誌留存、WIPS 偵測偽冒 AP、分隔訪客與內部網路。

#### 五、結論

通訊協定上，兩者最大差異在媒介存取方式（CSMA/CD 對 CSMA/CA），原因是有線可偵測碰撞、無線不能，並衍生隱藏節點與 ACK 機制；資安上，有線靠實體限制，無線靠廣播與空中介面，天然暴露，必須依賴加密與認證（WPA2/WPA3、802.1X）與偽冒 AP 偵測，才能達到接近有線的安全。`
    }

#### 二、四種等級的功能與運作原理

**RAID 0（條帶，Striping）**：把資料切成條帶（strip）輪流寫入各碟，讀寫可同時進行，效能與容量最大，但完全沒有冗餘，任一顆壞掉整個陣列資料全毀（可靠度比單碟更差，N 顆的故障機率約為單碟的 N 倍）。適用暫存、影像剪輯暫存碟等可再生資料。

**RAID 1（鏡像，Mirroring）**：每筆資料同時寫到兩顆（或多顆）碟，內容完全相同。任一顆損壞，另一顆立即接手，重建只需整碟複製，簡單、可靠。代價是容量利用率只有 50%。適用作業系統碟、資料庫日誌等重要但容量不大的資料。

**RAID 5（分散式單同位）**：資料採條帶化，每條帶另算出一個同位區塊 P＝D1 XOR D2 XOR …，同位區塊輪流分散在各碟，不會集中在單一同位碟。任一顆壞掉，可用其餘碟 XOR 算回遺失區塊。可容忍 1 顆碟損壞，容量利用率 (N−1)/N。小量寫入需「讀舊資料、讀舊同位、寫新資料、寫新同位」共 4 次 I/O（寫入懲罰）。重建期間若再壞一顆就全毀，且大容量碟重建時間長、遇到不可讀區塊（URE）風險升高。

**RAID 6（分散式雙同位）**：在 RAID 5 基礎上再多算一組獨立同位（P 為 XOR，Q 常用 Reed-Solomon 或對角線同位 / RDP），兩組同位都分散儲存。可容忍任意 2 顆碟同時損壞，容量利用率 (N−2)/N，寫入懲罰更高（約 6 次 I/O）。適合大容量、重要資料的檔案伺服器與備份儲存。

#### 三、比較表

| 項目 | RAID 0 | RAID 1 | RAID 5 | RAID 6 |
|---|---|---|---|---|
| 技術 | 條帶 | 鏡像 | 條帶＋單同位（分散） | 條帶＋雙同位（分散） |
| 最少硬碟數 | 2 | 2 | 3 | 4 |
| 可用容量（N 碟，每碟 S） | N×S | N×S÷2（兩兩鏡像） | (N−1)×S | (N−2)×S |
| 容錯能力 | 無 | 每組鏡像可壞 1 顆（兩碟版：1 顆） | 任 1 顆 | 任 2 顆 |
| 讀取效能 | 極佳（N 倍） | 佳（可由兩碟分擔讀取） | 佳（近 N−1 倍） | 佳（近 N−2 倍） |
| 寫入效能 | 極佳（N 倍） | 普通（需寫兩份，約同單碟） | 中（同位計算，小寫入 4 次 I/O） | 較差（雙同位，小寫入約 6 次 I/O） |
| 主要優點 | 速度與容量最大 | 簡單、重建快、可靠 | 容量與容錯平衡，成本低 | 抗雙碟故障，重建期更安全 |
| 主要缺點 | 無容錯 | 容量僅一半，成本高 | 重建期風險、寫入懲罰 | 容量損失較多，控制器運算負擔大 |
| 典型用途 | 暫存、高速暫存區 | 系統碟、日誌 | 一般檔案／應用伺服器 | 大容量備份、重要檔案庫 |

另有巢狀組合：RAID 10（1+0，先鏡像再條帶，最少 4 碟），兼顧效能與容錯，資料庫常用。注意 RAID 不等於備份：誤刪、勒索軟體、控制器故障、火災都無法靠 RAID 還原，仍需異地備份。

#### 四、Python 驗算：XOR 同位與 RAID 5 單碟重建

以 4 碟 RAID 5、每個 strip 取 1 byte 示意。條帶 0 的資料為 B2、6C、E1（十六進位），同位 P＝三者 XOR；同位依條帶輪替。令碟 2 損毀，用其餘碟 XOR 重建。

\`\`\`python
from functools import reduce
from operator import xor
stripes = [(0xB2,0x6C,0xE1),(0x4F,0x93,0x2A)]
disks = [[],[],[],[]]
for i, data in enumerate(stripes):
    p = reduce(xor, data)
    pd = 3 - i % 4                     # 同位碟輪替
    row = list(data); row.insert(pd, p)
    for d in range(4): disks[d].append(row[d])
for d in range(4): print("Disk%d:"%d, [format(v,'08b') for v in disks[d]])
lost = 1
print("Disk1 故障，逐條帶重建：")
for i in range(2):
    rec = reduce(xor, (disks[d][i] for d in range(4) if d != lost))
    print(" stripe",i,format(rec,'08b'),"OK" if rec==disks[lost][i] else "NG")
# 小寫入：新同位 = 舊同位 xor 舊資料 xor 新資料（不必讀其他資料碟）
old_d, new_d, old_p = 0xB2, 0xFF, reduce(xor,stripes[0])
new_p = old_p ^ old_d ^ new_d
print("RMW 新同位", format(new_p,'08b'), new_p == reduce(xor,(new_d,0x6C,0xE1)))

#### 五、結論

最少硬碟數：RAID 0 為 2 顆、RAID 1 為 2 顆、RAID 5 為 3 顆、RAID 6 為 4 顆。選用原則：要速度不要保護選 RAID 0；小容量高可靠選 RAID 1；兼顧容量與成本選 RAID 5；碟數多、單碟大、不能容忍重建期間再壞的情境選 RAID 6；兼要效能與容錯選 RAID 10。政府機關另需搭配異地備份與定期還原演練。`

網路實體隔離（又稱網路隔離閘道、網閘，英文常稱 Network Isolation Gateway，業界亦稱 GAP，即 "air gap" 的概念）是在兩個安全等級不同的網路（如內部機密網路與網際網路）之間，設置專用硬體設備，使兩個網路**在任一時刻都沒有直接的電氣連線與封包路由**，只允許經過檢查的「資料內容」以類似擺渡的方式，由設備在兩個網路之間搬運。重點是「物理上不連通，連通的是資料而非協定」。

1. 外網單元接收資料（如檔案或資料庫同步內容），在應用層終止原有的 TCP 連線。
2. 隔離開關切斷外網側，對資料做病毒掃描、格式與內容檢查、去除 TCP/IP 標頭，只留純資料。
3. 開關切換為連接內網側，把資料交給內網單元，內網單元重新封裝並轉送。

#### 三、與防火牆的差異比較

| 比較項目 | 網路實體隔離設備（網閘） | 防火牆 |
|---|---|---|
| 連線方式 | 內外網無直接連線，兩側獨立主機，以隔離硬體分時擺渡資料 | 內外網仍在同一條路徑上，封包被轉送（路由或橋接） |
| 傳輸單位 | 檢查後的「應用資料」，協定在兩側各自終止 | 封包或連線（TCP/IP 標頭仍被轉送） |
| 控制機制 | 協定中斷＋內容檢查＋時序切換 | 規則比對（IP、埠、狀態、應用層特徵） |
| 安全強度 | 高，抵禦協定層攻擊、隧道、遠端滲透 | 中高，仍可能因規則錯誤、設備漏洞、允許的服務被利用 |
| 效能與彈性 | 較低（需分時切換，延遲較大），服務需逐項設定適配 | 較高，支援即時、多樣服務 |
| 防護對象 | 高機密網路（國防、機要、關鍵基礎設施 OT 與管理網路） | 一般組織邊界、DMZ、區段隔離 |
| 成本與維運 | 成本高、須專屬設計 | 成本低、普及 |
| 能防內部洩密 | 可限制單向傳輸（只進不出或只出不進） | 規則可擋，但仍屬可連線通路 |

#### 四、實務與限制

兩者並非取代關係，而是縱深防禦：網際網路端以防火牆、IPS 把關一般流量，高機密網路與外界的必要資料交換則經過網閘。政府機關常見做法如公務機密網與網際網路隔離、工控系統與辦公網路隔離。限制：網閘無法防止可攜式媒體、USB 與人為帶入惡意程式（如震網病毒 Stuxnet 即越過空隙），也不能取代內容檢查與管理制度，仍需搭配資料交換流程管制、媒體管控、日誌稽核。

#### 五、結論

網路實體隔離設備以「物理不連通＋資料擺渡」換取最高等級的邊界安全，防火牆則以「規則過濾」提供即時、彈性的邊界防護。依資料機密等級與業務所需的即時性選用，高機密環境用網閘，一般環境用防火牆，並以多層防護與管理措施補足。`

**對稱式加密（Symmetric / Secret-key）**：加密與解密使用同一把金鑰 K。C＝E(K, M)，M＝D(K, C)。通信雙方必須事先以安全方式共享 K。

**非對稱式加密（Asymmetric / Public-key）**：每個使用者有一對數學相關的金鑰，公鑰（可公開）與私鑰（自行保管）。用公鑰加密、私鑰解密可達到機密性；用私鑰簽署、公鑰驗證可達到身分認證與不可否認性（數位簽章）。安全性建立在單向陷門函數的計算困難度上（如大數質因數分解、離散對數、橢圓曲線離散對數）。

#### 二、比較表

| 項目 | 對稱式 | 非對稱式 |
|---|---|---|
| 金鑰 | 單一共享金鑰 | 公鑰＋私鑰一對 |
| 速度 | 快（硬體加速，如 AES-NI） | 慢（大數運算，約慢數百至上千倍） |
| 金鑰長度 | 128 / 192 / 256 位元 | RSA 2048 位元以上；ECC 256 位元約相當 RSA 3072 |
| 優點 | 運算快、適合大量資料、密文膨脹小 | 無須事先共享秘密、金鑰分配容易、可做數位簽章與不可否認性、n 人只需 n 對金鑰 |
| 缺點 | 金鑰分配與保管困難；n 人兩兩通訊需 n(n−1)/2 把金鑰；無法單獨提供不可否認性 | 運算量大、不適合大量資料；需 PKI 憑證確認公鑰真實性（防中間人）；對量子電腦（Shor 演算法）脆弱 |
| 提供的安全服務 | 機密性（搭配 MAC 或 AEAD 另得完整性） | 機密性、認證、完整性（簽章）、不可否認性、金鑰交換 |
| 標準 | AES（FIPS 197，Rijndael，區塊 128 位元，金鑰 128/192/256） | RSA（PKCS#1）；或 ECC（ECDSA／ECDH，如 NIST P-256） |

#### 三、混合加密（實務通用做法）

實務上結合兩者：用非對稱式解決「金鑰如何安全傳遞」，用對稱式解決「大量資料如何快速加密」。HTTPS／TLS、PGP、S/MIME 皆採此架構。

#### 四、結論

#### 二、五個等級的特色

**第 1 級 Initial（初始級）**：過程臨時、混亂、無一致性，成敗靠個別人員的能力與英雄式加班。預算與時程常超支，需求常變動，沒有可靠的追蹤，沒有對應的過程領域。

**第 2 級 Managed（已管理級）**：專案層級已有基本管理，需求、計畫、進度與品質有被追蹤，成功經驗可在類似專案重複。過程是「依專案規劃並被管理」，但各專案做法可以不同。對應過程領域（7 項）：需求管理 REQM、專案規劃 PP、專案監督與控制 PMC、供應商協議管理 SAM、量測與分析 MA、過程與產品品質保證 PPQA、組態管理 CM。

**第 3 級 Defined（已定義級）**：組織層級建立標準過程（organization's set of standard processes），各專案由此剪裁出自己的已定義過程，文件化、整合、一致。重點從專案管理擴大到工程活動的整合與組織共通。對應過程領域（11 項）：需求開發 RD、技術解決方案 TS、產品整合 PI、查證 VER、確認 VAL、組織過程焦點 OPF、組織過程定義 OPD、組織訓練 OT、整合專案管理 IPM、風險管理 RSKM、決策分析與解決方案 DAR。

**第 4 級 Quantitatively Managed（量化管理級）**：以統計與量化技術管理過程與產品品質，訂定量化的品質與過程績效目標，使過程績效可預測（如缺陷密度、變異在管制界限內）。對應過程領域（2 項）：組織過程績效 OPP、量化專案管理 QPM。

**第 5 級 Optimizing（最佳化級）**：以量化資料持續改善過程，找出缺陷根因並預防，主動導入創新技術與漸進式改善。對應過程領域（2 項）：組織績效管理 OPM（v1.3 前稱組織創新與推展 OID）、原因分析與解決方案 CAR。

#### 三、各等級重點比較

| 等級 | 名稱 | 特色關鍵字 | 過程領域數 | 層次 |
|---|---|---|---|---|
| 1 | Initial 初始級 | 臨時、混亂、靠個人 | 0 | 個人 |
| 2 | Managed 已管理級 | 專案計畫、追蹤、可重複 | 7 | 專案 |
| 3 | Defined 已定義級 | 組織標準過程、剪裁、整合 | 11 | 組織 |
| 4 | Quantitatively Managed 量化管理級 | 量化目標、統計控制、可預測 | 2 | 量化 |
| 5 | Optimizing 最佳化級 | 持續改善、根因預防、創新 | 2 | 最佳化 |

合計 7＋11＋2＋2＝22 個過程領域。

#### 四、補充與實務

1. 另有連續式表示法（Continuous），以能力等級 0～5 評估單一過程領域，彈性較高。
2. 2018 年起 CMMI 改版為 v2.0（由 ISACA 維護），改為「實務領域（Practice Area）」並以成熟度等級 1～5 描述，名稱與階梯精神延續；v1.3 的 PA 名稱為歷年考題常見用語。
3. 政府機關在委外軟體開發案常要求廠商具備 CMMI 等級（如第 3 級以上），作為品質評選依據，但等級僅代表過程能力，不保證單一專案成敗。
4. 改善的原則是逐級晉升，不宜跳級；第 2 級先把專案管理做穩，第 3 級再建立組織標準，其後才適合導入量化與持續改善。

#### 五、結論

CMMI 五級依序為 Initial、Managed、Defined、Quantitatively Managed、Optimizing，從「靠個人」進步到「專案管理」、「組織標準化」、「量化可預測」、「持續最佳化」。組織應依現況評鑑，逐級補齊對應過程領域，以提升開發品質與預算、時程的可控性。`

弱點（Vulnerability）是資訊系統在設計、實作、設定或管理上的缺陷，可被威脅利用而造成資安事件。這六項來自資訊系統安全評估的傳統分類（TCSEC 與稽核實務常用的控制領域），對應機密性、完整性、可用性（CIA）三大目標：身分驗證、存取控制、物件再用主要保護機密性；準確度保護完整性；服務可靠性保護可用性；責任歸屬則是支撐不可否認性與事後稽核的基礎。

#### 二、逐項說明弱點特性、攻擊與對策

| 功能領域 | 弱點特性 | 常見攻擊／事件 | 對策 |
|---|---|---|---|
| 身分驗證（Identification and Authentication） | 識別（你是誰）與鑑別（證明你是你）機制薄弱：弱密碼、預設密碼、明文傳輸憑證、單因素驗證、驗證碼可預測、憑證長期不更換 | 暴力破解、字典攻擊、撞庫（credential stuffing）、密碼嗅探、釣魚、重送攻擊（replay）、冒用身分 | 密碼複雜度與定期更換原則、多因素驗證（MFA）、登入失敗鎖定、加密傳輸（TLS）、單一登入搭配強認證、自然人憑證 |
| 存取控制（Access Control） | 權限授予過大或不當、缺少最小權限與職務分離、預設開放、權限未回收、授權檢查有漏洞 | 越權存取（水平／垂直）、權限提升、目錄遍歷、IDOR、內部人員濫用 | 最小權限、角色式存取控制（RBAC）、職務分離、定期權限盤點與帳號清查、機敏資料分級、閘道與防火牆區段隔離 |
| 責任歸屬（Accountability） | 無法將行為追溯到個人：共用帳號、日誌未啟用或可被修改、時間未同步、紀錄不完整 | 否認行為、清除日誌（anti-forensics）、共用帳號濫用難以追責 | 一人一帳號、完整稽核日誌（誰、何時、做什麼）、日誌集中保存與防竄改（寫入一次、雜湊簽章）、NTP 時間同步、數位簽章達成不可否認性、SIEM 關聯分析 |
| 物件再用（Object Reuse） | 儲存媒體或記憶體被釋放或重新配置後，殘留前一使用者的資料未清除（殘餘資料 remanence），含刪除的檔案、記憶體頁、報廢硬碟、雲端虛擬機磁碟 | 撿拾報廢硬碟與影印機硬碟、還原已刪除檔案、讀取未清零的記憶體或快取 | 配置前清零、安全抹除（多次覆寫、加密抹除 crypto-erase）、消磁或實體銷毀、媒體報廢程序（NIST SP 800-88）、全磁碟加密 |
| 準確度（Accuracy） | 輸入、處理、傳輸或儲存過程中資料正確性與完整性未獲保證：缺少輸入驗證與檢核、無完整性檢查、交易不具原子性 | SQL 注入、參數竄改、中間人竄改、資料毀損、重複交易、錯誤輸入造成錯帳 | 輸入驗證與範圍檢核、檢查碼（checksum / CRC）、雜湊與數位簽章、資料庫交易（ACID）、複核與對帳、版本控管與變更管理 |
| 服務可靠性（Reliability of Service） | 單點失效、容量不足、缺少備援與備份、無災難復原計畫、相依第三方服務 | DoS 與 DDoS、勒索軟體、資源耗盡、設備或電力故障、天災 | 備援與負載平衡（HA、RAID、雙機房）、備份 3-2-1 與還原演練、DDoS 防護（CDN、流量清洗）、容量規劃與監控、業務持續運作計畫（BCP）與災害復原（DRP） |

#### 三、整體特性與管理建議

1. 這六項多屬「設計或管理缺陷」而非單純軟體 bug，需靠政策、流程與技術並行處理，單靠防毒軟體無法解決。
2. 彼此相互依賴：身分驗證被突破，存取控制與責任歸屬即失效；日誌（責任歸屬）若可被竄改，準確度也無法被證明。
3. 公務機關應依資通安全管理法與其子法的規範：資通安全責任等級分級辦法的資通系統防護基準涵蓋存取控制、識別與鑑別、稽核與可歸責性、系統與資訊完整性、系統與通訊保護、營運持續計畫等構面，與上述六項大致對應；稽核方面可進行弱點掃描、滲透測試、內外部稽核與社交工程演練，定期以 PDCA 持續改善。

#### 四、結論

六項功能弱點分別對應認證、授權、稽核、殘餘資料、資料正確性與可用性，構成資通系統安全的基本控制網。機關應逐項盤點弱點特性，採行多層次技術與管理對策，並以日誌與稽核確保可歸責，才能降低資安事件發生機率與衝擊。`

      answer: `#### 一、揮發性資料（Volatile Data）

指儲存於 RAM、CPU 暫存器與快取等處，**斷電、關機或程序結束後即消失**的資料。在數位證據取得（Digital Acquisition）時，這類資料含有重要的即時線索：執行中的程序、網路連線與開放埠、登入使用者、剪貼簿、解密後的金鑰與密碼、惡意程式在記憶體中的 payload 等，硬碟映像無法取得。

取證原則是**依揮發性由高至低的順序蒐集（Order of Volatility）**，依據 RFC 3227（Guidelines for Evidence Collection and Archiving）：

| 順序 | 資料 | 揮發程度 |
|---|---|---|
| 1 | CPU 暫存器、快取 | 奈秒級，最易失 |
| 2 | 路由表、ARP 快取、程序表、核心統計、記憶體（RAM） | 秒至分鐘 |
| 3 | 暫存檔案系統（如 swap、/tmp） | 重新開機即消失 |
| 4 | 磁碟（硬碟、SSD） | 非揮發，但可能被覆寫 |
| 5 | 遠端日誌與監控資料 | 依保存設定 |
| 6 | 實體組態、網路拓樸 | 相對穩定 |
| 7 | 歸檔媒體（備份磁帶、光碟） | 最穩定 |

實務上不可隨意關機（避免損失揮發性資料）；以最小影響的工具（如 FTK Imager、WinPmem、LiME）擷取記憶體映像並計算雜湊值，並記錄取證時間與操作過程。

#### 二、App 程式

App 為 Application 的簡稱，原指應用程式，現多指在智慧型手機、平板（iOS、Android）上執行的行動應用程式，透過應用商店（App Store、Google Play）下載安裝，可存取手機的感測器、定位、相機與聯絡人等資源。資安上的意涵：（1）App 權限過大會造成個資外洩；（2）山寨或惡意 App、重新封裝 App 可能內含木馬；（3）需做行動應用 App 基本資安檢測（經濟部工業局 / 行動應用 App 基本資安規範，檢測項目含資料儲存、傳輸、授權、敏感性資料等）；（4）組織導入 BYOD 時應搭配行動裝置管理（MDM）。

#### 三、智慧型代理人（Intelligent Agent）

指能在特定環境中**感知（perceive）環境、自主（autonomous）決策並採取行動（act）以達成目標**的軟體或硬體實體，具有自主性、反應性、主動性（目標導向）、社會性（與其他代理人或人溝通）及學習能力。例：網頁搜尋與比價機器人、智慧客服、推薦系統、電子郵件過濾、排程與自動交易代理人、資安上的自動化威脅偵測與回應。多個代理人可組成多代理人系統（Multi-Agent System）協同運作。安全議題包括：被惡意操縱、權限過大、行為不可預期。近年的大型語言模型代理人（LLM agent）亦屬此概念的延伸。

#### 四、零時差攻擊（Zero-day Attack）

指攻擊者利用**軟體廠商尚未知悉或尚未發布修補程式（patch）的漏洞**發動的攻擊。從漏洞被發現到修補之間的空窗期，防守方「有零天可以準備」，因此一般依賴特徵碼的防毒、IPS 常無法偵測。特性：隱匿性高、成本高、常見於 APT 與針對性攻擊（如 Stuxnet 利用多個 0-day）。防禦：縱深防禦與網路分段、最小權限、白名單與應用程式控管、行為式偵測與 EDR、沙箱動態分析、虛擬補丁（IPS/WAF）、威脅情資分享與快速更新、漏洞通報與管理（弱點揭露）。

#### 五、數位鑑識（Digital Forensics）

指以**科學方法與標準程序，對電腦、行動裝置、網路與雲端的數位資料進行辨識、保全、取得、分析、呈現**，使其成為具證據力、可被法庭採納的電子證據，用以還原事件經過、追查來源與責任。流程可概括為：辨識（Identification）→保全（Preservation）→蒐集／取得（Acquisition）→檢驗分析（Examination / Analysis）→報告呈現（Reporting）。關鍵原則：不改變原始證據（寫入保護、位元複製）、雜湊值驗證完整性、監管鏈（Chain of Custody）完整、可重現。分類有電腦鑑識、網路鑑識、行動裝置鑑識、記憶體鑑識、雲端鑑識。應用於資安事件調查、內部違規稽核、犯罪偵查與民事訴訟。`

把任意長度的輸入（訊息、檔案）經雜湊函數運算，得到**固定長度**的輸出，稱為雜湊值、訊息摘要（Message Digest）或指紋。例：MD5 為 128 位元（32 個十六進位字元），SHA-256 為 256 位元（64 個十六進位字元）。

#### 二、雜湊函數的特性與主要用途

安全雜湊函數須具備：（1）單向性（Preimage resistance，無法由雜湊值反推原文）；（2）抗弱碰撞（給定 x 難找 x' 使 H(x)＝H(x')）；（3）抗強碰撞（難找任兩個不同輸入有相同雜湊值）；（4）雪崩效應（輸入改 1 位元，輸出約一半位元改變）；（5）計算快速、輸出固定長度。

#### 三、外觀相同的兩個檔案 MD5 卻不同的可能原因

雜湊是對**每一個位元組**運算，只要檔案中任一位元不同，雜湊值就完全不同。畫面上看起來一樣，並不代表二進位內容相同。可能原因：

| 原因 | 說明 |
|---|---|
| 檔案格式內含元資料（metadata） | Word、PDF、圖片內含作者、建立與修改時間、軟體版本、文件 GUID、修訂紀錄、印表機設定等，即使內容相同也不同 |
| 時間戳記 | 壓縮檔、PDF、Office 文件會內嵌建立／儲存時間 |
| 隱藏字元或空白 | 結尾空白、零寬字元、Tab 與空白的差異、不可見控制碼 |
| 編碼不同 | UTF-8、Big5、UTF-16，或 UTF-8 加 BOM（位元組順序標記），文字相同但位元組不同 |
| 換行符號不同 | Windows 為 CRLF（0D 0A），Unix 為 LF（0A） |
| 檔案屬性或附加資料 | 檔案末端附加資料、NTFS 備用資料流（ADS）、嵌入物件、壓縮方式與參數 |
| 傳輸或複製過程變化 | FTP 以文字模式傳輸被轉換換行、編輯軟體自動存檔格式變更 |
| 惡意修改或碰撞 | 刻意構造或有細微的差異；MD5 已被證明可人為構造碰撞（兩個不同檔案相同 MD5，如王小雲 2004 年的研究），所以相同 MD5 也不能保證內容相同，須搭配 SHA-256 |

#### 四、Honeypot 惡意程式分析中採用 MD5／SHA-256 的目的

蜜罐（Honeypot）是故意佈置的誘捕系統，用來吸引攻擊者並收集被投放的惡意程式與網路活動。對收集到的樣本計算雜湊值，目的有：

1. **唯一識別與去重**：同一惡意程式可能被成千上萬次投放，以雜湊值當樣本指紋，重複樣本只需分析與儲存一次，並用雜湊值當索引追蹤各蜜罐的出現次數、時間與來源 IP。
2. **威脅情資比對**：把雜湊值送到 VirusTotal、MalwareBazaar、威脅情資平台（含 TWCERT／CC、國家資安資訊分享與分析中心 N-ISAC）比對，不必上傳樣本即可得知是否為已知惡意程式、家族與各防毒引擎偵測結果；也可將新發現的雜湊值作為 IoC（入侵指標）分享給其他單位，加入封鎖清單。
3. **完整性與可追溯**：確保樣本在蒐集、保存、傳送、分析過程未被改動，分析報告可引用雜湊值對應到特定樣本，讓不同人員可重現結果。
4. **處理安全**：以雜湊值而非檔案本身進行文件管理與交換，避免誤執行危險檔案。

為什麼常 MD5 與 SHA-256 並用：MD5 計算快且歷史資料庫與工具多數仍支援，但有碰撞風險，攻擊者可構造同 MD5 的不同檔案來規避比對；SHA-256 抗碰撞性強，因此以 SHA-256 為主、MD5 為相容輔助。另外注意：雜湊只比對完全相同的檔案，惡意程式稍微改動（加殼、重新編譯）雜湊值就不同，所以還要搭配模糊雜湊（ssdeep、TLSH）、YARA 規則與行為分析。

#### 五、個資法第 22 條第 2 項的電子證據取證與雜湊的目的

**取證（Acquisition）程序**：「複製」最能保全證據原貌，應採**位元複製（bit-stream / forensic image）**而非一般檔案複製（一般複製會漏掉已刪除檔案、未配置空間、檔案系統中繼資料，也會更改存取時間）。

| 步驟 | 作法與目的 |
|---|---|
| 1. 現場保全與記錄 | 拍照記錄設備狀態、序號、連線；開機中的設備先依 RFC 3227 擷取揮發性資料（記憶體、連線）；封緘證物；登錄時間地點人員 |
| 2. 寫入保護 | 使用硬體寫入阻斷器（write blocker）或唯讀掛載，避免取證過程改動原始媒體 |
| 3. 位元複製 | 使用 dd、FTK Imager、EnCase、Guymager 等，製作完整映像檔（含未配置空間與已刪除檔案），至少做兩份 |
| 4. 計算雜湊值 | 對原始媒體與映像檔各計算 MD5 與 SHA-256，記錄於取證報告 |
| 5. 驗證 | 原件與複本雜湊值必須一致，才證明複本與原件逐位元相同；原件封存，分析只在複本進行 |
| 6. 監管鏈 | 證物每次移交都記錄時間、人員、目的並簽名，保存環境管制，證明沒有被調換或竄改 |
| 7. 報告 | 說明工具與版本、步驟、雜湊值，使第三方可重現驗證 |

**取證驗證 Python 示例**（隨機資料，雜湊值每次不同）：

\`\`\`python
import hashlib, os, tempfile, shutil
d = tempfile.mkdtemp(); src = os.path.join(d, "evidence.bin"); img = os.path.join(d, "image.dd")
open(src, "wb").write(os.urandom(100000))
s0 = hashlib.sha256(open(src, "rb").read()).hexdigest(); shutil.copy(src, img)
s1 = hashlib.sha256(open(img, "rb").read()).hexdigest()
print("原件 SHA-256:", s0[:32] + "..."); print("複本 SHA-256:", s1[:32] + "...", "一致" if s0 == s1 else "不一致")
with open(img, "r+b") as f: f.seek(500); f.write(b"\\x00")
print("改動 1 byte 後:", hashlib.sha256(open(img, "rb").read()).hexdigest()[:32] + "...", "（與原件不同）")
\`\`\`

\`\`\`text

複本 SHA-256: 1e6ba196293fb51c8b3ef34772916b70... 一致
改動 1 byte 後: 5db2d4519a42be2f6592c13896c854f8... （與原件不同）
\`\`\`

**使用 MD5 / SHA-256 的目的**：
1. **證明證據完整性**：取證前後與每次移交時重算雜湊值，只要一致，即證明資料自取得後未被增刪修改，維持證據力。
2. **證明複本與原件相同**：複製的資料與被扣留的原件同一，之後可只留複本、返還原件，避免影響業者營運。
3. **可重現驗證**：任何第三方（業者、法院、鑑定人）都能自行計算雜湊值核對，結果客觀、可重現。
4. **與監管鏈結合**：雜湊值寫入證物清單與報告，成為證據身分證。
5. 因 MD5 有碰撞疑慮，法庭實務建議同時計算 SHA-256（或兩者並用），以提高證據可信度。

#### 六、結論

雜湊值是固定長度的資料指紋，用於完整性、簽章、識別與比對；兩個外觀相同的檔案 MD5 不同多半是 metadata、編碼、換行、隱藏字元等造成；在蜜罐中用於樣本去重與情資比對；在個資法行政檢查扣留或複製時，應以寫入保護與位元複製取證，並以雜湊值與監管鏈證明證據完整、可重現。`
    }
  ]
},

const BREAK_AT_PERIOD = true;   // 解析遇到「。」自動換行；不想要就改成 false

/* 全形→半形、英文轉小寫；逐字處理，確保處理後長度不變（highlight 才對得準） */
function normText(s) {
  let out = '';
  for (const ch of String(s)) {
    const n = ch.normalize('NFKC').toLowerCase();
    out += (n.length === ch.length) ? n : ch;
  }
  return out;

function parseTerms(raw) {
  return [...new Set(normText(raw).split(/\s+/).filter(Boolean))];
}
/* 去掉資料裡用來排版的 HTML 標籤，避免搜 "br"、"code"、"strong" 時誤中 */
function stripTags(s) {
  return String(s == null ? '' : s)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i|pre)(?:\s[^>]*)?>/gi, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
}
/* 每個關鍵字都必須出現（AND）；總分 = 各關鍵字命中的最高權重欄位之和 */
function scoreFields(terms, fields) {
  let total = 0;
  for (const term of terms) {
    let best = 0;
    for (const f of fields) if (f.w > best && f.t.includes(term)) best = f.w;
    if (!best) return 0;
    total += best;
  }
  return total;
}
/* 在已渲染的 DOM 文字節點上標黃（不動 HTML 結構） */
function highlightIn(root, terms) {
  if (!root || !terms.length) return;
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    if (!n.nodeValue.trim()) continue;
    const p = n.parentNode;
    if (p && p.closest && p.closest('svg, button, mark')) continue;
    nodes.push(n);
  }
  nodes.forEach(node => {
    const text = node.nodeValue, low = normText(text);
    const ranges = [];
    terms.forEach(t => {
      let i = low.indexOf(t);
      while (i !== -1) { ranges.push([i, i + t.length]); i = low.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return;
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (let k = 1; k < ranges.length; k++) {
      const last = merged[merged.length - 1];
      if (ranges[k][0] <= last[1]) last[1] = Math.max(last[1], ranges[k][1]);
      else merged.push(ranges[k].slice());
    }
    const frag = document.createDocumentFragment();
    let pos = 0;
    merged.forEach(([s, e]) => {
      if (s > pos) frag.appendChild(document.createTextNode(text.slice(pos, s)));
      const m = document.createElement('mark');
      m.className = 'hl';
      m.textContent = text.slice(s, e);
      frag.appendChild(m);
      pos = e;
    });
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* 解析換行：遇到「。」就換行（已有 <br>、句尾、或後面接」』）” 的不重複換） */

/* ---------- 搜尋欄位索引 ---------- */
function plainAnswer(md) {
