      answer: `#### (一) 關聯式資料庫與 NoSQL 的差異

NoSQL 是 "Not Only SQL"，泛指不採用關聯式資料表模型的資料庫，常見四大類：**鍵值（Key-Value，如 Redis）、文件（Document，如 MongoDB）、欄族（Column-family，如 Cassandra、HBase）、圖形（Graph，如 Neo4j）**。

| 比較項目 | 關聯式資料庫（RDBMS，如 MySQL、Oracle） | NoSQL（如 MongoDB、Redis） |
|---|---|---|
| 資料模型 | 二維表格（列、欄），以主鍵、外來鍵建立關聯 | 鍵值、文件（JSON）、欄族、圖形等，依需求選用 |
| 綱要（Schema） | 事先嚴格定義（schema-on-write），改欄位需 ALTER | 彈性或無綱要（schema-less），同一集合內文件欄位可不同 |
| 正規化與連接 | 重視正規化，資料拆成多表，查詢靠 JOIN | 常採反正規化，相關資料內嵌在同一文件，少用或不用 JOIN |
| 查詢語言 | 標準 SQL，功能完整（聚合、子查詢、交易） | 各系統自有 API 或查詢語言，缺乏統一標準 |
| 交易與一致性 | 強調 ACID，強一致性 | 多採 BASE（基本可用、軟狀態、最終一致），依 CAP 定理取捨 |
| 擴充方式 | 以垂直擴充（Scale-up，換更強的主機）為主；水平擴充較複雜 | 天生設計為水平擴充（Scale-out，增加節點、資料分片） |
| 資料型態 | 結構化資料 | 結構化、半結構化、非結構化（文字、日誌、社群資料） |
| 適用情境 | 銀行、訂單、ERP 等重視一致性、關係複雜的交易系統 | 大數據、即時推薦、物聯網、社群網路、內容管理、快取與會話儲存 |

為什麼 NoSQL 在大數據情境較快：不需要多表連接、模型貼近應用程式的物件、容易分散到多台便宜機器。代價是較弱的交易能力與跨實體查詢能力。兩者並非取代關係，企業常混用（交易用關聯式，快取與分析用 NoSQL）。

#### (二) 員工資料的兩種表示

下列範例資料皆為虛構。

**1. 關聯式資料庫資料表**

\`\`\`sql
CREATE TABLE Employee (
  emp_id      VARCHAR(10) PRIMARY KEY,      -- 員工編號
  name        VARCHAR(20) NOT NULL,         -- 姓名
  national_id CHAR(10)    NOT NULL UNIQUE,  -- 身分證字號（候選鍵）
  age         INT,                          -- 年齡
  department  VARCHAR(20),                  -- 部門
  title       VARCHAR(20),                  -- 職稱
  salary      INT                           -- 薪資
);
\`\`\`

| <u>員工編號</u> | 姓名 | 身分證字號 | 年齡 | 部門 | 職稱 | 薪資 |
|---|---|---|---|---|---|---|
| E001 | 王小明 | A123456789 | 32 | 資訊部 | 工程師 | 65000 |
| E002 | 李美華 | B234567891 | 41 | 人資部 | 經理 | 90000 |
| E003 | 陳大同 | C123456780 | 27 | 資訊部 | 助理工程師 | 48000 |

（身分證字號為候選鍵，故宣告 UNIQUE；員工編號選作主鍵。若要再正規化，可把部門拆成「部門」表，員工表放部門編號作外來鍵。）

**2. NoSQL：文件型資料庫（MongoDB）**——一位員工就是一份 JSON 文件，放在 employee 集合（collection）：

\`\`\`json
{
  "_id": "E001",
  "name": "王小明",
  "national_id": "A123456789",
  "age": 32,
  "department": "資訊部",
  "title": "工程師",
  "salary": 65000
}
\`\`\`

\`\`\`javascript
// 新增
db.employee.insertMany([
  { _id: "E001", name: "王小明", national_id: "A123456789", age: 32, department: "資訊部", title: "工程師",   salary: 65000 },
  { _id: "E002", name: "李美華", national_id: "B234567891", age: 41, department: "人資部", title: "經理",     salary: 90000 },
  { _id: "E003", name: "陳大同", national_id: "C123456780", age: 27, department: "資訊部", title: "助理工程師", salary: 48000 }
]);

// 查詢：資訊部且薪資高於 50000
db.employee.find({ department: "資訊部", salary: { $gt: 50000 } });

// 彙總：各部門平均薪資
db.employee.aggregate([ { $group: { _id: "$department", avgSalary: { $avg: "$salary" } } } ]);

// 彈性綱要：新員工可帶額外欄位或巢狀結構，不必 ALTER TABLE
db.employee.insertOne({ _id: "E004", name: "林小芳", national_id: "D223456781", age: 35,
  department: "資訊部", title: "工程師", salary: 70000,
  skills: ["Python", "SQL"], address: { city: "台北", zip: "100" } });
\`\`\`

**3. NoSQL：鍵值型資料庫（Redis）**——以「鍵」直接取「值」，值可以是整份 JSON 字串或雜湊（hash）：

| 鍵（Key） | 值（Value） |
|---|---|
| emp:E001 | {"name":"王小明","national_id":"A123456789","age":32,"department":"資訊部","title":"工程師","salary":65000} |
| emp:E002 | {"name":"李美華","national_id":"B234567891","age":41,"department":"人資部","title":"經理","salary":90000} |
| emp:E003 | {"name":"陳大同","national_id":"C123456780","age":27,"department":"資訊部","title":"助理工程師","salary":48000} |
| dept:資訊部 | 集合 {E001, E003}（自建的索引：部門對應員工編號） |

\`\`\`text
SET  emp:E001 "{\\"name\\":\\"王小明\\",\\"age\\":32,\\"department\\":\\"資訊部\\",\\"salary\\":65000}"
GET  emp:E001
HSET emp:E002 name 李美華 age 41 department 人資部 title 經理 salary 90000
HGET emp:E002 salary
SADD dept:資訊部 E001 E003        # 依部門查詢必須由應用程式自己維護這種反向索引
SMEMBERS dept:資訊部
\`\`\`

**對照重點**：

- 關聯式：固定欄位、一筆資料一列，查詢用 SQL，「部門＝資訊部」直接 WHERE。
- 文件型：一份文件含整筆資料，欄位可彈性增減，可對任何欄位建立索引與查詢。
- 鍵值型：結構最簡單、速度最快，但只能依鍵查找；其他查詢條件需要另建索引鍵。

      question: `「資料獨立」（Data Independence）是使用資料庫的方法來管理資料的優點之一，請說明資料獨立的做法及資料獨立的優點。（20 分）`,
      answer: `#### 一、什麼是資料獨立

**資料獨立**指「應用程式與資料的儲存結構、存取方式互相獨立」：當資料的結構或儲存方式改變時，不必（或只需極少）修改應用程式。傳統檔案處理系統把檔案格式寫死在程式裡（欄位位置、長度、排序），檔案一改，所有讀它的程式都要重寫、重新編譯，這就是「資料相依」；資料庫系統的目標就是消除這種相依。

#### 二、做法：三層式綱要架構（ANSI/SPARC three-schema architecture）與對映

\`\`\`htmldiagram

資料庫系統把「資料的描述」分成三層，**層與層之間用 DBMS 維護的「對映（mapping）」連結**，每一層只看到自己需要的那一層：

| 層次 | 內容 | 例子 |
|---|---|---|
| 外部層 | 各使用者或應用程式看到的局部觀點 | 人事 View：只含姓名、部門，隱藏薪水 |
| 概念層 | 整個資料庫的邏輯結構與限制，與儲存無關 | 員工、部門兩張表、主外鍵、CHECK |
| 內部層 | 資料在磁碟上實際如何存放 | B+ 樹索引、資料頁大小、檔案組織 |

具體做法（落實在 DBMS 與 SQL 上）：

- **資料字典（catalog）**：綱要資訊集中存在 DBMS 中，由 DBMS 解譯，程式不內建檔案格式。
- **宣告式的查詢語言（SQL）**：程式只說「要什麼」，不說「怎麼找」；由查詢最佳化器自行決定用哪個索引、哪種連接演算法。
- **View（檢視表）**：用 \`CREATE VIEW\` 建立外部層，應用程式只對 View 存取。
- **對映維護**：改了下層結構，DBMS 的管理者（DBA）只更新對映，不動上層。

#### 三、兩種資料獨立

**1. 物理資料獨立（Physical Data Independence）**：改變內部層（儲存結構、存取路徑）而不影響概念層與應用程式。例如：

\`\`\`sql
CREATE INDEX idx_dept ON Emp(dept);   -- 新增索引，改變存取路徑
-- 應用程式的查詢完全不用改，只是 DBMS 內部改走索引，速度變快
SELECT name FROM Emp WHERE dept = 'IT' AND salary > 55000;
\`\`\`

其他例：換磁碟或搬到 SSD、改變資料檔分割方式、重新組織資料頁、壓縮資料。

**2. 邏輯資料獨立（Logical Data Independence）**：改變概念層（新增欄位、把一張表拆成兩張、合併表）而不影響外部層與應用程式。實作上靠 View，例如把 Emp 拆成基本資料與薪資兩表後，用 View 還原原本的樣子：

\`\`\`sql
ALTER TABLE Emp RENAME TO Emp_old;
CREATE TABLE EmpBasic (id INT PRIMARY KEY, name VARCHAR(20), dept VARCHAR(20));
CREATE TABLE EmpPay   (id INT PRIMARY KEY, salary INT);
-- 搬移資料（略）
CREATE VIEW Emp AS
  SELECT b.id, b.name, b.dept, p.salary
  FROM EmpBasic b JOIN EmpPay p ON p.id = b.id;
-- 原本的 SELECT name FROM Emp WHERE ... 查詢一字不改仍可執行
\`\`\`

這個流程已用 SQLite 實測：加索引前、加索引後、拆表加 View 後，同一個查詢都回傳相同結果。新增欄位時，原有查詢不使用新欄位，同樣不受影響。注意：邏輯獨立比物理獨立難達成——若被刪除的欄位正好是某個 View 用到的，或 View 不可更新，就仍須修改程式。

#### 四、優點

- **降低維護成本**：結構調整不必逐一修改、重測所有應用程式。
- **效能可獨立調校**：DBA 可加索引、改儲存、分割資料表，不影響功能。
- **支援多種使用者觀點**：不同部門用不同 View，看到各自需要的資料。
- **資料安全與保護**：View 可隱藏敏感欄位，使用者無法直接碰底層資料。
- **資料共享且減少重複**：集中管理，各應用程式共用同一份資料，減少冗餘與不一致。
- **系統可演進**：新技術（新儲存媒體、新硬體）可導入而不重寫上層系統，延長系統壽命。`

      answer: `記號：S = 供應商編號、City = 供應商城市、Grade = 供應商等級、P = 零件編號、Qty = 零件供應數量。

函數相依（FD）：FD1 {S, P} → Qty；FD2 S → City；FD3 S → Grade；FD4 City → Grade。已用 Python 計算屬性閉包驗證：{S, P}⁺ = {S, P, Qty, City, Grade}（全部屬性），所以 {S, P} 是超鍵；它的任何真子集都不是（S⁺ = {S, City, Grade}、P⁺ = {P}），所以 {S, P} 是唯一候選鍵，與題目一致。

#### (一) 目前符合第幾正規型式？ → 只符合 1NF

- **符合 1NF**：題目的表格各屬性皆為單一值（不可再分），屬於關聯表。
- **不符合 2NF**：2NF 要求「非主屬性必須完全函數相依於候選鍵」。主屬性只有 S 與 P，非主屬性 City、Grade 只相依於候選鍵的一部分——FD2：S → City、FD3：S → Grade，這是**部分相依（partial dependency）**，違反 2NF。
- 因為不符合 2NF，更不符合 3NF（另外還有傳遞相依：S → City → Grade，違反 3NF）。

所以此表格的最高正規型式為 **1NF**。

異常現象（說明為何要正規化），以下為範例資料：

| S | City | Grade | P | Qty |
|---|---|---|---|---|
| S1 | 台北 | 20 | P1 | 300 |
| S1 | 台北 | 20 | P2 | 200 |
| S2 | 台中 | 10 | P1 | 100 |
| S3 | 台中 | 10 | P2 | 150 |

- **更新異常**：S1 搬到新竹，要改 S1 的每一列（有 2 列），漏改就不一致。
- **新增異常**：新供應商尚未供應任何零件（沒有 P），因為 P 是主鍵的一部分不得為 NULL，所以無法登錄這個供應商。
- **刪除異常**：S2 唯一的供應紀錄被刪掉，S2 的城市與等級資訊也一併消失。
- **冗餘**：「台中的等級是 10」被重複存放（S2、S3 各一次）。

#### (二) 應正規化到 3NF（此例同時也是 BCNF）

**步驟 1：1NF → 2NF**，移除部分相依，把相依於 S 的屬性搬出：

- 供應商（<u>S</u>, City, Grade）
- 供應（<u>S</u>, <u>P</u>, Qty）

**步驟 2：2NF → 3NF**，移除傳遞相依 S → City → Grade，把 City → Grade 獨立成表：

- 供應商（<u>S</u>, City）
- 城市等級（<u>City</u>, Grade）
- 供應（<u>S</u>, <u>P</u>, Qty）

**最終表格綱要**（含主鍵與外來鍵）：

| 表格名稱 | 屬性 | 主鍵 | 外來鍵 |
|---|---|---|---|
| 城市等級 | 供應商城市、供應商等級 | 供應商城市 | 無 |
| 供應商 | 供應商編號、供應商城市 | 供應商編號 | 供應商城市 參照 城市等級（供應商城市） |
| 供應 | 供應商編號、零件編號、零件供應數量 | 供應商編號 + 零件編號 | 供應商編號 參照 供應商（供應商編號） |

\`\`\`sql
CREATE TABLE 城市等級 (
  供應商城市 VARCHAR(20) PRIMARY KEY,
  供應商等級 INT NOT NULL
);
CREATE TABLE 供應商 (
  供應商編號 VARCHAR(10) PRIMARY KEY,
  供應商城市 VARCHAR(20) NOT NULL,
  FOREIGN KEY (供應商城市) REFERENCES 城市等級(供應商城市)
);
CREATE TABLE 供應 (
  供應商編號 VARCHAR(10),
  零件編號 VARCHAR(10),
  零件供應數量 INT NOT NULL,
  PRIMARY KEY (供應商編號, 零件編號),
  FOREIGN KEY (供應商編號) REFERENCES 供應商(供應商編號)
);
\`\`\`

（若另有「零件」表，則供應.零件編號也應宣告為參照零件表的外來鍵；題目未提供，故未列。）

**程式驗證結果**：

- 三個表格各自檢查：每個非平凡 FD 的左邊都是該表的超鍵，故皆符合 BCNF（也就符合 3NF）。
- **無損連接**：用 chase 檢查 {供應(S,P,Qty)、供應商(S,City)、城市等級(City,Grade)} 對原本 R 為無損分解（連接 供應 ⋈ 供應商 ⋈ 城市等級 可還原原表，不多不少）。
- **保持相依**：FD1 在供應表；FD2 在供應商表；FD4 在城市等級表；FD3（S → Grade）可由 S → City 與 City → Grade 傳遞推得，所以四個 FD 全部保留。

套用範例資料後：

| 城市等級：城市 | 等級 |
|---|---|
| 台北 | 20 |
| 台中 | 10 |

| 供應商：S | City |
|---|---|
| S1 | 台北 |
| S2 | 台中 |
| S3 | 台中 |

「台中的等級是 10」只存一次；新供應商可先登錄而不必有供應紀錄；刪掉供應紀錄也不會連帶丟失供應商資料。

**為什麼不停在 2NF？** 2NF 的「供應商（S, City, Grade）」仍有 City → Grade 的傳遞相依，同一城市的等級會在多個供應商列重複，仍有更新異常；所以要繼續拆到 3NF。**為什麼不再往上？** 3NF 與 BCNF 在這個綱要下已相同，且沒有多值相依，故 3NF 即適當。`

### 一、逐步轉換

**步驟 1：強實體 → 一個實體一張表**
- E1(A, B, C)，PK = A。
- E2(D, E)，PK = D。單值屬性放進表；E 是單值屬性，且 D→E，留在 E2。多值複合屬性 {F, G(G1,G2)} 先不放（步驟 7 處理）。
- PQRS(P, Q, R, S)，PK = P。
- TUV(T, U, V)，PK = T。

**步驟 2：特殊化（E1 → d → S1(H,J)、S2(K,M)）**
- 採「每個子類一張表」（Elmasri 的 8A 法，適合全部參與、不相交、子類有自己的屬性）。子類表的 PK 是超類的鍵 A，同時 A 是 FK 參照 E1(A)。
- S1(H, J)：圖上 H 是子類自己的鍵，故 H 在此表為候選鍵（UNIQUE NOT NULL），PK 選 A（FK 欄位），這樣整個特殊化的所有表以同一把鍵 A 連接。
- S2(K, M)：沒有自己的鍵，PK = A。
- 「E1 全部參與」表示每個 E1 都必須屬於某個子類，這個限制不能只用 FK 表達，需要靠交易層／觸發器／應用程式保證；「不相交」則表示同一個 A 不可同時出現在 E1_HJ 與 E1_KM。
- 取捨：不相交時也可以合成一張表加 type 欄，但會有大量 NULL，且 J、K、M 之間不同子類的欄位混在一起；故不採用。

**步驟 3：E1 與 E2 的 M:N 關係（無屬性）**
- M:N 必須獨立成表：E1_E2(A, D)，PK = (A, D)，A 為 FK → E1，D 為 FK → E2。沒有關係屬性，所以只有兩個 FK 欄位。

**步驟 4：三元關係（E2 多、PQRS 多、TUV 一）**
- 三元關係獨立成表，把三個實體的 PK 都放進來當 FK：E2_PQRS_TUV(D, P, T)。
- PK：看基數。E2 與 PQRS 兩端是「多」，TUV 端是「一」，意思是「給定一組 (D, P)，最多只對到一個 T」，故 (D,P)→T，PK = (D, P)，T 只是 FK（NOT NULL，因為假設 TUV 端為恰好一個）。若 PK 取三個欄位 (D,P,T)，T 非主屬性就會多出多餘的鍵，非最小，所以不取。
- FK：D → E2(D)、P → PQRS(P)、T → TUV(T)。

**步驟 5：PQRS 的遞迴 1:1 關係**
- 兩端都是「一」的遞迴關係，在同一張表加一個自我參照的 FK 欄位即可：PQRS(P, Q, R, S, P_PARTNER)，P_PARTNER → PQRS(P)，加 UNIQUE 才是 1:1（否則變成 N:1），允許 NULL（沒有夥伴），並用 CHECK 禁止自己對應自己。
- 也可另開 PQRS_REL(P1, P2)，P1、P2 皆為 FK，各自 UNIQUE；此處關係沒有屬性，且是 1:1，合併進本表較省。

**步驟 6：弱實體 WXY 與識別關係**
- 弱實體沒有完整的鍵，PK = 擁有者的 PK + 部分識別子：WXY(T, W, X, Y)，PK = (T, W)；T 為 FK → TUV(T)，且 ON DELETE CASCADE（擁有者刪除，弱實體一併刪除）。識別關係（TUV 一、WXY 多）不另外建表，因為 T 已在 WXY 內。

**步驟 7：多值複合屬性 {F, G(G1,G2)}**
- 多值屬性必須另開一張表：E2_FG(D, F, G1, G2)。複合屬性 G 展開成 G1、G2 兩個單值欄位。
- PK：D 對應「多個」(F, G) 組合，所以 PK = (D, F)。D 為 FK → E2(D)，ON DELETE CASCADE。
- 因為有 FD：D+F→G，所以 G1、G2 完全相依於整個 PK (D, F)，沒有部分相依。
- 因為 D→E：E 只相依於 D（PK 的一部分），若把 E 也放進 E2_FG 就會違反 2NF（部分相依）且造成同一個 D 重複存 E 的異常，所以 E 留在 E2(D, E)，不放入多值表。

### 二、最終表格（共 10 張，PK 與 FK 皆已標明）

| Table | 欄位 | PK | FK | NOT NULL |
|---|---|---|---|---|
| E1 | A, B, C | A | 無 | A |
| E1_HJ（子實體 S1） | A, H, J | A | A → E1(A) | A, H（H 另有 UNIQUE，為候選鍵） |
| E1_KM（子實體 S2） | A, K, M | A | A → E1(A) | A |
| E2 | D, E | D | 無 | D |
| E2_FG（多值複合屬性） | D, F, G1, G2 | (D, F) | D → E2(D) | D, F |
| E1_E2（M:N 關係） | A, D | (A, D) | A → E1(A)；D → E2(D) | A, D |
| PQRS | P, Q, R, S, P_PARTNER | P | P_PARTNER → PQRS(P)（UNIQUE，可 NULL，遞迴 1:1） | P |
| TUV | T, U, V | T | 無 | T |
| E2_PQRS_TUV（三元關係） | D, P, T | (D, P) | D → E2(D)；P → PQRS(P)；T → TUV(T) | D, P, T |
| WXY（弱實體） | T, W, X, Y | (T, W) | T → TUV(T) | T, W |

關聯綱要寫法（PK、FK 逐表標明）：
- E1(A, B, C)　PK：A
- E1_HJ(A, H, J)　PK：A；FK：A → E1(A)；H UNIQUE
- E1_KM(A, K, M)　PK：A；FK：A → E1(A)
- E2(D, E)　PK：D
- E2_FG(D, F, G1, G2)　PK：(D, F)；FK：D → E2(D)
- E1_E2(A, D)　PK：(A, D)；FK：A → E1(A)、D → E2(D)
- PQRS(P, Q, R, S, P_PARTNER)　PK：P；FK：P_PARTNER → PQRS(P)
- TUV(T, U, V)　PK：T
- E2_PQRS_TUV(D, P, T)　PK：(D, P)；FK：D → E2(D)、P → PQRS(P)、T → TUV(T)
- WXY(T, W, X, Y)　PK：(T, W)；FK：T → TUV(T)

MySQL 建表語法如下（依 FK 參照順序排列，可以直接執行）：

\`\`\`sql
CREATE TABLE E1 (
  A VARCHAR(10) NOT NULL,
  B VARCHAR(20),
  C VARCHAR(20),
  PRIMARY KEY (A)
);
-- 特殊化 d：子實體 S1 (H, J)；PK = A（同時是 FK），H 為候選鍵
CREATE TABLE E1_HJ (
  A VARCHAR(10) NOT NULL,
  H VARCHAR(10) NOT NULL,
  J VARCHAR(20),
  PRIMARY KEY (A),
  UNIQUE (H),
  FOREIGN KEY (A) REFERENCES E1 (A) ON DELETE CASCADE
);
-- 特殊化 d：子實體 S2 (K, M)
CREATE TABLE E1_KM (
  A VARCHAR(10) NOT NULL,
  K VARCHAR(20),
  M VARCHAR(20),
  PRIMARY KEY (A),
  FOREIGN KEY (A) REFERENCES E1 (A) ON DELETE CASCADE
);
CREATE TABLE E2 (
  D VARCHAR(10) NOT NULL,
  E VARCHAR(20),
  PRIMARY KEY (D)
);
-- 多值複合屬性 {F, G(G1, G2)}；D+F -> G，故 PK = (D, F)；E 不放在此表
CREATE TABLE E2_FG (
  D  VARCHAR(10) NOT NULL,
  F  VARCHAR(20) NOT NULL,
  G1 VARCHAR(20),
  G2 VARCHAR(20),
  PRIMARY KEY (D, F),
  FOREIGN KEY (D) REFERENCES E2 (D) ON DELETE CASCADE
);
-- E1 與 E2 的 M:N
CREATE TABLE E1_E2 (
  A VARCHAR(10) NOT NULL,
  D VARCHAR(10) NOT NULL,
  PRIMARY KEY (A, D),
  FOREIGN KEY (A) REFERENCES E1 (A),
  FOREIGN KEY (D) REFERENCES E2 (D)
);
-- PQRS；遞迴 1:1 以「夥伴 FK」實作（UNIQUE 保證 1:1，可為 NULL）
CREATE TABLE PQRS (
  P VARCHAR(10) NOT NULL,
  Q VARCHAR(20),
  R VARCHAR(20),
  S VARCHAR(20),
  P_PARTNER VARCHAR(10) NULL,
  PRIMARY KEY (P),
  UNIQUE (P_PARTNER),
  CHECK (P_PARTNER IS NULL OR P_PARTNER <> P),
  FOREIGN KEY (P_PARTNER) REFERENCES PQRS (P)
);
CREATE TABLE TUV (
  T VARCHAR(10) NOT NULL,
  U VARCHAR(20),
  V VARCHAR(20),
  PRIMARY KEY (T)
);
-- 三元關係：E2 (多) - PQRS (多) - TUV (一)；PK = 多端的鍵 (D, P)
CREATE TABLE E2_PQRS_TUV (
  D VARCHAR(10) NOT NULL,
  P VARCHAR(10) NOT NULL,
  T VARCHAR(10) NOT NULL,
  PRIMARY KEY (D, P),
  FOREIGN KEY (D) REFERENCES E2 (D),
  FOREIGN KEY (P) REFERENCES PQRS (P),
  FOREIGN KEY (T) REFERENCES TUV (T)
);
-- 弱實體 WXY：PK = (擁有者 T, 部分識別子 W)
CREATE TABLE WXY (
  T VARCHAR(10) NOT NULL,
  W VARCHAR(10) NOT NULL,
  X VARCHAR(20),
  Y VARCHAR(20),
  PRIMARY KEY (T, W),
  FOREIGN KEY (T) REFERENCES TUV (T) ON DELETE CASCADE
);
\`\`\`

### 三、3NF 檢查

| Table | 成立的 FD | 候選鍵 | 檢查結果 |
|---|---|---|---|
| E1 | A→B, C | A | 左邊為超鍵，符合 BCNF／3NF |
| E1_HJ | A→H, J；H→A, J | A、H | 兩個決定項都是候選鍵，符合 BCNF |
| E1_KM | A→K, M | A | 符合 BCNF |
| E2 | D→E | D | 左邊為超鍵，符合 3NF |
| E2_FG | D+F→G，即 D+F→G1, G2 | (D, F) | 非主屬性 G1、G2 完全相依於整個 PK，沒有部分相依；G1、G2 彼此無 FD，沒有遞移相依，符合 3NF |
| E1_E2 | 全鍵 (A, D) | (A, D) | 沒有非主屬性，符合 BCNF |
| PQRS | P→Q, R, S, P_PARTNER；P_PARTNER→P（因 UNIQUE） | P、P_PARTNER | 兩個決定項都是候選鍵，符合 3NF |
| TUV | T→U, V | T | 符合 BCNF |
| E2_PQRS_TUV | D+P→T | (D, P) | 非主屬性 T 完全相依於 PK，且只有一個非主屬性，無遞移相依，符合 3NF |
| WXY | T+W→X, Y | (T, W) | X、Y 完全相依於 (T, W)；若 X、Y 只相依於 W 則為部分相依，原圖未表示，視為完全相依，符合 3NF |

重點：
- 多值屬性表 E2_FG 之所以只含 (D, F, G1, G2)，是因為 D→E：E 只相依於 D，是 E2 自己的單值屬性，放在多值表會有部分相依與重複儲存；D+F→G 則說明 G 屬於 (D, F) 這個組合，所以放在多值表並以 (D, F) 為 PK。
- 若沒有題目的註記而把 {F, G} 當成兩個各自獨立的多值屬性，就要拆成 E2_F(D, F) 與 E2_G(D, G1, G2) 兩張表；有 D+F→G 後，G 與 F 配成一組，合併為 E2_FG 才不會失去相依。
- 每張表都已標 PK、FK，且全部符合 3NF（大部分也符合 BCNF）。`

**(1) 合併成一個 Relation 的缺點**

學生(學號 PK, 姓名, 性別, 生日, 申請書號, 送件日)

1. 未錄取的申請無處存放：申請書號、送件日必須留存，但未被接受者沒有學號、姓名等學生資料。若以學號為主鍵，這些申請的主鍵為 NULL，違反實體完整性（主鍵不可為 NULL）；若改以申請書號為主鍵，則未錄取者的學號、姓名、性別、生日整批為 NULL。不論哪種做法，都會有大量空值（NULL）、浪費儲存空間，也讓查詢要處處判斷 NULL。
2. 申請資料與學生資料混在一起：兩者是不同的實體，生命週期也不同（申請在先、成為學生在後；學生畢業後申請資料仍要留存）。合併後，「學生」表裡其實包含了許多「不是學生」的人，語意混淆。
3. 刪除異動異常：若某位學生資料被刪除（例如退學、資料作廢），整列一起消失，連他的入學申請資料也被連帶刪掉；但題目要求申請資料必須留存。
4. 新增、修改的流程不自然：先收到申請時只能填申請欄位、學生欄位留空，錄取後再對同一列「更新」補上學生資料，不能用 INSERT 表示「新增一位學生」；權限控管與鎖定也無法依兩種資料分別設定。
5. 若日後規則改變（例如一人可重複申請），單一表格難以延伸；而分成兩表只要調整外來鍵即可。

結論：當一邊是部分參與（0,1）時，不宜合併，應各自成表，再用外來鍵連結。

**(2) 為何「申請書號」要宣告 NOT NULL**

這是用「外來鍵放在學生表」實作 1:1，而且要表達「每位學生必定有一份入學申請」（學生端全部參與）。

1. 外來鍵欄位預設可為 NULL；外來鍵為 NULL 時，參考完整性檢查會直接略過，等於「這位學生沒有對應申請」也能通過。宣告 NOT NULL 才能強制每位學生都必須指到一筆存在的入學申請。
2. 「NOT NULL ＋ REFERENCES」兩者合起來才等於「必須恰有一筆、而且是存在的」。NOT NULL 保證有值，REFERENCES 保證該值在入學申請中真的存在。
3. 另一方向「入學申請不一定有學生」，因此不把外來鍵放在入學申請那邊（否則未錄取者的欄位會是 NULL）。
4. 補充：題目的 DDL 沒有 UNIQUE，嚴格說這只表達 N:1（多位學生可指向同一份申請）；若要真正實現 1:1，應在申請書號再加上 UNIQUE（或 NOT NULL UNIQUE）。

**(3) 刪除一筆學生資料，對應的入學申請會如何**

結論：不受影響，該入學申請資料原封不動地保留。

關鍵是搞清楚方向：外來鍵在「學生」表，被參考的父表是「入學申請」，學生是子表。ON DELETE CASCADE 的意思是「當被參考的父列（入學申請）被刪除時，參考它的子列（學生）跟著被刪除」。它的觸發條件是刪除父表的列，不是刪除子表的列。

\`\`\`text
DELETE FROM 學生 WHERE 學號 = 'S01';        → 只刪掉 S01 這一列，入學申請 A01 仍在（子表被刪，不牽動父表）
DELETE FROM 入學申請 WHERE 申請書號='A02';  → 參考 A02 的學生 S02 被連動刪除（父表被刪，CASCADE 往子表傳遞）
\`\`\`

這個設計符合題意：申請資料一定要留存，所以刪學生時申請資料不能被帶走；反之若申請資料被刪除（作廢），依附它的學生資料就失去存在意義，一併刪除。

**實測**（SQLite 開啟外來鍵檢查；ON DELETE CASCADE、NOT NULL、REFERENCES 在 MySQL InnoDB 與 SQLite 的語意相同，本環境沒有 MySQL 伺服器，故未直接在 MySQL 上執行）：

\`\`\`sql
CREATE TABLE 入學申請 (申請書號 CHAR(10) PRIMARY KEY, 送件日 DATE);
CREATE TABLE 學生 (
  學號 CHAR(10) PRIMARY KEY, 姓名 CHAR(12), 性別 CHAR(2), 生日 DATETIME,
  申請書號 CHAR(10) NOT NULL UNIQUE,
  FOREIGN KEY (申請書號) REFERENCES 入學申請(申請書號) ON DELETE CASCADE);
INSERT INTO 入學申請 VALUES ('A01','2025-03-01'),('A02','2025-03-02'),('A03','2025-03-03');
INSERT INTO 學生 VALUES ('S01','甲','M','2007-01-01','A01'),('S02','乙','F','2007-02-02','A02');
\`\`\`

INSERT 學生，申請書號 = NULL                       失敗：NOT NULL constraint failed
INSERT 學生，申請書號 = 'A99'（不存在）            失敗：FOREIGN KEY constraint failed
INSERT 學生，申請書號 = 'A01'（已被 S01 使用）     失敗：UNIQUE constraint failed（有加 UNIQUE 才是 1:1）
DELETE FROM 學生 WHERE 學號='S01'                  成功；入學申請仍有 A01、A02、A03 三筆
DELETE FROM 入學申請 WHERE 申請書號='A02'          成功；學生 S02 一併被刪除，學生表只剩 0 筆
A03 從未被錄取                                     入學申請有 A03，學生沒有對應列：資料沒有 NULL 空洞
\`\`\`

      question: `四個異動對同一標的物做操作，其動作序列如下表（● 表示該異動仍在進行中），請分別以： (一) X-Locking（X 鎖-鎖定法）、(二) Versioning（版本法）與 (三) Timestamping（時間戳記法）模擬之（要有過程之說明；否則，不給分），並說出最後分別有那些異動被執行？（25 分）`,
      answer: `**題目表格還原**：T1~T4 對同一標的物 X 的動作如下（● 表示該異動仍在進行中）：

| 時間 | T1 | T2 | T3 | T4 |
|---|---|---|---|---|
| 1 | Read | | | |
| 2 | ● | | Read | |
| 3 | ● | Read | ● | |
| 4 | ● | ● | ● | |
| 5 | ● | Write | ● | |
| 6 | Write | | ● | |
| 7 | | | ● | Read |
| 8 | | | Write | ● |
| 9 | | | | Write |

由 ● 可知各異動的存活區間：T1 為 t1~t6、T3 為 t2~t8、T2 為 t3~t5、T4 為 t7~t9；每個異動做完最後一個動作就 commit（T2 在 t5、T1 在 t6、T3 在 t8、T4 在 t9）。啟動順序是 T1、T3、T2、T4。

**共同假設**：只有一個標的物 X，初始版本為 v0；每個異動在最後一個動作之後立即嘗試 commit；被中止的異動以後可重新啟動，但「最後被執行的異動」以本次排程能 commit 的為準，重啟另述。

### (一) X-Locking（讀寫都先取 X 鎖，嚴格兩階段，到 commit 才放鎖）

規則：任何動作（Read 或 Write）都要先取得 X 鎖；鎖被別人持有就等待（FIFO 佇列）；鎖要到 commit 才釋放。每次等待都檢查等待圖（wait-for graph）有沒有環；有環＝死結，要中止其中一個（例如最年輕者）。

| 時間 | 事件 | 鎖的狀態與說明 |
|---|---|---|
| 1 | T1 Read | X 鎖空閒，T1 取得 X 鎖，執行 Read |
| 2 | T3 Read | X 鎖在 T1 手上，T3 被擋，進入佇列 [T3]；等待圖 T3→T1 |
| 3 | T2 Read | 同樣被擋，佇列 [T3, T2]；T2→T1，無環 |
| 4 | （無新動作） | 仍然是 T3、T2 在等 T1 |
| 5 | T2 Write | T2 還在等第一個動作（Read），Write 排在後面，無法執行 |
| 6 | T1 Write | T1 已持有 X 鎖，直接執行 Write；T1 做完 → commit，釋放鎖。鎖依序給佇列第一個 T3，T3 補執行 Read（原 t2 的動作）；佇列 [T2] |
| 7 | T4 Read | X 鎖在 T3 手上，T4 被擋，佇列 [T2, T4]；T4→T3、T4→T2、T2→T3，無環 |
| 8 | T3 Write | T3 持有鎖，執行 Write 後 commit，釋放鎖。鎖給 T2：補執行 Read、Write，T2 做完 commit，釋放；鎖再給 T4：補執行 Read |
| 9 | T4 Write | T4 持有鎖，執行 Write，commit |

結果：全部 4 個異動都被執行（commit），實際的執行順序等價於串列 T1 → T3 → T2 → T4。整個過程中等待圖都沒有環（等待的人只等較早取得鎖的人），所以沒有死結，不需要中止任何異動。代價是 T3、T2、T4 都被延遲（T2 從 t3 一直等到 t8）。

補充：如果 Read 只取共享鎖 S、Write 才取 X 鎖（一般的 S/X 鎖），則 t1~t3 三個 Read 都拿到 S 鎖；t5 T2 要升級成 X 鎖，要等 T1、T3 釋放 S；t6 T1 也要升級成 X 鎖，要等 T2、T3 釋放 S。此時 T2→T1、T1→T2 形成環，是典型的死結，必須中止其中一個（例如較年輕的 T2）才能繼續。本題題目指定的是 X 鎖（讀也取 X 鎖），因為讀就不能共享，所以前面的過程沒有死結。

### (二) Versioning（多版本，快照讀＋先 commit 者勝）

規則：每個異動開始時取得一個快照（開始時間 start）；Read 讀的是快照時刻之前最新 commit 的版本，不會被擋；Write 先寫在私有副本；commit 時做驗證：若標的物 X 在我開始之後已經有別人 commit 了新版本（寫寫衝突），後 commit 的人中止（first-committer-wins）。

| 3 | T2 Read | T2 start=3，讀 v0（Read 不會被 T1、T3 擋住） |

| 6 | T1 Write | T1 寫私有副本；commit 驗證：自 start=1 以來 X 已出現 v1（T2 在 t5 commit）→ 寫寫衝突，T1 中止（abort） |

| 8 | T3 Write | T3 寫私有副本；commit 驗證：自 start=2 以來 X 已有 v1 → 衝突，T3 中止 |

### (三) Timestamping（基本時戳排序）

規則：每個異動以開始順序取得時戳 TS：T1=1、T3=2、T2=3、T4=7（依 t1、t2、t3、t7 的啟動順序）。標的物 X 記錄 R_TS（讀過它的最大 TS）與 W_TS（寫過它的最大 TS），初始皆為 0。
- Read(X)：若 TS < W_TS(X) → 讀到「未來」的值，中止；否則執行，R_TS = max(R_TS, TS)。
- Write(X)：若 TS < R_TS(X) 或 TS < W_TS(X) → 比自己新的異動已經讀（或寫）過，中止；否則執行，W_TS = TS。
- 被中止的異動以新的、較大的時戳重啟。

**(1) 事實表（Fact Table）**

\`\`\`text
包含的資料：與商業活動（事件）相關的「量值」（measures），通常是可加總的數值，
            例如銷售數量、銷售金額、成本、利潤。每一列代表某一粒度（grain）的一次事件。
結構：
  1. 外來鍵：每個維度各一個 FK（時間鍵、商品鍵、門市鍵、客戶鍵），指向維度表的主鍵。
  2. 量值欄位：數值型（銷售數量、銷售金額）。
  3. 主鍵：通常由所有維度外來鍵組成的複合鍵（唯一決定一列事件）；也可另加代理鍵。
  4. 粒度（grain）：必須先定義「一列代表什麼」，例如「一張發票上的一項商品」。
特性：列數非常多（資料量大、持續成長）、欄位少而窄、以數字為主、多為只新增不修改。
\`\`\`

量值依可加性分為：可加（銷售金額，可沿所有維度加總）、半可加（帳戶餘額，不可沿時間加總）、不可加（比率、單價，須用分子分母重算）。

**(2) 維度表（Dimension Table）**

\`\`\`text
包含的資料：描述事實的「脈絡」——誰（客戶）、何時（時間）、何處（門市）、何物（商品）。
            內容是文字型的描述屬性，用來篩選（WHERE）、分組（GROUP BY）、做報表標籤。
結構：
  1. 主鍵：單一的代理鍵（surrogate key，無意義的流水號），供事實表參考。
  2. 描述屬性：多而寬（商品名稱、品牌、類別…），常含階層（日期→月→季→年；城市→區域），
     供上捲（roll-up）與下鑽（drill-down）。
  3. 通常不正規化（階層屬性放在同一張表），以減少 JOIN、加快查詢；若把階層再拆成子表則成為雪花綱要（Snowflake）。
特性：列數相對少、欄位多、變動慢（緩慢變動維度 SCD 處理歷史變化）。
\`\`\`

**(3) 兩者比較**

| 項目 | 事實表 | 維度表 |
| --- | --- | --- |
| 內容 | 量值（數字）與維度外來鍵 | 描述屬性（文字、階層） |
| 主鍵 | 各維度 FK 的複合鍵 | 單一代理鍵 |
| 列數 | 極多（百萬到數十億） | 較少（數百到數百萬） |
| 欄位數 | 少 | 多 |
| 變動 | 持續新增，少修改 | 少量變動（SCD） |
| 查詢用途 | 被彙總（SUM、AVG） | 篩選、分組、標籤 |

**(4) 範例綱要與查詢（MySQL 語法，已用 SQLite 以小資料實測）**

\`\`\`sql
CREATE TABLE dim_time    (time_key INT PRIMARY KEY, full_date DATE, month INT, quarter INT, year INT);
CREATE TABLE dim_product (product_key INT PRIMARY KEY, product_name VARCHAR(30), brand VARCHAR(20), category VARCHAR(20));
CREATE TABLE dim_store   (store_key INT PRIMARY KEY, store_name VARCHAR(20), city VARCHAR(20), region VARCHAR(20));
CREATE TABLE dim_customer(customer_key INT PRIMARY KEY, customer_name VARCHAR(20), gender CHAR(1), age_group VARCHAR(10));
CREATE TABLE fact_sales (
  time_key INT, product_key INT, store_key INT, customer_key INT,
  quantity INT, amount DECIMAL(10,2),
  PRIMARY KEY (time_key, product_key, store_key, customer_key),
  FOREIGN KEY (time_key)     REFERENCES dim_time(time_key),
  FOREIGN KEY (product_key)  REFERENCES dim_product(product_key),
  FOREIGN KEY (store_key)    REFERENCES dim_store(store_key),
  FOREIGN KEY (customer_key) REFERENCES dim_customer(customer_key));

-- 分析：各年、各區域、各商品類別的銷售額（事實表彙總 + 維度表分組）
SELECT t.year, s.region, p.category, SUM(f.amount) AS 銷售額
FROM fact_sales f
JOIN dim_time t    ON f.time_key = t.time_key
JOIN dim_store s   ON f.store_key = s.store_key
JOIN dim_product p ON f.product_key = p.product_key
GROUP BY t.year, s.region, p.category;
\`\`\`

維度表資料例：

| 商品鍵 | 商品名稱 | 品牌 | 類別 |
| --- | --- | --- | --- |
| 1 | 牛奶 | 光泉 | 乳品 |
| 2 | 吐司 | 統一 | 麵包 |

事實表資料例：

| 時間鍵 | 商品鍵 | 門市鍵 | 客戶鍵 | 銷售數量 | 銷售金額 |
| --- | --- | --- | --- | --- | --- |
| 1 | 1 | 1 | 1 | 2 | 90 |
| 1 | 2 | 1 | 2 | 1 | 45 |
| 3 | 1 | 2 | 2 | 4 | 180 |

事實表只存鍵與數字，要看「哪個品牌、哪個城市」必須回頭連到維度表，這就是維度模式「分析時事實表在中央、維度表在四周」的結構。`

針對下列三個查詢問題，請各寫出一個 SQL 指令來進行查詢。
(1) 列出開課科系為 '資訊管理學系' 的每一門課程之課程編號與課程名稱。（10 分）
(2) 列出平均成績大於 75 的每一位學生之學號及其平均成績。（10 分）
(3) 列出修完所有課程的每一位學生之學號與學生姓名。（10 分）`,
      answer: `以下使用 MySQL 語法（中文欄位名稱在 MySQL 可直接使用；若環境不便，可改成英文欄位）。已用 SQLite 建立小資料實測，結果如各小題所示。

測試資料：學生 S1 王小明、S2 李小華、S3 陳大同、S4 林美美；課程 C1 資料庫（資訊管理學系）、C2 系統分析（資訊管理學系）、C3 行銷管理（企業管理學系）；修課：S1 修 C1/C2/C3 得 90/80/70，S2 修 C1/C2 得 60/70，S3 修 C1/C2/C3 得 85/80/75，S4 沒修課。

**(1) 開課科系為 '資訊管理學系' 的課程**

\`\`\`sql
SELECT 課程編號, 課程名稱
FROM 課程
WHERE 開課科系 = '資訊管理學系';
\`\`\`

\`\`\`sql
SELECT 學號, AVG(成績) AS 平均成績
FROM 修課
GROUP BY 學號
HAVING AVG(成績) > 75;
\`\`\`

要點：平均是「每位學生」的彙總，故先 GROUP BY 學號；對群組的條件必須用 HAVING，不能寫在 WHERE（WHERE 在分組前執行，不能用聚合函數）。實測結果：S1 平均 80、S3 平均 80（S2 平均 65 被排除；S4 沒有修課列，不會出現）。

**(3) 修完所有課程的學生（關聯除法）**

方法一：雙重 NOT EXISTS（「不存在任何一門課，是該生沒修的」）

\`\`\`sql
SELECT s.學號, s.學生姓名
FROM 學生 s
WHERE NOT EXISTS (
    SELECT * FROM 課程 c
    WHERE NOT EXISTS (
        SELECT * FROM 修課 x
        WHERE x.學號 = s.學號 AND x.課程編號 = c.課程編號));
\`\`\`

方法二：計數比較（修課數等於課程總數）

\`\`\`sql
SELECT s.學號, s.學生姓名
FROM 學生 s
JOIN 修課 x ON x.學號 = s.學號
GROUP BY s.學號, s.學生姓名
HAVING COUNT(DISTINCT x.課程編號) = (SELECT COUNT(*) FROM 課程);
\`\`\`

實測兩種寫法結果相同：S1 王小明、S3 陳大同（S2 少修 C3、S4 完全沒修）。

      answer: `**(1) 正規化的定義與目的**

正規化是依據功能相依（FD）與鍵，把一個關聯綱要逐步分解成較小、較單純的關聯，使每個關聯只描述一件事（1NF → 2NF → 3NF → BCNF…），且分解後須是無損連接（lossless join），最好也保持相依（dependency preserving）。

目的：
1. 消除資料冗餘（同一事實只存一次，節省空間）。
2. 避免更新異常：新增異常（沒有某些資料就無法存另一些資料）、刪除異常（刪一筆而連帶失去不相關的資料）、修改異常（同一事實存多處，改漏造成不一致）。
3. 讓資料庫結構反映語意，維持完整性、容易維護與擴充。

**(2) 2NF 的定義與 R 的判定**

2NF 定義：關聯符合 1NF，且每一個非鍵屬性（不屬於任何候選鍵的屬性）都完全功能相依於每一個候選鍵（即不可只相依於候選鍵的一部分；不得有「部分相依」）。

先用屬性閉包確認候選鍵（以 Python 驗算）：

\`\`\`text
A+  = {A}                     （A 單獨不能決定任何屬性）
B+  = {B, D, E}               （B→D，B→E）
AB+ = {A, B, C, D, E} = R     （AB→C 再加上 B 的閉包）
→ 唯一候選鍵為 AB（與題目給定的主鍵一致）；主屬性 A、B；非鍵屬性 C、D、E。
\`\`\`

逐一檢查非鍵屬性：

\`\`\`text
AB → C   ：C 完全相依於 AB（A→C、B→C 皆不成立，故為完全相依）          ✔
B  → D   ：D 只相依於 AB 的一部分 B → 部分相依                          ✘
B  → E   ：E 只相依於 AB 的一部分 B → 部分相依                          ✘
D  → E   ：非鍵屬性決定非鍵屬性 → 傳遞相依（AB → B → D → E，違反 3NF）
\`\`\`

結論：R 不符合 2NF，因為 D、E 部分相依於主鍵 AB（B→D、B→E）。D→E 則是傳遞相依，與 2NF 無關，要到 3NF 才處理。

用資料看異常（B 相同的列，D、E 重複）：

| A | B | C | D | E |
| --- | --- | --- | --- | --- |
| a1 | b1 | c1 | d1 | e1 |
| a2 | b1 | c2 | d1 | e1 |
| a1 | b2 | c3 | d2 | e1 |
| a3 | b2 | c4 | d2 | e1 |
| a2 | b3 | c5 | d3 | e2 |

b1 的 d1、e1 重複兩次、b2 的 d2、e1 也重複；而且 d1、d2 都對應 e1，e1 也被重複儲存。要改 b1 的 D 值得改兩列（修改異常）；沒有任何 A/C 資料時，無法單獨新增一個 (b4, d4, e4)（新增異常）。

**(3) 應正規化到 3NF**

3NF：符合 2NF，且沒有非鍵屬性傳遞相依於候選鍵。（等價說法：對每個 FD X→Y，X 是超鍵，或 Y 是主屬性。）

做法分兩步：

\`\`\`text
步驟一：消除部分相依 → 2NF
  R_a(A, B, C)   主鍵 AB   （AB → C）
  R_b(B, D, E)   主鍵 B    （B → D, B → E）；B 是 R_a 的外來鍵

步驟二：消除傳遞相依 D → E（B → D → E）→ 3NF
  R_b(B, D, E) 拆成
  R2(B, D)       主鍵 B    （B → D）
  R3(D, E)       主鍵 D    （D → E）
\`\`\`

最終 3NF 結果：

| 關聯 | 屬性 | 主鍵 | 外來鍵 |
| --- | --- | --- | --- |
| R1 | A, B, C | A, B | B 參照 R2(B) |
| R2 | B, D | B | D 參照 R3(D) |
| R3 | D, E | D | 無 |

\`\`\`text

R2(B, D)       PK(B)       FK(D) → R3

      answer: `**先備觀念：父型態／子型態（Supertype／Subtype）**

父型態是一般性的實體型態（含全體共同的屬性與關係）；子型態是父型態中具有特殊意義的子集合。子型態繼承（inherit）父型態的所有屬性與關係，並可再加自己專有的屬性與關係。子型態與父型態之間是「是一個（IS-A）」關係，子型態的實體同時也是父型態的實體（同一個物件，不是兩個），因此子型態的識別碼就是父型態的識別碼。

**(1) 特殊化（Specialization）**

定義：由上而下（top-down）的設計過程。從一個已有的實體型態（父型態）出發，依某些「區分特徵」（稱為定義屬性／特殊化條件，如職務類別）把其中的實體分成若干具有各自特殊屬性或特殊關係的子集合，每個子集合定義成一個子型態。目的是把「只有部分實體才有」的屬性和關係獨立出來，避免父型態中出現大量 NULL。

例子：員工（員工編號 PK、姓名、薪資）依職務特殊化為「工程師」（專長、證照）與「業務員」（業績獎金）。只有工程師才有專長與證照，只有業務員才有業績獎金。

**(2) 一般化（Generalization）**

定義：由下而上（bottom-up）的設計過程。觀察到數個獨立的實體型態具有許多共同的屬性（與關係），就把這些共同特徵抽取出來，合併定義成一個較高層的父型態，原本的實體型態變成它的子型態，各子型態只保留自己特有的屬性。目的是消除重複定義的屬性，使模型更簡潔，並能表達共同的關係。

例子：原本有「轎車」（車牌、廠牌、出廠年、載客數）與「卡車」（車牌、廠牌、出廠年、載重噸數）兩個實體型態，重複出現車牌、廠牌、出廠年；將共同屬性抽出成「車輛」（車牌 PK、廠牌、出廠年），轎車只留載客數，卡車只留載重噸數。

/* 全形→半形、英文轉小寫；逐字處理，確保處理後長度不變（highlight 才對得準） */
function normText(s) {

    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i|pre)(?:\s[^>]*)?>/gi, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');

/* 每個關鍵字都必須出現（AND）；總分 = 各關鍵字命中的最高權重欄位之和 */
function scoreFields(terms, fields) {
  let total = 0;
  for (const term of terms) {
    let best = 0;
    for (const f of fields) if (f.w > best && f.t.includes(term)) best = f.w;
    if (!best) return 0;
    total += best;
  }
  return total;
}
/* 在已渲染的 DOM 文字節點上標黃（不動 HTML 結構） */
function highlightIn(root, terms) {
  if (!root || !terms.length) return;
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    if (!n.nodeValue.trim()) continue;
    const p = n.parentNode;
    if (p && p.closest && p.closest('svg, button, mark')) continue;
    nodes.push(n);
  }
  nodes.forEach(node => {
    const text = node.nodeValue, low = normText(text);
    const ranges = [];
    terms.forEach(t => {
      let i = low.indexOf(t);
      while (i !== -1) { ranges.push([i, i + t.length]); i = low.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return;
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (let k = 1; k < ranges.length; k++) {
      const last = merged[merged.length - 1];
      if (ranges[k][0] <= last[1]) last[1] = Math.max(last[1], ranges[k][1]);
      else merged.push(ranges[k].slice());
    }
    const frag = document.createDocumentFragment();
    let pos = 0;
    merged.forEach(([s, e]) => {
      if (s > pos) frag.appendChild(document.createTextNode(text.slice(pos, s)));
      const m = document.createElement('mark');
      m.className = 'hl';
      m.textContent = text.slice(s, e);
      frag.appendChild(m);
      pos = e;
    });
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* ---------- 輕量 Markdown 渲染 ---------- */
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(md) {
  // 先抽出 ``` 程式碼/ASCII 區塊
  const blocks = [];
  md = md.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang, code });
    return `\u0000BLOCK${blocks.length - 1}\u0000`;
  });

  const lines = md.split('\n');
  let html = '', i = 0;

  while (i < lines.length) {
    let line = lines[i];

    // 區塊佔位
    if (/^\u0000BLOCK\d+\u0000$/.test(line.trim())) {
      const idx = parseInt(line.trim().match(/\d+/)[0]);
      const b = blocks[idx];
      // html-diagram 圍欄：直接輸出 HTML（用於圖表），不做跳脫
      if (b.lang === 'htmldiagram') {
        html += `<div class="html-diagram">${b.code}</div>`;
      } else if (b.lang === 'tree') {
        // tree 圍欄：JSON 樹資料 → 自動產生對齊的 SVG 樹狀圖
        html += `<div class="html-diagram">${renderTreeSVG(b.code)}</div>`;
      } else {
        html += `<pre><code>${escapeHtml(b.code.replace(/\n$/,''))}</code></pre>`;
      }
      i++; continue;
    }

    // 表格
    if (line.includes('|') && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])) {
      const headers = line.split('|').map(c => c.trim()).filter(c => c !== '');
      i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes('|')) {
        const cells = lines[i].split('|').map(c => c.trim());
        // 去除頭尾空白格
        if (cells[0] === '') cells.shift();
        if (cells[cells.length-1] === '') cells.pop();
        rows.push(cells);
        i++;
      }
      html += '<table><thead><tr>' +
        headers.map(h => `<th>${inline(h)}</th>`).join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>' +
          r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table>';
      continue;
    }

    // 標題
    let m;
    if ((m = line.match(/^####\s+(.*)/))) { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }
    if ((m = line.match(/^###\s+(.*)/)))  { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }

    // 無序清單
    if (/^\s*[-*]\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
        i++;
      }
      html += '<ul>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ul>';
      continue;
    }
    // 有序清單
    if (/^\s*\d+\.\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, ''));
        i++;
      }
      html += '<ol>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ol>';
      continue;
    }

    // 空行
    if (line.trim() === '') { i++; continue; }

    // 一般段落（合併連續非空行）
    let para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== '' &&
           !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) &&
           !/^#{3,4}\s/.test(lines[i]) &&
           !/^\u0000BLOCK\d+\u0000$/.test(lines[i].trim()) &&
           !(lines[i].includes('|') && i+1 < lines.length &&
             /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]))) {
      para.push(lines[i]); i++;
    }
    html += `<p>${para.map(l => breakSentences(inline(l))).join('<br>')}</p>`;
  }
  return html;
}

// 行內語法：**粗體**、`code`、<u>底線</u>
function inline(s) {
  // 先抽出 `code` 片段保護起來，其餘文字才做標籤還原與粗體
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });
  s = escapeHtml(s);
  // 還原資料中直接寫的白名單標籤（<u> 用於標示主鍵）
  s = s.replace(/&lt;(\/?)(strong|code|sub|sup|u)&gt;/g, '<$1$2>');
  s = s.replace(/&lt;br\s*\/?&gt;/g, '<br>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code>' + escapeHtml(codes[+i]) + '</code>');
  return s;
}

/* ---------- 二元樹 SVG 產生器 ---------- */
// 輸入 JSON：{ "v":"根值", "l":{子樹}, "r":{子樹} }
// l/r 可省略；空子樹可用 null。採對稱佈局：節點置於左右子樹正中央，
// 單子節點向左/右偏移固定距離，使左右視覺平衡。
function renderTreeSVG(json) {
  let root;
  try { root = JSON.parse(json.trim()); }
  catch (e) { return `<pre><code>樹資料格式錯誤</code></pre>`; }

  const NODE_R  = 21;       // 節點圓半徑
  const H_UNIT  = 32;       // 水平基本單位
  const V_GAP   = 76;       // 層與層垂直間距
  const PAD     = 30;       // 邊界留白

  // ── 遞迴佈局：回傳該子樹的 {width, rootX}（皆以 H_UNIT 為單位）──
  // 做法：左子樹先排好佔據 [0, lw)，右子樹排在 [lw+gap, ...)，
  //       父節點 x = 左右子根的中點；單子節點則讓父在子的對側偏移一格，
  //       使整棵子樹仍保有對稱的視覺重心。
  function layout(node, depth) {
    node._d = depth;
    const L = node.l, R = node.r;

    // 葉節點：寬度 1，根在 0
    if (!L && !R) {
      node._w = 1;
      node._x = 0;
      return;
    }

    // 雙子：左右子樹各自佈局，並排放置
    if (L && R) {
      layout(L, depth + 1);
      layout(R, depth + 1);
      const gap = 1;                         // 左右子樹之間留 1 單位
      // 左子樹佔 [0, L._w)，右子樹整體右移 L._w + gap
      const shift = L._w + gap;
      offset(R, shift);
      node._w = L._w + gap + R._w;
      node._x = (L._x + R._x) / 2;           // 父 = 左右子根中點
      return;
    }

    // 單左子：左子樹佈局後，父放在「左子根右側一格」
    if (L) {
      layout(L, depth + 1);
      node._x = L._x + 1;                    // 父在左子根右邊一格
      // 整棵子樹寬度 = 左子樹寬度，但要確保涵蓋父節點 x
      node._w = Math.max(L._w, node._x + 1);
      return;
    }

    // 單右子：右子樹佈局後，父放在「右子根左側一格」
    {
      layout(R, depth + 1);
      // 父在右子根左邊一格；若會 < 0 則整體右移
      let px = R._x - 1;
      if (px < 0) { offset(R, -px); px = 0; }
      node._x = px;
      node._w = Math.max(R._w + (px < 0 ? -px : 0), node._x + 1,
                         R._x + 1);
      return;
    }
  }
  // 把以 node 為根的整棵子樹所有 _x 平移 dx
  function offset(node, dx) {
    if (!node) return;
    node._x += dx;
    offset(node.l, dx);
    offset(node.r, dx);
  }
  layout(root, 0);

  // 收集座標範圍
  let minX = Infinity, maxX = -Infinity, maxDepth = 0;
  (function scan(node) {
    if (!node) return;
    minX = Math.min(minX, node._x);
    maxX = Math.max(maxX, node._x);
    maxDepth = Math.max(maxDepth, node._d);
    scan(node.l); scan(node.r);
  })(root);

  const width  = (maxX - minX) * H_UNIT + PAD * 2 + NODE_R * 2;
  const height = maxDepth * V_GAP + PAD * 2 + NODE_R * 2;

  function cx(node) { return PAD + NODE_R + (node._x - minX) * H_UNIT; }
  function cy(node) { return PAD + NODE_R + node._d * V_GAP; }

  // 第三遍：產生連線與節點
  let edges = '', nodes = '';
  function draw(node) {
    if (!node) return;
    const x = cx(node), y = cy(node);
    ['l', 'r'].forEach(side => {
      const child = node[side];
      if (child) {
        edges += `<line x1="${x}" y1="${y}" x2="${cx(child)}" y2="${cy(child)}" `
               + `stroke="#3d4456" stroke-width="2"/>`;
        draw(child);
      }
    });
    const palette = {
      accent: ['#fbf3f0', '#8a3324', '#8a3324'],
      blue:   ['#eef4f7', '#1f5673', '#1f5673'],
      gold:   ['#faf5e6', '#a07e2c', '#7a5d1e'],
      dim:    ['#e8e3d6', '#b3a98f', '#8a8266'],
      ink:    ['#1a1f2c', '#1a1f2c', '#ffffff'],
    };
    const [fill, stroke, txt] = palette[node.t] || palette.ink;
    nodes += `<circle cx="${x}" cy="${y}" r="${NODE_R}" `
           + `fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`
           + `<text x="${x}" y="${y + 5}" text-anchor="middle" `
           + `font-size="15" font-weight="700" fill="${txt}">`
           + escapeHtml(String(node.v)) + `</text>`;
  }
  draw(root);

  return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" `
       + `style="max-width:${width}px;width:100%;font-family:'Noto Sans TC',sans-serif;">`
       + edges + nodes + `</svg>`;
}

/* ---------- 程式碼語法highlight（逐字元 tokenizer，不在 HTML 上做 regex）---------- */
function highlightCode(code, lang) {
  const kw = {
    c: ['int','char','void','return','if','else','for','while','do','struct','typedef','bool','long','double','float','define','include','sizeof','static','const','unsigned','break','continue','switch','case','NULL','true','false'],
    java: ['public','private','protected','class','int','void','return','if','else','for','while','do','new','static','final','abstract','extends','implements','import','package','this','super','boolean','double','String','char','long','float','try','catch','throw','throws','interface','null','true','false','break','continue'],
    python: ['def','return','if','elif','else','for','while','import','from','as','with','try','except','finally','class','None','True','False','and','or','not','in','is','lambda','break','continue','global','print'],
    javascript: ['function','return','if','else','for','while','let','const','var','new','class','this','try','catch','import','export','from','null','true','false','typeof','break','continue','console'],
    php: ['function','return','if','else','elseif','for','while','foreach','as','class','new','public','private','echo','true','false','null','require','include']
  };
  const list = new Set(kw[lang] || kw.c);

  let out = '';
  let i = 0;
  const n = code.length;
  // 包一段文字成指定 token 樣式（內容先 escape）
  const wrap = (cls, text) => `<span class="${cls}">${escapeHtml(text)}</span>`;

  const isWordChar = c => /[A-Za-z0-9_@]/.test(c);
  const isDigit = c => c >= '0' && c <= '9';

  while (i < n) {
    const c = code[i];
    const two = code.substr(i, 2);

    // 區塊註解 /* ... */
    if (two === '/*') {
      let j = code.indexOf('*/', i + 2);
      if (j === -1) j = n; else j += 2;
      out += wrap('tok-com', code.slice(i, j));
      i = j; continue;
    }
    // 行註解 //...
    if (two === '//') {
      let j = code.indexOf('\n', i);
      if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j));
      i = j; continue;
    }
    // 行註解 #...（Python；PHP 也用，C 的 #include 也歸此類顯示為註解色以外——改用關鍵字處理）
    if (c === '#' && (lang === 'python' || lang === 'php')) {
      let j = code.indexOf('\n', i);
      if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j));
      i = j; continue;
    }
    // 字串 "..." 或 '...'（含跳脫 \）
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n && code[j] !== c) {
        if (code[j] === '\\') j++;   // 跳過跳脫字元
        j++;
      }
      j = Math.min(j + 1, n);
      out += wrap('tok-str', code.slice(i, j));
      i = j; continue;
    }
    // 數字
    if (isDigit(c)) {
      let j = i;
      while (j < n && /[0-9.]/.test(code[j])) j++;
      out += wrap('tok-num', code.slice(i, j));
      i = j; continue;
    }
    // 識別字（可能是關鍵字）
    if (isWordChar(c) && !isDigit(c)) {
      let j = i;
      while (j < n && isWordChar(code[j])) j++;
      const word = code.slice(i, j);
      if (list.has(word)) out += wrap('tok-kw', word);
      else out += escapeHtml(word);
      i = j; continue;
    }
    // 其他單一字元
    out += escapeHtml(c);
    i++;
  }
  return out;
}

function codeBlockHtml(codeObj) {
  if (!codeObj) return '';
  const langLabel = {
    c: 'C', java: 'Java', python: 'Python',
    javascript: 'JavaScript', php: 'PHP'
  }[codeObj.lang] || codeObj.lang;
  return `<div class="code-block">
    <div class="code-head">
      <span class="dots"><span></span><span></span><span></span></span>
      <span>${langLabel}</span>
    </div>
    <pre><code>${highlightCode(codeObj.text, codeObj.lang)}</code></pre>
  </div>`;
}

/* ---------- 渲染題目卡 ---------- */
/* QFENCE：考題中的程式碼圍欄 ``` 轉成程式碼區塊（避免原樣顯示、長行撐破版面） */
function qFences(h) {
  return h.replace(/```[a-z]*\n([\s\S]*?)\n```/g, (m, c) =>
    '<pre style="background:#2b303b;color:#eee;padding:.7rem 1rem;border-radius:6px;overflow-x:auto;margin:.5rem 0;font-size:.85rem;white-space:pre">' + c + '</pre>');
}

function bodyHtml(q) {
  return `      <span class="section-label q">考題</span>
      <div class="q-question">${qFences(escapeHtml(q.question)).replace(/&lt;u&gt;([\s\S]*?)&lt;\/u&gt;/g, '<u>$1</u>')}</div>
      ${q.figure ? `<div class="q-figure" style="margin:.7rem 0">${q.figure}</div>` : ''}
      <span class="section-label a">詳解</span>
      <div class="q-answer">${renderMarkdown(q.answer)}</div>
      ${q.code ? codeBlockHtml(q.code) : ''}`;
}

function fillBody(card) {
  if (card.dataset.filled) return;
  const q = ALL_Q.find(x => x.id === card.dataset.id);
  if (!q) return;
  const box = card.querySelector('.q-body');
  box.innerHTML = bodyHtml(q);
  card.dataset.filled = '1';
  if (state.terms.length) highlightIn(box, state.terms);
}

function questionCard(q, forceOpen) {
  const t = TOPIC_INFO[q.topic] || { name: q.topicName, cls: '' };
  const sb = SUB_INFO[q.sub] || null;
  const isOpen = openIds.has(q.id) || !!forceOpen;
  return `<div class="q-card ${t.cls}${isOpen ? ' open' : ''}" data-id="${q.id}"${isOpen ? ' data-filled="1"' : ''}>
    <div class="q-header" onclick="toggleCard(this)"${sb ? ` style="border-left-color:${sb.color}"` : ''}>
      <div class="q-no">${q.no}</div>
      <div class="q-headmain">
        <div class="q-title">${escapeHtml(q.title)}</div>
        <div class="q-tags">
          <span class="tag tag-topic"${sb ? ` style="background:${sb.color}"` : ''}>${sb ? sb.name : t.name}</span>
          <span class="tag tag-year">${q.year}年</span>
          ${q.part ? `<span class="tag tag-part">${escapeHtml(q.part)}　第${q.no}題</span>` : ''}
          <span class="tag tag-score">${q.score}分</span>
        </div>
      </div>
      <div class="q-toggle">+</div>
    </div>
    <div class="q-body">${isOpen ? bodyHtml(q) : ''}</div>
  </div>`;
}

/* ---------- 篩選 ---------- */
function filterQuestions() {
  let list = ALL_Q.filter(q => state.topic === 'all' || q.sub === state.topic);
  if (state.terms.length) {
    // 多關鍵字 AND、全形半形統一、依相關度排序（標題 > 考題 > 詳解 > 程式碼）
    list = list
      .map((q, i) => ({ q, i, s: scoreFields(state.terms, searchFields(q)) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.i - b.i)
      .map(x => x.q);
  }
  return list;
}

/* ---------- 渲染主內容 ---------- */
function updateSearchInfo(count, autoOpen) {
  const el = document.getElementById('searchInfo');
  if (!state.terms.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  let h = `找到 <b>${count}</b> 題 ‧ 依相關度排序`;
  if (count > 30) h += ' ‧ 結果較多，已不自動展開詳解，可再加關鍵字縮小範圍';
  else h += ' ‧ 詳解中有符合的題目已自動展開並標黃';
  el.innerHTML = h;
  el.classList.add('show');
}

function render() {
  const list = filterQuestions();
  const wrap = document.getElementById('content');
  const searching = state.terms.length > 0;
  const autoOpen = searching && list.length <= 30;
  JUMP_ITEMS = [];
  updateSearchInfo(list.length, autoOpen);

  if (list.length === 0) {
    const msg = searching
      ? `找不到符合「${escapeHtml(state.search)}」的題目。可改用較短的關鍵字；多個關鍵字請用空格分開。`
      : '找不到符合條件的題目';
    wrap.innerHTML = `<div class="empty">
      <div class="big">📭</div>
      <p>${msg}</p>
    </div>`;
    buildJump();
    syncExpandBtn();
    return;
  }

  let html = '';

  if (searching) {
    html += `<div class="group">
      <div class="group-head">
        <span class="g-badge">搜尋</span>
        <span class="g-title">依相關度排序</span>
        <span class="g-meta">共 ${list.length} 題</span>
      </div>
      ${list.map(q => questionCard(q, autoOpen && bodyHit(q))).join('')}
    </div>`;
  } else if (state.mode === 'year') {
    JUMP_TITLE = '跳到年度';
    // 依年度分組
    const byYear = {};
    list.forEach(q => { (byYear[q.year] = byYear[q.year] || []).push(q); });
    const years = Object.keys(byYear).sort((a, b) => Number(b) - Number(a));
    years.forEach(yr => {
      const qs = byYear[yr];
      const yObj = ALL_YEARS.find(y => y.year === yr);
      const totalScore = qs.reduce((s, q) => s + q.score, 0);
      JUMP_ITEMS.push({ key: 'y' + yr, label: yr, sub: `${qs.length} 題` });
      html += `<div class="group" id="g-y${yr}">
        <div class="group-head">
          <span class="g-badge">${yr} 年</span>
          <span class="g-title">${escapeHtml(yObj.subject)}</span>
          <span class="g-meta">
            ${yObj.timeLimit ? '考試時間 ' + yObj.timeLimit + '<br>' : ''}
            本頁 ${qs.length} 題 / ${totalScore} 分
          </span>
        </div>
        ${yObj.note ? `<div class="group-note">※ ${escapeHtml(yObj.note)}</div>` : ''}
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  } else {
    JUMP_TITLE = '跳到主題';
    // 依主題（子主題）分組
    const bySub = {};
    list.forEach(q => { (bySub[q.sub] = bySub[q.sub] || []).push(q); });
    SUBTOPICS.forEach(st => {
      const qs = bySub[st.key];
      if (!qs || qs.length === 0) return;
      qs.sort((a, b) => Number(b.year) - Number(a.year));
      JUMP_ITEMS.push({ key: 't' + st.key, label: st.name, sub: `${qs.length} 題` });
      html += `<div class="group" id="g-t${st.key}">
        <div class="group-head">
          <span class="g-badge" style="background:${st.color}">${st.name}</span>
          <span class="g-title">相似概念彙整</span>
          <span class="g-meta">共 ${qs.length} 題<br>跨 ${new Set(qs.map(q => q.year)).size} 個年度</span>
        </div>
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  }

  wrap.innerHTML = html;
  if (searching) highlightIn(wrap, state.terms);
  buildJump();
  syncExpandBtn();
}

function jumpTo(key) {
  toggleJump(false);
  scrollToGroup(key);
}

/* ---------- 互動 ---------- */
function toggleCard(headerEl) {
  const card = headerEl.parentElement;
  const open = card.classList.toggle('open');
  if (open) fillBody(card);
  if (open) openIds.add(card.dataset.id); else openIds.delete(card.dataset.id);
  syncExpandBtn();
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  render();
}

function updateStatBar() {
  const scope = ALL_Q;
  const yearSet = new Set(scope.map(q => q.year));
  document.getElementById('statYear').textContent = yearSet.size;
  document.getElementById('statQ').textContent = scope.length;
  document.getElementById('statTopic').textContent = new Set(scope.map(q => q.sub)).size;
}

function rebuildTopicChips() {
  const scope = ALL_Q;
  const cnt = {};
  scope.forEach(q => cnt[q.sub] = (cnt[q.sub] || 0) + 1);
  const filterRow = document.getElementById('filterRow');
  let chips = `<button class="chip ${state.topic === 'all' ? 'active' : ''}" data-topic="all"
    onclick="setTopic('all')">全部<span class="c-count">${scope.length}</span></button>`;
  SUBTOPICS.forEach(st => {
    const n = cnt[st.key] || 0;
    if (!n) return;
    chips += `<button class="chip ${state.topic === st.key ? 'active' : ''}" data-topic="${st.key}"
      onclick="setTopic('${st.key}')">${st.name}<span class="c-count">${n}</span></button>`;
  });
  filterRow.innerHTML = chips;
}

function setTopic(topic) {
  state.topic = topic;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.topic === topic);
  });
  render();
}

/* 按鈕文字依「目前畫面上的卡片是否都已展開」決定，不再用獨立旗標 */
function updateCollapseFab() {
  const f = document.getElementById('collapseFab');
  if (f) f.classList.toggle('show', !!document.querySelector('.q-card.open'));
}
/* 全部收合：收起所有詳解，並讓「正在讀的那一題」留在原本的視窗位置，不會跳到別處 */
function collapseAllCards() {
  const open = [...document.querySelectorAll('.q-card.open')];
  if (!open.length) return;
  const ctrl = document.querySelector('.controls');
  const off = (ctrl && ctrl.getBoundingClientRect().bottom > 0 ? ctrl.offsetHeight : 0) + 12;
  const anchor = open.find(c => c.getBoundingClientRect().bottom > off) || open[open.length - 1];
  const want = Math.min(Math.max(anchor.getBoundingClientRect().top, off), window.innerHeight * 0.6);
  open.forEach(c => { c.classList.remove('open'); openIds.delete(c.dataset.id); });
  syncExpandBtn();
  const root = document.documentElement;
  root.style.scrollBehavior = 'auto';
  window.scrollBy(0, anchor.getBoundingClientRect().top - want);
  root.style.scrollBehavior = '';
}
function syncExpandBtn() {
  updateCollapseFab();
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  document.getElementById('btnExpand').textContent = allOpen ? '全部收合' : '全部展開';
}
function toggleExpandAll() {
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  cards.forEach(c => {
    c.classList.toggle('open', !allOpen);
    if (!allOpen) fillBody(c);
    if (allOpen) openIds.delete(c.dataset.id); else openIds.add(c.dataset.id);
  });
  syncExpandBtn();
}

/* ---------- 初始化 ---------- */
function init() {
  updateStatBar();
  rebuildTopicChips();

  bindSearch();

  // 回頂部
  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 600);
  });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
<script>
/* 工具列自動隱藏：往下捲動或滑鼠離開工具列就收起；滑鼠移到畫面最頂端才出現 */
(function () {
  const ctrl = document.querySelector('.controls');
  if (!ctrl) return;
  const touch = window.matchMedia('(hover: none)').matches;
  let lastY = window.scrollY, acc = 0, quiet = 0, hiddenAt = 0;
  const away = v => document.body.classList.toggle('ctl-away', v);
  const isHidden = () => ctrl.classList.contains('ctl-hidden');
  window.ctlShow = function () { ctrl.classList.remove('ctl-hidden'); away(false); acc = 0; };
  window.ctlHide = function () { if (isHidden()) return; ctrl.classList.add('ctl-hidden'); away(true); acc = 0; hiddenAt = Date.now(); };
  window.ctlQuiet = function (ms) { quiet = Date.now() + (ms || 250); };   // 程式內部捲動（跳轉、重新繪製）時暫停判斷
  function inHeader() {                       // 頁首、統計列還看得到時，工具列自然在原位，不收
    let prev = ctrl.previousElementSibling;
    while (prev && (prev.id === 'ctlHandle' || prev.id === 'ctlEdge')) prev = prev.previousElementSibling;
    return prev ? prev.getBoundingClientRect().bottom > 0 : window.scrollY < 120;
  }
  window.addEventListener('scroll', () => {
    const y = window.scrollY, dy = y - lastY; lastY = y;
    if (Date.now() < quiet) return;
    if (inHeader()) { ctrl.classList.remove('ctl-hidden'); away(false); acc = 0; return; }
    if (dy > 0) {
      acc = acc > 0 ? acc + dy : dy;
      if (acc > 8) window.ctlHide();
    } else if (dy < 0 && touch) {
      acc = acc < 0 ? acc + dy : dy;
      if (acc < -50 && isHidden()) window.ctlShow();
    }
  }, { passive: true });
  /* 點工具列上的按鈕會重新繪製內容、捲動高度改變，那一下不要誤判成往下捲 */
  ctrl.addEventListener('click', () => window.ctlQuiet(500));
  ctrl.addEventListener('keyup', () => window.ctlQuiet(500));
  /* 滑鼠移開工具列 → 收起（頁首還看得到時不收） */
  ctrl.addEventListener('mouseleave', () => { if (!inHeader()) window.ctlHide(); });
  /* 保險：游標快速甩出工具列時瀏覽器可能不送 mouseleave，所以也看游標位置 */
  document.addEventListener('mousemove', e => {
    if (!isHidden() && !inHeader() && e.clientY > ctrl.offsetHeight + 2) window.ctlHide();
  }, { passive: true });
  /* 滑鼠移到畫面最頂端 → 出現（剛收起 0.4 秒內不理會，避免游標剛好停在頂端時又彈出來） */
  const edge = document.getElementById('ctlEdge');
  if (edge) edge.addEventListener('mousemove', () => { if (Date.now() - hiddenAt > 400) window.ctlShow(); });
})();
</script>
</body>
</html>
