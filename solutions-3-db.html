<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地方特考三等｜資訊處理・資料庫應用 考古題詳解</title>
<style>/* ===== 關務四等考古題複習系統 — 樣式 ===== */

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink:        #1a1f2c;
  --ink-soft:   #3d4456;
  --paper:      #f4f1ea;
  --paper-warm: #ece6d8;
  --card:       #fffdf8;
  --line:       #d8d0bf;
  --accent:     #8a3324;   /* 朱紅 — 印章色 */
  --accent-2:   #1f5673;   /* 靛藍 */
  --gold:       #a07e2c;
  --shadow:     rgba(40,32,20,0.13);

  /* 主題分類色 */
  --t-db:   #1f5673;
  --t-ds:   #6a4c93;
  --t-prog: #2d6a4f;
  --t-sec:  #8a3324;
  --t-net:  --t-net;
  --t-net-c:#b5651d;
  --t-mis:  #4a5859;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(138,51,36,0.025) 31px, rgba(138,51,36,0.025) 32px);
}

/* ===== 頁首 ===== */
.site-header {
  background: var(--ink);
  color: var(--paper);
  padding: 2.4rem 1.5rem 2rem;
  text-align: center;
  border-bottom: 4px solid var(--accent);
  position: relative;
}
.site-header .kicker {
  font-size: .78rem; letter-spacing: .55em; text-indent: .55em;
  color: var(--gold); font-weight: 700; margin-bottom: .7rem;
}
.site-header h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900; font-size: clamp(1.6rem, 4.4vw, 2.7rem);
  letter-spacing: .06em; line-height: 1.3;
}
.site-header h1 .stamp {
  display: inline-block; border: 2.5px solid var(--accent);
  color: var(--accent); padding: .05em .3em; border-radius: 6px;
  transform: rotate(-4deg); margin: 0 .15em;
  font-size: .82em; background: rgba(244,241,234,0.06);
}
.site-header .sub {
  margin-top: .8rem; font-size: .9rem; color: #b8bcca; font-weight: 400;
  letter-spacing: .04em;
}

/* ===== 統計列 ===== */
.stat-bar {
  display: flex; justify-content: center; gap: 2.5rem; flex-wrap: wrap;
  background: var(--paper-warm); padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.stat-bar .stat { text-align: center; }
.stat-bar .num {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1.7rem; color: var(--accent); line-height: 1;
}
.stat-bar .lbl {
  font-size: .72rem; color: var(--ink-soft); letter-spacing: .15em;
  margin-top: .25rem;
}

/* ===== 控制列 ===== */
.controls {
  position: sticky; top: 0; z-index: 50;
  background: rgb(244,241,234);
  border-bottom: 1.5px solid var(--line);
  padding: .9rem 1.5rem;
  box-shadow: 0 3px 14px var(--shadow);
}
.controls-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.mode-switch {
  display: flex; border: 2px solid var(--ink); border-radius: 8px;
  overflow: hidden;
}
.mode-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem 1.1rem; font-size: .88rem; font-weight: 700;
  color: var(--ink); transition: all .18s;
}
.mode-switch button.active { background: var(--ink); color: var(--paper); }

.search-box {
  flex: 1; min-width: 180px; position: relative;
}
.search-box input {
  width: 100%; font-family: 'Noto Sans TC', sans-serif;
  padding: .55rem .9rem .55rem 2.2rem; font-size: .9rem;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink);
}
.search-box input:focus { outline: 2px solid var(--accent-2); border-color: transparent; }
.search-box::before {
  content: '🔍'; position: absolute; left: .7rem; top: 50%;
  transform: translateY(-50%); font-size: .85rem; opacity: .5;
}
.btn-expand {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--ink-soft); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 8px;
  padding: .5rem .9rem; font-size: .82rem; font-weight: 500;
  white-space: nowrap; transition: all .15s;
}
.btn-expand:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ===== 篩選晶片 ===== */
.filter-row {
  max-width: 1080px; margin: .7rem auto 0;
  display: flex; gap: .45rem; flex-wrap: wrap;
}
.chip {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 20px;
  padding: .3rem .85rem; font-size: .8rem; font-weight: 500;
  transition: all .15s;
}
.chip:hover { border-color: var(--ink-soft); }
.chip.active {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
}
.chip .c-count { opacity: .6; font-size: .92em; margin-left: .2em; }

/* ===== 主內容 ===== */
.wrap { max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

/* 群組標題（年度 / 主題） */
.group {
  margin-bottom: 2.6rem;
}
.group-head {
  display: flex; align-items: center; gap: .9rem;
  margin-bottom: 1.1rem; padding-bottom: .6rem;
  border-bottom: 2.5px solid var(--ink);
}
.group-head .g-badge {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  background: var(--ink); color: var(--paper);
  padding: .35rem .8rem; border-radius: 6px; font-size: 1.05rem;
  white-space: nowrap;
}
.group-head .g-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.15rem; color: var(--ink);
}
.group-head .g-meta {
  margin-left: auto; font-size: .76rem; color: var(--ink-soft);
  text-align: right; line-height: 1.5;
}
.group-note {
  font-size: .8rem; color: var(--accent-2); font-style: italic;
  margin: -.5rem 0 1rem; padding-left: .2rem;
}

/* ===== 題目卡 ===== */
.q-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 10px; margin-bottom: .9rem;
  box-shadow: 0 2px 8px var(--shadow);
  overflow: hidden; transition: box-shadow .2s;
}
.q-card:hover { box-shadow: 0 4px 16px var(--shadow); }

.q-header {
  display: flex; align-items: flex-start; gap: .8rem;
  padding: 1rem 1.2rem; cursor: pointer;
  border-left: 5px solid var(--line);
  transition: background .15s;
}
.q-card.t-db   .q-header { border-left-color: var(--t-db); }
.q-card.t-ds   .q-header { border-left-color: var(--t-ds); }
.q-card.t-prog .q-header { border-left-color: var(--t-prog); }
.q-card.t-sec  .q-header { border-left-color: var(--t-sec); }
.q-card.t-net  .q-header { border-left-color: var(--t-net-c); }
.q-card.t-mis  .q-header { border-left-color: var(--t-mis); }
.q-header:hover { background: var(--paper-warm); }

.q-no {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1rem; color: var(--paper); background: var(--ink-soft);
  min-width: 2.4rem; height: 2.4rem; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.q-headmain { flex: 1; min-width: 0; }
.q-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.02rem; color: var(--ink); line-height: 1.5;
}
.q-tags {
  display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .4rem;
  align-items: center;
}
.tag {
  font-size: .7rem; font-weight: 700; padding: .12rem .55rem;
  border-radius: 4px; letter-spacing: .03em;
}
.tag-topic { color: #fff; }
.t-db   .tag-topic, .tag.topic-db   { background: var(--t-db); }
.t-ds   .tag-topic, .tag.topic-ds   { background: var(--t-ds); }
.t-prog .tag-topic, .tag.topic-prog { background: var(--t-prog); }
.t-sec  .tag-topic, .tag.topic-sec  { background: var(--t-sec); }
.t-net  .tag-topic, .tag.topic-net  { background: var(--t-net-c); }
.t-mis  .tag-topic, .tag.topic-mis  { background: var(--t-mis); }
.tag-year {
  background: var(--paper-warm); color: var(--ink-soft);
  border: 1px solid var(--line);
}
.tag-score {
  background: transparent; color: var(--gold);
  border: 1px solid var(--gold);
}
.tag-part {
  background: var(--accent-2); color: #fff;
  font-weight: 500;
}
.q-toggle {
  flex-shrink: 0; font-size: 1.3rem; color: var(--ink-soft);
  transition: transform .25s; line-height: 1; margin-top: .4rem;
}
.q-card.open .q-toggle { transform: rotate(45deg); }

/* ===== 題目展開內容 ===== */
.q-body { display: none; padding: 0 1.2rem 1.4rem; }
.q-card.open .q-body { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.section-label {
  display: inline-block; font-family: 'Noto Serif TC', serif;
  font-weight: 700; font-size: .82rem; letter-spacing: .1em;
  padding: .25rem .8rem; border-radius: 4px; margin: 1.1rem 0 .6rem;
}
.section-label.q { background: var(--ink); color: var(--paper); }
.section-label.a { background: var(--accent); color: var(--paper); }

.q-question {
  background: var(--paper-warm); border-left: 3px solid var(--ink-soft);
  padding: .9rem 1.1rem; border-radius: 0 6px 6px 0;
  font-size: .93rem; white-space: pre-wrap; color: var(--ink-soft);
  font-feature-settings: "tnum";
}
.q-answer {
  font-size: .95rem; color: var(--ink);
}
.q-answer h4 {
  font-family: 'Noto Serif TC', serif; color: var(--accent);
  font-size: 1rem; margin: 1.1rem 0 .4rem;
  border-bottom: 1px dashed var(--line); padding-bottom: .2rem;
}
.q-answer p { margin: .55rem 0; }
.q-answer ul, .q-answer ol { margin: .5rem 0 .5rem 1.4rem; }
.q-answer li { margin: .3rem 0; }
.q-answer strong { color: var(--accent-2); font-weight: 700; }
.q-answer code {
  font-family: 'JetBrains Mono', monospace; font-size: .86em;
  background: var(--paper-warm); padding: .1em .35em;
  border-radius: 3px; color: var(--accent);
}
.q-answer table {
  border-collapse: collapse; width: 100%; margin: .8rem 0;
  font-size: .86rem;
  display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;  /* MOBILE_TABLE：手機寬度下表格可左右捲動 */
}
.q-figure { max-width: 100%; overflow-x: auto; }
.q-answer th, .q-answer td {
  border: 1px solid var(--line); padding: .4rem .6rem;
  text-align: left;
}
.q-answer th {
  background: var(--ink); color: var(--paper); font-weight: 700;
}
.q-answer tr:nth-child(even) td { background: var(--paper-warm); }

/* 程式碼/ASCII 區塊 */
.q-answer pre {
  background: #2b303b; color: #f2f0e9;
  font-family: 'JetBrains Mono', monospace; font-size: .85rem;
  line-height: 1.7; padding: 1rem 1.2rem; border-radius: 8px;
  overflow-x: auto; margin: .8rem 0;
  border-left: 3px solid var(--gold);
}
.q-answer pre code { background: none; color: inherit; padding: 0; }

/* 獨立程式碼區（code 欄位） */
.code-block {
  margin: 1rem 0; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--ink);
}
.code-head {
  background: var(--ink); color: var(--gold);
  font-family: 'JetBrains Mono', monospace; font-size: .76rem;
  padding: .4rem .9rem; font-weight: 500;
  display: flex; justify-content: space-between; align-items: center;
}
.code-head .dots { display: flex; gap: .3rem; }
.code-head .dots span {
  width: .6rem; height: .6rem; border-radius: 50%; display: block;
}
.code-head .dots span:nth-child(1) { background: #d4554a; }
.code-head .dots span:nth-child(2) { background: #d9a441; }
.code-head .dots span:nth-child(3) { background: #5a9e6f; }
.code-block pre {
  margin: 0; border-radius: 0; border-left: none;
  background: #2b303b;            /* 提亮背景，降低與文字的明度落差刺眼感 */
  color: #f2f0e9;                 /* 預設文字（變數、標點）改為近白，清楚可見 */
  font-size: .86rem; line-height: 1.7;
  padding: 1.1rem 1.3rem 1.1rem 1.7rem;   /* 左側多留白，程式碼不貼邊、不壓迫 */
}
/* 語法highlight — 高對比配色，深背景下皆清晰 */
.tok-kw  { color: #ff9d6f; font-weight: 700; }   /* 關鍵字：亮橘，最醒目 */
.tok-str { color: #b8e986; }                      /* 字串：亮綠 */
.tok-com { color: #9aa6b8; font-style: italic; }  /* 註解：提亮的灰藍，不再灰到看不見 */
.tok-num { color: #f7d56e; }                      /* 數字：亮黃 */
.tok-fn  { color: #82c8ff; }                      /* 函式：亮藍 */
.tok-typ { color: #ffd166; }                      /* 型別：金黃 */

/* ===== HTML 圖表（取代易跑版的 ASCII 圖）===== */
.html-diagram {
  margin: 1.1rem 0; padding: 1.3rem 1rem;
  background: var(--paper-warm);
  border: 1.5px solid var(--line); border-radius: 10px;
  overflow-x: auto;
}
/* 通用方框節點 */
.dg-box {
  display: inline-flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center;
  border: 2px solid var(--ink); border-radius: 8px;
  background: var(--card); padding: .55rem .9rem;
  font-size: .86rem; line-height: 1.5; font-weight: 500;
  min-width: 5.5rem;
}
.dg-box .dg-sub { font-size: .73rem; color: var(--ink-soft); font-weight: 400; }
.dg-box.accent { border-color: var(--accent); background: #fbf3f0; }
.dg-box.blue   { border-color: var(--accent-2); background: #eef4f7; }
.dg-box.gold   { border-color: var(--gold); background: #faf5e6; }
.dg-box.ink    { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dg-box.ink .dg-sub { color: #b8bcca; }

/* 排列容器 */
.dg-row { display: flex; align-items: center; justify-content: center;
  gap: .5rem; flex-wrap: wrap; }
.dg-col { display: flex; flex-direction: column; align-items: center;
  gap: .5rem; }
.dg-center { justify-content: center; }

/* 箭頭 */
.dg-arrow { font-size: 1.3rem; color: var(--accent); font-weight: 700;
  line-height: 1; padding: 0 .15rem; }
.dg-arrow.v { transform: rotate(90deg); margin: .1rem 0; }
.dg-arrow.bi::before { content: '◀▶'; }
.dg-arrow.down::before { content: '▼'; }
.dg-arrow.right::before { content: '▶'; }

/* 流程圖專用 */
.flow { display: flex; flex-direction: column; align-items: center; gap: 0; }
.flow-node {
  border: 2px solid var(--ink); background: var(--card);
  padding: .55rem 1.1rem; font-size: .86rem; text-align: center;
  font-weight: 500; max-width: 32rem; line-height: 1.55;
}
.flow-node.start, .flow-node.end {
  border-radius: 22px; background: var(--ink); color: var(--paper);
  font-weight: 700;
}
.flow-node.process { border-radius: 6px; }
.flow-node.io {
  border-radius: 6px; background: var(--paper-warm);
  border-style: dashed;
}
.flow-node.decision {
  background: #faf5e6; border-color: var(--gold);
  border-radius: 6px; font-weight: 700;
}
/* 連接線（直線 + 箭頭） */
.flow-conn { width: 2px; height: 1.6rem; background: var(--ink-soft);
  position: relative; }
.flow-conn::after {
  content: '▼'; position: absolute; bottom: -.3rem; left: 50%;
  transform: translateX(-50%); color: var(--ink-soft); font-size: .68rem;
}
/* 連接線旁的小標籤（如「否」「未出貨訂單」） */
.flow-edge {
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.flow-edge .lbl {
  font-size: .74rem; font-weight: 700; padding: .08rem .55rem;
  border-radius: 4px; position: relative; z-index: 1;
}
.flow-edge .lbl.yes { background: #2d6a4f; color: #fff; }
.flow-edge .lbl.no  { background: var(--accent); color: #fff; }
.flow-edge .lbl.plain {
  background: var(--card); color: var(--accent-2);
  border: 1px solid var(--line);
}
.flow-conn.short { height: .7rem; }
.flow-conn.short::after { display: none; }

/* 迴圈返回標記 —— 掛在決策節點下方，明確標示「往回」 */
.flow-loop {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .76rem; font-weight: 700;
  background: #eef4f7; color: var(--accent-2);
  border: 1.5px dashed var(--accent-2); border-radius: 20px;
  padding: .25rem .8rem; margin: .35rem 0;
}
.flow-loop::before { content: '⟲'; font-size: 1.05rem; }

.flow-label {
  font-size: .73rem; color: var(--accent-2); font-weight: 600;
  background: var(--card); padding: 0 .4rem; margin: .15rem 0;
}
/* 舊版分支樣式（保留相容，僅用於少數真正左右並排的場景） */
.flow-branch { display: flex; align-items: flex-start; gap: 2.5rem;
  justify-content: center; }
.flow-branch-arm { display: flex; flex-direction: column;
  align-items: center; gap: 0; }
.flow-yes, .flow-no {
  font-size: .76rem; font-weight: 700; padding: .1rem .5rem;
  border-radius: 4px; margin: .2rem 0;
}
.flow-yes { background: #2d6a4f; color: #fff; }
.flow-no  { background: var(--accent); color: #fff; }

/* ERD 專用形狀 */
.erd-entity {
  border: 2px solid var(--ink); background: var(--card);
  padding: .5rem 1.1rem; font-weight: 700; font-size: .9rem;
  border-radius: 4px; text-align: center;
}
.erd-rel {
  display: inline-flex; align-items: center; justify-content: center;
  width: 7rem; height: 4rem; background: #faf5e6;
  border: 2px solid var(--gold);
  transform: rotate(45deg); margin: 1rem;
}
.erd-rel > span {
  transform: rotate(-45deg); font-size: .8rem; font-weight: 700;
  text-align: center; line-height: 1.3;
}
.erd-attr {
  display: inline-block; border: 1.5px solid var(--accent-2);
  background: #eef4f7; border-radius: 50%;
  padding: .35rem .8rem; font-size: .76rem; text-align: center;
  color: var(--accent-2);
}
.empty .big { font-size: 2.5rem; margin-bottom: .5rem; }

/* 回頂部 */
.to-top {
  position: fixed; right: 1.5rem; bottom: 1.5rem;
  width: 3rem; height: 3rem; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 14px var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .25s;
  z-index: 60;
}
.to-top.show { opacity: 1; pointer-events: auto; }

/* 頁尾 */
.site-footer {
  background: var(--ink); color: #9aa0b0;
  text-align: center; padding: 2rem 1.5rem;
  font-size: .8rem; line-height: 1.8;
}
.site-footer strong { color: var(--gold); }

/* 手機 */
@media (max-width: 640px) {
  .stat-bar { gap: 1.4rem; }
  .controls-inner { gap: .6rem; }
  .search-box { order: 3; flex-basis: 100%; }
  .group-head { flex-wrap: wrap; }
  .group-head .g-meta { margin-left: 0; flex-basis: 100%; text-align: left; }
  .q-answer table { font-size: .78rem; }
  .q-answer pre, .code-block pre { font-size: .74rem; }
}

/* ===== 搜尋強化 / 跳轉面板（新增） ===== */
.search-box input { padding-right: 2.2rem; }
.search-clear {
  position: absolute; right: .35rem; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; color: var(--ink-soft);
  font-size: 1.05rem; line-height: 1; cursor: pointer;
  padding: .25rem .45rem; border-radius: 50%; display: none;
}
.search-clear.show { display: block; }
.search-clear:hover { background: var(--paper-warm); }
.search-info {
  max-width: 1100px; margin: .55rem auto 0;
  font-size: .8rem; color: var(--ink-soft); display: none;
}
.search-info.show { display: block; }

      answer: `先看表格定義帶來哪些完整性限制，再逐一檢查每個指令。

#### 一、表格定義的限制

| --- | --- | --- |
| ID | char(5) | 主鍵：值不可重複，也不可為 NULL（實體完整性） |
| Title | varchar(20) | NOT NULL：不可為空值 |
| Author | varchar(20) | 無限制，可為 NULL |
| Price | numeric(8,2) | 無限制，可為 NULL；整數部分最多 6 位，所以 60000、80000、10000 都放得下 |

#### 二、逐指令判斷

每個 INSERT 都是獨立的一個敘述（預設 autocommit）。失敗的敘述整句被拒絕、不會留下半筆資料，也不會影響先前已成功的敘述。

| 指令 | 能否執行 | 說明 |
| --- | --- | --- |
| 指令 1 | 能 | 表格目前是空的，主鍵 11111 沒有重複，Title 不是 NULL，所有限制都滿足。對資料庫的影響：BOOK 新增 1 筆 (11111, Sky, John, 60000.00) |
| 指令 2 | 不能 | 違反 NOT NULL 限制：Title 是 NULL。主鍵 11211 雖然沒有重複，但只要有任一欄位違反限制整筆就被拒絕。MySQL 嚴格模式的錯誤為 Column 'Title' cannot be null，BOOK 不變 |
| 指令 3 | 不能 | 違反主鍵限制（實體完整性、唯一性）：主鍵 ID = 11111 已經被指令 1 的那一筆佔用，主鍵值不可重複。即使 Title、Price 都不同也一樣被拒絕。MySQL 錯誤為 Duplicate entry '11111' for key 'PRIMARY'，BOOK 不變 |
| 指令 4 | 能 | ID = 11411 沒有重複；Title = Ocean 不是 NULL；Author、Price 沒有 NOT NULL 限制，Price 為 NULL 是合法的（代表價格未知）。BOOK 新增 1 筆 (11411, Ocean, Mary, NULL) |

要注意指令 3 的 Title（Ocean）和指令 4 的 Title 相同並不是問題，因為 Title 沒有 UNIQUE 限制；Author 為 John 重複也沒關係。

| <u>ID</u> | Title | Author | Price |
| --- | --- | --- | --- |

| 11411 | Ocean | Mary | NULL |

      question: `近年來大數據（Big Data）為資料庫系統帶來新的挑戰。首先詳述大數據最主要的 3 個特性（簡稱 3V）為何？其次說明在那種情境或應用下會產生大數據？最後建議使用那種軟體或技術來儲存大數據，並詳述你的理由。`,
      answer: `#### 一、大數據的 3V 特性

| 特性 | 英文 | 意涵 | 對傳統資料庫的挑戰 |
| --- | --- | --- | --- |
| 資料量大 | Volume | 資料規模從 TB 到 PB、EB，單機放不下，也很難在單一磁碟上掃描完 | 單一伺服器的容量與 I/O 有上限，需要靠水平擴充（加機器）而不是換更大的機器 |
| 速度快 | Velocity | 資料產生與流入的速度極快，並要求即時或近即時處理，例如每秒數萬筆事件 | 批次 ETL 太慢；關聯式資料庫的寫入、鎖定與交易成本在高吞吐量下成為瓶頸 |
| 多樣性 | Variety | 資料型態多元：結構化（交易紀錄）、半結構化（JSON、XML、日誌）、非結構化（文字、影像、影音、感測訊號） | 關聯式模型要先定義固定綱要（schema-on-write），難以容納欄位不一致、變動頻繁的資料 |

補充：業界常再加上 Veracity（真實性、資料品質）與 Value（價值）成為 5V，但題目要求的主要三項是 Volume、Velocity、Variety。

#### 二、會產生大數據的情境與應用

- 社群媒體與網路服務：臉書、Line、抖音的貼文、訊息、按讚、影片，使用者行為日誌每天累積大量資料，可用來做推薦與輿情分析。
- 電子商務與金融：網站點擊流、購物車與交易紀錄、信用卡交易，用於推薦系統與即時詐欺偵測。
- 物聯網（IoT）與智慧城市：工廠機台感測器、智慧電表、交通攝影機與 GPS，資料連續不斷湧入（高 Velocity）。
- 醫療與基因體：電子病歷、醫學影像、基因定序資料量龐大而且型態多樣。
- 電信與網路：通話紀錄、基地臺訊號、網路流量監控。
- 科學研究與政府公開資料：氣象衛星、粒子對撞實驗、天文觀測資料。

這些情境共同的特徵是：資料持續增長、來源多元、格式不固定，而且常常需要分析整批歷史資料而不只是查單筆交易。

#### 三、建議使用的儲存軟體與技術

我建議用「分散式檔案系統加 NoSQL 資料庫」的架構，依資料特性搭配：

| 資料與需求 | 建議技術 | 理由 |
| --- | --- | --- |
| 原始資料的大量儲存（含非結構化） | Hadoop HDFS（可搭配雲端物件儲存如 S3，形成資料湖 Data Lake） | 把檔案切成區塊、複製多份分散在許多一般伺服器，容量可隨機器數量線性擴充，單機故障不會遺失資料，成本低 |
| 批次分析與大規模運算 | Hadoop MapReduce 或 Spark | 「把運算搬到資料所在處」（data locality），平行處理 PB 級資料；Spark 以記憶體運算，速度更快，也可處理串流 |
| 高速寫入、巨量鍵值或寬欄資料 | Cassandra、HBase（寬欄式 NoSQL） | 無單點故障、水平擴充、寫入吞吐量高，適合時間序列與感測資料 |
| 彈性綱要的半結構化資料 | MongoDB（文件式 NoSQL） | 以 JSON 文件儲存，不需事先固定欄位，欄位增減不必改表 |
| 即時串流資料的匯入 | Kafka 搭配 Spark Streaming 或 Flink | 對應 Velocity，先緩衝再分批或即時處理 |

理由歸納（對應 3V）：

- 對應 Volume：靠分散式架構水平擴充（scale-out），而不是把單一伺服器越買越大（scale-up），容量與效能一起成長。
- 對應 Velocity：NoSQL 放寬了嚴格的 ACID 與連接運算，採 BASE 與最終一致性（eventual consistency），換取很高的寫入吞吐量與可用性（CAP 定理中偏向 AP）。
- 對應 Variety：schema-on-read，先把原始資料存起來，分析時才決定怎麼解讀，可容納各種格式。
- 容錯與成本：資料多副本，使用一般硬體即可，單機故障可自動恢復。

取捨：NoSQL 與 Hadoop 不擅長複雜的多表連接與強一致的交易。所以需要精準交易的核心業務（如帳務）仍應留在關聯式資料庫，兩者搭配使用；分析後的彙總結果再匯入資料倉儲，供報表與決策使用。`

      answer: `#### 一、BCNF 的定義

設 R 是關聯綱要，F 是 R 上的功能相依集合。R 符合 BCNF，若且唯若對 F 中每一個非平凡（nontrivial）的功能相依 X → Y（Y 不是 X 的子集合），X 都是 R 的超鍵（superkey）。

白話說：每一個「決定其他屬性的決定因素」都必須是鍵。BCNF 比 3NF 更嚴格：3NF 允許「右邊是主屬性（鍵的成分）」的例外，BCNF 連這個例外也不允許，所以 BCNF 一定是 3NF，反過來不一定。

#### 二、找出 Register 的功能相依與候選鍵

依表格的語意（學號決定姓名，課名決定學分，學號加課名決定成績）：

- FD1：ID → Name（學號決定姓名）
- FD2：Title → Credit（課名決定學分數）
- FD3：{ID, Title} → Grade（一個學生修一門課只有一個成績）

我用程式計算屬性閉包：{ID, Title}⁺ = {ID, Name, Title, Credit, Grade} 是全部屬性，而 ID⁺ = {ID, Name}、Title⁺ = {Title, Credit}，都不是全部，所以候選鍵只有 {ID, Title}，與題目的主鍵一致。

#### 三、未符合 BCNF 的原因

| 非平凡功能相依 | 左邊是超鍵嗎 | 判定 |
| --- | --- | --- |
| ID → Name | 否（ID 只是鍵的一部分，ID⁺ 不含 Title、Credit、Grade） | 違反 BCNF |
| Title → Credit | 否（Title⁺ 不含 ID、Name、Grade） | 違反 BCNF |
| {ID, Title} → Grade | 是 | 符合 |

ID → Name 與 Title → Credit 的左邊都只是候選鍵的一部分，屬於部分相依（partial dependency），所以這張表連 2NF 都不符合，只有 1NF，當然也不符合 BCNF。

這樣的設計會造成異常與冗餘：
- 冗餘：張三的姓名在他修的每一門課都重複存一次，資料庫課的學分 3 也重複存。
- 更新異常：把張三改名時，要改每一筆他的修課紀錄，漏改就不一致。
- 插入異常：新開了一門課（還沒有人選）無法登錄它的學分，因為主鍵 (ID, Title) 的 ID 不能為空；新生還沒選課也無法先登錄姓名。
- 刪除異常：若李四退選了唯一修的某課，刪掉那筆紀錄會連他的姓名一起消失。

#### 四、正規化（BCNF 分解）步驟

1. 取違反 BCNF 的 ID → Name，把 Register 分成兩張：Student(ID, Name)（由這個 FD 本身產生），以及剩下的 R′(ID, Title, Credit, Grade)（保留 ID 當連接用）。
2. 在 R′ 裡還有 Title → Credit，其左邊 Title 不是 R′ 的超鍵，再分解：Course(Title, Credit)，以及 Register(ID, Title, Grade)。
3. 檢查結果：三張表都只剩下左邊是鍵的功能相依。

分解結果：

| 資料表 | 欄位（底線為主鍵） | 外來鍵 | 保留的 FD |
| --- | --- | --- | --- |
| Student | <u>ID</u>, Name | | ID → Name |
| Course | <u>Title</u>, Credit | | Title → Credit |
| Register | <u>ID</u>, <u>Title</u>, Grade | ID 參照 Student；Title 參照 Course | {ID, Title} → Grade |

各表資料：

| Student：<u>ID</u> | Name |
| --- | --- |
| 11301 | 張三 |
| 11302 | 李四 |

| Course：<u>Title</u> | Credit |
| --- | --- |
| 資料庫 | 3 |
| 作業系統 | 3 |

| Register：<u>ID</u> | <u>Title</u> | Grade |
| --- | --- | --- |
| 11301 | 資料庫 | A |
| 11301 | 作業系統 | C |
| 11302 | 資料庫 | B |
| 11302 | 作業系統 | B |

對應的 SQL 定義（MySQL）：

CREATE TABLE Student (ID CHAR(5) PRIMARY KEY, Name VARCHAR(20) NOT NULL);
CREATE TABLE Course  (Title VARCHAR(30) PRIMARY KEY, Credit TINYINT NOT NULL);
CREATE TABLE Register (
    ID CHAR(5), Title VARCHAR(30), Grade CHAR(2),
    PRIMARY KEY (ID, Title),
    FOREIGN KEY (ID) REFERENCES Student(ID),
    FOREIGN KEY (Title) REFERENCES Course(Title)
);
\`\`\`

#### 五、驗證分解是否正確

| 檢查項目 | 結果 | 說明 |
| --- | --- | --- |
| 每張表是否 BCNF | 是 | Student、Course 的決定因素就是鍵；Register 只有 {ID, Title} → Grade，左邊是鍵 |
| 無損連接（lossless join） | 是 | 我用 chase 演算法驗證：Student 與 Course、Register 依序以 ID、Title 連接，共同屬性分別是 Student 的鍵 ID 與 Course 的鍵 Title，因此連接後恰好還原原表，不會產生多餘的列 |
| 保留功能相依 | 是 | 三個 FD 各自完整地落在某一張表中 |

分解後，改名只改 Student 一筆，新增課程只增加 Course 一筆，異常都消失了。要得到原本的 Register 完整資料，只需把三張表做自然連接（Student JOIN Register JOIN Course）。`

#### 三、基數比與參與限制

| 關係 | 基數比 | 參與限制 |
| --- | --- | --- |
| 借閱（讀者、書、服務組館員）三元關係 | M : N : P | 讀者：全部參與（沒借過書就不記錄）；書：部分參與（有些書從未被借出）；服務組館員：部分參與（新進館員可能還沒處理過借書） |
| 檢查（書、書籍狀態） | 1 : N | 書籍狀態：全部參與（弱實體必須依附某本書，沒有書就不會有狀態紀錄）；書：部分參與（多數書從未被發現有狀況） |
| 館員特殊化為服務組館員 | 子類型 | 不是全體館員都屬於服務組，所以是部分特殊化（單線）；服務組館員繼承館員的身分證號碼、姓名、隸屬組別 |

三元關係的基數 M : N : P 說明：一位讀者可借很多本書、經不同館員處理；一本書在不同時間可被不同讀者借；一位服務組館員可處理很多筆借閱。同時「讀者每次可借閱多本書」也已包含在內（一次借多本書就是多筆借閱紀錄）。

注意：同一位讀者可能在不同日期重複借同一本書，所以轉成關聯表時借閱的主鍵要包含借出日期，而不是只有 (讀者, 書, 館員)。

#### (1) 臺北直飛洛杉磯航班的旅客護照號碼與姓名（10 分）

2. 航班與購票資訊用航班編號連接，得到每張票。
3. 再與旅客用護照號碼連接，取得姓名。

關聯代數式：

\`\`\`

分步寫法：

\`\`\`text
R1 ← σ 出發地='臺北' ∧ 目的地='洛杉磯' (航班)
R2 ← R1 ⋈ 購票資訊            （依 航班編號）
R3 ← R2 ⋈ 旅客                （依 護照號碼）
結果 ← π 護照號碼, 姓名 (R3)
\`\`\`

投影會自動消除重複列，所以同一位旅客搭了兩班臺北到洛杉磯的直飛航班，也只出現一次。我用 python sqlite3 以小資料驗證等價的 SQL，結果正確。

#### (1) 從未搭乘「甲航空」的旅客（10 分）

「從來沒有」是否定的全稱語句，要用 NOT EXISTS 或 NOT IN 排除「搭過甲航空的人」，不可以只寫 \`Airline <> '甲航空'\`，因為那樣會把「搭過甲航空、也搭過別家」的人找進來。

SELECT P.Passport, P.Name
FROM Passenger AS P
WHERE NOT EXISTS (
    SELECT *
    FROM Ticket AS T

定義：關聯綱要 R 符合第二正規化，若且唯若 R 已符合第一正規化（1NF，所有屬性值都是不可再分的原子值），而且每一個非主屬性（不屬於任何候選鍵的屬性）都完全功能相依（fully functionally dependent）於每一個候選鍵。換句話說，不能有「非主屬性只相依於候選鍵的一部分」的部分相依（partial dependency）。

「完全相依」是指：若候選鍵是複合鍵 K = {K1, K2}，非主屬性 A 相依於 K，但把 K 中任何一個屬性拿掉後就不再成立（A 不是只由 K1 或只由 K2 決定）。若候選鍵只有單一屬性，那麼不可能有部分相依，自動符合 2NF。

例子：修課(學號, 課名, 姓名, 學分, 成績)，主鍵為 (學號, 課名)。

| 功能相依 | 類型 |
| --- | --- |
| 學號 → 姓名 | 部分相依（只依賴主鍵的一部分），違反 2NF |
| 課名 → 學分 | 部分相依，違反 2NF |
| (學號, 課名) → 成績 | 完全相依，合乎 2NF |

#### (2) 何謂 NoSQL（5 分）

NoSQL 一般解釋為 Not Only SQL（不只有 SQL），泛指不採用傳統關聯式模型（表格加固定綱要、以 SQL 為主要查詢語言）的非關聯式資料庫系統。它是為了解決大數據、高併發網站與雲端應用而興起，特色是水平擴充、彈性綱要、高可用與高吞吐量。

- 放寬一致性：多採 BASE（Basically Available、Soft state、Eventually consistent）與最終一致性，取代嚴格的 ACID，換取可用性與效能；依 CAP 定理在一致性、可用性、分區容忍之間取捨。
- 避免複雜連接：資料常以非正規化方式儲存（把相關資料放在同一個文件或列中），讀取一次就拿到完整資料。

| 類型 | 代表產品 | 資料模型與適用情境 |
| --- | --- | --- |
| 鍵值式 Key-Value | Redis、DynamoDB | 以鍵找值，極快；快取、工作階段、購物車 |
| 文件式 Document | MongoDB、CouchDB | 以 JSON 類文件儲存，彈性綱要；內容管理、商品目錄 |
| 寬欄式 Column-family | Cassandra、HBase | 依列鍵與欄族儲存，寫入量大；時間序列、日誌、感測資料 |
| 圖形式 Graph | Neo4j | 節點與邊；社群網路、推薦、關係分析 |

與關聯式資料庫的取捨：NoSQL 擅長大量資料、高寫入與彈性結構，但對複雜的多表連接、強一致交易支援較弱；需要嚴格交易的核心系統（如銀行帳務）仍適合關聯式資料庫，實務上常兩者並用。`

      question: `假設有關博物館的部分實體關係圖（Entity-Relationship Diagram）如圖，其中每一實體（矩形）或弱實體（雙矩形）鄰近某關係（菱形）間均有一對（min,max）的限制，代表該實體參與該關係之 min（至少）、max（至多）次數限制，* 代表沒有限制。屬性劃實底線者（如 MID、LID、C_Number）為 Primary Key（主鍵）、劃虛底線者（如 BID）為 Partial Key。
(一) 請將此圖轉化為對應的關聯（Relation）式資料庫綱要，以「關聯（屬性 1,屬性 2,……）」方式寫出應有的所有關聯表格；同時，必須標示出每個關聯的主鍵。（15 分）
(二) 進一步，若對實體關係圖中「館藏物」應有的關聯表格，以 SQL 語法的 CREATE 命令去創建它，其中應有的參考完整性限制（Referential Integrity Constraints）語句應為何？（5 分）`,
      answer: `## 一、先讀懂圖（還原的 ER 圖）

下圖依原圖重畫，並把每條連線的 (min,max) 標出（min=1 的連線畫成雙線，表示全部參與）。

## 二、(一) 關聯式資料庫綱要（15 分）

轉換步驟：

1. 強實體：博物館、館藏物、會員各成一個關聯，簡單屬性直接成為欄位，主鍵照圖（LID、C_Number、MID）。
2. 弱實體：分館成為關聯，加入擁有者（博物館）的主鍵 LID 作為外來鍵，主鍵為 (LID, BID)，Address 為一般屬性。
3. 1:N 關係「保存」：館藏物在 N 端，加入分館主鍵 (LID, BID) 為外來鍵。館藏物端是 (1,1)，所以外來鍵必須 NOT NULL。
4. M:N 關係「申請」：另建關聯表，欄位為博物館的 LID 與會員的 MID，兩者合成主鍵，且各自是外來鍵。

結果（主鍵與外來鍵標註於右側）：

\`\`\`text
博物館 (LID)
分館   (LID, BID, Address)            主鍵 (LID, BID)；FK: LID → 博物館.LID
館藏物 (C_Number, LID, BID)           主鍵 C_Number；FK: (LID, BID) → 分館.(LID, BID)
會員   (MID, Address)                 主鍵 MID
申請   (LID, MID)                     主鍵 (LID, MID)；FK: LID → 博物館.LID；FK: MID → 會員.MID
\`\`\`

| 關聯 | 屬性 | 主鍵 | 外來鍵 |
| --- | --- | --- | --- |
| 博物館 | LID | LID | 無 |
| 分館 | LID, BID, Address | (LID, BID) | LID → 博物館(LID) |
| 館藏物 | C_Number, LID, BID | C_Number | (LID, BID) → 分館(LID, BID) |
| 會員 | MID, Address | MID | 無 |
| 申請 | LID, MID | (LID, MID) | LID → 博物館(LID)；MID → 會員(MID) |

重點說明：

- 分館的 BID 只是部分鍵（同一博物館內不重複即可），單獨用 BID 不能識別分館，所以主鍵必須含 LID。
- 館藏物若只放 BID 當外來鍵是錯的，會找不到唯一的分館；一定要帶 (LID, BID) 整組。
- 館藏物的主鍵是 C_Number（實體本身的主鍵），LID、BID 只是外來鍵，不是主鍵的一部分。
- 「申請」沒有自己的屬性，但 M:N 不能把外來鍵塞進任一邊，否則會產生多值屬性或重複資料，所以獨立成表。
- 博物館與會員都有 Address，是各自關聯內的欄位，兩者不同名稱空間，不衝突。

## 三、(二) 館藏物的 CREATE TABLE（5 分）

\`\`\`sql
CREATE TABLE \`館藏物\` (
    C_Number  VARCHAR(20) NOT NULL,
    LID       VARCHAR(10) NOT NULL,
    BID       VARCHAR(10) NOT NULL,
    PRIMARY KEY (C_Number),
    FOREIGN KEY (LID, BID) REFERENCES \`分館\` (LID, BID)
        ON DELETE CASCADE
        ON UPDATE CASCADE
);
\`\`\`

參考完整性限制語句就是這一行：\`FOREIGN KEY (LID, BID) REFERENCES 分館 (LID, BID)\`。說明：

- 外來鍵是複合鍵，必須兩個欄位一起參照分館的複合主鍵 (LID, BID)，不能拆成兩條各自參照。
- LID、BID 宣告 NOT NULL，對應圖中館藏物端的 (1,1)：每件館藏物恰屬於一個分館，不可沒有分館。
- ON DELETE：館藏物完全依附於分館，分館被刪除時採 CASCADE 一併刪除；若希望禁止刪除仍有館藏的分館，改用 \`ON DELETE RESTRICT\`（MySQL 預設的 NO ACTION 效果相近）。ON UPDATE CASCADE 讓分館主鍵變動時同步更新。
- 建表順序：博物館 → 分館 → 館藏物，被參照的表要先建立。

為了完整，其餘表格的 CREATE 如下（題目只要求館藏物，這是對照參考）：

\`\`\`sql
CREATE TABLE \`博物館\` (
    LID VARCHAR(10) NOT NULL,
    PRIMARY KEY (LID)
);

CREATE TABLE \`分館\` (
    LID     VARCHAR(10) NOT NULL,
    BID     VARCHAR(10) NOT NULL,
    Address VARCHAR(100),
    PRIMARY KEY (LID, BID),
    FOREIGN KEY (LID) REFERENCES \`博物館\` (LID) ON DELETE CASCADE
);

CREATE TABLE \`會員\` (
    MID     VARCHAR(10) NOT NULL,
    Address VARCHAR(100),
    PRIMARY KEY (MID)
);

CREATE TABLE \`申請\` (
    LID VARCHAR(10) NOT NULL,
    MID VARCHAR(10) NOT NULL,
    PRIMARY KEY (LID, MID),
    FOREIGN KEY (LID) REFERENCES \`博物館\` (LID) ON DELETE CASCADE,
    FOREIGN KEY (MID) REFERENCES \`會員\` (MID) ON DELETE CASCADE
);
\`\`\`

      answer: `#### (1) 功能相依為何存在、如何找到（5 分）

功能相依 X → Y 的意思是：只要兩筆資料的 X 值相同，它們的 Y 值就一定相同（X 的值決定了 Y 的值）。

為何存在：功能相依來自真實世界的語意與企業規則，而不是資料本身的巧合。例如「學號 → 姓名」是因為一個學號只會發給一個人；「課號 → 學分」是因為一門課只有一個學分數；「員工編號 → 部門」是因為公司規定員工只隸屬於一個部門；「(學號, 課號) → 成績」是因為一位學生修一門課只有一個成績。這些規則在這個企業的任何時刻都必須成立，所以功能相依是綱要（schema）層次的性質，要對所有可能的資料表內容都成立。

如何找到：
1. 與使用者、領域專家訪談，詢問「已知 X，是否就能唯一決定 Y」。
2. 閱讀企業的作業規章、表單、報表與需求文件，把每一條「每個…只有一個…」的規則轉成 FD。

先建表（MySQL）：

\`\`\`sql
CREATE TABLE PersonIncome (
  ID      CHAR(5) PRIMARY KEY,
  name    VARCHAR(20),

  income  INT
);

### （一）收入大於 22000 或小於 26000

照題意字面寫：

\`\`\`sql
SELECT * FROM PersonIncome
WHERE income > 22000 OR income < 26000;
\`\`\`

實測結果：12 筆全部回傳。原因是只要金額不是「恰好同時違反兩個條件」就會被選中：任何數字不是大於 22000，就是小於或等於 22000（此時必然小於 26000）。兩個條件的聯集涵蓋整條數線，OR 的結果是恆真，等於沒有過濾。

\`\`\`text
income <= 22000  → 一定 < 26000，符合第二條件
income >  22000  → 符合第一條件
所以 12 筆（C1001～C1012）全部符合。
\`\`\`

題目應是出題疏忽，常見的真正意圖有兩種：

\`\`\`sql
-- 意圖 1：介於 22000 與 26000 之間（AND）。實測：C1001, C1006, C1008，共 3 筆
SELECT * FROM PersonIncome WHERE income > 22000 AND income < 26000;
-- 等價寫法
SELECT * FROM PersonIncome WHERE income BETWEEN 22001 AND 25999;

-- 意圖 2：落在區間之外（小於 22000 或大於 26000）。實測 9 筆：
-- C1002, C1003, C1004, C1005, C1007, C1009, C1010, C1011, C1012
SELECT * FROM PersonIncome WHERE income < 22000 OR income > 26000;
\`\`\`

SELECT * FROM PersonIncome WHERE MOD(income, 7) = 0;

實測結果 4 筆：C1002（21000＝7×3000）、C1004、C1010、C1011（28000＝7×4000）。其餘金額 25000、27000、23000、17000、29000 除以 7 都有餘數。差異：sqlite 沒有 MOD() 函數，實測用 income % 7 = 0，結果相同；Oracle 則用 MOD(income, 7)。

SELECT name, SUM(income) AS total_income
FROM PersonIncome
GROUP BY name
HAVING SUM(income) > 70000;
\`\`\`

全期間總額：王大陸 81000、趙麗生 72000、黃球聲 80000、李大喬 49000、李曉喬 23000，因此實測結果為王大陸、趙麗生、黃球聲三人。若題意是限定在（五）的期間內，則把 WHERE paydate BETWEEN … 加在 GROUP BY 之前，此時沒有人超過 70000（最大為 56000）。`

      score: 20,
      question: `關於物件導向資料庫，請回答下列問題：
（一）請闡述何謂物件導向資料庫？（3 分）
（二）有些資料類型適合儲存在物件導向資料庫，請舉出三種適合以物件導向資料庫儲存的資料類型。（3 分）
（三）關聯式資料模型有許多構成元素，其中表格（Table）、值組（Row/Tuple）、主鍵（Primary Key）、屬性（Attribute）、預儲程序（Stored Procedure），這些元素可以分別對應到物件導向資料庫的那些元素？（4 分）

      answer: `### （一）物件導向資料庫（OODB／ODBMS）

物件導向資料庫是把資料以「物件」的形式直接儲存與管理的資料庫。每個物件封裝了狀態（屬性）與行為（方法），屬於某個類別，具有系統自動產生、永不改變的物件識別碼（OID），物件之間可以用 OID 直接互相參照，並支援類別階層、繼承與多型。它與物件導向程式語言（Java、C++ 等）採用相同的資料模型，程式中的物件可以不經過「物件—關聯對映」直接持久化，避免阻抗不匹配（impedance mismatch）。

### （二）適合的資料類型（任選三種）

1. 電腦輔助設計／製造資料（CAD／CAM、建築、電路圖）：結構是階層式的零件組合，需整份載入、反覆導覽。
2. 多媒體資料（影像、音訊、影片、地理資訊 GIS）：資料是大型物件，且有專屬的處理方法（播放、縮放、疊圖）。
3. 複雜的巢狀結構資料：例如工程材料清單（BOM）、文件結構、生物資訊（蛋白質結構）。
4. 即時、嵌入式、通信網路管理資料：需快速以指標式方式存取關聯物件。

共同特性是資料結構複雜、階層深、需要使用者自訂型態與行為，若用關聯式要拆成許多表格並大量 JOIN，效率差。

### （三）關聯式與物件導向元素的對應

| 關聯式元素 | 物件導向資料庫的對應元素 |
|---|---|
| 表格（Table） | 類別（Class）；或某類別所有物件的集合（Extent） |
| 值組（Row／Tuple） | 物件（Object／Instance） |
| 主鍵（Primary Key） | 物件識別碼 OID（系統產生、不可變；另可宣告 key 作為商業鍵） |
| 屬性（Attribute） | 屬性（Attribute／Instance variable） |
| 預儲程序（Stored Procedure） | 方法（Method／Operation），隨類別封裝並可被子類別繼承 |

### （四）繼承的規則

繼承（inheritance）是由「一般」的上層類別（超類別，superclass）衍生出「特殊」的下層類別（子類別，subclass）：

1. 子類別自動擁有超類別所有的屬性與方法，不必重複定義。
2. 子類別可以新增自己專屬的屬性與方法（擴充）。
3. 子類別可以覆寫（override）超類別的方法，使同名方法在不同類別有不同實作（多型）。
4. 子類別的物件同時也是超類別的物件（is-a 關係），因此可以出現在要求超類別物件的任何地方；超類別的 Extent 包含所有子類別的物件。
5. 繼承具傳遞性：孫類別會繼承祖先類別的全部特徵；若支援多重繼承，子類別有多個超類別，須有規則解決同名屬性或方法的衝突（如指定優先順序、明確限定名稱）。

例如：「人員」類別有姓名、生日、年齡計算方法；「學生」繼承人員，再新增學號與選課方法；「研究生」再繼承學生，新增指導教授。

### （五）四種屬性

| 屬性種類 | 意涵 | 例子 |
|---|---|---|
| 基本屬性 Primitive | 單一、不可再分的原子值，型態為整數、字串、日期等基本型態 | 員工.薪水 ＝ 52000 |
| 複合屬性 Complex | 值本身由多個欄位（結構）組成，或其值是另一個物件（參照到其他類別） | 員工.地址 ＝ (縣市, 路, 號)；或員工.所屬部門 ＝ 指向部門物件的 OID |
| 集合屬性 Set | 一個屬性的值是同型態值的集合（set、bag、list、array），元素為基本型態 | 員工.電話 ＝ {0912…, 02…}；員工.專長 ＝ {Java, SQL} |
| 複合集合屬性 Complex Set | 屬性值是「複合值（結構或物件參照）的集合」 | 員工.眷屬 ＝ {(姓名, 關係, 生日), …}；部門.成員 ＝ {指向員工物件的 OID 集合} |

這些屬性使 OODB 能直接表達關聯式模型第一正規化所禁止的「多值、巢狀」結構。`

      question: `資料庫正規化（Normalization）是很重要的資料塑模（Data Modeling）方法，請回答下列相關問題：

（二）請敘述第一正規化形式（1NF）的規則，並舉一個不符合 1NF 的資料表例子。（4 分）
（三）請敘述第二正規化形式（2NF）的規則，並舉一個不符合 2NF 的資料表例子。（5 分）
（四）請敘述第三正規化形式（3NF）的規則，並舉一個不符合 3NF 的資料表例子。（4 分）
（五）請敘述 BCNF（Boyce-Codd Normal Form）正規化形式的規則。（4 分）`,
      answer: `### （一）正規化的目的

正規化是依功能相依（FD）逐步分解關聯綱要的過程，目的有三：

1. 消除資料冗餘，節省儲存空間，並讓同一個事實只存一處。
2. 避免更新異常：修改異常（改一處漏改他處造成不一致）、新增異常（沒有某資訊就無法新增另一資訊）、刪除異常（刪一筆資料連帶失去不相干的資訊）。
3. 讓每個表格只描述一個主題，結構清楚、易於維護，並且分解必須無損（lossless join），盡量保持相依（dependency preserving）。

### （二）1NF

規則：每個屬性的值都必須是不可再分的原子值（atomic）；不得有多值屬性、複合屬性或巢狀表格（重複群組），且每列要能以主鍵識別。

不符合 1NF 的例子（學生的電話欄位放了多個值）：

| 學號 | 姓名 | 電話 |
|---|---|---|
| S01 | 王小明 | 0912-111111, 02-22223333 |
| S02 | 李小華 | 0933-444444 |

修正：把電話拆成另一個表格 StudentPhone(學號, 電話)，主鍵為 (學號, 電話)；或每支電話一列。

### （三）2NF

規則：先符合 1NF，且每個非主屬性（不屬於任何候選鍵的屬性）都「完全功能相依」於每一個候選鍵，也就是不可有「部分相依」——非主屬性不能只相依於候選鍵的一部分。只有複合鍵的表才可能違反 2NF。

不符合 2NF 的例子：

| 學號 | 課號 | 學生姓名 | 成績 |
|---|---|---|---|
| S01 | C1 | 王小明 | 90 |
| S01 | C2 | 王小明 | 85 |
| S02 | C1 | 李小華 | 77 |

候選鍵為 (學號, 課號)。FD：學號 → 學生姓名（只相依於鍵的一部分，部分相依），(學號, 課號) → 成績。學生姓名重複儲存，違反 2NF。修正：分成 Student(學號, 學生姓名) 與 Enroll(學號, 課號, 成績)。（本例以程式驗算：候選鍵 (學號, 課號)，不符合 2NF；分解後兩表皆符合 BCNF。）

### （四）3NF

規則：先符合 2NF，且沒有非主屬性「傳遞相依」於候選鍵。等價定義：對每個非平凡 FD X → A，必須 X 是超鍵，或 A 是主屬性。

不符合 3NF 的例子：

| 員工編號 | 姓名 | 部門編號 | 部門名稱 |
|---|---|---|---|
| E1 | 甲 | D1 | 研發部 |
| E2 | 乙 | D1 | 研發部 |
| E3 | 丙 | D2 | 業務部 |

候選鍵為員工編號。員工編號 → 部門編號，部門編號 → 部門名稱，所以部門名稱「傳遞相依」於員工編號（部門編號不是超鍵，部門名稱也不是主屬性），同一部門名稱重複出現。修正：Employee(員工編號, 姓名, 部門編號) 與 Department(部門編號, 部門名稱)。

### （五）BCNF

規則：對關聯中每一個非平凡的功能相依 X → Y，X 必須是超鍵（superkey）。也就是說，所有決定因素（determinant）都必須是候選鍵（不再有「主屬性相依於非超鍵」的例外）。

BCNF 比 3NF 更嚴格：每個 BCNF 必為 3NF，反之不然。3NF 允許 X → A 在 A 為主屬性時成立，BCNF 不允許。典型反例：Teach(學生, 課程, 教師)，FD：(學生, 課程) → 教師，教師 → 課程（一位教師只教一門課）。候選鍵為 (學生, 課程) 與 (學生, 教師)，教師 → 課程中課程是主屬性，所以符合 3NF，但教師不是超鍵，違反 BCNF；分解為 (教師, 課程) 與 (學生, 教師)，代價是 (學生, 課程) → 教師 這條 FD 無法在單一表格內檢查（失去相依保持）。（以程式驗算：此例候選鍵為 (學生, 課程)、(學生, 教師)，符合 3NF 但不符合 BCNF。）`

      score: 20,
      question: `在多使用者多工的資料庫管理系統，多個交易（Transactions）在同步執行時，有可能發生資料讀取之難題。請回答下列相關問題：
（一）請敘述何謂交易？（4 分）
（二）請敘述何謂更新遺失（Lost Updates）的難題？（4 分）
（三）請敘述何謂讀到髒資料（Dirty Read）的難題？（4 分）
（四）請敘述何謂無法重複讀取（Non-Repeatable Read）難題？（4 分）
（五）同步控制方法（Concurrency Control Method）可運用來解決前述的難題。其中有一種以鎖為基礎之協定（Lock-Based Protocol），請敘述其運作機制。（4 分）`,
      answer: `### （一）交易（Transaction）

交易是資料庫管理系統中不可分割的一組邏輯工作單元，包含一個或多個對資料庫的讀寫操作，從 BEGIN 開始，以 COMMIT（全部生效）或 ROLLBACK（全部撤銷）結束。交易必須具備 ACID 特性：原子性（Atomicity，全做或全不做）、一致性（Consistency，由一致的狀態轉到另一個一致的狀態）、隔離性（Isolation，並行執行的結果等同某個序列執行）、持久性（Durability，commit 後的結果永久保存）。例如轉帳：扣款與入帳必須同時成功或同時失敗。

### （二）更新遺失（Lost Update）

兩個交易讀取同一資料，各自依舊值計算後再寫回，後寫入的覆蓋先寫入的，使先寫入的更新「消失」。例：帳戶 X 餘額 100。

\`\`\`text
時間  T1              T2
t1    read(X) = 100
t2                    read(X) = 100
t3    X = 100 + 50
t4    write(X) = 150
t5                    X = 100 + 20
t6                    write(X) = 120    ← T1 的 +50 遺失
結果 X = 120，正確應為 170。
\`\`\`

### （三）讀到髒資料（Dirty Read，又稱 temporary update）

一個交易讀到另一個尚未 commit 的資料；若對方之後 rollback，讀到的值就是從未真正存在過的「髒」值。

\`\`\`text
時間  T1                  T2
t1    write(X) = 500
t2                        read(X) = 500   ← 讀到未提交的值
t3    rollback (X 回復 100)
T2 依據 500 做的計算或決策是錯的。
\`\`\`

### （四）無法重複讀取（Non-Repeatable Read）

同一個交易在執行過程中，對同一筆資料讀兩次，卻得到不同的值，因為中間有其他交易更新並已 commit。

\`\`\`text
時間  T1                  T2
t1    read(X) = 100
t2                        write(X) = 200; commit
t3    read(X) = 200       ← 同一交易兩次讀取結果不同
\`\`\`

（相近的幻讀 Phantom Read 則是同一查詢第二次執行時多出或少了符合條件的列。）

### （五）以鎖為基礎之協定（Lock-Based Protocol）

運作機制：交易要存取資料項前，必須先向鎖管理員（lock manager）取得適當的鎖，用完後釋放。

1. 鎖的種類：共享鎖 S（Shared，讀鎖）與互斥鎖 X（Exclusive，寫鎖）。
2. 相容性：S 與 S 相容（多人可同時讀）；S 與 X、X 與 X 不相容，要求不相容鎖的交易必須等待。

| 已持有＼要求 | S | X |
|---|---|---|
| S | 允許 | 等待 |
| X | 等待 | 等待 |

3. 兩階段鎖定協定（2PL）：每個交易分為成長階段（只能取得鎖，不能釋放）與收縮階段（只能釋放，不能再取得）；一旦釋放了任何鎖就不能再加鎖。遵守 2PL 可保證排程可序列化（serializable）。嚴格 2PL（Strict 2PL）要求 X 鎖保持到 commit／rollback 才釋放，可避免髒讀與連鎖回復。
4. 對前述難題的效果：更新遺失例中，T1、T2 都先取 S 鎖再升級為 X 鎖，會互相等待而形成死結，系統偵測後犧牲其中一個交易，避免了遺失更新；髒讀因 X 鎖保持到 commit，T2 的 S 鎖要等 T1 結束才取得；不可重複讀取因 T1 的 S 鎖持續到結束，T2 無法取得 X 鎖寫入。
5. 副作用與處理：可能發生死結（deadlock），須以預防（如 wait-die、wound-wait）、偵測（wait-for graph 找環並犧牲交易）或逾時處理；也可能發生飢餓（starvation）。`
    },
    {
      id: "loc3-db-110-5", no: "五", topic: "sec", topicName: "資料庫應用",
      title: "參與限制、基數限制、View、外來鍵、叢集索引",
      score: 20,
      question: `資料庫領域有許多專門術語，請敘述下列術語之意涵：
（一）參與限制（Participation Constraint）（4 分）
（二）基數限制（Cardinality Constraint）（4 分）
（三）View（4 分）
（四）外來鍵（Foreign Key）（4 分）
（五）叢集索引（Clustered Index）（4 分）`,
      answer: `### （一）參與限制（Participation Constraint）

指實體集合中的實體是否「一定要」參與某個關係集合。分為全部參與（total participation，必須參與，ER 圖以雙線表示，等於最小基數 ≥ 1）與部分參與（partial participation，可以不參與，單線，最小基數 0）。例：每位員工都必須隸屬某部門（員工對 works_for 為全部參與）；但並非每位員工都是部門主管（員工對 manages 為部分參與）。轉成關聯綱要時，全部參與通常用外來鍵 NOT NULL 表示。

### （二）基數限制（Cardinality Constraint）

指一個實體可以透過某個關係與另一實體集合中的幾個實體相連，常以對應比率 1:1、1:N、M:N 表示，或用 (min, max) 標示最小與最大參與次數。例：一個部門有多位員工，一位員工只屬於一個部門，為 1:N；員工與計畫為 M:N。基數限制決定關聯綱要的設計：1:N 在 N 側加外來鍵，M:N 需獨立的關聯表格。

### （三）View（視界、檢視表）

View 是由 SELECT 查詢定義出來的虛擬表格，本身通常不存放資料（只存查詢定義），每次使用時才由底層的基底表格（base table）動態計算。用途：簡化複雜查詢、提供資料安全（只開放部分欄位或列給使用者）、提供邏輯資料獨立性（基底表結構改變時，只需改 view 定義）。

\`\`\`sql
CREATE VIEW CS_Staff AS
SELECT ID, name, salary FROM Employee WHERE dept = 'CS';
\`\`\`

簡單的 view（單一表、含主鍵、未使用彙總）通常可更新；含 GROUP BY、DISTINCT、彙總函數或多表連接的 view 一般不可更新。

### （四）外來鍵（Foreign Key）

某關聯 R1 中的一個（或一組）屬性 FK，其值必須對應到另一個關聯 R2 的主鍵（或候選鍵）的現有值，或為 NULL。它用來表達表格間的參考關係並維護參考完整性（referential integrity）：不能新增指向不存在 R2 值組的 FK 值，刪除或更新被參考的列時須遵循 RESTRICT、CASCADE、SET NULL 等規則。

\`\`\`sql
CREATE TABLE Employee (
  ssn INT PRIMARY KEY,
  dno INT,
  FOREIGN KEY (dno) REFERENCES Department(dnum)
    ON DELETE SET NULL ON UPDATE CASCADE
);
\`\`\`

### （五）叢集索引（Clustered Index）

叢集索引的索引鍵順序與資料列在磁碟上的實體存放順序一致（資料列依索引鍵排序存放，如 InnoDB 的主鍵索引，葉節點就是資料列本身）。每個表格最多只能有一個叢集索引。優點：依索引鍵做範圍查詢（BETWEEN）與排序時，相鄰資料在相鄰的磁碟頁，讀取 I/O 少。缺點：插入、更新索引鍵時可能需搬移資料列或造成頁面分裂。相對地，非叢集索引（nonclustered／secondary index）的葉節點存放索引鍵與指向資料列（或主鍵值）的指標，可有多個，資料實體順序與索引無關。`

      answer: `### 一、ER 模型中有關實體間對應的兩個限制

1. 基數比限制（Cardinality Ratio／Mapping Cardinality）：一個實體可以經由關係與多少個另一實體集合的實體相連，分成 1:1、1:N（N:1）、M:N 三種。例：部門與員工為 1:N（一個部門有多位員工，一位員工只屬一個部門）；員工與計畫為 M:N。
2. 參與限制（Participation Constraint）：實體集合中的每一個實體是否都必須參與該關係。全部參與（total，雙線，最小基數 ≥ 1）：每位員工都必須隸屬某個部門；部分參與（partial，單線，最小基數 0）：不是每位員工都管理一個部門。

（亦可合併表示為結構限制 (min, max)：min 對應參與限制，max 對應基數限制。）

### 二、關聯模型的三個限制

| 限制 | 內容 | 例子 |
|---|---|---|
| 值域限制（Domain Constraint） | 每個屬性值必須是其值域中的原子值（型態、範圍、是否可為 NULL 等） | 年齡 INT 且大於 0；性別只能是 M 或 F |
| 實體完整性（Entity Integrity，含鍵限制） | 主鍵值不可為 NULL；任兩個值組的鍵值不可重複（唯一性） | 員工編號是主鍵，不可為空且不可重複 |
| 參考完整性（Referential Integrity） | 外來鍵的值必須是被參考關聯中現存的主鍵值，或為 NULL | 員工.部門代碼必須存在於部門.部門代碼 |

（教科書另將「鍵限制」獨立為一項：不同值組的候選鍵值不同；這裡將其併入實體完整性。亦有將應用語意相關的限制稱為語意完整性限制，如以觸發器、CHECK 實作。）

### 三、關聯模型如何表示 ER 的兩個限制

以部門 Department(dept_id, dept_name)、員工 Employee 為例。

1. 1:N 基數比：把「1」方的主鍵放進「N」方當外來鍵（外來鍵所在的表就是 N 方）。
2. 1:1 基數比：任一方放外來鍵，並加上 UNIQUE（限制每個值只出現一次）；常放在全部參與的一方。
3. M:N 基數比：另建一個關聯表格，包含兩邊的主鍵作為外來鍵，兩者合成主鍵（如 Works_on(emp_id, proj_id, hours)）。
4. 全部參與：外來鍵宣告 NOT NULL（每個員工必須有部門）；部分參與：外來鍵允許 NULL。M:N 關係的全部參與，無法用單純的欄位限制表達，須用 CHECK／斷言（ASSERTION）或觸發器（TRIGGER）、或由應用程式／交易確保。

\`\`\`sql
CREATE TABLE Department (
  dept_id   INT PRIMARY KEY,            -- 實體完整性
  dept_name VARCHAR(30) NOT NULL        -- 值域限制
);
CREATE TABLE Employee (
  emp_id   INT PRIMARY KEY,
  emp_name VARCHAR(30) NOT NULL,
  dept_id  INT NOT NULL,                -- NOT NULL：員工對 works_for 為全部參與
  FOREIGN KEY (dept_id) REFERENCES Department(dept_id)  -- 1:N 與參考完整性
);

      score: 20,
      question: `在資料庫的實作及環境中，同步控制（Concurrency Control）在交易（Transactions）處理是很重要的技術，請論述兩階段鎖定（Two-phase Locking）與時戳（Timestamps）技術及其不同處。（20 分）`,
      answer: `### 一、同步控制的目標

多個交易並行時，要確保排程可序列化（serializable，結果等同某個一次一個交易的序列執行），以避免更新遺失、髒讀、不可重複讀取等問題。兩階段鎖定與時戳排序是兩種保證可序列化的主要技術。

### 二、兩階段鎖定（Two-Phase Locking，2PL）

1. 每個交易存取資料項前先取得鎖：讀取要共享鎖 S，寫入要互斥鎖 X（S 與 S 相容，其餘不相容，衝突者等待）。
2. 兩階段：成長階段（growing）只取得鎖、不釋放；收縮階段（shrinking）只釋放、不再取得。第一次釋放鎖的時間點稱為鎖定點（lock point）。只要所有交易都遵守兩階段，排程必可序列化，且等價的序列順序就是各交易鎖定點的順序。
3. 變形：嚴格 2PL（X 鎖保留到 commit／abort，避免連鎖回復）、嚴謹（rigorous）2PL（所有鎖保留到結束）、保守（conservative）2PL（開始前一次鎖住所有資料項，可免死結，但不易實施）。
4. 缺點：會等待、可能發生死結（deadlock）與飢餓；死結以預防（wait-die、wound-wait）、偵測（wait-for graph 找環並犧牲一個交易）或逾時處理。

### 三、時戳排序（Timestamp Ordering，TO）

1. 每個交易 T 開始時取得唯一的時戳 TS(T)（如系統時間或遞增計數器），年輕的交易時戳較大。每個資料項 X 記錄 read_TS(X)（讀過 X 的最大交易時戳）與 write_TS(X)（寫過 X 的最大交易時戳）。
2. 排程必須等價於「依時戳由小到大序列執行」。規則：
   - T 讀 X：若 write_TS(X) > TS(T)，表示 X 已被較年輕的交易寫過，T 讀不到應看到的舊值，T 中止（abort）並以新時戳重新啟動；否則執行讀取，並設 read_TS(X) ＝ max(read_TS(X), TS(T))。
   - T 寫 X：若 read_TS(X) > TS(T) 或 write_TS(X) > TS(T)，T 中止重啟；否則執行寫入，並設 write_TS(X) ＝ TS(T)。（Thomas 寫入規則：若僅 write_TS(X) > TS(T) 而 read_TS(X) ≤ TS(T)，這個寫入已被「覆蓋」，可忽略而不必中止 T。）
3. 特性：不使用鎖，交易不會等待，所以不會死結；但衝突時以中止重啟解決，可能有重啟（饑餓）與連鎖回復（除非採嚴格版，寫入需等先前寫入的交易 commit）。

### 四、同一個衝突在兩種方法下的不同處理（以程式模擬驗算）

設 T1 的時戳為 1、T2 為 2（T1 較老），排程：r2(X)、w1(X)。

\`\`\`text
時戳排序：T2 讀 X 後 read_TS(X)=2；T1 要寫 X，read_TS(X)=2 > TS(T1)=1
          → T1 中止並以新時戳重啟（不等待）。
兩階段鎖定：T2 讀 X 取得 S 鎖；T1 要寫 X 要 X 鎖，與 T2 的 S 鎖不相容
          → T1 等待，直到 T2 結束釋放鎖後再寫。
\`\`\`

### 五、比較

| 項目 | 兩階段鎖定 2PL | 時戳排序 TO |
|---|---|---|
| 控制方式 | 悲觀：以鎖限制衝突操作，等待 | 悲觀：依事先決定的時戳順序檢查，違反就中止 |
| 序列化順序 | 由鎖定點的順序決定，執行時才定 | 由交易開始時的時戳事先決定 |
| 衝突處理 | 等待（blocking） | 中止並重啟（rollback） |
| 死結 | 可能發生，需偵測或預防 | 不會死結 |
| 額外資料 | 鎖表 | 每個資料項的 read_TS、write_TS |
| 適用情境 | 衝突頻繁、交易長時較穩定 | 衝突少、唯讀交易多時效率佳；衝突多時重啟成本高 |
| 其他 | 有 Strict 2PL 防連鎖回復 | 可用 Thomas 寫入規則減少中止 |

兩者可序列化的集合並不相同：有些排程 2PL 允許但 TO 不允許，反之亦然。`

      answer: `### 一、臉書與 Line 資料的特性（設計前先掌握）

| 特性 | 說明 | 對設計的影響 |
|---|---|---|
| 巨量（Volume） | 數十億使用者、每日數十億則貼文與訊息 | 需水平擴充（sharding、分散式儲存），不適合單一伺服器 |
| 快速產生（Velocity） | 訊息與動態即時寫入，寫入量大於修改 | 偏重寫入吞吐量；以追加（append）為主 |
| 多樣（Variety） | 文字、貼圖、表情符號、圖片、影片、連結；多語言（中文需斷詞） | 半結構化與非結構化資料，欄位彈性 |
| 關係網路 | 朋友、群組、按讚、標記、轉分享 | 社群圖（graph）結構，需要走訪關係 |

### 二、資料庫設計過程（Database Design Process）

1. 需求蒐集與分析（Requirements Collection and Analysis）
   - 與商業與資料科學人員訪談，確認目標：以 AI 從貼文與訊息中發掘關鍵詞，分析使用者（及其親友）對產品的偏好。

   - 非功能需求：資料量與成長率、可用性、查詢延遲、隱私法規（個資法、GDPR）。
2. 概念設計（Conceptual Design）
   - 與具體 DBMS 無關，以 ER／EER 表示：實體 USER、POST／MESSAGE、KEYWORD、PRODUCT、GROUP；關係 FRIEND_OF（M:N，USER 對 USER 的遞迴關係）、WRITES（USER 1：N POST）、CONTAINS（POST M:N KEYWORD，屬性 weight、出現次數）、MENTIONS（POST M:N PRODUCT）、PREFERS（USER M:N PRODUCT，由模型推論，屬性 score）。

   - 選擇資料模型：因資料巨量、半結構化且是圖狀，採用多模型（polyglot persistence）：

|---|---|---|

| 訓練與測試集、特徵 | 欄式資料倉儲／Parquet 檔 | 批次掃描與分析 |

   - 關聯式部分的綱要（ER 轉換結果）：

| 表格 | 屬性 | 備註 |
|---|---|---|
| User | user_id (PK), anon_id, region, age_group | 去識別化，不存姓名電話 |
| Post | post_id (PK), user_id (FK), ts, lang, text_ref | 內文存放在文件庫或資料湖，此處放參照 |
| Keyword | kw_id (PK), word, lang | 斷詞與關鍵詞字典 |
| PostKeyword | post_id, kw_id (合成 PK), cnt, weight | M:N 關係 |
| Product | prod_id (PK), name, category | |
| Preference | user_id, prod_id (合成 PK), score, model_ver | 模型推論的偏好結果 |
| Dataset_Split | post_id (PK), split(train／valid／test), version | 固定資料集切分，確保可重現 |

4. 實體設計（Physical Design）
   - 分區與分片：依時間（月）與 user_id 雜湊分片；索引：Keyword.word 的索引、PostKeyword 以 kw_id 建索引、全文檢索（倒排索引）；複製（replication，3 份）以提高可用性與讀取吞吐量；冷熱分層（近期資料放 SSD、舊資料放物件儲存）；壓縮與欄式格式以加快訓練時的掃描。
   - 一致性取捨：貼文、按讚採最終一致性（BASE、CAP 中選 AP）；帳號與付費採強一致。
5. 實作與調校（Implementation and Tuning）
   - 建立 ETL 管線：爬取或 API 匯入 → 清理（去重、去除垃圾訊息、去識別）→ 斷詞與關鍵詞萃取 → 載入各儲存層；資料版本管理；建立訓練、驗證、測試集的切分（如 70／15／15，依使用者或時間切分避免資料洩漏）。

### 三、小結

設計順序是需求分析 → 概念設計 → 邏輯設計 → 實體設計 → 實作與調校。針對臉書與 Line，關鍵是承認其「巨量、高速、非結構化、關係網路」的特性，因此不是單一關聯式資料庫，而是以資料湖保存原始內容、NoSQL 儲存貼文訊息、圖資料庫儲存關係、關聯式資料庫保存主資料，並以 ETL 與資料集版本管理支援 AI 模型的訓練與測試，同時以去識別化與權限控管遵守隱私規範。`

    {
      id: "loc3-db-109-5", no: "五", topic: "sec", topicName: "資料庫應用",
      title: "關聯代數、關聯完全、SQL 與資料庫處理器如何處理查詢",
      score: 20,
      question: `在關聯式資料庫模型，何謂關聯代數（Relational Algebra）？為何需要關聯代數？何謂關聯完全（Relationally Complete）？又商業化的資料庫管理系統會用到的資料庫查詢語言是什麼？與關聯代數有何關係？資料庫處理器（Run-time Database Processor）如何處理此查詢語言？（20 分）`,
      answer: `### 一、何謂關聯代數

關聯代數是對關聯（relation，即值組的集合）進行運算的一組運算子，輸入是一個或兩個關聯，輸出仍是關聯，因此運算可以巢狀組合成任意複雜的查詢。它是程序式（procedural）的查詢語言：運算式指出「以什麼順序做哪些運算」。

| 類別 | 運算 | 符號與意義 |
|---|---|---|
| 基本運算 | 選擇 Select | σ_條件(R)：挑出符合條件的列 |
| | 投影 Project | π_屬性(R)：挑出指定的欄並去除重複 |
| | 聯集 Union | R ∪ S |
| | 差集 Difference | R − S |
| | 卡氏積 Cartesian product | R × S |
| | 重新命名 Rename | ρ |
| 衍生運算 | 交集、連接（Join）、自然連接、除法（Division） | 可由基本運算組成，但使用方便 |
| 擴充運算 | 彙總（Aggregation）、分組、外部連接、排序 | 使關聯代數可表達 SQL 的 GROUP BY 與聚合 |

例：「薪水超過 50000 的員工姓名」：π_name(σ_salary>50000(Employee))。

### 二、為何需要關聯代數

1. 形式基礎：給關聯模型一個嚴謹的數學定義，說明資料查詢的語意與可表達能力。
2. 查詢最佳化的基礎：DBMS 把查詢轉成代數運算式（查詢樹），再利用等價規則（例如先做選擇再連接、先投影以縮小中間結果、連接順序重排）改寫成成本較低的等價運算式。
3. 衡量語言能力：以它作為標準，判斷其他查詢語言夠不夠強（見下節）。
4. 內部執行：DBMS 的實體運算子（掃描、索引查找、巢狀迴圈／雜湊／合併連接、排序）直接對應代數運算。

### 三、關聯完全（Relationally Complete）

一個查詢語言若能表達所有可用關聯代數表達的查詢（等價於能表達所有安全的關聯演算查詢），就稱為關聯完全。這是衡量查詢語言表達能力的最低標準。Codd 證明關聯代數與（安全的）元組／領域關聯演算表達能力相同。SQL 是關聯完全的，並且更強：它另有聚合、分組、排序、空值、遞迴查詢（WITH RECURSIVE）等關聯代數基本運算子沒有的功能，所以要用「擴充的關聯代數」才對應得上。

### 四、商業 DBMS 的查詢語言：SQL 與關聯代數的關係

商業 DBMS 使用 SQL（Structured Query Language），它是宣告式（declarative）語言：使用者只說「要什麼」，不說「怎麼做」。SQL 的 SELECT-FROM-WHERE 區塊對應關聯代數：

\`\`\`text
SELECT name FROM Employee WHERE salary > 50000
        ⇒   π_name ( σ_salary>50000 ( Employee ) )

SELECT e.name, d.dname FROM Employee e, Department d WHERE e.dno = d.dnum AND d.dname = 'R&D'
        ⇒   π_e.name,d.dname ( σ_d.dname='R&D' ( Employee ⋈_e.dno=d.dnum Department ) )
\`\`\`

SELECT 對應投影 π、WHERE 對應選擇 σ、FROM 多表對應卡氏積或連接 ⋈、UNION／EXCEPT／INTERSECT 對應集合運算，GROUP BY 與聚合對應擴充運算。

### 五、資料庫處理器如何處理 SQL

\`\`\`text
SQL 查詢
  → ① 掃描、剖析與驗證（Scanner／Parser／Validator）：檢查語法，並檢查表格與欄位是否存在、型態是否相容
  → ② 轉成內部表示：查詢樹（query tree）或查詢圖，即擴充關聯代數運算式
  → ③ 查詢最佳化（Query Optimizer）：套用等價規則改寫（啟發式，如選擇與投影往下推），
       再依統計資訊（表大小、索引、選擇率）估計成本，選擇最便宜的連接順序與存取路徑，產生執行計畫（execution plan）
  → ④ 程式碼產生（Query Code Generator）：把執行計畫變成可執行的程式碼或運算子樹
  → ⑤ 執行階段資料庫處理器（Run-time Database Processor）：
       依計畫呼叫掃描、索引、連接、排序等實體運算子，以管線（pipelining）或具體化（materialization）傳遞中間結果，
       並透過儲存管理員、緩衝區與交易管理員（鎖、log）讀寫資料
  → 傳回結果給使用者
\`\`\`

因此執行階段處理器收到的不是 SQL 原文，而是由關聯代數運算式經過最佳化而得的執行計畫，並負責實際執行；若查詢出現錯誤（如執行期除以零、鎖逾時），則產生錯誤訊息並回復交易。`
    }
  ]
},

      question: `假設我們要設計某物流公司的資料庫，其中某事實是記錄其司機（Driver）每天使用某輛卡車（Truck）負責某趟運送（Delivery）。每趟運送剛好用到一部卡車；但出車時，有時會有雙司機出勤，輪流駕駛。司機有編號（ID）、姓名（Name）、薪水（Salary）的資料，卡車有牌照號碼（License_No）、品牌（Make）、款式（Model）、噸數（Tonnage）的資料，運送有運送編號（D_Number）、日期（Date）、送達地址（Address）、送達時間（Time）、載送內容（Content）的資料。圖一為實體關係圖（Entity-Relationship Diagram）。對所用符號的約略說明：其中每一實體鄰近某關係間均有一個對應比率（min,max），代表該實體參與該關係之 min（至少）、max（至多）次數，＊代表沒有限制。屬性劃實底線者為 Primary Key（主鍵）。請暫時不考慮其他實體、屬性，並假設所有對應比率均為正確反映該企業實況。欲記錄上述事實：
（一）請說明圖一的設計有何問題？（5 分）
（二）可否將圖一改為只有司機（Driver）與卡車（Truck）兩個實體，而將運送（Delivery）放在其中、當成關係？這樣的設計有何問題？（8 分）
（三）請提出改進版本。請注意：你的改進版本必須同時滿足「提供完整（Complete）的資訊，且無多餘的（Redundant）關係」的要求。（12 分）`,
      answer: `圖一為：Driver（ID、Name、Salary）—Drive（Driver 端 (1,*)、Truck 端 (0,*)）—Truck；Delivery—Is_for（Delivery 端 (1,1)、Truck 端 (0,*)）—Truck。Truck 實體上掛的屬性是 D_Number（主鍵）、Date、Address、Time、Content；Delivery 實體上掛的屬性是 License_No（主鍵）、Make、Model、Tonnage。

### （一）圖一的問題

1. 屬性掛錯實體（最嚴重）：D_Number、Date、Address、Time、Content 是「運送」的屬性，卻畫在 Truck 上；License_No、Make、Model、Tonnage 是「卡車」的屬性，卻畫在 Delivery 上。兩個實體的屬性整組互換，主鍵也跟著錯：Truck 的主鍵變成 D_Number（運送編號），Delivery 的主鍵變成 License_No（牌照號碼）。依此圖，同一輛卡車只能有一趟運送（License_No 在 Delivery 為主鍵，每筆 Delivery 的牌照不可重複），與 Is_for 的 (0,*) 互相矛盾。
2. 無法表示「某司機在某趟運送開某輛卡車」：Drive 只連 Driver 與 Truck，記錄的是「司機—卡車」的配對，沒有「運送」這一維。同一司機、同一卡車可以在不同天負責不同趟運送，Drive 無法區分這些趟次；Driver 與 Delivery 之間沒有任何直接關係，因此無從得知某趟運送由誰駕駛。
3. Drive 與 Is_for 資訊重複且不一致：運送與卡車的關係已由 Is_for 表示；若 Drive 又記司機與卡車，沒有機制保證司機—卡車的配對與各趟運送實際使用的卡車一致，造成冗餘與不一致的風險。
4. 對應比率與題意不符：題意為每趟運送至少 1 名、至多 2 名司機（雙司機輪流駕駛），但圖一中 Delivery 端沒有與司機相連的比率可表達 (1,2)；Drive 中 Driver (1,*)、Truck (0,*) 的比率表達的是司機與卡車的對應，並不是題目所要記錄的事實。另外 Driver 端 (1,*) 要求每位司機至少開過一輛卡車，新進尚未出車的司機無法先建檔，亦不合理（以題意，司機可為 (0,*)）。

### （二）改成只有 Driver 與 Truck 兩個實體、把 Delivery 當關係

做法：Delivery 成為 Driver 與 Truck 之間的關係（二元或再加上其他實體的三元關係），D_Number、Date、Address、Time、Content 變成關係的屬性。這樣在概念上能勉強記到「司機—卡車—運送」，但有下列問題：

1. 關係沒有自己的主鍵：關係實例由參與實體的主鍵組合 (ID, License_No) 唯一識別。同一司機在不同天駕駛同一輛卡車（很常見）會產生兩筆「相同的 (ID, License_No)」，在標準 ER 模型中同一組實體之間同一關係只能出現一次，因此無法表示多趟運送；若要硬分開，就得把 D_Number 或 Date 納入識別，等於又把運送當成實體。
2. 關係屬性太多、本身是獨立的事件：運送有編號、日期、地址、時間、內容，是一個有自己主鍵的獨立「事件」，本質上就是實體；關係一般只承載少量描述性屬性。
3. 不能再參與其他關係：關係不能再與其他實體（如客戶、收貨單、發票、貨物明細）建立關係或被聚合以外的方式引用；日後想記「某趟運送屬於哪位客戶」就會困難（只能用聚合，增加複雜度）。
4. 雙司機與「一趟一車」的限制難以表達：一趟運送若有 2 位司機，需要兩筆關係實例 (ID1, 卡車, D_Number)、(ID2, 卡車, D_Number)，同一趟的 Date、Address、Time、Content 與卡車牌照都要重複存兩次（冗餘），也無法保證兩筆的卡車一致，「每趟運送剛好用到一部卡車」這個限制不能由模型本身表達。若為三元關係，其比率還會被誤解為「Driver 與 Truck 兩端」的限制，語意不清。
5. 司機若尚未被指派運送（或運送尚未指派司機）時，資料無法存在，因為關係實例必須同時有參與者。

因此不建議這樣做，應保留 Delivery 為實體。

### （三）改進版本

做法：保留 Driver、Truck、Delivery 三個實體，各自的屬性放回正確位置，並重新建立關係：

- Delivery—Truck：Is_for（保留），Delivery 端 (1,1)、Truck 端 (0,*)，即每趟運送恰用一部卡車，一部卡車可負責 0 到多趟運送（1:N）。
- Driver—Delivery：新增「Drives（駕駛）」關係，M:N，Delivery 端 (1,2)（每趟至少 1 位、至多 2 位司機），Driver 端 (0,*)（司機可駕駛 0 到多趟運送）。
- 刪除原本的 Drive（Driver—Truck）：某司機開過哪些卡車，可由 Driver→Drives→Delivery→Is_for→Truck 推導出，若保留就是冗餘關係（且可能與 Delivery 的卡車不一致）。

**完整性檢查**：題目要記錄的事實是「司機—每天—卡車—某趟運送」。
- 哪個司機負責哪趟運送：Drives。
- 該趟運送用哪輛卡車：Is_for（每趟恰一輛）。
- 日期：Delivery.Date，因此「每天」可得。
- 雙司機：Drives 的 Delivery 端 (1,2)。
- 某司機某日開哪輛卡車：Driver ⋈ Drives ⋈ Delivery（Date）⋈ Truck 可得。

**無冗餘檢查**：三個實體之間只有兩個關係，沒有任何一個關係可以由另一個推導出來（Driver—Truck 的關係已刪除）。

轉為關聯綱要（MySQL）：

| 關聯 | 欄位 | 鍵 |
|---|---|---|
| Driver | ID、Name、Salary | 主鍵 ID |
| Truck | License_No、Make、Model、Tonnage | 主鍵 License_No |
| Delivery | D_Number、Date、Address、Time、Content、License_No | 主鍵 D_Number；License_No 外來鍵參考 Truck，NOT NULL（(1,1) 由 Is_for 合併入 Delivery） |
| Drives | D_Number、ID | 主鍵 (D_Number, ID)；D_Number 外來鍵參考 Delivery；ID 外來鍵參考 Driver |

\`\`\`sql
CREATE TABLE Driver (
  ID INT PRIMARY KEY, Name VARCHAR(50), Salary INT);
CREATE TABLE Truck (
  License_No VARCHAR(10) PRIMARY KEY, Make VARCHAR(30),
  Model VARCHAR(30), Tonnage DECIMAL(4,1));
CREATE TABLE Delivery (
  D_Number INT PRIMARY KEY, \`Date\` DATE, Address VARCHAR(100),
  \`Time\` TIME, Content VARCHAR(100),
  License_No VARCHAR(10) NOT NULL,
  FOREIGN KEY (License_No) REFERENCES Truck(License_No));
CREATE TABLE Drives (
  D_Number INT, ID INT,
  PRIMARY KEY (D_Number, ID),
  FOREIGN KEY (D_Number) REFERENCES Delivery(D_Number),
  FOREIGN KEY (ID) REFERENCES Driver(ID));
\`\`\`

說明：Delivery 端 (1,1) 對應 License_No NOT NULL 的外來鍵，一趟恰一部卡車；Drives 的 (1,2) 中「最多 2 位」無法以單純宣告式約束表達，需用觸發器或應用程式檢查（每個 D_Number 在 Drives 至多 2 列，至少 1 列由交易提交時檢查）。

|---|---|---|---|

| D2 | 2019-05-01 | T-200 | 1、2（雙司機輪流駕駛） |
| D3 | 2019-05-02 | T-100 | 2 |

### （一）王大維每門課的修課人數

\`\`\`sql
SELECT c.CNo, c.CName, COUNT(g.SNo) AS cnt
FROM Course c
LEFT JOIN Grade g ON g.CNo = c.CNo
WHERE c.Instructor = '王大維'
GROUP BY c.CNo, c.CName;
\`\`\`

用 LEFT JOIN 讓「開了但沒人修」的課程也列出（人數為 0）；COUNT(g.SNo) 只計算非 NULL 的修課紀錄，因此是 0 而不是 1。若題意只要「有人修的課」，改成 INNER JOIN 即可。實測結果：C1 資料庫 4 人（S1、S2、S4、S7）、C2 網路 2 人（S1、S2）、C5 空課 0 人。

FROM Student s
WHERE s.Major = 'MIS'

WHERE s.Major = 'MIS'
GROUP BY s.SID, s.Name
HAVING MIN(g.Score) >= 90;

WHERE c.Dept = 'Business'

      score: 20,
      question: `假設某資料庫管理系統採用時間戳記（Timestamp）來管理並行控制（Concurrency Control），它採用的不是基本的時間戳記排序，而是修改版的 Thomas 的編寫規則（Write Rule）。假設某交易 T 的時間戳記是 10010，請問下列情況，資料庫管理系統會如何處理？（每小題 5 分，共 20 分）
（一）欲寫某項目 X 時，得知 X 已有寫的時間戳記 write_TS(X) 是 10015
（二）欲寫某項目 X 時，得知 X 已有讀的時間戳記 read_TS(X) 是 10012
（三）欲讀某項目 X 時，得知 X 已有寫的時間戳記 write_TS(X) 是 10020
（四）欲讀某項目 X 時，得知 X 已有寫的時間戳記 write_TS(X) 是 10005`,
      answer: `### 規則（TS(T) ＝ 10010）

每個資料項 X 記錄 read_TS(X)（成功讀過 X 的最大交易時戳）與 write_TS(X)（成功寫過 X 的最大交易時戳）。修改版 Thomas 寫入規則：

| 操作 | 判斷順序 | 處理 |
|---|---|---|
| write(X) | 1. 若 read_TS(X) > TS(T) | 中止（abort）並回復 T，以新時戳重新啟動 |
| | 2. 否則若 write_TS(X) > TS(T) | 忽略這次寫入（Thomas 規則），T 繼續執行，不中止 |
| | 3. 其他 | 執行寫入，write_TS(X) ＝ TS(T) |
| read(X) | 1. 若 write_TS(X) > TS(T) | 中止並重啟 T |
| | 2. 否則 | 執行讀取，read_TS(X) ＝ max(read_TS(X), TS(T)) |

與基本時戳排序的唯一差別：基本版只要 write_TS(X) > TS(T) 也要中止 T；Thomas 規則認為若沒有較年輕的交易讀過 X（read_TS(X) ≤ TS(T)），則 T 的寫入在序列順序中本來就會被後來的 write_TS(X) 的那次寫入覆蓋，沒有人需要看到 T 的值，所以直接略過即可，減少不必要的中止。

### （一）write(X)，write_TS(X) ＝ 10015 > 10010

題目沒有給 read_TS(X)，依規則須先檢查它：
- 若 read_TS(X) ≤ 10010（一般合理的情況）：不符合第 1 條，進入第 2 條，write_TS(X)＝10015 > 10010，因此忽略此寫入（Thomas 規則），T 不中止，也不更新 write_TS(X)。這個情況正是修改版與基本版的差異（基本版會中止 T）。
- 若 read_TS(X) 也大於 10010（已有較年輕的交易讀過 X），則第 1 條成立，T 必須中止；此時不能適用 Thomas 規則。

### （二）write(X)，read_TS(X) ＝ 10012 > 10010

符合第 1 條：已有時戳較大（較年輕）的交易 10012 讀過 X。若讓 T 寫入，那個較年輕的交易讀到的就不是「時戳順序上應該看到的值」（它應該看到 T 寫的新值，卻讀了舊值），因此不能忽略也不能執行：T 中止並回復，取得新的（更大的）時戳後重新啟動。Thomas 規則在此不適用，因為忽略寫入會使 10012 的讀取失去依據。

### （三）read(X)，write_TS(X) ＝ 10020 > 10010

X 已被時戳較大（較年輕）的交易寫過，T 要讀的「時戳 10010 之前的版本」已被覆蓋，T 讀到的會是來自「未來」的值，違反時戳順序。因此中止 T 並以新時戳重啟（Thomas 規則只針對寫入，讀取沒有例外）。

### （四）read(X)，write_TS(X) ＝ 10005 ≤ 10010

X 最後是由時戳較小（較老）的交易寫入，讀取符合時戳順序，允許執行。讀取後 read_TS(X) ＝ max(原 read_TS(X), 10010)；write_TS(X) 不變（仍為 10005）。

### 彙總（已用 Python 依上述規則逐項驗算）

| 小題 | 條件 | 處理結果 |
|---|---|---|
| （一） | write；write_TS(X)＝10015 > TS(T)；（假設 read_TS(X) ≤ 10010） | 忽略寫入，T 繼續（若 read_TS(X) > 10010 則中止） |
| （二） | write；read_TS(X)＝10012 > TS(T) | 中止 T，重啟 |
| （三） | read；write_TS(X)＝10020 > TS(T) | 中止 T，重啟 |
| （四） | read；write_TS(X)＝10005 ≤ TS(T) | 允許讀取，read_TS(X)＝max(原值, 10010) |`

FD1： {A, E} → {B, G}
FD2： C → F
FD3： D → C
FD4： G → D`,
      answer: `### 第一部分：由資料判斷功能相依

原理：X → Y 成立的定義是「任兩列只要 X 值相同，Y 值就必須相同」。
- 只要找到一對值組在 X 相同但 Y 不同（反例），就能確認此 FD 不存在。
- 找不到反例，只代表「目前資料沒有違反，還有可能存在」；FD 是屬於綱要的語意限制，無法由有限筆資料證明它一定成立。

做法：對每個 FD，把四列兩兩比較（共 6 對：t1t2、t1t3、t1t4、t2t3、t2t4、t3t4），找出左邊相同的列對，再看右邊是否相同（以 Python 逐對檢查）。

| FD | 左邊相同的列對 | 右邊是否相同 | 結論 |
|---|---|---|---|
| （1）{D,E} → C | 只有 t3 與 t4：D 同為 d3，E 同為 e1（其他列對的 D、E 組合 (d1,e1)、(d2,e2) 皆不相同） | C：t3 為 c2，t4 為 c4，不同 | 可確認不存在（反例：t3、t4） |
| （2）{A,B} → D | 沒有任何列對。AB 組合為 (a1,b1)、(a1,b2)、(a2,b2)、(a3,b3)，四列皆不同；單獨看 A（t1、t2 皆 a1，但 B 不同）或 B（t2、t3 皆 b2，但 A 不同）也只是部分相同 | 無反例可比較（左邊都不重複，空洞地成立） | 還有可能存在（未被推翻，但資料並未真正支持它；{A,B} 目前在樣本中像是唯一值，可能是候選鍵之故） |
| （3）{E,F} → G | 只有 t1 與 t3：E 同為 e1，F 同為 f1（t4 的 F 是 f4，t2 是 e2、f2） | G：t1 為 g1，t3 為 g3，不同 | 可確認不存在（反例：t1、t3） |

說明：t1 與 t4 的 E 都是 e1，但 F 不同（f1 與 f4），所以不構成對 {E,F} 的反例；要兩個屬性同時相同才算，這是判斷複合左邊時常見的錯誤。

結論：（1）、（3）確認不存在；（2）有可能存在。

### 第二部分：以 Closure 找候選鍵

已知 R(A,B,C,D,E,F,G)，FD：
- FD1：AE → BG
- FD2：C → F
- FD3：D → C
- FD4：G → D

步驟一：找必含屬性。出現在任何 FD 右邊的屬性（B、G、F、C、D）都有可能被推導出來；沒有出現在任何右邊的屬性是 A 與 E，它們無法由其他屬性推導，因此 A 與 E 必定出現在每一個候選鍵中。

步驟二：計算 {A,E} 的閉包 (AE)+：

\`\`\`text
(AE)+ 初始      = {A, E}
套用 FD1 AE→BG  = {A, B, E, G}
套用 FD4 G→D    = {A, B, D, E, G}
套用 FD3 D→C    = {A, B, C, D, E, G}
套用 FD2 C→F    = {A, B, C, D, E, F, G}  ＝ R 全部屬性
\`\`\`

(AE)+ 包含 R 的所有屬性，所以 {A,E} 是超鍵。

步驟三：檢查最小性。
- A+ ＝ {A}（A 不是任何 FD 的左邊，所以只有自己）
- E+ ＝ {E}
兩者都不是超鍵，因此 {A,E} 不能再縮小，是候選鍵。

步驟四：唯一性。因為 A、E 必在每個候選鍵中，而 {A,E} 已經是超鍵，任何其他候選鍵都必定是 {A,E} 的超集合，不是最小，所以 R 的候選鍵只有一個：{A, E}。

已用 Python 對所有屬性子集窮舉驗證：滿足「閉包為全部屬性且最小」的只有 {A,E}。

| 屬性集 | 閉包 | 是否為超鍵 |
|---|---|---|
| {A} | {A} | 否 |
| {E} | {E} | 否 |
| {A,E} | {A,B,C,D,E,F,G} | 是（候選鍵） |
| 其他不含 A 或 E 的集合（如 {B,C,D,F,G}） | 永遠不含 A 或 E | 否 |

補充：此表有 C → F、D → C、G → D 的傳遞鏈（G → D → C → F），F、C、D 對候選鍵 AE 而言為傳遞相依，所以 R 不符合 3NF，若要正規化需分解（超出本題範圍）。`

| 階段 | 工作 | 以 AI 訓練與測試資料為例 |

| 1. 需求蒐集與分析 | 訪談使用者，確認資料來源、資料內容、使用者與查詢、效能與安全需求，產生需求規格書與資料流程 | 確認要訓練的模型（如醫療影像判讀）、需要哪些資料（影像、診斷標籤、病患去識別資料）、資料量與成長率、取用方式（批次讀取訓練） |

### 二、四項「好」的關聯式綱要設計原則（Elmasri／Navathe 的非形式化設計準則）

1. 清楚的屬性語意：每個關聯綱要應只描述一種實體或一種關係，屬性意義清楚；不要把多種實體混在同一個表格（如把員工與部門資料混在一起）。
2. 降低值組中的冗餘資訊（避免更新異常）：同一事實只存放一次，避免插入、刪除、修改異常；做法是依功能相依正規化（如 3NF／BCNF）。例：部門名稱不應在每位員工的列重複存放。
3. 降低值組中的 NULL 值：避免把很少使用的屬性放在大表，空值浪費空間，而且連接、彙總時語意不清；可把這些屬性放在另一個表。
4. 不允許產生假值組（spurious tuples，即分解必須無損連接）：分解後做自然連接要能還原原關聯，不能多出不存在的資料；分解時須保證共同屬性是其中一個關聯的鍵（lossless join），並盡量保持功能相依（dependency preservation）。

（亦可補充：不使用冗餘屬性做連接、使用正確的資料型態與限制。）`

轉換規則：

1. 每個強實體各成一個關聯：EMPLOYEE(ssn, ename)、DEPARTMENT(dnum, dname)，主鍵照圖。
2. 1:N 關係 works-for：把 1 端（DEPARTMENT）的主鍵 dnum 放進 N 端（EMPLOYEE）當外來鍵，不另建表。因為一位員工只屬於一個部門，這個欄位是單值。
3. 多值屬性 locations（雙橢圓）：關聯式模型的欄位必須是單值，所以另建一個關聯 DEPT_LOCATIONS，放 dnum（外來鍵）與 location，兩者合成主鍵。一個部門有幾個地點就有幾列。

結果：

\`\`\`text
EMPLOYEE       (ssn, ename, dnum)        主鍵 ssn；FK: dnum → DEPARTMENT.dnum
DEPARTMENT     (dnum, dname)             主鍵 dnum
DEPT_LOCATIONS (dnum, location)          主鍵 (dnum, location)；FK: dnum → DEPARTMENT.dnum
\`\`\`

| 關聯 | 屬性 | 主鍵 | 外來鍵 |
| --- | --- | --- | --- |
| EMPLOYEE | ssn, ename, dnum | ssn | dnum → DEPARTMENT(dnum) |
| DEPARTMENT | dnum, dname | dnum | 無 |
| DEPT_LOCATIONS | dnum, location | (dnum, location) | dnum → DEPARTMENT(dnum) |

\`\`\`sql
CREATE TABLE DEPARTMENT (
    dnum  INT         NOT NULL,
    dname VARCHAR(50) NOT NULL,
    PRIMARY KEY (dnum)
);

CREATE TABLE EMPLOYEE (
    ssn   CHAR(9)     NOT NULL,
    ename VARCHAR(50) NOT NULL,
    dnum  INT,
    PRIMARY KEY (ssn),
    FOREIGN KEY (dnum) REFERENCES DEPARTMENT (dnum)
        ON DELETE SET NULL
        ON UPDATE CASCADE
);

CREATE TABLE DEPT_LOCATIONS (
    dnum     INT         NOT NULL,
    location VARCHAR(50) NOT NULL,
    PRIMARY KEY (dnum, location),
    FOREIGN KEY (dnum) REFERENCES DEPARTMENT (dnum)
        ON DELETE CASCADE
        ON UPDATE CASCADE
);
\`\`\`

轉換規則：

1. 兩個強實體各成一個關聯：EMPLOYEE(ssn, ename)、PROJECT(pnum, pname)。
2. M:N 關係 works-on 一定要獨立成一個關聯（關聯表／交叉表）：欄位為兩端的主鍵 ssn、pnum（各自為外來鍵，合成主鍵），再加上關係本身的屬性 hours。
3. hours 是「某員工在某計畫上的時數」，同時依賴 ssn 與 pnum，不屬於任何一個實體，所以只能放在 works-on 中。

結果：

\`\`\`text
EMPLOYEE (ssn, ename)                主鍵 ssn
PROJECT  (pnum, pname)               主鍵 pnum
WORKS_ON (ssn, pnum, hours)          主鍵 (ssn, pnum)；FK: ssn → EMPLOYEE.ssn；FK: pnum → PROJECT.pnum
\`\`\`

| 關聯 | 屬性 | 主鍵 | 外來鍵 |
| --- | --- | --- | --- |
| EMPLOYEE | ssn, ename | ssn | 無 |
| PROJECT | pnum, pname | pnum | 無 |
| WORKS_ON | ssn, pnum, hours | (ssn, pnum) | ssn → EMPLOYEE(ssn)；pnum → PROJECT(pnum) |

\`\`\`sql
CREATE TABLE PROJECT (
    pnum  INT         NOT NULL,
    pname VARCHAR(50) NOT NULL,
    PRIMARY KEY (pnum)
);

CREATE TABLE WORKS_ON (
    ssn   CHAR(9)      NOT NULL,
    pnum  INT          NOT NULL,
    hours DECIMAL(4,1),
    PRIMARY KEY (ssn, pnum),
    FOREIGN KEY (ssn)  REFERENCES EMPLOYEE (ssn) ON DELETE CASCADE ON UPDATE CASCADE,
    FOREIGN KEY (pnum) REFERENCES PROJECT (pnum) ON DELETE CASCADE ON UPDATE CASCADE
);

## 三、(三) 參與限制在關聯式模型的表示（6 分）

參與限制說明實體是否一定要參與某個關係：

- 選擇性（Optional，部分參與）：實體可以不參與關係，ER 圖用單線，(min=0)。
- 必須（Mandatory，全部參與）：每個實體實例都必須參與至少一次關係，ER 圖用雙線，(min=1)。

關聯式模型沒有直接對應的「雙線」語法，是靠外來鍵欄位的 NULL 限制與參考完整性規則來表達：

| 情形 | Optional（部分參與） | Mandatory（全部參與） |
| --- | --- | --- |
| 1:N，外來鍵所在的 N 端（如員工必須屬於一個部門） | 外來鍵欄位允許 NULL（可以沒有所屬部門） | 外來鍵欄位宣告 NOT NULL，且外來鍵限制要存在（每位員工必須有部門） |
| 刪除 1 端時（刪部門）對 N 端的處理 | ON DELETE SET NULL（員工變成無部門） | ON DELETE RESTRICT／NO ACTION（有員工就不准刪），或 CASCADE（連員工一起刪）；不可用 SET NULL，因為欄位是 NOT NULL |
| M:N 關聯表（works-on）的兩個外來鍵 | 外來鍵本來就在主鍵內，必為 NOT NULL，這是關聯表的結構規定，不是在表達參與限制 | 同左；關聯表不存在列就代表沒參與，所以「必須參與」要另外檢查 |
| 1 端的必須參與（每個部門至少要有一位員工；每位員工至少參加一個計畫） | 不需處理 | 外來鍵無法表達（外來鍵只保證「子表有值必有父表」，不保證「父表必有子表」），需靠觸發器（trigger）、交易內同時新增、延遲約束或應用程式檢查 |
| 弱實體（如分館依附博物館、DEPT_LOCATIONS 依附部門） | 不適用 | 外來鍵 NOT NULL 且在主鍵內，ON DELETE CASCADE（擁有者刪除，弱實體一併刪除） |

Mandatory 的 CREATE TABLE 寫法（員工必須屬於一個部門）與 Optional 對照：

\`\`\`sql
-- Optional：員工可以暫時沒有部門
CREATE TABLE EMPLOYEE (
    ssn   CHAR(9)     NOT NULL,
    ename VARCHAR(50) NOT NULL,
    dnum  INT NULL,
    PRIMARY KEY (ssn),
    FOREIGN KEY (dnum) REFERENCES DEPARTMENT (dnum) ON DELETE SET NULL
);

-- Mandatory：員工一定要有部門
CREATE TABLE EMPLOYEE (
    ssn   CHAR(9)     NOT NULL,
    ename VARCHAR(50) NOT NULL,
    dnum  INT NOT NULL,
    PRIMARY KEY (ssn),
    FOREIGN KEY (dnum) REFERENCES DEPARTMENT (dnum) ON DELETE RESTRICT
);
\`\`\`

結論：外來鍵欄位 NULL／NOT NULL 表示 N 端的 Optional／Mandatory；ON DELETE 的行為（SET NULL、RESTRICT、CASCADE）要與其一致；多對多關聯表兩端皆 NOT NULL（因在主鍵中）；而「1 端至少要有一個 N 端」這類最小基數為 1 的限制，標準的外來鍵做不到，須用觸發器或程式補強。`

| 透明度 | 意義 | 例子 |

| 特性 | 說明 | 由誰負責 | 例子（轉帳 A 帳戶扣 1000，B 帳戶加 1000） |

      answer: `#### (一) Entity Integrity Rule（實體完整性規則）

**意涵**：關聯式模型的完整性規則之一——**任何基底關聯（base relation）的主鍵，其任一屬性值都不得為 NULL**（且主鍵值必須唯一）。理由：主鍵的功能是辨識每一個「實體」，若主鍵為 NULL 就代表「不知道是哪一個實體」，這筆資料無法被辨識、也無法被外來鍵參照。

- 複合主鍵的**每一個組成屬性**都不得為 NULL。
- SQL 中 \`PRIMARY KEY\` 宣告會同時隱含 \`NOT NULL\` 與 \`UNIQUE\`；違反時 DBMS 拒絕該次 INSERT／UPDATE。
- 例：\`INSERT INTO Student(sid, name) VALUES (NULL, 'Amy')\` 會被拒絕（sid 是主鍵）；訂購（訂單編號, 傢俱編號, 數量）的主鍵由兩欄組成，任一欄為 NULL 都不允許。
- 與**參考完整性**（外來鍵必須為 NULL 或對應到被參照表的現有主鍵值）並列為兩大關聯完整性規則；注意外來鍵可以是 NULL，主鍵不行。

#### (二) Location independence（位置獨立性）in a distributed database

**意涵**：在分散式資料庫中，**使用者與應用程式不必知道資料實際存放在哪一個站台（site）／哪一台伺服器，就能存取資料**；下查詢時只用邏輯名稱，資料搬到別的站台、或跨站台複製，程式都不必修改。它也稱為**位置透明性（location transparency）**，是分散式資料庫「透明性」的一種（其他如分割透明性、複製透明性、故障透明性）。

- 實現：全域資料字典（global catalog）記錄「邏輯表格→實體站台」的對映；分散式查詢處理器（optimizer）負責把 \`SELECT … FROM Customer\` 拆成各站台的子查詢，再合併結果；也可用別名／同義詞（synonym、nickname）隱藏站台名稱。
- 例：客戶資料分存於台北與高雄兩站台，使用者寫 \`SELECT * FROM Customer WHERE city='高雄'\`，系統自動決定到哪個站台取資料；若日後把高雄資料搬到雲端機房，只更新資料字典即可。
- 優點：降低程式維護成本、支援資料重新配置與負載平衡；缺點：系統要付出對映與跨站台通訊成本，查詢最佳化較複雜。

#### (三) SSA（Segment Search Argument）in the Hierarchical Database Model

**背景**：階層式資料模型（以 IBM IMS 為代表）把資料組成**樹狀階層**，節點稱為**區段（segment）**，每個區段含若干欄位；父子關係為 1：N，從根往下走。程式以 **DL/I** 呼叫（GU 取得唯一、GN 取下一筆、GNP 取父下的下一筆、ISRT 插入、DLET 刪除、REPL 取代）對資料庫導覽存取，是「記錄一次一筆」的程序式存取。

**意涵**：**SSA 是 DL/I 呼叫中用來指定「要找哪一種區段、符合什麼條件」的搜尋引數**。一個呼叫可帶 0 到多個 SSA，由根往下依階層順序排列，用來限定導覽路徑。

- **無條件 SSA（unqualified）**：只寫區段名稱，表示「該型態的任何一個（第一個）區段」，例如 \`DEPT\`。
- **有條件 SSA（qualified）**：區段名稱後面加括號的「限定條件」：\`區段名(欄位名 運算子 值)\`，運算子有 =、>、<、>=、<=、^=（不等於）；多個條件以 \`&\`（AND）、\`|\`（OR）連接。例如 \`STUDENT(SNO =1001)\`。
- 另可附加**命令碼（command code）**，如 \`*D\` 表示路徑呼叫（一次取回路徑上所有區段）。
- 實際格式要求區段名稱、欄位名稱補空白至固定長度，這裡以概念形式表示。

\`\`\`text
階層：SCHOOL（學校）
        └─ DEPT（系）
              ├─ STUDENT（學生）
              └─ COURSE（課程）

GU  SCHOOL(NAME =NTU)  DEPT(DEPTNO =CS)  STUDENT(SNO =1001)
    └ 由根往下，依序限定：台大 → 資工系 → 學號 1001 的學生（唯一取得）
GN  STUDENT
    └ 無條件 SSA：沿目前位置取得下一個 STUDENT 區段
\`\`\`

與關聯式的差異：SSA 是**導覽式**（程式要指出路徑與順序），而 SQL 是**宣告式**（只說要什麼）；階層模型缺點是 M：N 關係不易表示、結構改變影響程式（資料獨立性差）。

#### (四) Two-Phase Locking Protocol（兩階段鎖定協定，2PL）

**意涵**：一種並行控制協定，規定**每個交易的鎖定動作分成兩個階段**：

1. **擴張階段（growing phase）**：只能取得（lock）鎖，不能釋放任何鎖；
2. **收縮階段（shrinking phase）**：一旦釋放了第一個鎖，之後就只能釋放、**不能再取得任何新鎖**。

兩階段的分界（取得最後一個鎖的時點）稱為**鎖定點（lock point）**。

- **鎖的模式**：共享鎖 S（讀）與互斥鎖 X（寫）。相容性：

| 已持有＼要求 | S | X |
|---|---|---|
| S | 相容 | 衝突，等待 |
| X | 衝突，等待 | 衝突，等待 |

- **正確性**：遵守 2PL 的所有交易排程必為**衝突可序列化（conflict serializable）**，序列化順序就是各交易的鎖定點順序。
- 反例（不遵守 2PL）：T1 對 X 鎖定→讀寫→立即解鎖，再對 Y 鎖定，期間 T2 可插入修改 X、Y，會產生不可序列化的排程（結果不等於任何序列執行）；2PL 禁止「解鎖後再鎖」。
- **缺點**：可能發生**死結（deadlock）**（T1 等 T2 的鎖、T2 等 T1 的鎖，需偵測或預防）；基本 2PL 也可能產生**連鎖回復（cascading rollback）**——T1 提早釋放 X 鎖後 T2 讀了它的值，T1 若中止 T2 也要中止。
- **變形**：**嚴格 2PL（strict 2PL）**——寫鎖（X）保持到交易 commit／abort 才釋放，避免連鎖回復；**強嚴格 2PL（rigorous 2PL）**——所有鎖都保持到交易結束，商用 DBMS 多採此法；**保守 2PL（conservative）**——開始前一次取得全部所需的鎖，可避免死結。`

#### (一) 學生修過某位老師「剛好兩門」課

\`\`\`sql
SELECT s.Sname, t.Tname
FROM   STUDENT s
JOIN   TAKE_COURSE tc ON tc.\`S#\` = s.\`S#\`
JOIN   OFFER o        ON o.\`C#\`  = tc.\`C#\`
JOIN   TEACHER t      ON t.\`T#\`  = o.\`T#\`
GROUP BY s.\`S#\`, s.Sname, t.\`T#\`, t.Tname
HAVING COUNT(DISTINCT tc.\`C#\`) = 2;
\`\`\`

說明：把學生修的課，經由 OFFER 對應到開課老師；以（學生，老師）分組，計算這位學生修過該老師的相異課程數，HAVING 取剛好等於 2。分組欄位加入 S#、T#（主鍵）以避免同名學生或同名老師被合併。實測：(Amy, John)、(Bob, John)、(Bob, Mary)、(Cat, John)；Amy 只修了 Mary 的 1 門（c3）所以沒有 (Amy, Mary)。若題意是「至少兩門」，把 \`= 2\` 改成 \`>= 2\`。

#### (二) 從來沒有被當過（所有 Score ≥ 60）的學生

\`\`\`sql
SELECT s.Sname
FROM   STUDENT s
WHERE  NOT EXISTS (SELECT 1
                   FROM   TAKE_COURSE tc
                   WHERE  tc.\`S#\` = s.\`S#\`
                     AND  tc.Score < 60);
\`\`\`

\`\`\`sql
SELECT s.Sname
FROM   STUDENT s
WHERE  s.\`S#\` NOT IN (SELECT \`S#\` FROM TAKE_COURSE WHERE Score < 60);
\`\`\`

#### (三) 修過 John 開設的所有課程，並且都被當掉的學生

這是「除法」問題：對 John 開的每一門課 c，該學生都修過且分數 < 60。以雙重 NOT EXISTS：不存在「John 開的某門課，該學生沒有以不及格修過」。

\`\`\`sql
SELECT s.Sname
FROM   STUDENT s
WHERE  EXISTS (SELECT 1                                  -- John 至少開了一門課

  AND  NOT EXISTS (

         WHERE  t.Tname = 'John'

                            WHERE  tc.\`S#\` = s.\`S#\`
                              AND  tc.\`C#\` = o.\`C#\`
                              AND  tc.Score < 60));

另一種「計數比較」寫法：不及格地修過 John 的課的門數，等於 John 開課的總門數（且大於 0）。

\`\`\`sql
SELECT s.Sname
FROM   STUDENT s
WHERE  (SELECT COUNT(*)
        FROM   OFFER o JOIN TEACHER t ON t.\`T#\` = o.\`T#\`
                       JOIN TAKE_COURSE tc ON tc.\`C#\` = o.\`C#\` AND tc.\`S#\` = s.\`S#\`

#### (四) 所有學生的姓名、總學分數、平均分數

**實體、關係與限制**：

| 關係 | 基數 | 限制與說明 |
|---|---|---|
| 隸屬（科別—醫生） | 1：N | 一位醫生屬於一個科別（全部參與）；科別可有多位醫生 |
| 開診（醫生—門診） | 1：N | 一個門診（某日、某時段、某診別）由一位主治醫生負責；醫生可開多個門診 |
| 屬於（門診—就診記錄） | 1：N | 每筆就診記錄屬於一個門診（全部參與）；一個門診有多位病患就診 |
| 掛號（病患—就診記錄） | 1：N | 每筆就診記錄是某一位病患的（全部參與）；病患可就診多次 |
| 處方（就診記錄—藥品） | M：N | 一次就診可開多種藥；一種藥可出現在多次就診；處方帶有用法、數量兩個關係屬性 |

就診記錄本質上是病患與門診之間的「M：N 關係」，因帶有診斷、就診時間等屬性且還要再與藥品產生關係，所以把它**升格成實體**（關聯實體）；病患與門診都是 1：N 到它。

**3. 轉換成關聯綱要（底線＝主鍵，FK＝外來鍵）**

| 資料表 | 屬性 | 主鍵與外來鍵 |
|---|---|---|
| Department 科別 | <u>dept_id</u>、dept_name | PK：dept_id |
| Doctor 醫生 | <u>doctor_id</u>、name、years（年資）、dept_id | FK：dept_id → Department |
| Patient 病患 | <u>patient_id</u>、name、gender、birth_date、phone、address | PK：patient_id |
| Clinic 門診 | <u>clinic_id</u>、clinic_no（診別）、clinic_date、period（時段）、doctor_id | FK：doctor_id → Doctor |
| Visit 就診記錄 | <u>visit_id</u>、patient_id、clinic_id、visit_time、diagnosis | FK：patient_id → Patient；clinic_id → Clinic |
| Drug 藥品 | <u>drug_id</u>、drug_name | PK：drug_id |
| Prescription 處方 | <u>visit_id</u>、<u>drug_id</u>、dosage、quantity | PK：(visit_id, drug_id)；FK：visit_id → Visit；drug_id → Drug |

設計重點：門診的科別不另存，由 Doctor.dept_id 推得（門診→醫生→科別），避免與醫生資料重複而不一致，所有非鍵屬性只相依於主鍵，符合 3NF。

\`\`\`sql
CREATE TABLE Department (
  dept_id   CHAR(3) PRIMARY KEY,
  dept_name VARCHAR(20) NOT NULL UNIQUE
);
CREATE TABLE Doctor (
  doctor_id INT PRIMARY KEY,
  name      VARCHAR(20) NOT NULL,
  years     INT NOT NULL,                 -- 年資
  dept_id   CHAR(3) NOT NULL,
  FOREIGN KEY (dept_id) REFERENCES Department(dept_id)
);
CREATE TABLE Patient (
  patient_id INT PRIMARY KEY,
  name       VARCHAR(20) NOT NULL,
  gender     CHAR(1) NOT NULL,            -- 'F' 女、'M' 男
  birth_date DATE NOT NULL,
  phone      VARCHAR(15),
  address    VARCHAR(60)
);
CREATE TABLE Clinic (
  clinic_id   INT PRIMARY KEY,
  clinic_no   VARCHAR(10) NOT NULL,       -- 診別，例如「內科第 1 診」
  clinic_date DATE NOT NULL,
  period      VARCHAR(4) NOT NULL,        -- 時段：上午／下午／晚上
  doctor_id   INT NOT NULL,
  FOREIGN KEY (doctor_id) REFERENCES Doctor(doctor_id)
);
CREATE TABLE Visit (
  visit_id   INT PRIMARY KEY,
  patient_id INT NOT NULL,
  clinic_id  INT NOT NULL,
  visit_time TIME,
  diagnosis  VARCHAR(100),
  FOREIGN KEY (patient_id) REFERENCES Patient(patient_id),
  FOREIGN KEY (clinic_id)  REFERENCES Clinic(clinic_id)
);
CREATE TABLE Drug (
  drug_id   INT PRIMARY KEY,
  drug_name VARCHAR(40) NOT NULL
);
CREATE TABLE Prescription (
  visit_id INT,
  drug_id  INT,
  dosage   VARCHAR(30),
  quantity INT,
  PRIMARY KEY (visit_id, drug_id),
  FOREIGN KEY (visit_id) REFERENCES Visit(visit_id),
  FOREIGN KEY (drug_id)  REFERENCES Drug(drug_id)
);
\`\`\`

以上建表語法已用 SQLite 執行確認可建立（MySQL 語法相同）。

#### (二) SQL 查詢

假設科別名稱為「內科」，性別以 'F' 表示女性；日期 D 以 \`'2025-03-10'\` 代表（實際使用時換成參數 \`?\` 或所需日期）。

**(1) 在日期 D 看內科、且有拿藥的六十歲女性**

\`\`\`sql
SELECT DISTINCT p.patient_id, p.name
FROM   Patient p
JOIN   Visit v       ON v.patient_id  = p.patient_id
JOIN   Clinic c      ON c.clinic_id   = v.clinic_id
JOIN   Doctor d      ON d.doctor_id   = c.doctor_id
JOIN   Department dp ON dp.dept_id    = d.dept_id
WHERE  c.clinic_date = '2025-03-10'                          -- 日期 D
  AND  dp.dept_name  = '內科'
  AND  p.gender      = 'F'
  AND  TIMESTAMPDIFF(YEAR, p.birth_date, c.clinic_date) = 60 -- 就診當天滿 60 歲
  AND  EXISTS (SELECT 1                                      -- 有拿藥：該次就診至少有一筆處方
               FROM   Prescription rx
               WHERE  rx.visit_id = v.visit_id);
\`\`\`

說明：\`TIMESTAMPDIFF(YEAR, 生日, 日期D)\` 是 MySQL 的滿年齡計算（未過生日不加一歲）。「有拿藥」用 EXISTS 檢查處方表；用 EXISTS 而不是直接 JOIN 處方，可避免同一次就診開多種藥造成重複列（仍加 DISTINCT 保險）。若題意的「六十歲」指 60 歲以上，改為 \`>= 60\`。

SQLite 實測（以 strftime 取代 TIMESTAMPDIFF 計算滿年齡）：建 4 位病患與 3 個門診，結果只回傳「在 2025-03-10 看內科、有處方、滿 60 歲的女性」一人；男性、65 歲、未滿 60（差一天生日）、外科就診與沒拿藥的都被正確排除。

**(2) 同一科看過兩次的病患姓名與對應醫生年資**

\`\`\`sql
SELECT p.name       AS 病患姓名,
       dp.dept_name AS 科別,
       c.clinic_date AS 就診日期,
       d.name       AS 醫生,
       d.years      AS 醫生年資
FROM   Visit v
JOIN   Patient p     ON p.patient_id = v.patient_id
JOIN   Clinic c      ON c.clinic_id  = v.clinic_id
JOIN   Doctor d      ON d.doctor_id  = c.doctor_id
JOIN   Department dp ON dp.dept_id   = d.dept_id
JOIN  (SELECT v2.patient_id, d2.dept_id
       FROM   Visit v2
       JOIN   Clinic c2 ON c2.clinic_id = v2.clinic_id
       JOIN   Doctor d2 ON d2.doctor_id = c2.doctor_id
       GROUP BY v2.patient_id, d2.dept_id
       HAVING COUNT(*) >= 2) t
       ON t.patient_id = v.patient_id AND t.dept_id = d.dept_id
ORDER BY p.name, dp.dept_name, c.clinic_date;
\`\`\`

說明：子查詢 t 先以（病患，科別）分組，找出在同一科至少就診 2 次的組合（科別透過醫生取得）；再與就診紀錄連接，列出這些就診各自的醫生與年資（每次就診一列，所以同科兩次若看不同醫生，會看到兩位醫生的年資）。若題意是「剛好兩次」，把 \`>= 2\` 改成 \`= 2\`；若只要每人一列，可把醫生年資換成 \`GROUP_CONCAT\` 或另外查詢。

SQLite 實測：病患「林美」在內科兩次就診（同一位王醫師，年資 15）被列出兩列；另一位病患內科、外科各看一次不符合，被排除。`

      answer: `**先備：閉包與候選鍵**（以 Python 窮舉所有屬性子集的閉包驗證）

FD：A → BC、CD → E、B → D、E → A。

| 屬性集合 | 閉包推導 | 結果 |
|---|---|---|
| A⁺ | A → BC 得 B, C；B → D 得 D；CD → E 得 E | {A, B, C, D, E}，是超鍵 |
| E⁺ | E → A 得 A，再同 A⁺ | {A, B, C, D, E}，是超鍵 |
| (BC)⁺ | B → D 得 D；CD → E 得 E；E → A 得 A | {A, B, C, D, E}，是超鍵 |
| (CD)⁺ | CD → E 得 E；E → A 得 A；A → BC 得 B | {A, B, C, D, E}，是超鍵 |
| B⁺ | B → D | {B, D}，不是超鍵 |

**候選鍵共 4 個：A、E、BC、CD**（皆為極小；每個屬性 A、B、C、D、E 都出現在某個候選鍵裡，都是「主屬性」）。

#### (一) 證明 (A, B, C)、(A, D, E) 為 lossless-join

記 R1 = (A, B, C)、R2 = (A, D, E)。

**方法一：交集為其中一邊的鍵（定理）**

二分解 {R1, R2} 為無損，若且唯若 (R1 ∩ R2) → R1 或 (R1 ∩ R2) → R2 在 F⁺ 中成立。

- R1 ∩ R2 = {A}。
- A⁺ = {A, B, C, D, E} ⊇ R1，也 ⊇ R2，所以 A → R1（亦即 A → ABC，由 A → BC 直接可得），且 A 是 R 的鍵。
- 因此為無損分解。

**方法二：Chase 演算法**

建初始表格：每個關聯一列，屬於該關聯的屬性填 a 符號（a_A…），否則填該列專屬的 b 符號。

| 列 | A | B | C | D | E |
|---|---|---|---|---|---|
| R1 (A,B,C) | a_A | a_B | a_C | b1_D | b1_E |
| R2 (A,D,E) | a_A | b2_B | b2_C | a_D | a_E |

套用 A → BC：兩列的 A 相同（皆為 a_A），所以兩列的 B、C 必須相等，把 b2_B 改成 a_B、b2_C 改成 a_C：

| 列 | A | B | C | D | E |
|---|---|---|---|---|---|
| R1 | a_A | a_B | a_C | b1_D | b1_E |
| R2 | a_A | a_B | a_C | a_D | a_E |

R2 這一列已全為 a 符號，所以**分解為無損連接**。（程式實作 chase 的結果亦為「無損」；還可再套 B → D：兩列 B 相同，b1_D 改 a_D，CD → E，b1_E 改 a_E，R1 也變全 a。）

直觀意義：連接 R1 ⋈ R2 = 以 A 配對，A 是鍵，每個 A 值在 R1 與 R2 各只有一列，所以不會產生假元組（spurious tuples）。

#### (二) 一個 lossless-join 的 BCNF 分解

**步驟 1：找違反 BCNF 的 FD。** 逐一檢查（左邊必須是超鍵）：

- A → BC：A 是超鍵，OK。
- E → A：E 是超鍵，OK。
- CD → E：CD 是超鍵，OK。
- **B → D：B⁺ = {B, D}，B 不是超鍵，違反 BCNF**。

**步驟 2：依 B → D 分解**：R → R1 (B, D)、R2 (A, B, C, E)（R2 = R − (D − B)，即拿掉被決定的 D）。

**步驟 3：檢查結果。**

- R1 (B, D)：只有 B → D，B 是 R1 的鍵 ⇒ BCNF。
- R2 (A, B, C, E)：把 F 投影到 R2，得 A → BCE、E → ABC、BC → AE（由 B → D、CD → E 推得 BC → E，再 E → A）；候選鍵為 A、E、BC，每個 FD 左邊都是超鍵 ⇒ BCNF。
- **無損**：R1 ∩ R2 = {B}，B 是 R1 的鍵（B → D），所以無損（程式的 chase 檢查亦為無損）。

**結果：{ (B, D)、(A, B, C, E) } 為 lossless-join 且滿足 BCNF。**

代價：CD → E 不被任何單一關聯保存（C、D 不在同一個關聯裡，要用 JOIN 才能檢查），亦即 BCNF 分解**不保持相依**。這是 BCNF 的已知取捨，本題要求只有無損，因此合格。

補充：(一) 的分解 (A, B, C)、(A, D, E) 本身也符合 BCNF（(A,B,C) 的鍵為 A 與 BC，(A,D,E) 的鍵為 A 與 E，每個非平凡 FD 的左邊都是鍵），也是 BCNF 且無損；但它同時遺失 B → D 與 CD → E 兩個相依，所以上面這個只丟一個 FD 的分解較好。

#### (三) 一個 lossless-join 的 3NF 分解

**觀察**：3NF 的條件是「每個非平凡 FD X → Y，X 是超鍵，或 Y 的每個屬性都是主屬性」。本題 A、B、C、D、E 全是主屬性（出現在候選鍵 A、E、BC、CD 中），所以 **R 本身就已滿足 3NF**（B → D 雖然左邊不是超鍵，但 D 是主屬性，3NF 允許）。(二) 的 BCNF 結果也是 3NF。

若要一個「保持相依」的 3NF 分解，用 **3NF 合成演算法（synthesis）**：

1. **求最小覆蓋（canonical cover）**：右邊拆成單一屬性：A → B、A → C、CD → E、B → D、E → A。逐一檢查——左邊沒有多餘屬性（例如 CD → E 中，C⁺ = {C}、D⁺ = {D} 都推不出 E，故 C、D 都不可去掉），每個 FD 也都不是冗餘（去掉任一條後，閉包都少了該右邊屬性）。得最小覆蓋 Fc = { A → B, A → C, CD → E, B → D, E → A }。
2. **依左邊相同者合併成一個關聯**：
   - A → B、A → C ⇒ R1 (A, B, C)
   - CD → E ⇒ R2 (C, D, E)
   - B → D ⇒ R3 (B, D)
   - E → A ⇒ R4 (A, E)
3. **確認有包含 R 的候選鍵**：R1 含 A，A 是 R 的候選鍵，所以不需再補一個關聯；若沒有任何關聯含候選鍵，必須再補一個含候選鍵的關聯。
4. 檢查有無被其他關聯包含的關聯（有就刪除）：四個關聯互不包含。

| 關聯 | 屬性 | 候選鍵 |
|---|---|---|
| R1 | (A, B, C) | A、BC |
| R2 | (C, D, E) | E、CD |
| R3 | (B, D) | B |
| R4 | (A, E) | A、E |

**驗證（程式）**：

- 每個關聯皆符合 3NF（事實上都符合 BCNF，因為每個非平凡 FD 的左邊都是該關聯的鍵）。
- **無損連接**：chase 結果得到全 a 的列（R1 含候選鍵 A，保證合成演算法的結果必為無損）。
- **保持相依**：A → BC 在 R1、CD → E 在 R2、B → D 在 R3、E → A 在 R4，四個 FD 全部保留。

**結論：{ (A, B, C)、(C, D, E)、(B, D)、(A, E) } 為 lossless-join、保持相依的 3NF 分解。**

**索引（index）**是為了加速依某些欄位（索引鍵）查詢而額外建立的資料結構（常用 B+ 樹），以「索引鍵 → 資料位置」換取少讀磁碟頁。依「索引與資料列實體順序的關係」分成兩類：

- **叢集索引（Clustered Index）**：**資料列本身就依索引鍵的順序存放**，索引的葉節點就是資料頁。因為資料只能排成一種順序，所以**每張表最多只有一個叢集索引**。例：SQL Server 的 CLUSTERED INDEX；MySQL InnoDB 的**主鍵索引**即叢集索引（資料列存放在主鍵 B+ 樹的葉節點）。
- **非叢集索引（Non-clustered Index，亦稱次要索引 secondary index）**：**索引結構與資料列分開存放**；葉節點存「索引鍵＋指向資料列的指標」（在堆積表是列位址 RID，在叢集表是叢集索引鍵值），資料列的實體順序與索引順序無關。**一張表可建多個**。

#### 二、差別比較

| 比較項目 | 叢集索引 | 非叢集索引 |
|---|---|---|
| 與資料列關係 | 葉節點即資料列，索引決定實體排列順序 | 葉節點只存「索引鍵＋指標」，資料列另存 |
| 每表數量 | 最多 1 個 | 可有多個（受空間與維護成本限制） |
| 查詢方式 | 找到葉節點即得整列資料 | 先在索引找到指標，再回表取其他欄位（bookmark lookup／回表），多一次存取 |
| 範圍查詢（BETWEEN、ORDER BY） | 很快：資料相鄰，循序讀取 | 較慢：符合的資料列散在各處，每筆都要回表；除非是「覆蓋索引」 |
| 空間 | 不額外複製資料，額外負擔小 | 額外占空間（鍵與指標） |
| 寫入維護成本 | 插入中間值可能造成頁面分裂與資料搬移；以遞增鍵插入最佳 | 每次 INSERT、DELETE、UPDATE 索引欄位都要同步維護每一個索引 |
| 適合欄位 | 常做範圍查詢、排序、分組的欄位；窄而唯一、遞增的鍵（如主鍵、日期） | 常做等值查詢的其他欄位（如 Email、姓名）、外來鍵欄位、WHERE 或 JOIN 條件欄位 |

#### 三、SQL 範例與使用建議

\`\`\`sql
-- SQL Server：叢集索引（資料依學號排序存放）
CREATE CLUSTERED INDEX ix_student_sid ON Student(sid);
-- 非叢集索引：用姓名快速找人
CREATE NONCLUSTERED INDEX ix_student_name ON Student(name);

-- MySQL (InnoDB)：主鍵自動成為叢集索引；一般 CREATE INDEX 建立的是非叢集（次要）索引
CREATE TABLE Student (
  sid  INT PRIMARY KEY,          -- 叢集索引
  name VARCHAR(20),
  dept VARCHAR(20)
);

轉換規則：每個實體轉成一個資料表；1：N 關係把「1 方」的主鍵放到「N 方」當外來鍵。共 4 個資料表（底線＝主鍵、FK＝外來鍵）：

| 藥妝商品 | <u>藥妝商品編號</u>、藥妝名稱、藥妝種類、單價、廠商編號 | 藥妝商品編號 | 廠商編號 參照 供應商（廠商編號） |
| 訂單 | <u>訂單編號</u>、訂單日期、數量、備註、顧客編號、藥妝商品編號 | 訂單編號 | 顧客編號 參照 顧客（顧客編號）；藥妝商品編號 參照 藥妝商品（藥妝商品編號） |

寫成 SQL（MySQL）：

\`\`\`sql
CREATE TABLE 供應商 (
  廠商編號 VARCHAR(10) PRIMARY KEY,
  廠商名稱 VARCHAR(40) NOT NULL,
  廠商住址 VARCHAR(80),
  廠商電話 VARCHAR(20)
);
CREATE TABLE 顧客 (
  顧客編號 VARCHAR(10) PRIMARY KEY,
  顧客姓名 VARCHAR(20) NOT NULL,
  顧客住址 VARCHAR(80),
  手機號碼 VARCHAR(15)
);
CREATE TABLE 藥妝商品 (
  藥妝商品編號 VARCHAR(10) PRIMARY KEY,
  藥妝名稱 VARCHAR(40) NOT NULL,
  藥妝種類 VARCHAR(20),
  單價 DECIMAL(8,2) NOT NULL,
  廠商編號 VARCHAR(10) NOT NULL,
  FOREIGN KEY (廠商編號) REFERENCES 供應商(廠商編號)
);
CREATE TABLE 訂單 (
  訂單編號 VARCHAR(12) PRIMARY KEY,
  訂單日期 DATE NOT NULL,
  數量 INT NOT NULL,
  備註 VARCHAR(100),
  顧客編號 VARCHAR(10) NOT NULL,
  藥妝商品編號 VARCHAR(10) NOT NULL,
  FOREIGN KEY (顧客編號) REFERENCES 顧客(顧客編號),
  FOREIGN KEY (藥妝商品編號) REFERENCES 藥妝商品(藥妝商品編號)
);
\`\`\`

      question: `巨人電腦補習班有個關聯式資料庫（Relational Database），兩個資料表為授課 A、授課 B，資料表綱要如下所示：
授課 A（教師編號、教師姓名、授課時間、授課教室），功能相依性的假設為：每位教師姓名都不一樣，教師授課皆在教室內，教師在任何一個上課時段內只在一間教室上課。

若想要將各資料表分解成符合 BCNF（Boyce-Codd Normal Form）的資料表，請列出每個資料表的綱要與候選鍵（Candidate Key）。（20 分）`,

#### 一、授課 A

記號：a = 教師編號、n = 教師姓名、t = 授課時間、r = 授課教室。

**由題意寫出 FD**：

- 姓名不重複 ⇒ 教師編號與教師姓名一對一：FD1：a → n、FD2：n → a。
- 一位教師在同一時段只在一間教室：FD3：{a, t} → r（因 n ↔ a，等價地 {n, t} → r）。

**候選鍵**（用閉包算）：

- {a, t}⁺ = {a, t, n, r}（a → n、{a,t} → r）＝ 全部屬性，是超鍵；a⁺ = {a, n}、t⁺ = {t}，缺一不可，所以 {a, t} 是候選鍵。
- {n, t}⁺ = {n, t, a, r}（n → a 之後同上）＝ 全部屬性，同理 {n, t} 也是候選鍵。
- 候選鍵共兩個：**{教師編號, 授課時間}**、**{教師姓名, 授課時間}**。

**BCNF 檢查**：a → n 的左邊 a 的閉包只有 {a, n}，不是超鍵，**違反 BCNF**（n → a 同理）。原因：教師編號與姓名這組資訊，每位教師開一堂課就重複存一次。

**分解**：以 a → n 拆開。

| 新資料表 | 屬性 | 候選鍵 |
|---|---|---|
| 授課 A1（教師） | 教師編號、教師姓名 | 教師編號；教師姓名（兩個都是候選鍵） |
| 授課 A2（授課） | 教師編號、授課時間、授課教室 | {教師編號, 授課時間} |

驗證：

- A1：a → n、n → a，左邊皆為候選鍵，符合 BCNF。
- A2：只有 {a, t} → r，左邊是候選鍵，符合 BCNF。
- **無損連接**：A1 ∩ A2 = {教師編號}，而教師編號是 A1 的鍵，所以 A1 ⋈ A2 無損（chase 結果得到全 a 列）。
- **保持相依**：a → n、n → a 在 A1；{a, t} → r 在 A2；{n, t} → r 可由 n → a 與 {a, t} → r 推得。四個 FD 全部保持。
- 備註：A2 的教師欄位也可換成教師姓名（{教師姓名, 授課時間}為鍵），兩者等價，通常保留編號。

#### 二、授課 B

記號：a = 教師編號、t = 授課時間、r = 授課教室、c = 課程。

**由題意寫出 FD**：

- 一門課程只由一位教師教：FD1：c → a。
- 一位教師同一時段只在一間教室：FD2：{a, t} → r。
- 「每位教師可授多門課程」表示 a 不決定 c，沒有 a → c。

**候選鍵**：{c, t}⁺：c → a、再 {a, t} → r，得 {c, t, a, r} ＝ 全部屬性，是超鍵；c⁺ = {c, a}、t⁺ = {t}，缺一不可，且沒有任何屬性能決定 c，所以 c 必在任何鍵中，同理 t 沒有被決定，必在鍵中；**唯一候選鍵為 {課程, 授課時間}**。

**BCNF 檢查**：c → a 左邊 c 不是超鍵（c⁺ = {c, a}）違反；{a, t} → r 左邊 {a, t} 的閉包是 {a, t, r}，不含 c，也不是超鍵，違反。**兩個 FD 都違反 BCNF**。

**分解**（先依 FD2 拆，再依 FD1 拆）：

1. 依 {a, t} → r 拆成 B1 (a, t, r) 與 B' (a, t, c)；{a, t} 是 B1 的鍵，所以無損。
2. B' (a, t, c) 中仍有 c → a 違反（鍵為 {c, t}），再依 c → a 拆成 B2 (c, a) 與 B3 (c, t)；c 是 B2 的鍵，無損。

| 新資料表 | 屬性 | 候選鍵 |
|---|---|---|
| 授課 B1（教師時段教室） | 教師編號、授課時間、授課教室 | {教師編號, 授課時間} |
| 授課 B2（課程教師） | 課程、教師編號 | 課程 |
| 授課 B3（課程時段） | 課程、授課時間 | {課程, 授課時間}（全部屬性） |

驗證：

- B1 只有 {a, t} → r（左邊為鍵）；B2 只有 c → a（左邊為鍵）；B3 沒有非平凡 FD；三者皆符合 BCNF。
- **保持相依**：c → a 在 B2，{a, t} → r 在 B1，兩個 FD 都保持（程式驗證亦為保持）。

**無損連接（chase）**：初始表格每個關聯一列，在自己的屬性填 a 符號，其餘填 b 符號：

| 列 | 教師編號 a | 授課時間 t | 授課教室 r | 課程 c |
|---|---|---|---|---|
| B1 | a_a | a_t | a_r | b1_c |
| B2 | a_a | b2_t | b2_r | a_c |
| B3 | b3_a | a_t | b3_r | a_c |

套用 c → a：B2 與 B3 的課程相同（都是 a_c），所以 B3 的教師編號由 b3_a 改成 a_a；此時 B1 與 B3 的 (a, t) 皆為 (a_a, a_t)，套用 {a, t} → r，B3 的授課教室改成 a_r；B3 整列變成全 a 符號（a_a, a_t, a_r, a_c），所以是**無損分解**。程式驗證結果同樣為「無損」。

**取捨說明**：若只依 c → a 一次拆成 (c, a)、(c, t, r)，雖然也符合 BCNF 且無損，但 {a, t} → r 的左邊 a 不在 (c, t, r)，這條「教師同時段只在一間教室」的限制就**無法在單一表內由鍵來保證**（程式驗證為不保持相依）。上面的三表分解不但符合 BCNF，也保持所有相依，是較佳答案。

| 授課 B | （課程, 教師編號） | 課程 |
| 授課 B | （課程, 授課時間） | {課程, 授課時間} |`

#### (一) 未付款且數量 ≥ 50 的客戶姓名與電話

\`\`\`sql
SELECT DISTINCT c.客戶姓名, c.客戶電話
FROM   客戶 c
JOIN   訂單 o ON o.客戶編號 = c.客戶編號
WHERE  o.是否付款 = 'N'
  AND  o.數量 >= 50;
\`\`\`

說明：客戶資料在客戶表、付款與數量在訂單表，用客戶編號連接。同一客戶可能有多筆符合的訂單，所以用 \`DISTINCT\` 避免重複列出。實測結果：C1（甲，O1 未付款 60 本）、C3（丙，O3 未付款 50 本，剛好 50 算「>=」）；C2 已付款，不入選。

#### (二) 每本書籍的購買數量，依書籍編號由小到大排序

SELECT   書籍編號, SUM(數量) AS 購買數量
FROM     訂單

ORDER BY 書籍編號 ASC;
\`\`\`

SELECT   b.書籍編號, COALESCE(SUM(o.數量), 0) AS 購買數量
FROM     書籍 b
LEFT JOIN 訂單 o ON o.書籍編號 = b.書籍編號
GROUP BY b.書籍編號
ORDER BY b.書籍編號;
