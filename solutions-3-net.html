| **無競爭期間（CFP）內傳送的訊框**（PCF 模式） | 固定值 **32768**（0x8000），表示此訊框在無競爭週期中傳送，其他站台不需設定 NAV 為該值（用來表示無競爭期間） |

**三、如何區分與檢視傳送端與接收端的位址**

802.11 訊框最多有 **4 個位址欄位**，其**意義依訊框控制中的 To DS 與 From DS 兩個位元**而定（DS = Distribution System，分配系統，即 AP 後面的有線網路）：

| To DS | From DS | 傳輸情境 | 位址 1 | 位址 2 | 位址 3 | 位址 4 |
|---|---|---|---|---|---|---|
| 0 | 0 | 站台對站台（Ad hoc／IBSS）、管理與控制訊框 | 目的位址 DA（接收端） | 來源位址 SA（傳送端） | BSSID | — |
| 0 | 1 | AP → 站台（下行） | DA（接收站台） | **BSSID**（AP，傳送端） | SA（原始來源） | — |
| 1 | 0 | 站台 → AP（上行） | **BSSID**（AP，接收端） | SA（傳送站台） | DA（最終目的） | — |
| 1 | 1 | AP → AP（WDS／無線橋接、Mesh） | RA（接收的 AP） | TA（傳送的 AP） | DA（最終目的） | SA（原始來源） |

**區分方法**：

1. **位址 1 永遠是「這一跳的接收端（RA）」**，**位址 2 永遠是「這一跳的傳送端（TA）」**——所以在無線這一段，檢視前兩個位址就知道**誰傳給誰**。
2. 位址 3、4 描述**端點對端點的原始來源（SA）與最終目的（DA）**，以及 BSSID，用於橋接到有線網路時，讓 AP 知道要把訊框轉給誰。
3. 先看 **To DS／From DS** 兩個位元，再依上表判讀各位址欄位的意義。
4. 可用 Wireshark 等工具擷取 802.11 訊框，檢視 Frame Control 與各位址欄位。`

**二、運作模式**

SNMP 採 **管理者／代理（Manager–Agent）的客戶端／伺服器（請求／回應）模式**，主要有兩種運作方式：

| 方式 | 說明 |

| 項目 | IPv4 | IPv6 |
|---|---|---|
| 位址長度 | 32 位元（4 位元組） | **128 位元（16 位元組）** |
| 位址數量 | 約 4.3×10^9 | 約 3.4×10^38 |
| 表示法 | **點分十進位**，4 組 0～255，如 \`192.168.1.10\` | **冒號十六進位**，8 組 16 位元（4 個十六進位數字），如 \`2001:0db8:0000:0000:0000:0000:0000:0001\` |
| 縮寫規則 | 無 | 每組可省略前導 0；**連續全 0 的組可用 \`::\` 縮寫一次**，如 \`2001:db8::1\` |
| 網路／主機劃分 | 子網路遮罩或 CIDR 前綴（如 /24）；早期有類別（A、B、C） | 固定使用**前綴長度**（如 /64），不再有類別；一般子網路為 /64 |
| 位址類型 | 單播、多播、**廣播** | 單播、多播、**任播（Anycast）**；**沒有廣播** |
| 位址取得 | 手動或 DHCP | 手動、**SLAAC（無狀態自動組態）**、DHCPv6 |
| 私有位址／NAT | 大量使用私有位址（10／172.16／192.168）與 NAT | 位址充足，不需 NAT；有唯一本地位址（fc00::/7）與鏈路本地位址（fe80::/10） |
| 特殊位址 | 127.0.0.1 迴路、0.0.0.0、255.255.255.255 | \`::1\` 迴路、\`::\` 未指定、\`ff00::/8\` 多播 |
| 解析與設定 | 使用 ARP 解析 MAC | 使用**鄰居探索（NDP，ICMPv6）** |

**（二）IPv6 主機介面位址的組成（10 分）**

典型的 IPv6 單播位址（128 位元）由「**網路前綴（64 位元）＋介面識別碼（64 位元）**」組成：

\`\`\`
|<------------ 64 位元：網路前綴 ------------>|<----- 64 位元：介面識別碼 ----->|
|  全球路由前綴（48 位元，由 ISP 或 RIR 分配） | 子網路 ID（16 位元，組織自行規劃） |      Interface ID       |
\`\`\`

| 部分 | 長度 | 說明 |
|---|---|---|
| 全球路由前綴（Global Routing Prefix） | 通常 48 位元 | 由 ISP／網際網路註冊機構分配給組織，用於全球路由 |
| 子網路 ID（Subnet ID） | 通常 16 位元 | 組織內部可切出 65,536 個子網路 |
| 介面識別碼（Interface ID） | 64 位元 | 唯一識別該子網路中的一個介面 |

**介面識別碼的產生方式**

1. **EUI-64（由 MAC 位址衍生）**：把 48 位元 MAC 位址從中間插入 \`FFFE\`，並把第一個位元組的第 7 位元（U/L 位元）反轉。例如 MAC \`00:1A:2B:3C:4D:5E\` → 插入 FFFE 得 \`00:1A:2B:FF:FE:3C:4D:5E\` → 反轉 U/L 位元（0x00 → 0x02）→ 介面識別碼 **\`021A:2BFF:FE3C:4D5E\`**。
2. **隨機產生（隱私擴充，RFC 4941／穩定隱私位址 RFC 7217）**：避免因為固定 MAC 衍生的位址而被追蹤。目前作業系統預設多使用此法。
3. **DHCPv6** 分配或**手動設定**。

**主機位址的取得（SLAAC 過程）**

1. 主機啟動後，先以 \`fe80::/10\` 前綴加介面識別碼，產生**鏈路本地位址（Link-local）**，並以重複位址偵測（DAD）確認沒有衝突。
2. 主機送出路由器請求（RS），路由器回覆**路由器通告（RA）**，內含**網路前綴**（如 \`2001:db8:1:1::/64\`）。
3. 主機把**前綴 + 介面識別碼**組成**全球單播位址**，如 \`2001:db8:1:1:21a:2bff:fe3c:4d5e\`。`

- QAM-64 是同時改變載波的**振幅與相位**（64 種組合，每符號 6 位元）來調變資料；**頻率本身不被調變**，每個方向只使用一個載波頻率，因此與星座圖的點數（64）無關。

      answer: `**（一）Slotted ALOHA 吞吐量（10 分）**

**觀念**：在 slotted ALOHA 中，時間被切成固定時槽，每個站在每個時槽以一定機率傳送。**某站在一個時槽傳送成功，必須是「自己傳送、而且其他所有站都沒有傳送」**，否則發生碰撞。

**工作站 A 的吞吐量**（每時槽平均成功傳送的訊框數）：

\`S_A = PA × (1 − PB) × (1 − PC) = 0.2 × 0.7 × 0.6 = 0.084\`

即約 **0.084 個訊框／時槽**（8.4%）。

| 工作站 | 計算 | 吞吐量 |
|---|---|---|
| A | 0.2 × (1 − 0.3) × (1 − 0.4) = 0.2 × 0.7 × 0.6 | 0.084 |
| B | 0.3 × (1 − 0.2) × (1 − 0.4) = 0.3 × 0.8 × 0.6 | 0.144 |
| C | 0.4 × (1 − 0.2) × (1 − 0.3) = 0.4 × 0.8 × 0.7 | 0.224 |

**整個系統的吞吐量** = 三站吞吐量之和 = 0.084 + 0.144 + 0.224 = **0.452** 個訊框／時槽（約 45.2%）。

**（二）CSMA/CA 的碰撞避免策略（12 分）**

**背景**：無線網路（802.11）無法像有線乙太網路一樣邊傳邊聽（收發難同時，且存在隱藏終端機），無法有效偵測碰撞，因此改為**事前盡量避免碰撞**。

**策略 1：隨機退避（Random Backoff）與訊框間隔（IFS）**

- 站台傳送前先偵測通道；若閒置，必須**再等待一段 DIFS（分散式訊框間隔）**。

**策略 2：RTS／CTS 握手與虛擬載波感測（NAV）**

- 傳送端先傳一個短的 **RTS（Request to Send）** 給接收端，接收端回覆 **CTS（Clear to Send）**。RTS／CTS 訊框中帶有 **Duration** 欄位，表示預計佔用通道的時間。

| 否認（repudiation） | 否（屬完整性） | 通訊的一方**否認**自己曾經傳送或接收過訊息，破壞的是不可否認性（完整性範疇） |

**答案：只有「窺探（snooping）」是對機密性的攻擊。**（流量分析也屬於機密性攻擊，但不在選項中。）`

**（一）Store-and-Forward（儲存後轉送）（5 分）**

- 交換器**先收下整個訊框**存入緩衝區，**計算並檢查 FCS（CRC）**，確認沒有錯誤後，才查 MAC 位址表並從輸出埠轉送；**有錯誤的訊框直接丟棄**。
- 優點：**不會轉送錯誤訊框**（過濾損壞與過短、過長訊框），可在**不同速率埠之間轉送**（如 100 Mbps 與 1 Gbps），也方便做 QoS 與 VLAN 處理。
- 缺點：**延遲最大**，且延遲與**訊框長度成正比**（要等整個訊框收完）。
- 現今多數交換器採用此模式。

**（二）Cut-Through（直通式）（5 分）**

- 交換器只要**收完目的 MAC 位址（訊框前 6 位元組，連同前置碼約前 14 位元組以內）**，就查表並**立刻開始轉送**，邊接收邊轉送。
- 優點：**延遲最小**且固定（與訊框長度無關），適合低延遲需求（如高頻交易、叢集）。
- 缺點：**不檢查 FCS**，錯誤訊框、碰撞產生的殘缺訊框（runt）也會被轉送，浪費頻寬，錯誤會擴散；輸入輸出埠速率必須相同（無法在不同速率間轉送）。

**（三）Fragment-Free（無碎片）（5 分）**

- 屬於 Cut-Through 的**改良**：交換器收到**訊框的前 64 位元組**後才開始轉送。
- 原因：乙太網路的**碰撞通常發生在前 64 位元組內**（最小訊框 64 位元組，即碰撞視窗），碰撞產生的殘缺訊框（碎片，fragment／runt）長度都小於 64 位元組。等到收滿 64 位元組，就可過濾掉絕大多數碰撞碎片。
- 延遲介於兩者之間；仍然**不檢查 FCS**，所以無法過濾其他類型的錯誤。

**（四）三種機制的效能比較（5 分）**

| 比較項目 | Store-and-Forward | Fragment-Free | Cut-Through |
|---|---|---|---|
| 開始轉送的時機 | 收完整個訊框並檢查 FCS 後 | 收到前 64 位元組後 | 收完目的 MAC（前 6 位元組）後 |
| 延遲 | **最大**（隨訊框長度而變） | 中等（固定，約 64 位元組的傳輸時間） | **最小**（固定） |
| 錯誤偵測 | **完整**（FCS 檢查），錯誤訊框被丟棄 | 只過濾碰撞碎片（< 64 B） | **無** |
| 轉送錯誤訊框的風險 | 無 | 低 | **高** |
| 緩衝區需求 | 大（需存放整個訊框） | 小 | 最小 |
| 不同速率埠間轉送 | **可以** | 不適合 | 不可（需同速率） |
| 有效頻寬（浪費） | 最有效率（不轉送壞訊框） | 次之 | 可能浪費頻寬轉送壞訊框 |
| 適用情境 | 一般網路、需要可靠性 | 折衷方案 | 要求極低延遲、網路品質良好（錯誤少） |

**舉例**：在 1 Gbps 鏈路上，最大 1,500 位元組的訊框傳輸時間約 12 μs，Store-and-Forward 需多等約 12 μs，Cut-Through 只需等前 6 位元組（約 0.05 μs）。因此對延遲極敏感的應用才選 Cut-Through，一般場合選 Store-and-Forward 以確保品質。（許多交換器在錯誤率升高時，可自動由 Cut-Through 切回 Store-and-Forward。）`

    {
      id: "loc3-net-105-2", no: "二", topic: "sec", topicName: "資通網路與安全",

      score: 15,
      question: `路由器有 Routing 與 Forwarding 兩大功能，請說明兩大功能運作機制與差異之處。（15 分）`,
      answer: `**一、兩大功能的概念**

| 功能 | 白話說明 |
|---|---|
| **路由（Routing）** | 決定「**封包應該走哪一條路徑**」：路由器彼此交換資訊，**計算**到各個目的網路的最佳路徑，並**建立路由表** |
| **轉送（Forwarding）** | 「**把到達的封包送往下一個地方**」：路由器收到每一個封包後，**依據路由表（轉發表）**決定從哪個輸出介面轉送出去 |

類比：Routing 像事先規劃地圖與行車路線；Forwarding 像在每個路口依路標決定轉向。

**二、運作機制**

**1. Routing（路由）的運作——控制平面（Control Plane）**

1. 路由器透過**路由協定**與鄰居交換路由資訊：
   - 內部閘道協定（IGP）：**RIP**（距離向量）、**OSPF**（鏈路狀態）、EIGRP、IS-IS；
   - 外部閘道協定（EGP）：**BGP**（路徑向量，用於自治系統之間）。
   - 也可靜態設定（手動設定靜態路由、預設路由）。
2. 依演算法計算最佳路徑：距離向量（Bellman-Ford）、鏈路狀態（Dijkstra 最短路徑），依成本度量（跳數、頻寬、延遲、政策）。
3. 結果存入**路由表（Routing Table／RIB）**，並更新到**轉發表（FIB）**。
4. 網路拓撲改變（鏈路故障、新增網路）時，**重新計算**並更新。
5. 運算較複雜，發生頻率較低（秒～分鐘等級），通常由 CPU 執行軟體處理。

**2. Forwarding（轉送）的運作——資料平面（Data Plane）**

1. 封包由輸入埠到達，路由器檢查**IP 表頭**（檢查檢驗和、TTL 減 1，TTL = 0 就丟棄並回 ICMP）。
2. 以**目的 IP 位址**查**轉發表（FIB）**，採**最長前綴比對**，找出**下一跳位址與輸出介面**。
3. 透過**交換結構（switching fabric）**把封包送到輸出埠，排入輸出佇列。
4. 重新封裝成新的資料鏈結層訊框（用 ARP 查下一跳的 MAC），從輸出介面送出。
5. 每一個封包都要做，**必須非常快**（奈秒～微秒），通常由**硬體（ASIC、網路處理器）**高速完成。

\`\`\`htmldiagram
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:'Noto Sans TC',sans-serif;font-size:13px;margin:.4rem 0"><span style="background:#1f5673;color:#fff;padding:5px 10px;border-radius:6px">路由協定<br><small>RIP／OSPF／BGP 交換資訊</small></span><span>→</span><span style="background:#8a3324;color:#fff;padding:5px 10px;border-radius:6px">路由計算<br><small>最短路徑演算法</small></span><span>→</span><span style="background:#2f6b4f;color:#fff;padding:5px 10px;border-radius:6px">路由表／轉發表<br><small>目的網路 → 下一跳＋介面</small></span><span>→</span><span style="background:#6a4c93;color:#fff;padding:5px 10px;border-radius:6px">封包到達<br><small>查表（最長前綴比對）</small></span><span>→</span><span style="background:#a07e2c;color:#fff;padding:5px 10px;border-radius:6px">轉送<br><small>輸出介面送出</small></span></div>
\`\`\`

（前三項為 Routing，後兩項為 Forwarding，兩者以路由表／轉發表連結。）

**三、差異比較**

| 項目 | Routing（路由） | Forwarding（轉送） |
|---|---|---|
| 本質 | **決定路徑**（規劃） | **執行轉送**（動作） |
| 所屬平面 | 控制平面（Control plane） | 資料平面（Data plane） |
| 處理對象 | 網路拓撲與路由資訊（路由訊息） | 每一個傳送的資料封包 |
| 依據 | 路由協定、演算法與政策 | 轉發表（FIB）與封包目的位址 |
| 結果／產出 | 路由表、轉發表 | 封包從特定輸出介面送出 |
| 時間尺度 | 較慢（毫秒～分鐘，隨網路變動時才更新） | 極快（奈秒～微秒，每個封包） |
| 實作 | 多半以軟體、由 CPU 執行 | 多以專用硬體（ASIC、TCAM）執行 |
| 範圍 | 全域觀點（需知道網路拓撲） | 區域動作（只決定下一跳） |
| 例子 | OSPF 計算最短路徑 | 收到封包，查表後從 eth1 送出 |

**四、關係**：Routing 產生並維護轉發表，Forwarding 使用轉發表。沒有 Routing，Forwarding 沒有依據；沒有 Forwarding，Routing 的結果無法落實。（軟體定義網路 SDN 把控制平面集中到控制器，資料平面留在交換器，就是兩者分離的典型例子。）`
    },

      answer: `**（一）何謂 Replay Attack（5 分）**

**重放攻擊（Replay Attack，又稱重播攻擊）** 是指攻擊者**截取**一段**合法的通訊內容（如認證訊息、交易指令、Token）**，在之後**原封不動地重新送出**，藉此冒充合法使用者或重複執行動作。

**關鍵**：攻擊者**不需要破解加密或得知內容**，只要複製並重送封包。即使內容經過加密或雜湊，只要系統只驗證「內容是否正確」而不檢查「是否是新的」，攻擊就可能成功。

**（二）重放攻擊引發的資安危害（5 分）**

| 情境 | 危害 |
|---|---|
| **身分認證被繞過** | 截取登入時的認證封包（如雜湊後的密碼、Cookie、Session Token、Kerberos 票證）重送，直接冒充使用者登入；如無鑰匙遙控系統（車用遙控鑰匙）被錄下開鎖訊號後重放而開門 |
| **重複交易與金融損失** | 截取一筆轉帳、付款或訂單指令並重送，導致**重複扣款、重複轉帳**、重複下單 |
| **未授權的指令執行** | 重放 IoT 設備、工控系統的控制指令（如開閘、啟動），造成實體損害 |
| **阻斷或混亂服務** | 大量重放造成伺服器資源耗用、資料不一致 |
| **洩漏與破壞資料完整性** | 重放舊的資料封包或舊的設定，使系統回到舊狀態（如舊的路由更新） |
| **舉例** | 對 Wi-Fi 中的 WEP／舊版協定重放封包以蒐集資料來破解金鑰；重放簡訊驗證碼、HTTP 請求（Session 劫持） |

**（三）如何防範重放攻擊（5 分）**

核心思想：**讓每一則訊息都「只能使用一次」且「具有時效性」**，使舊訊息失效。

| 防範方法 | 說明 |
|---|---|
| **隨機數（Nonce）／挑戰回應** | 伺服器每次認證都發送一個**隨機且不重複的挑戰值（nonce）**，使用者須用它計算回應（如 HMAC）；舊回應因為 nonce 不同而失效 |
| **時間戳記（Timestamp）** | 訊息中加入時間，**超過容許時間窗**就拒絕；需同步時間（如 Kerberos 要求時鐘誤差在數分鐘內） |
| **序號／計數器（Sequence number）** | 每則訊息帶遞增的序號，接收端記錄已收序號，**拒絕重複或過舊的序號**（如 IPsec 的反重放視窗、TLS 記錄序號） |
| **一次性憑證（One-time token）** | 一次性密碼（OTP）、單次有效的 Token／簽章 URL、CSRF Token，使用後立即作廢 |
| **會話金鑰與短效期** | 每次會話使用**新的會話金鑰**；縮短 Session／Token 有效期限，登出時使其失效 |
| **訊息鑑別碼與數位簽章** | 以 HMAC 或簽章保護訊息（含 nonce／時間戳），防止攻擊者修改後重送 |
| **使用安全通道** | 採用 **TLS／IPsec** 加密與完整性保護，其協定內建序號與反重放功能 |
| **交易層的防護** | 交易編號（Idempotency key）去重、金額簽署、重要交易多因素驗證 |
| **車用遙控與 IoT** | 使用**滾動碼（rolling code）** |

**結論**：重放攻擊不需破密，防範重點在於確保訊息的「**新鮮度**」——以 nonce、時間戳記或序號等機制，加上安全通道，使重放的舊訊息被拒絕。`

    {
      id: "loc3-net-105-4", no: "四", topic: "sec", topicName: "資通網路與安全",
      title: "TCP 流量控制與壅塞控制的原理與差異",
      score: 15,
      question: `在 TCP 相關控制機制中，請回答下列問題：（每小題 5 分，共 15 分）
（一）TCP Flow Control 運作原理。
（二）TCP Congestion Control 運作原理。
（三）比較說明 TCP Flow Control 與 TCP Congestion Control 之差異。`,
      answer: `**（一）TCP 流量控制（Flow Control）的運作原理（5 分）**

**目的**：避免**傳送端送得太快，使接收端來不及處理而緩衝區溢位**。屬於「**端對端、兩端點之間的速度配合**」。

**機制：滑動視窗（Sliding Window）與接收視窗（rwnd）**

1. 接收端有一個接收緩衝區，每個 ACK 都在 TCP 表頭的**視窗大小（Window）** 欄位**通告目前剩餘可用空間**，稱為 **接收視窗（rwnd, receive window）**。
2. 傳送端保證**尚未被確認的資料量不超過 rwnd**：\`LastByteSent − LastByteAcked ≤ rwnd\`。
3. 接收端處理（讀取）資料後，緩衝區空出空間，視窗變大；若來不及處理，緩衝區變滿，視窗縮小，**最後通告 rwnd = 0，傳送端暫停傳送**。
4. rwnd = 0 時，傳送端會定時送出**視窗探測（Window Probe）** 小封包，查詢接收端的視窗是否已重新開啟，避免死鎖。
5. 其他：**避免糊塗窗口症候群（Silly Window Syndrome）**（Nagle 演算法與 Clark 的接收端策略）。

**（二）TCP 壅塞控制（Congestion Control）的運作原理（5 分）**

**目的**：避免**過多資料湧入網路，使中間路由器壅塞**而造成封包遺失與延遲（崩潰）。屬於「**對整個網路的保護**」，傳送端必須自行推測網路狀況（TCP 沒有明確回饋）。

**機制：擁塞視窗（cwnd）與 AIMD**

1. 傳送端維護**擁塞視窗 cwnd**；實際可送出的資料量 = \`min(cwnd, rwnd)\`。
2. **慢啟動（Slow Start）**：cwnd 從小值（1 MSS）起，每收到一個 ACK 加 1 MSS，每個 RTT **加倍**（指數成長），直到達**慢啟動門檻值 ssthresh**。
3. **壅塞避免（Congestion Avoidance）**：cwnd ≥ ssthresh 後，每個 RTT 只加 **1 MSS**（線性成長）。
4. **偵測壅塞（以封包遺失為訊號）並降低速率**：
   - **逾時**：ssthresh = cwnd / 2，cwnd = 1 MSS，重新慢啟動。
   - **收到 3 個重複 ACK**：**快速重傳**遺失的區段，ssthresh = cwnd / 2，cwnd = ssthresh，進入**快速恢復**，之後轉為壅塞避免（TCP Reno）。
5. 整體呈現「**加法增加、乘法減少（AIMD）**」的鋸齒狀變化，使多個連線公平共享頻寬。

**（三）兩者差異比較（5 分）**

| 比較項目 | 流量控制（Flow Control） | 壅塞控制（Congestion Control） |
|---|---|---|
| **目的／保護對象** | 保護**接收端**不被壓垮（緩衝區不溢位） | 保護**網路**（路由器、鏈路）不被壅塞 |
| **問題來源** | 傳送端與接收端**處理速度不匹配** | **網路整體負載過大**，容量不足 |
| **作用範圍** | 兩個端點之間（端對端的局部問題） | 全域性，涉及整條路徑與所有共享該網路的流量 |
| **控制變數** | **接收視窗（rwnd）**，由接收端明確通告 | **擁塞視窗（cwnd）**，由傳送端自行推測與調整 |
| **回饋資訊** | 接收端在 ACK 中**明確告知**剩餘緩衝區 | **隱含**：依封包遺失、逾時、重複 ACK（或延遲、ECN）推測 |
| **演算法** | 滑動視窗、視窗探測 | 慢啟動、壅塞避免、快速重傳、快速恢復（AIMD） |
| **實際傳送上限** | \`min(cwnd, rwnd)\`：兩者共同決定，取較小者 | 同左 |
| **失敗後果** | 接收端緩衝區溢位，資料被丟棄 | 路由器佇列溢位、封包大量遺失、網路崩潰 |

**重點整理**：流量控制是「**接收端告訴傳送端：我還吃得下多少**」；壅塞控制是「**傳送端自己判斷：網路還承受得了多少**」。傳送端同時遵守兩者，取較小的視窗。`
    },
    {
      id: "loc3-net-105-5", no: "五", topic: "sec", topicName: "資通網路與安全",
      title: "OTT、CDN、Web Caching 三種數位內容相關網路服務",
      score: 15,
      question: `請說明下列數位內容相關網路服務名稱：（每小題 5 分，共 15 分）
（一）OTT
（二）CDN
（三）Web Caching`,
      answer: `**（一）OTT（Over-The-Top）（5 分）**

- **全名**：Over-The-Top，意指「**越過（繞過）傳統電信業者與有線電視業者的營運平台**」，**直接透過網際網路向使用者提供內容與服務**。
- **說明**：內容業者不需自建網路，利用使用者已有的寬頻或行動網路，把影音、通訊等服務送到各種終端（手機、智慧電視、電腦）。電信業者只提供「管道」（頻寬），不參與內容營運。
- **例子**：影音串流（Netflix、Disney+、YouTube、friDay 影音）、即時通訊與通話（LINE、WhatsApp）、音樂（Spotify）、直播平台。
- **特點與影響**：隨選、跨裝置、訂閱制；對電信業者造成語音與簡訊收入的衝擊（流量大增卻無對應收入，引發「網路中立性」與費用分攤爭議）；依賴 CDN 與自適應串流（HTTP 串流）提供品質。

**（二）CDN（Content Delivery Network，內容傳遞網路）（5 分）**

- **全名**：Content Delivery Network（內容傳遞／分發網路）。
- **說明**：業者在世界各地**部署大量分散的邊緣伺服器（Edge server／PoP）**，把網站或影音內容**複製（快取）到離使用者較近的節點**；使用者的請求會被**導向最近、最適合的節點**，而不是遠方的來源伺服器（Origin）。

\`\`\`htmldiagram
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:'Noto Sans TC',sans-serif;font-size:13px;margin:.4rem 0"><span style="background:#1f5673;color:#fff;padding:5px 10px;border-radius:6px">使用者<br><small>請求內容</small></span><span>→</span><span style="background:#8a3324;color:#fff;padding:5px 10px;border-radius:6px">DNS／任播導向<br><small>選擇最近最佳的節點</small></span><span>→</span><span style="background:#2f6b4f;color:#fff;padding:5px 10px;border-radius:6px">邊緣伺服器<br><small>命中快取直接回應</small></span><span>→</span><span style="background:#6a4c93;color:#fff;padding:5px 10px;border-radius:6px">來源伺服器<br><small>未命中才回源取得</small></span></div>
\`\`\`

- **運作**：靠 **DNS 重新導向**（回覆最近節點的 IP）或 **Anycast 任播** 導流；邊緣節點命中快取就直接回覆，沒有才向來源取得並快取。
- **好處**：降低延遲、減輕來源伺服器與骨幹頻寬負擔、提高可用性與抗 DDoS 能力、改善串流品質。
- **例子**：Akamai、Cloudflare、Amazon CloudFront、Google Cloud CDN。是 OTT 影音服務不可或缺的基礎設施。

**（三）Web Caching（網頁快取）（5 分）**

- **說明**：把**曾經取得的網頁與物件暫存**在離使用者較近的位置，下次有相同請求時，**直接從快取回覆，不必再向原始伺服器取得**。常見位置有：瀏覽器快取、**代理伺服器／快取伺服器（Proxy Cache）**（組織或 ISP 設置）、反向代理與 CDN。
- **運作**：
  1. 用戶端（或其代理）向快取伺服器請求物件；
  2. 若快取中有且**尚未過期**（依 \`Cache-Control\`、\`Expires\`），直接回應（**Cache hit**）；
  3. 否則快取伺服器向來源伺服器取得、回覆用戶端並儲存一份（**Cache miss**）；
  4. 過期後以**條件式 GET**（\`If-Modified-Since\`、\`ETag\`）詢問來源是否有更新，沒變就回 304 Not Modified，不必重傳內容。
- **好處**：縮短回應時間、減少對外網路流量與頻寬費用、減輕來源伺服器負載。
- **限制**：動態內容與個人化內容不易快取；需處理內容更新（一致性）與隱私；HTTPS 流量需另行處理。
- **與 CDN 的關係**：CDN 可視為由內容業者部署的**大規模、分散式 Web Caching**。`
    },
    {
      id: "loc3-net-105-6", no: "六", topic: "sec", topicName: "資通網路與安全",
      title: "TDMA、FDMA、CDMA 的運作模式與頻寬使用比較",
      score: 20,
      question: `就常見的多重接取（Multiple Access）技術，請回答下列問題：（每小題 5 分，共 20 分）
（一）TDMA 運作模式。
（二）FDMA 運作模式。
（三）CDMA 運作模式。
（四）請從使用者觀點比較上述三種接取技術在頻寬資源上使用之差異。`,
      answer: `**背景**：多重接取（Multiple Access）是讓**多個使用者共用同一個通訊媒介**（如同一段無線頻譜）而不互相干擾的方法。三種基本方式是**切頻率、切時間、切代碼**。

\`\`\`htmldiagram
<svg viewBox="0 0 600 190" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:600px;font-family:'Noto Sans TC',sans-serif;background:#fffdf8;border:1px solid #d8d0bf;border-radius:6px;display:block">
  <g font-size="12" text-anchor="middle">
    <text x="100" y="18" font-weight="700" fill="#1f5673">FDMA</text><text x="300" y="18" font-weight="700" fill="#8a3324">TDMA</text><text x="500" y="18" font-weight="700" fill="#2f6b4f">CDMA</text>
    <g stroke="#fff"><rect x="40" y="30" width="120" height="30" fill="#1f5673"/><rect x="40" y="60" width="120" height="30" fill="#4d8aa8"/><rect x="40" y="90" width="120" height="30" fill="#1f5673"/><rect x="40" y="120" width="120" height="30" fill="#4d8aa8"/></g>
    <text x="100" y="170" fill="#4a5859">各用戶各占一個頻帶（整段時間）</text>
    <g stroke="#fff"><rect x="240" y="30" width="30" height="120" fill="#8a3324"/><rect x="270" y="30" width="30" height="120" fill="#c4705f"/><rect x="300" y="30" width="30" height="120" fill="#8a3324"/><rect x="330" y="30" width="30" height="120" fill="#c4705f"/></g>
    <text x="300" y="170" fill="#4a5859">各用戶輪流占整個頻帶（各一時槽）</text>
    <rect x="440" y="30" width="120" height="120" fill="#e3ecde" stroke="#2f6b4f"/>
    <text x="500" y="85" fill="#2f6b4f">全部用戶</text><text x="500" y="102" fill="#2f6b4f">同時、同頻</text><text x="500" y="119" fill="#2f6b4f">以不同代碼區分</text>
    <text x="500" y="170" fill="#4a5859">垂直軸：頻率；水平軸：時間</text>
  </g>
</svg>
\`\`\`

**（一）TDMA（Time Division Multiple Access，分時多重接取）（5 分）**

- 把通道**依時間切成重複的框（frame）**，每個框再分成多個**時槽（time slot）**，**每個使用者被分配固定的時槽**，只能在自己的時槽內使用**整個頻寬**傳送資料。
- 各使用者**輪流**使用通道；需要精確的**時間同步**與保護時間（guard time）避免相鄰時槽重疊。
- 例：GSM（2G）、T1 電話線、衛星通訊；藍牙也屬於時槽式。
- 優點：同一頻道可容納多人，彈性分配時槽數；缺點：需要嚴格同步，使用者只能在輪到自己時傳送。

**（二）FDMA（Frequency Division Multiple Access，分頻多重接取）（5 分）**

- 把可用頻寬**切成多個互不重疊的頻帶（頻道）**，**每個使用者獨占一個頻道**，**在整個通話期間持續使用**（時間不分割）。頻帶之間留**保護頻帶（guard band）** 避免鄰頻干擾。
- 例：傳統類比行動電話（AMPS，1G）、廣播電台與電視頻道、有線電視、ADSL 以不同頻段區分上行與下行。
- 優點：技術簡單，不需要時間同步；缺點：頻道固定分配，**使用者沒有傳資料時頻寬仍被占用而浪費**，保護頻帶也耗頻寬。

**（三）CDMA（Code Division Multiple Access，分碼多重接取）（5 分）**

- **所有使用者在同一時間、使用同一段（寬）頻帶**傳送，但每個使用者被分配一個**獨特的展頻碼（正交的擴頻碼，chipping code）**。
- **傳送端**把每個資料位元乘上自己的碼序列（擴展到寬頻帶）；**接收端**用同一個碼與收到的混合訊號做**相關運算（內積）**，還原出自己的資料，其他使用者的訊號因碼正交而相互抵消，只表現為雜訊。
- 例：IS-95／cdma2000（2G／3G）、WCDMA（3G）、GPS 衛星訊號。
- 優點：**頻譜使用率高**、**軟式容量**（使用者數可彈性增加，只是干擾逐漸上升）、抗窄頻干擾與多重路徑、保密性好、易於軟式換手；缺點：需要**精確的功率控制**（遠近效應）、編碼設計與接收端運算較複雜。

**（四）從使用者觀點比較頻寬資源的使用（5 分）**

| 比較項目 | FDMA | TDMA | CDMA |
|---|---|---|---|
| 使用者占用的頻寬 | **整個時間**，但只擁有**一小段固定頻帶**（窄頻） | **整段頻寬**，但**只有自己的時槽**（不連續） | **整段寬頻帶、全部時間**（但被展頻碼擴展，與其他人共用） |
| 使用者數量上限 | **硬性限制**：頻道數 = 總頻寬 ÷ 單一頻道寬 | **硬性限制**：時槽數 | **軟性限制**：容量隨干擾逐漸下降，使用者增加時各人品質變差 |
| 單一使用者可得的速率 | 固定（頻道寬決定） | 固定（時槽比例決定），可依需求配置多個時槽 | 依擴頻增益；各用戶共享干擾預算 |
| 閒置時資源 | 頻道被占住，**浪費** | 時槽被占住，**浪費** | **不浪費**：不傳送時不產生干擾，其他用戶受益（可利用語音靜默） |
| 同步需求 | 不需要 | **需要嚴格時間同步** | 需要碼同步與功率控制 |
| 干擾與保護 | 需要保護頻帶 | 需要保護時間 | 靠碼的正交性，用戶間為「共享的雜訊」 |
| 頻寬彈性 | 低 | 中（可分配不同數量時槽） | 高 |
| 代表系統 | 1G 類比電話、廣播電台 | 2G GSM | 3G WCDMA、cdma2000 |

**小結**：FDMA 是「**一人一條路**」（每人一個頻道），TDMA 是「**輪流使用同一條路**」，CDMA 是「**大家同時在同一條路，用不同語言交談**」。現代 4G／5G 的 OFDMA 則結合了分頻與分時，以子載波與時槽為單位動態分配資源。`
    }
  ]

{

  questions: [
    {
      id: "loc3-net-104-1", no: "一", topic: "sec", topicName: "資通網路與安全",
      title: "CRC 循環冗餘檢驗的運作原理與公式",
      score: 20,
      question: `循環冗餘檢驗（Cyclic Redundancy Check, CRC）是普遍被使用的鏈接層錯誤偵測技術。假設資料 D 的長度為 k bits，檢驗碼 R 的長度為 n bits，n 小於 k，G 為生成多項式（Generator Polynomial），長度為 n+1 bits。請輔以公式說明 CRC 的運作原理。（20 分）`,
      answer: `**一、基本想法**

CRC 把資料看成一個**二進位多項式**，在發送端附加 n 個位元的檢驗碼 R，使得「**資料加上檢驗碼之後的整串位元，恰好能被生成多項式 G 整除**」（模 2 運算）；接收端用 G 去除收到的整串位元，**餘數為 0 就視為沒有錯誤**，否則表示傳輸中出錯。

**所有運算均為「模 2 運算」**：加法與減法都是 **XOR（互斥或）**，沒有進位與借位。

**二、符號與公式**

- D：資料，k 位元。
- G：生成多項式（雙方事先約定），**n + 1 位元**，且最高位元為 1（如 G = 1001 對應 x³ + 1）。
- R：檢驗碼（FCS），**n 位元**，是要求出的值。
- 實際傳送的整串位元：\`<D, R>\`，長度 \`k + n\`，數學上為 \`D · 2^n XOR R\`（把 D 左移 n 位，再把 R 放在最後 n 位）。

**要求**：\`D · 2^n  XOR  R\` 能被 G 整除，也就是存在整數 \`n'\` 使得：

\`\`\`
D · 2^n  XOR  R  =  n' · G
\`\`\`

兩邊同時 XOR R：

\`\`\`
D · 2^n  =  n' · G  XOR  R
\`\`\`

這個式子說明：**把 D · 2^n 除以 G，餘數正好就是 R**。因此：

\`\`\`
R  =  remainder( D · 2^n  /  G )     （模 2 除法，取餘數）
\`\`\`

這個餘數長度一定是 n 位元（餘數的位數必然小於 G 的 n + 1 位元，不足 n 位元前面補 0）。

**三、發送端與接收端的步驟**

| 步驟 | 發送端 | 接收端 |
|---|---|---|
| 1 | 取得資料 D（k 位元），雙方事先約定生成多項式 G | 收到整串 \`<D, R>\`（k + n 位元） |
| 2 | 在 D 後面補 n 個 0，即 \`D · 2^n\` | 用 G 對整串收到的位元做**模 2 除法** |
| 3 | 以模 2 除法計算 \`D · 2^n ÷ G\`，**餘數即 R** | **餘數 = 0 → 接受（視為無錯誤）**；餘數 ≠ 0 → 偵測到錯誤，丟棄 |
| 4 | 傳送 \`<D, R>\` | |

**四、計算範例**

資料 D = \`101110\`（k = 6），生成多項式 G = \`1001\`（x³ + 1，n = 3）：

1. 補 3 個 0：\`D · 2^3 = 101110000\`
2. 模 2 除法：每遇到最高位為 1，就把 G（1001）對齊該位置做 XOR；最高位為 0 則直接略過：

| 步驟 | 對齊位置 | 運算 | 結果（整串 9 位元） |
|---|---|---|---|
| 起始 | — | \`D · 2^3\` | 101110000 |
| ① | 第 1 位起 | 1011 XOR 1001 = 0010 | 001010000 |
| ② | 第 3 位起 | 1010 XOR 1001 = 0011 | 000011000 |
| ③ | 第 5 位起 | 1100 XOR 1001 = 0101 | 000001010 |
| ④ | 第 6 位起 | 1010 XOR 1001 = 0011 | 000000011 |

最後三位 \`011\` 即為餘數。
3. 因此 **R = 011**，實際傳送的是 \`101110 011\`（即 101110011）。
4. 驗算：接收端用 1001 除 \`101110011\`，餘數為 0，通過檢查。

**五、錯誤偵測能力**

CRC 的偵測能力取決於 G 的設計。以 r（= n）位元的 CRC 而言：

| 錯誤類型 | 偵測能力 |
|---|---|
| 所有單一位元錯誤 | 全部可偵測（G 含至少兩項，且 x^0 項不為 0） |
| 所有雙位元錯誤、奇數個位元錯誤 | 在適當的 G（如含因式 x + 1）下可偵測 |
| 長度 ≤ n 的**突發錯誤（burst error）** | **全部**可偵測 |
| 長度 = n + 1 的突發錯誤 | 偵測機率 1 − 2^(−(n−1)) |
| 更長的突發錯誤 | 偵測機率 1 − 2^(−n) |

實務使用：乙太網路與 Wi-Fi 的 **CRC-32**（G 為 33 位元，n = 32）、HDLC／PPP 的 CRC-16、CRC-CCITT。

**六、特點**

- 以硬體（移位暫存器與 XOR 閘）即可高速實作，所以適合鏈結層。
- 只能偵測錯誤，**不能更正**（發現錯誤後由重傳處理）；也**不防惡意竄改**（攻擊者可重新計算 CRC）。`

**二、彼此間的關連**

- **SSL 是 Netscape 公司在 1990 年代中期為保護網頁（HTTP）傳輸而開發的協定**：SSL 1.0 未公開發布、SSL 2.0（1995）、SSL 3.0（1996）。

- 兩者**概念與架構相同**（握手協定＋記錄協定），TLS 在演算法（如以 HMAC 取代 MAC、改進金鑰推導）與安全性上做了改良，**但 TLS 與 SSL 彼此不能互通**（需要協商）。
- **現況**：SSL 2.0、SSL 3.0 因存在嚴重弱點（如 POODLE 攻擊）**已被棄用**；TLS 1.0、1.1 也已被淘汰；目前建議使用 **TLS 1.2 與 TLS 1.3**。因為歷史因素，人們仍常泛稱「SSL」，如 SSL 憑證、SSL VPN，實際指的多半是 TLS。

      question: `Fast Retransmit 與 Fast Recovery 為 TCP 之改善機制，試述兩種機制之目的各為何？並說明兩者如何動作。（20 分）`,
      answer: `**一、背景**

傳統 TCP 判定封包遺失靠**重傳逾時（RTO, Retransmission Timeout）**：等到計時器逾時才重傳，並把 cwnd 降為 1 重新慢啟動，這使得：(1) 遺失後要**等很久**才重傳，傳輸停頓；(2) 一次輕微遺失就讓速率大幅降低，**吞吐量損失大**。

因此 TCP Reno 加入了快速重傳與快速恢復兩種機制。

**二、快速重傳（Fast Retransmit）**

**目的**：**不必等到逾時，更早發現並重傳遺失的區段**，縮短遺失造成的傳輸停頓。

**動作**：

1. 接收端收到**不連續（失序）的區段**時（例如缺少第 4 個區段，卻收到第 5、6、7 個），會對**最後一個連續收到的位置重複回覆 ACK**（都是 ACK = 4）。
2. 這些**重複 ACK（duplicate ACK）** 表示「後面的封包有收到，但中間有一個還沒到」。
3. 傳送端若連續收到 **3 個重複 ACK（共 4 個相同 ACK）**，就判定該區段（序號為 ACK 值）已遺失，**不等逾時，立即重傳該區段**。
4. （使用 3 個而不是 1 個重複 ACK，是為了避免封包只是「亂序」而被誤判為遺失。）

**三、快速恢復（Fast Recovery）**

**目的**：發生快速重傳（表示只是**輕微壅塞**，因為後續封包仍有送達，ACK 還在回來）時，**不要把傳送速率降到最低重新慢啟動**，而是**保持傳輸管線的流動**，讓速率快速恢復，提高效率。

**動作**（TCP Reno）：

1. 收到 3 個重複 ACK 並執行快速重傳後：
   - **ssthresh = cwnd / 2**（乘法減少）；
   - **cwnd = ssthresh + 3 MSS**（加上 3 個已離開網路的封包，因為已收到 3 個重複 ACK）。
2. **之後每多收到一個重複 ACK，cwnd 再加 1 MSS**（每個重複 ACK 代表有一個封包離開網路，可再送出新資料，維持管線）。
3. 當收到**新的 ACK**（確認了遺失區段之後的新資料）時，**cwnd = ssthresh**（把視窗縮回），**進入壅塞避免**（線性增加），結束快速恢復。
4. 若是**逾時**，則仍然回到 cwnd = 1 的慢啟動（較嚴重的壅塞）。

**四、效果比較**

| 事件 | 傳統（Tahoe） | 有快速重傳＋快速恢復（Reno） |
|---|---|---|
| 偵測遺失的方式 | 只能等逾時 | **3 個重複 ACK 即重傳** |
| 遺失後的 cwnd | 降為 1，**重新慢啟動** | 降為 ssthresh（約一半），**直接進入壅塞避免** |
| 傳輸停頓 | 長（等逾時＋慢啟動爬升） | 短 |
| 吞吐量 | 較低 | **較高** |

      title: "WiFi 無線主機從尋找 AP 到連上 Internet 的過程",
      score: 15,
      question: `請說明在 WiFi 網路環境下，一個無線主機（Wireless Host）從開始尋找擷取點（Access Points, APs）到連線上 Internet 之過程。若有不同尋找擷取點之過程請一併說明。（15 分）`,
      answer: `**整體流程**

\`\`\`htmldiagram
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:'Noto Sans TC',sans-serif;font-size:13px;margin:.4rem 0"><span style="background:#1f5673;color:#fff;padding:5px 10px;border-radius:6px">① 掃描 AP<br><small>被動／主動掃描</small></span><span>→</span><span style="background:#8a3324;color:#fff;padding:5px 10px;border-radius:6px">② 選擇 AP<br><small>依訊號強度與設定</small></span><span>→</span><span style="background:#2f6b4f;color:#fff;padding:5px 10px;border-radius:6px">③ 認證<br><small>Open／WPA2／WPA3</small></span><span>→</span><span style="background:#6a4c93;color:#fff;padding:5px 10px;border-radius:6px">④ 關聯<br><small>取得 AID，加入 BSS</small></span><span>→</span><span style="background:#a07e2c;color:#fff;padding:5px 10px;border-radius:6px">⑤ 取得 IP<br><small>DHCP</small></span><span>→</span><span style="background:#b5651d;color:#fff;padding:5px 10px;border-radius:6px">⑥ ARP／DNS<br><small>解析閘道與網域名稱</small></span><span>→</span><span style="background:#1f5673;color:#fff;padding:5px 10px;border-radius:6px">⑦ 連上 Internet<br><small>經 AP→路由器</small></span></div>
\`\`\`

**一、尋找擷取點（AP）：掃描（Scanning）**

802.11 無線主機（站台，STA）必須先找到可用的 AP，有兩種方式：

| 方式 | 作法 | 特點 |
|---|---|---|
| **被動掃描（Passive scanning）** | 站台在各個頻道上**監聽 AP 定期廣播的信標訊框（Beacon frame）**（通常每約 100 ms 一次，內含 SSID、BSSID、支援速率、加密方式、頻道） | 省電、不主動發射，但需要在每個頻道停留較久，**發現速度較慢** |
| **主動掃描（Active scanning）** | 站台在各頻道上**主動廣播探測請求（Probe Request）**，附近的 AP 回覆**探測回應（Probe Response）**（內容與 Beacon 類似）；若是指定 SSID（隱藏 SSID 的網路）則發送含該 SSID 的探測請求 | **速度快**，可找到隱藏 SSID 的網路，但耗電、會發射訊號 |

站台依訊號強度（RSSI）、SSID（使用者選擇或儲存的設定檔）、支援的速率與加密方式，**選擇一個 AP**；若有多個可選，通常選訊號最強者。

**二、認證（Authentication）與關聯（Association）**

1. **認證**：
   - 開放系統（Open System）：站台與 AP 交換認證訊框（形式上的認證）。
   - 若使用 **WPA2／WPA3-Personal／Enterprise**，則另做金鑰協商：**WPA2 以 4 向交握（4-way handshake）**，由 PMK 推導出每次連線的成對暫時金鑰（PTK），之後以 **AES-CCMP** 加密；企業環境以 **802.1X／RADIUS（EAP）** 認證；WPA3 改用 SAE。
2. **關聯**：站台送出**關聯請求（Association Request）**，內含 SSID 與支援速率；AP 回覆**關聯回應（Association Response）**，分配**關聯識別碼（AID）**。關聯後，站台才正式成為該 AP 所屬 **BSS** 的成員，之後所有往來的訊框都經由此 AP。
3. 在漫遊時，可使用**重新關聯（Reassociation）** 與快速漫遊（802.11r）。

**三、取得網路位址設定（網路層）**

站台透過 AP 連到有線網路後，與一般有線主機相同，需要 IP 設定：

1. **DHCP**：站台廣播 **DHCP Discover**，DHCP 伺服器回覆 **Offer**，站台送 **Request**，伺服器回 **ACK**，取得 **IP 位址、子網路遮罩、預設閘道（路由器）、DNS 伺服器位址**（DORA 四步驟）。
2. **ARP**：站台以 **ARP** 查出**預設閘道 IP 對應的 MAC 位址**（AP 轉送訊框，AP 本身作為橋接）。

**四、連線上 Internet**

1. 使用者要連網站時，先用 **DNS** 查詢網域名稱對應的 IP。
2. 站台把封包送給**預設閘道**（訊框的位址 1 為 AP 的 BSSID、位址 3 為閘道 MAC），**AP 將 802.11 訊框轉換為乙太網路訊框**，轉送給路由器。
3. 路由器（通常配合 NAT）將封包路由到 Internet，回程封包依相同路徑返回。
4. 之後依 CSMA/CA 競爭通道，使用 TCP／HTTP 等協定傳輸資料；站台也持續依訊號強度，必要時漫遊到另一個 AP。

**五、補充：不同的尋找 AP 流程**

- **被動與主動掃描**（如上），多數裝置混合使用：先被動聽，再主動探測。
- **儲存的網路（Preferred networks）**：裝置依先前連線過的 SSID 清單，**主動送出指定 SSID 的 Probe Request**，快速重連。
- **Ad hoc（IBSS）模式**：沒有 AP，站台之間直接建立點對點的網路，用掃描找 IBSS，或自行建立。
- **WPS／熱點 2.0（Passpoint）／公共 Wi-Fi**：連線後可能還需經過**強制入口網頁（Captive Portal）** 認證，才能真正上網。
- **漫遊（Roaming）**：移動時持續掃描鄰近 AP，訊號變差時重新關聯，不需重新取得 IP（同一子網路）。`
    }

      question: `以網路管理的標的而言，除設備管理之外，還有那些？請列舉 3 種並說明之。（15 分）`,
      answer: `**一、網路管理的功能架構（ISO FCAPS）**

網路管理的標的，除了**設備（組態與資產）管理**之外，依 ISO 網路管理模型（FCAPS）還有下列面向：

| 縮寫 | 管理領域 | 說明 |

**二、列舉三種並說明（15 分）**

**1. 故障管理（Fault Management）**

- **例**：交換器介面中斷、設備離線、鏈路中斷時，管理系統自動告警並通知維運人員。

**2. 效能管理（Performance Management）**

- **目的**：**量測、分析與調校網路效能**，確保服務品質並預測容量需求。
- **內容**：蒐集效能指標，如**頻寬使用率、吞吐量、延遲、抖動、封包遺失率、設備 CPU 與記憶體使用率**；設定門檻與趨勢分析、容量規劃、**服務品質（QoS）** 管理；工具如 MRTG、Cacti、NetFlow／sFlow 分析。

**4. （補充）其他標的**

**三、管理協定與工具**：**SNMP** 為最常用的管理協定（輪詢與 Trap），另有 Syslog、NetFlow、NETCONF／RESTCONF（以 YANG 模型）、遠端監控 RMON 等。`

    {
      id: "loc3-net-103-2", no: "二", topic: "sec", topicName: "資通網路與安全",
      title: "光纖衰減計算：0.8 dB/km、25 km、發射 5 W，接收端功率",
      score: 15,
      question: `假設光纖訊號（使用 0.85 μ 波長光源）傳遞之訊號衰減為 0.8 dB/km，如果傳送端與接收端之距離為 25 公里（km），並且傳送端之訊號強度為 5 Watt，請問接收端所收到之訊號強度為多少 Watt？（15 分）`,
      answer: `**一、觀念：分貝（dB）與功率比**

分貝用來表示兩個功率的比值：

\`\`\`
衰減（dB） = 10 · log10( P_in / P_out )
\`\`\`

若衰減為 A dB，則 \`P_out = P_in × 10^(−A/10)\`。

**二、計算**

1. **總衰減** = 衰減率 × 距離 = \`0.8 dB/km × 25 km = 20 dB\`
2. 換成功率比：\`10 · log10(P_in / P_out) = 20\` → \`P_in / P_out = 10^(20/10) = 10^2 = 100\`
3. **接收端功率**：

\`\`\`
P_out = P_in / 100 = 5 W ÷ 100 = 0.05 W
\`\`\`

**答：接收端所收到的訊號強度為 0.05 Watt（50 mW）。**

**三、驗算**

- 每 10 dB 功率變為原來的 1/10；20 dB 就是兩次 1/10，即 1/100。
- \`5 W → 0.5 W（−10 dB）→ 0.05 W（−20 dB）\`。

**四、補充**

- 以 dBm 表示：5 W = 37 dBm，經 20 dB 衰減後為 17 dBm，對應 \`10^(17/10) ≈ 50 mW\`，結果相同。
- 若有中繼器或光放大器（如 EDFA），可補償衰減；實際設計需預留足夠的**鏈路預算（Link Budget）**，保證接收端功率高於接收靈敏度。`

    {
      id: "loc3-net-103-3", no: "三", topic: "sec", topicName: "資通網路與安全",
      title: "QPSK 改為 QAM-256 後的網速計算",
      score: 15,
      question: `假設你的筆記型電腦之無線網卡的 upstream（上行）channel 採用 QPSK 為其調變技術，此時無線 AP 端之網速為 9 Mbps，如果你移動後，無線 AP 發現訊號品質（Signal to noise ratio, SNR）變得很好而要求你筆記型電腦之無線網卡改採 QAM-256 為其調變技術，在其他條件均相同的情況下，請問此時無線 AP 端之網速會變成多少 Mbps？（15 分）`,
      answer: `**一、觀念**

資料速率（bps）= **符號率（baud rate）× 每個符號攜帶的位元數**。

\`每符號位元數 = log2(星座圖的點數 M)\`

在「其他條件均相同」（頻寬與符號率不變）時，網速只取決於調變方式每個符號能攜帶幾個位元。

**二、兩種調變方式**

| 調變 | 星座點數 M | 每符號位元數 log2(M) |
|---|---|---|
| QPSK | 4 | log2(4) = **2** |
| QAM-256 | 256 | log2(256) = **8** |

**三、計算**

1. QPSK 時：\`9 Mbps = 符號率 × 2\` → **符號率 = 4.5 Msymbols/s**。
2. 改為 QAM-256，符號率不變：\`速率 = 4.5 M × 8 = 36 Mbps\`。
3. 也可直接用比值：\`9 Mbps × (8 / 2) = 36 Mbps\`。

**答：改採 QAM-256 後，無線 AP 端的網速變為 36 Mbps（為原來的 4 倍）。**

**四、補充**

- 這就是**自適應調變（Adaptive Modulation）／速率調整（Rate Adaptation）** 的概念：訊號品質（SNR）好時用高階調變（QAM-256）得到高速率；訊號差時降為 QPSK 或 BPSK，犧牲速率以維持可靠傳輸。
- 高階調變的星座點之間距離較近，對雜訊更敏感，因此需要較高的 SNR 才能維持相同的錯誤率。`
    },
    {
      id: "loc3-net-103-4", no: "四", topic: "sec", topicName: "資通網路與安全",
      title: "無線網路可能遭遇的五種安全威脅",
      score: 15,
      question: `對於無線網路可能會遭遇之安全威脅，試列舉出五種類型並說明之。（15 分）`,
      answer: `無線網路透過開放的**無線電波**傳送，任何在訊號範圍內的人都可能接收或發射，因此面臨比有線網路更多的威脅。五種主要類型如下：

| 威脅 | 說明 | 防範方式 |
|---|---|---|
| **1. 竊聽（Eavesdropping／Sniffing）** | 攻擊者在涵蓋範圍內，用無線網卡的監聽模式**擷取空中傳輸的封包**，取得帳號密碼、郵件與機敏資料；屬被動攻擊，難以發現 | 使用強加密（**WPA2／WPA3**、AES-CCMP）；應用層再用 TLS／VPN |
| **2. 未授權存取與弱加密破解** | 沒有設定加密或使用易破的 **WEP**、弱密碼，攻擊者可快速破解金鑰或字典攻擊 WPA 預先共用金鑰（PSK），免費使用或進入內網；也包括**MAC 位址偽造**繞過 MAC 過濾 | 改用 WPA3／WPA2-Enterprise（802.1X）、長且複雜的密碼、停用 WPS、MAC 過濾僅作輔助 |
| **3. 偽冒（流氓）AP 與邪惡雙胞胎（Rogue AP／Evil Twin）** | 攻擊者設置**與合法 AP 相同 SSID** 的假 AP，使用者誤連後，所有流量被攔截；或員工私自架設未受管理的 AP，成為內網後門 | 使用 802.1X 與伺服器憑證驗證、無線入侵防禦系統（WIPS）偵測流氓 AP、管制私接設備 |
| **4. 中間人攻擊（Man-in-the-Middle）與重放** | 攻擊者介於使用者與 AP 之間，攔截、竄改或重放封包；也可利用 **ARP 欺騙**在同一 WLAN 內進行；或 **解除認證攻擊（Deauthentication）**迫使使用者重連以捕捉 4 向交握 | 啟用**管理訊框保護（802.11w，PMF）**、HTTPS／VPN、動態 ARP 檢測 |
| **5. 阻斷服務／干擾（Denial of Service／Jamming）** | 以強烈雜訊**干擾**頻段、大量送出解除認證或關聯請求，使合法使用者無法連線；因為使用免授權頻譜，很容易被干擾 | 多頻段與頻道規劃、頻譜監測、802.11w、定位並移除干擾源、WIPS |

**其他威脅**：

- **War driving／war chalking**：開車或步行搜尋可用且無防護的無線網路。
- **釣魚熱點與強制入口（Captive Portal）詐騙**：假的熱點登入頁騙取密碼。
- **客戶端攻擊**：攻擊使用者裝置的漏洞或自動連線行為（如 Karma 攻擊，回應所有探測請求）。
- **隱藏 SSID 的錯誤安全感**：隱藏 SSID 並無法提供真正保護。

**無線網路的整體防護建議**：採用 WPA3 或 WPA2-Enterprise；網路分段（訪客網路與內網隔離）；定期更新 AP 韌體；關閉不用的功能（WPS、遠端管理）；監控並偵測流氓 AP；使用者教育（不連來路不明的熱點，公共場所使用 VPN）。`

    {
      id: "loc3-net-103-5", no: "五", topic: "sec", topicName: "資通網路與安全",
      title: "M/M/1 排隊模型：ADSL 上行傳送 1000 位元組封包的平均延遲",
      score: 15,
      question: `假設你家申裝之 ADSL 的上行網速為 10 Mbps，而且經過測量，你家平均上行送出之資料速率為 8 Mbps，請問如果上行傳送一個封包（長度為 1000 bytes），其平均延遲時間（mean delay time）為多少秒？（假設平均延遲時間 T 服從 M/M/1 公式，T = 1 / (μ − λ)）（15 分）`,
      answer: `**一、M/M/1 模型**

M/M/1 是最基本的排隊模型：**到達為卜瓦松過程（到達率 λ）**、**服務時間為指數分配（服務率 μ）**、**單一服務台**。封包在系統中的**平均延遲時間（含排隊等待與傳送）** 為：

\`\`\`
T = 1 / (μ − λ)       （要求 λ < μ，即使用率 ρ = λ/μ < 1，系統才穩定）
\`\`\`

μ 與 λ 的單位都是「**封包／秒**」。

**二、計算**

**1. 封包長度**：\`1000 bytes × 8 = 8,000 bits\`

**2. 服務率 μ**（鏈路每秒能送出的封包數）：

\`μ = 鏈路容量 ÷ 封包長度 = 10 Mbps ÷ 8,000 bits = 10,000,000 ÷ 8,000 = 1,250 封包／秒\`

**3. 到達率 λ**（平均每秒送出的封包數）：

\`λ = 平均資料速率 ÷ 封包長度 = 8 Mbps ÷ 8,000 bits = 8,000,000 ÷ 8,000 = 1,000 封包／秒\`

**4. 平均延遲時間**：

\`\`\`
T = 1 / (μ − λ) = 1 / (1,250 − 1,000) = 1 / 250 = 0.004 秒 = 4 ms
\`\`\`

**答：平均延遲時間為 0.004 秒（4 毫秒）。**

**三、說明與驗算**

- **使用率** ρ = λ / μ = 1,000 / 1,250 = 0.8（80%）。
- 另一種寫法：\`T = (1/μ) / (1 − ρ) = 0.0008 / 0.2 = 0.004 秒\`，結果相同。
- 單純傳輸一個封包的時間為 \`8,000 bits ÷ 10 Mbps = 0.8 ms\`；因為鏈路已有 80% 負載，平均需要 4 ms，其中 **3.2 ms 是排隊等待**，這顯示使用率愈接近 1，延遲呈**非線性暴增**（若使用率到 95%，延遲將達 16 ms）。`
    },
    {
      id: "loc3-net-103-6", no: "六", topic: "sec", topicName: "資通網路與安全",
      title: "第 2、3、4 層的網路定址方式：位址名稱與位元數",
      score: 15,
      question: `請說明網路七層架構中，第二層（layer 2）、第三層（layer 3）及第四層（layer 4）的網路定址（addressing）方式為何？亦即說明這三層的位址名稱及位址大小（bits）。（15 分）`,
      answer: `**一、三層的位址整理**

| 層級 | 名稱 | 位址名稱 | 位址大小 | 表示法與範例 | 作用 |
|---|---|---|---|---|---|
| **第 2 層** | 資料鏈結層 | **MAC 位址（實體位址、硬體位址、乙太網路位址）** | **48 位元（6 位元組）** | 十六進位，如 \`00:1A:2B:3C:4D:5E\` | 識別**同一網段（鏈路）上的網路介面卡**；前 24 位元為廠商代碼（OUI），後 24 位元為廠商指定序號；用於相鄰節點之間的訊框傳送 |
| **第 3 層** | 網路層 | **IP 位址（邏輯位址）** | **IPv4：32 位元（4 位元組）**；**IPv6：128 位元（16 位元組）** | IPv4 點分十進位，如 \`192.168.1.10\`；IPv6 如 \`2001:db8::1\` | 識別**網際網路上的主機（介面）**，包含網路部分與主機部分，用於跨網路的路由 |
| **第 4 層** | 傳輸層 | **埠號（Port Number）** | **16 位元（2 位元組）**，範圍 0～65,535 | 如 HTTP 80、HTTPS 443、SSH 22、DNS 53 | 識別**主機上的應用程式（程序）／服務**，用於端點對端點的多工與解多工 |

**二、說明**

1. **第 2 層（MAC）**：位址是**平面（無階層）、全球唯一**（出廠時燒錄，也可修改），只在區域範圍內有意義；路由器轉送時會改寫來源與目的 MAC（逐跳改變）。
2. **第 3 層（IP）**：位址有**階層**（網路 ID + 主機 ID），可聚合，利於路由；封包的來源與目的 IP **端到端不變**（除了 NAT）。
3. **第 4 層（Port）**：與 IP 位址合稱 **Socket（插座）**，如 \`192.168.1.10:51234\`；**TCP 以「來源 IP、來源埠、目的 IP、目的埠」四元組識別一條連線**。埠號分為：知名埠（0～1023）、註冊埠（1024～49151）、動態／私有埠（49152～65535）。

**三、封裝時的位置**

\`\`\`
[ 乙太網路表頭：目的 MAC (48b) + 來源 MAC (48b) ] [ IP 表頭：來源 IP (32b) + 目的 IP (32b) ] [ TCP 表頭：來源埠 (16b) + 目的埠 (16b) ] [ 資料 ]
\`\`\`

一個封包送出時三層位址同時使用：MAC 找到下一跳、IP 找到目的主機、埠號找到目的程式。`

      question: `何謂 BYOD？（4 分）另請說明 BYOD 主要解決方案之三項主要功能。（6 分）`,
      answer: `**一、何謂 BYOD（4 分）**

**BYOD（Bring Your Own Device，自帶設備）** 是指**允許員工使用自己的行動裝置（智慧型手機、平板、筆電）存取公司的網路、系統與資料**來辦公。

| 面向 | 說明 |
|---|---|
| 優點 | 提高員工滿意度與生產力（使用熟悉的裝置、隨時隨地工作）；降低企業採購與維護設備的成本 |
| 風險 | 個人與公司資料混用；裝置遺失或被竊導致資料外洩；裝置感染惡意程式後帶入內網；裝置種類繁多、難以管控；離職員工帶走資料；法規與隱私問題 |

**二、BYOD 主要解決方案的三項主要功能（6 分）**

| 功能 | 說明 |
|---|---|
| **1. 行動裝置管理（MDM, Mobile Device Management）** | **對裝置本身的管理**：裝置**註冊與盤點**；強制設定安全政策（螢幕鎖、密碼強度、儲存加密）；偵測越獄／Root 裝置並拒絕存取；**遠端鎖定與遠端清除（Remote wipe）**（遺失或離職時）；定位；推送設定檔與應用程式 |
| **2. 行動應用程式與資料管理（MAM／MCM；容器化）** | **把公司資料與個人資料隔離**：公司應用程式與資料放在**加密的安全容器（Container／Work profile）** 中，只對公司容器做管控與清除，**不干預個人資料**（兼顧隱私）；管控複製貼上、截圖與分享；應用程式白名單／黑名單；公司內部 App Store |
| **3. 網路存取控制與身分驗證（NAC／IAM）** | **控制「誰與哪些裝置」可以進網**：使用者認證（802.1X、憑證、多因素驗證）與**裝置合規性檢查**（作業系統版本、防毒、是否越獄），不合規者隔離到受限網段或拒絕；依角色與裝置類型授權不同的存取範圍；公司資源以 VPN／零信任方式存取 |

**其他常見功能**：資料外洩防護（DLP）、威脅偵測（行動端防毒與行動威脅防禦 MTD）、日誌與稽核、政策管理與使用者同意。

**三、導入 BYOD 的管理要點**：制定**BYOD 政策**與使用者同意書（說明哪些資料會被管理、遺失時如何處理）、教育訓練、與法規遵循（個資隱私）。`

  questions: [
    {
      id: "loc3-net-102-1", no: "一", topic: "sec", topicName: "資通網路與安全",
      title: "Binary FSK 與 16-QAM 在鮑率 1000 時的資料速率",
      score: 10,
      question: `我們可以將數位的資料（digital data）轉成類比的信號（analog signal），以便可以在類比的通訊系統傳輸。
（一）如果我們用的 baud rate 為 1000，調變的方式是 Binary FSK（Frequency Shift Keying）的話，那 data rate 會是多少？（5 分）
（二）如果我們用的 baud rate 為 1000，調變的方式是 16-QAM（Quadrature Amplitude Modulation）的話，那 data rate 又會是多少？（5 分）`,
      answer: `**觀念**

\`資料速率（bps）= 鮑率（baud，每秒符號數）× 每符號位元數\`，其中 \`每符號位元數 = log2(符號種類數 M)\`。

**（一）Binary FSK（5 分）**

- Binary FSK 只有 **2 種頻率**（分別代表 0 與 1），M = 2，每符號 \`log2(2) = 1\` 位元。
- **資料速率 = 1000 × 1 = 1,000 bps**。

**（二）16-QAM（5 分）**

- 16-QAM 有 **16 種**振幅與相位的組合，M = 16，每符號 \`log2(16) = 4\` 位元。
- **資料速率 = 1000 × 4 = 4,000 bps**。

| 調變 | M | 每符號位元數 | 資料速率（鮑率 1000） |
|---|---|---|---|
| Binary FSK | 2 | 1 | **1,000 bps** |
| 16-QAM | 16 | 4 | **4,000 bps** |

**說明**：在鮑率相同（所需頻寬約略相同）時，**高階調變每個符號攜帶更多位元，資料速率更高**；代價是各符號之間較難分辨，需要較高的訊雜比。**只有在 Binary（二元）調變時，鮑率才等於位元率。**`

    {
      id: "loc3-net-102-2", no: "二", topic: "sec", topicName: "資通網路與安全",
      title: "Datagram 與 virtual circuit 交換的運作與差異；使用 virtual path 的好處",
      score: 20,
      question: `（一）請簡要說明 Datagram 以及 virtual circuit 的交換（switching），分別是如何運作的？並舉出至少兩個不同點。（10 分）
（二）使用 virtual path 的方法，主要有何好處？（10 分）`,
      answer: `**（一）Datagram 與 Virtual Circuit 交換（10 分）**

兩者都是**封包交換（packet switching）**，差別在於**是否事先建立連線（路徑）**。

**1. 資料報交換（Datagram）**——無連線（connectionless）

- **運作**：每個封包**獨立**處理；封包表頭帶有**完整的目的位址**；路由器收到封包後，依**目的位址**查路由表（轉發表）決定下一跳。不事先建立路徑，**同一來源的各封包可能走不同路徑**。
- 例：**IP 網路（網際網路）**。

**2. 虛擬電路交換（Virtual Circuit, VC）**——連接導向（connection-oriented）

- **運作**：
  1. **建立連線（Call setup）**：先由來源送出建立請求，沿途決定路徑，每個交換節點在表中記錄一筆「**（進入埠，進入的 VC 編號）→（輸出埠，輸出的 VC 編號）**」，並預留資源；
  2. **資料傳送**：每個封包的表頭只需帶**短的虛擬電路編號（VCI）**，各節點依 VCI 查表轉送，**所有封包走同一條路徑**，且依序抵達；
  3. **拆除連線（Teardown）**：結束時釋放資源。
- 例：X.25、**Frame Relay、ATM**、MPLS。

**3. 差異比較**

| 比較項目 | Datagram | Virtual Circuit |
|---|---|---|
| 是否需要建立連線 | **不需要** | **需要**（建立與拆除階段） |
| 封包表頭 | 完整目的位址（較長） | 只有 VC 編號（較短），開銷小 |
| 路徑 | **每個封包各自選擇**，可能不同 | **全程固定同一條路徑** |
| 封包順序 | 可能亂序，由接收端重組 | **保證依序**抵達 |
| 路由器狀態 | 無連線狀態（只有路由表） | 每個連線在路由器維護**狀態**（VC 表） |
| 路由器／鏈路故障 | 後續封包自動改走其他路徑，**容錯性佳** | 經過故障節點的**所有 VC 都中斷**，需重新建立 |
| 壅塞控制與 QoS | 較難預留資源 | **容易預留資源**與保證服務品質（頻寬、延遲） |
| 傳輸前的延遲 | 無建立延遲 | 有連線建立延遲 |
| 轉送速度 | 每個封包要做最長前綴比對，較慢 | 查簡單的 VC 表，**速度快** |

**（二）使用 Virtual Path 的好處（10 分）**

**Virtual Path（虛擬路徑，VP）** 是把**多條走相同路徑的虛擬電路（VC）捆綁成一束**（如 ATM 以 VPI／VCI 兩級識別），在**途中的交換節點只依 VPI 對整束 VC 做轉送，不需要逐一處理個別的 VC**。

主要好處：

| 好處 | 說明 |
|---|---|
| **簡化網路管理與控制** | 管理的單位由大量的個別 VC 變成少數的 VP，路徑規劃、頻寬配置與監控都更簡單 |
| **縮小中間交換節點的轉發表與處理量** | 中間節點只需維護與查詢 **VP 表**，不必為每一條 VC 記錄與處理，**查表更快、記憶體需求小**，提升交換速度 |
| **縮短連線建立時間** | 新的 VC 若走已建立好的 VP，只需在**兩端點**處理，**中間節點不必參與**，建立速度快（可預先建好 VP，成本低） |
| **便於資源預留與分配** | 可對整個 VP 預留頻寬，再在內部彈性配置給各 VC，也易於做**統計多工**，提高鏈路利用率 |
| **容易做流量與服務品質管理** | 對 VP 為單位做流量整形與監管（policing）、QoS 分級 |

    {

      title: "HDLC（3 位元序號、視窗 7）下接收視窗能否大於 1",
      score: 20,
      question: `假設你正在寫一個 data link layer 的接收方軟體，接收傳給你的資料。而對應的另一端使用的是 HDLC（High-Level Data Link Control），用的是 3 個 bit 的序號（sequence number）和視窗大小（window size）是七個訊框（frames）。為了增加效率，你會將未照順序（out-of-sequence）收到的訊框暫存起來，但是你無法改變傳送端的傳送軟體。
（一）請問你是否可以使用大於 1 的接收視窗（receiver window），而仍然保證此協定不會失敗？（5 分）
（二）如果可以，那接收視窗最大可以是多少，仍然保證是安全不失敗的？如果不可以，請舉例說明何種狀況下會失敗？（15 分）`,
      answer: `**答案概要**：**不可以**。在傳送端固定採用 **3 位元序號、視窗大小 7（Go-Back-N 型）** 且不能修改的前提下，接收端**只能使用大小為 1 的接收視窗**；若接收視窗大於 1，協定可能失敗（重複的舊訊框被誤當成新資料接收）。

**一、先釐清傳送端的行為**

| 項目 | 內容 |
|---|---|
| 序號空間 | 3 位元 → 序號 0～7，共 **8 個** |
| 傳送視窗 | **7**（HDLC 在 Go-Back-N 下的最大值為 2³ − 1 = 7） |
| 重傳方式 | Go-Back-N：逾時或收到 REJ 後，**從最舊未被確認的訊框開始，全部重傳** |

傳送視窗為 7 表示同一時間最多有 7 個訊框未被確認。

**二、為什麼接收視窗不能大於 1（舉例說明失敗情況）**

假設我們（接收端）把接收視窗設為 **2**，目前期望序號為 0，視窗內可接受序號 {0, 1}。

| 步驟 | 事件 | 接收端狀態 |
|---|---|---|
| 1 | 傳送端一次送出訊框 **0、1、2、3、4、5、6**（7 個，傳送視窗已滿） | 接收端全部正確收到並交給上層，視窗前進，現在期望序號為 **7**，接收視窗 = {**7, 0**} |
| 2 | 接收端對這 7 個訊框回覆的 **ACK 全部遺失**（或延遲很久） | 傳送端認為都還沒被確認 |
| 3 | 傳送端**逾時**，依 Go-Back-N **重傳訊框 0、1、2、…** | 重傳的訊框 0 進來時 |
| 4 | **訊框 0 落在接收視窗 {7, 0} 之內** | 接收端**無法分辨它是「舊訊框 0 的重傳」還是「下一輪新的訊框 0」**，把它**當作新資料接收並交給上層** |

**結果**：**同一筆資料被重複交付給上層（重複接收）——協定失敗**，資料不正確。

若接收視窗只有 1（只期望序號 7）：重傳的訊框 0 不是 7，就會被**丟棄**（視為重複），並重送 ACK，協定正常運作。

\`\`\`

**三、一般的規則（為什麼視窗大小與序號空間要配合）**

| 協定 | 接收視窗大小 | 傳送視窗大小上限 | 序號空間要求 |
|---|---|---|---|
| Go-Back-N | 1 | \`2^m − 1\`（本題 m = 3 → 7） | 傳送視窗 + 1 個序號即可 |
| Selective Repeat | **= 傳送視窗** | **\`2^(m−1)\`**（本題 m = 3 → 4） | 傳送與接收視窗的總和 ≤ 序號空間（\`W_s + W_r ≤ 2^m\`） |

Selective Repeat 要能接收亂序訊框並暫存，條件是**接收視窗與傳送視窗的總和不超過序號空間**，才能分辨新舊訊框。本題傳送端視窗為 7，而序號空間只有 8，若接收視窗 ≥ 2，兩者總和 ≥ 9 > 8，必然可能發生序號重疊而混淆；只有接收視窗為 1（7 + 1 = 8 ≤ 8）才安全。

**四、結論**

- **不可以**使用大於 1 的接收視窗：傳送端不能更動，會以 7 的視窗 Go-Back-N 傳送，接收端若把亂序訊框暫存並使用大於 1 的視窗，在 ACK 遺失、傳送端重傳時，會把舊訊框誤當成新訊框。
- 想要暫存亂序訊框，必須**雙方一起改**：把傳送視窗改為 **4（= 2^(3−1)）**，接收視窗也為 4，採用 Selective Repeat；或加大序號位元數（HDLC 擴充模式使用 7 位元序號）。`

      question: `依據 RIP（Routing Information Protocol），假設路由器（Router）A 目前的路由表（routing table）可連至四個網路（123，234，345 和 789），其內容如下：

      answer: `**一、RIP 更新規則（距離向量，Bellman-Ford）**

路由器 A 收到鄰居 D 通告的路由資訊後，對每一筆路由：

1. **把通告的跳數（hop cost）加 1**（因為要先走到 D 還需要 1 個跳點；題目已說明 A 與 D 距離 1 hop）；下一跳設為 D。
2. 與 A 現有的路由表比較：
   - **新網路（A 的表中沒有）** → **新增**一筆，下一跳為 D；
   - **已有該網路，且新路徑成本較低** → **更新**成本與下一跳（改走 D）；
   - **已有該網路，且原來的下一跳就是 D** → **一律以 D 的最新資訊為準更新**（即使成本變大，因為 D 是原本路徑的下一跳，其資訊代表該路徑的最新狀況）；
   - **成本相同或較高（且下一跳是別人）** → **不變**。

**二、逐筆計算**

| 網路 | D 通告的成本 | 加 1 後（經 D） | A 原路由表 | 判斷 | 結果 |
|---|---|---|---|---|---|
| 123 | 4 | **5** | 8，下一跳 B | 5 < 8，經 D 較佳 | **更新為 5，下一跳 D** |
| 234 | （D 未通告） | — | 5，下一跳 C | 沒有新資訊 | 不變：5，C |
| 345 | 5 | **6** | 6，下一跳 C | 6 = 6，成本沒有更低 | **不變：6，C**（不更新） |
| 567 | 7 | **8** | （原本沒有） | 新網路 | **新增：8，下一跳 D** |
| 789 | 10 | **11** | 10，下一跳 **D** | 原下一跳就是 D，需依 D 的最新資訊更新 | **更新為 11，下一跳 D** |

**三、更新後的 A 路由表**

| Network | Hop Cost | Next Router |
|---|---|---|
| 123 | **5** | **D** |
| 234 | 5 | C |
| 345 | 6 | C |
| 567 | **8** | **D** |

- 345：經 D 為 6，與現有 6 相同，沒有改善，RIP 為了避免不必要的路徑震盪，**保留原路徑**。

**隱藏終端機（Hidden Terminal）問題**：站台 A 與站台 C 都在 AP（或站台）B 的**通訊範圍內**，但 A 與 C **彼此距離太遠，互相聽不到對方**（互為隱藏終端機）。

CSMA 的做法是**傳送前先偵測（聽）通道是否忙碌**。但：

1. **A 正在傳資料給 B 時，C 聽不到 A**（超出 A 的訊號範圍），因此 C 偵測到通道「閒置」，就開始傳送給 B。
2. **兩個訊號在 B 處重疊而發生碰撞**，B 無法正確接收。
3. 問題在於：**碰撞發生在「接收端 B」，而 CSMA 的載波偵測只能偵測「傳送端附近」的狀況**，傳送端本身感測到的通道狀態，不等於接收端所感受到的狀態。
4. 無線網路也無法像有線乙太網路的 CSMA/CD 那樣「邊傳邊聽」偵測碰撞（收發同時困難、訊號強度差異大），所以碰撞發生了，傳送端也不知道，浪費了整個訊框的傳送時間。

1. **A 送 RTS（Request To Send）給 B**，內含**Duration**（預計佔用通道的時間）。
2. **B 回覆 CTS（Clear To Send）**，同樣帶有 Duration。**CTS 是 B 廣播送出的，B 範圍內的所有站台都會聽到，包括 A 聽不到的隱藏終端機 C**。
3. **C 收到 CTS 後**，雖然聽不到 A，但知道 B 即將接收資料，就**設定 NAV（Network Allocation Vector，網路分配向量）**，在 Duration 時間內**視為通道忙碌、保持沉默**（虛擬載波感測）。
4. A 收到 CTS 後，傳送資料（DATA），B 收到後回覆 ACK；整個過程 C 不會干擾。
5. 效果：以**很短的 RTS／CTS 控制訊框**作為「預約」，即使碰撞，浪費的只是短訊框而非整個長資料訊框；並解決隱藏終端機。（RTS/CTS 有額外開銷，通常只在訊框超過 **RTS 門檻**時才使用。）

**（三）是否 100% 解決？（4 分）**

**沒有 100% 解決。** 以下情況仍可能失敗：

| 失敗情況 | 說明 |
|---|---|
| **RTS 之間發生碰撞** | A 與 C 同時（或在同一個時槽內）送出 RTS 給 B，兩個 RTS 在 B 處碰撞，B 無法回覆 CTS；雙方沒收到 CTS，各自**二進位指數退避後重送**（損失較小，但仍有碰撞） |
| **隱藏終端機沒有收到 CTS** | C 當時**正在傳送或接收其他資料**，沒有聽到 B 的 CTS；或 C 剛開機／剛進入範圍；或 CTS **因雜訊、衰減而遺失** → C 未設定 NAV，仍可能傳送而干擾 |
| **C 在 B 的範圍外但仍干擾 B 的接收** | 干擾範圍通常比可解碼範圍大，C 的訊號在 B 處雖不可解碼，但仍造成足夠的干擾 |
| **RTS／CTS 未啟用或門檻設得過高** | 短訊框不使用 RTS／CTS，仍存在隱藏終端機碰撞 |
| **來自其他網路（OBSS）的干擾** | 鄰近的其他 BSS 或非 802.11 裝置（藍牙、微波爐）不遵守 NAV |
| **暴露終端機問題（Exposed terminal）** | 與 RTS/CTS 反向的問題：C 聽到 A 的 RTS 而不必要地保持沉默，降低整體效率（不是失敗，但是機制的副作用） |

**結論**：RTS／CTS 與 NAV 大幅**降低**隱藏終端機造成的碰撞，但不能完全消除。`

**二、優缺點比較（5 分）**

**IP Multicasting**

優點：

1. **效率高**：每條鏈路上同一份資料只傳一次，**不重複占用頻寬**，節省網路資源。
2. **延遲低**：路徑接近最短，由路由器直接複製。
3. **來源負擔小**：來源只送一份，與接收者數量無關，可擴充性好。
4. 群組管理（加入／離開）由網路層標準化（IGMP）。

缺點：

1. **部署困難**：需要路由器全面支援，跨網域（ISP 之間）的多播路由與管理複雜，**網際網路上很少全面啟用**。
2. 路由器需**維護群組狀態**，群組數多時擴充性有問題。
3. 缺乏可靠傳輸、壅塞控制、安全與計費機制（多播使用 UDP，需自行補強）。
4. 群組存取控制（誰能加入、誰能傳送）較難。

**ALM（應用層多播）**

優點：

1. **易於部署**：不需要修改路由器，在現有網路上就可用，**跨 ISP、跨自治系統**沒有困難。
2. **彈性高**：可在應用層加入可靠傳輸、擁塞控制、安全、認證、計費等功能，容易實驗新的服務與協定。
3. 不受 ISP 是否開放多播的限制，也避免增加網路設備的複雜度。
4. 容易做群組存取控制與成員管理。

缺點：

1. **效率較低**：同一份資料可能在同一條實體鏈路上重複傳送多次（**鏈路壓力**，link stress）；覆蓋路徑未必是最短路徑，**延遲較大**。
2. **終端主機負擔重**：轉送他人的資料要消耗自身的頻寬與運算，品質取決於成員的上傳能力。
3. 成員**加入與離開（churn）** 頻繁時，覆蓋結構需要持續維護與重建，可能中斷服務。
4. 依賴終端主機的可靠度與意願，需處理不穩定或不誠實的節點。

**三、結論**

IP Multicasting 在網路層直接複製封包，**效率最佳但部署困難**；ALM 在應用層以覆蓋網路實現，**易部署、彈性高，但效率較低、終端主機負擔較大**。實務上，企業與 IPTV 等受控網路採用 IP Multicasting，網際網路上的串流與會議則多採用 ALM、P2P 或 CDN。`

  if (!el) return;
  const ctrl = document.querySelector('.controls');
  if (window.ctlQuiet) { window.ctlQuiet(300); window.ctlHide(); }
  const top = el.getBoundingClientRect().top + window.scrollY - 10;
  const root = document.documentElement;
  root.style.scrollBehavior = 'auto';          // 跳轉用瞬間定位，避免長距離捲動動畫
  window.scrollTo(0, Math.max(0, top));
  root.style.scrollBehavior = '';
}
document.addEventListener('click', e => {
  const p = document.getElementById('jumpPanel');
  if (p && !p.hidden && !p.contains(e.target) && !e.target.closest('#jumpFab')) p.hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleJump(false); });

/* ---------- 搜尋欄位索引 ---------- */
function plainAnswer(md) {
  return String(md || '')
    .replace(/```(?:htmldiagram|tree)\n[\s\S]*?```/g, ' ')   // 圖表/樹狀圖的 HTML、JSON 不列入搜尋
    .replace(/^#{1,4}\s+/gm, '')
    .replace(/\*\*|`/g, '')
    .replace(/\|/g, ' ')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i)\s*>/gi, '');
}
function searchIndex(q) {
  return q._ix || (q._ix = {
    title: normText(stripTags(q.title)),
    ques:  normText(stripTags(q.question)),
    ans:   normText(plainAnswer(q.answer)),
    code:  normText(q.code ? q.code.text : ''),
    meta:  normText(q.year + ' ' + q.year + '年 第' + q.no + '題 ' +
                    ((TOPIC_INFO[q.topic] || {}).name || '') + ' ' + (q.part || ''))
  });
}
function searchFields(q) {
  const ix = searchIndex(q);
  return [{ t: ix.title, w: 10 }, { t: ix.ques, w: 6 }, { t: ix.ans, w: 3 },
          { t: ix.code, w: 2 }, { t: ix.meta, w: 1 }];
}
function bodyHit(q) {
  const ix = searchIndex(q);
  return state.terms.some(t => ix.ques.includes(t) || ix.ans.includes(t) || ix.code.includes(t));
}

/* ---------- 輕量 Markdown 渲染 ---------- */
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(md) {
  // 先抽出 ``` 程式碼/ASCII 區塊
  const blocks = [];
  md = md.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang, code });
    return `\u0000BLOCK${blocks.length - 1}\u0000`;
  });

  const lines = md.split('\n');
  let html = '', i = 0;

  while (i < lines.length) {
    let line = lines[i];

    // 區塊佔位
    if (/^\u0000BLOCK\d+\u0000$/.test(line.trim())) {
      const idx = parseInt(line.trim().match(/\d+/)[0]);
      const b = blocks[idx];
      // html-diagram 圍欄：直接輸出 HTML（用於圖表），不做跳脫
      if (b.lang === 'htmldiagram') {
        html += `<div class="html-diagram">${b.code}</div>`;
      } else if (b.lang === 'tree') {
        // tree 圍欄：JSON 樹資料 → 自動產生對齊的 SVG 樹狀圖
        html += `<div class="html-diagram">${renderTreeSVG(b.code)}</div>`;
      } else {
        html += `<pre><code>${escapeHtml(b.code.replace(/\n$/,''))}</code></pre>`;
      }
      i++; continue;
    }

    // 表格
    if (line.includes('|') && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])) {
      const headers = line.split('|').map(c => c.trim()).filter(c => c !== '');
      i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes('|')) {
        const cells = lines[i].split('|').map(c => c.trim());
        // 去除頭尾空白格
        if (cells[0] === '') cells.shift();
        if (cells[cells.length-1] === '') cells.pop();
        rows.push(cells);
        i++;
      }
      html += '<table><thead><tr>' +
        headers.map(h => `<th>${inline(h)}</th>`).join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>' +
          r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table>';
      continue;
    }

    // 標題
    let m;
    if ((m = line.match(/^####\s+(.*)/))) { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }
    if ((m = line.match(/^###\s+(.*)/)))  { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }

    // 無序清單
    if (/^\s*[-*]\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
        i++;
      }
      html += '<ul>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ul>';
      continue;
    }
    // 有序清單
    if (/^\s*\d+\.\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, ''));
        i++;
      }
      html += '<ol>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ol>';
      continue;
    }

    // 空行
    if (line.trim() === '') { i++; continue; }

    // 一般段落（合併連續非空行）
    let para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== '' &&
           !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) &&
           !/^#{3,4}\s/.test(lines[i]) &&
           !/^\u0000BLOCK\d+\u0000$/.test(lines[i].trim()) &&
           !(lines[i].includes('|') && i+1 < lines.length &&
             /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]))) {
      para.push(lines[i]); i++;
    }
    html += `<p>${para.map(l => breakSentences(inline(l))).join('<br>')}</p>`;
  }
  return html;
}

// 行內語法：**粗體**、`code`、<u>底線</u>
function inline(s) {
  // 先抽出 `code` 片段保護起來，其餘文字才做標籤還原與粗體
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });
  s = escapeHtml(s);
  // 還原資料中直接寫的白名單標籤（<u> 用於標示主鍵）
  s = s.replace(/&lt;(\/?)(strong|code|sub|sup|u)&gt;/g, '<$1$2>');
  s = s.replace(/&lt;br\s*\/?&gt;/g, '<br>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code>' + escapeHtml(codes[+i]) + '</code>');
  return s;
}

/* ---------- 二元樹 SVG 產生器 ---------- */
// 輸入 JSON：{ "v":"根值", "l":{子樹}, "r":{子樹} }
// l/r 可省略；空子樹可用 null。採對稱佈局：節點置於左右子樹正中央，
// 單子節點向左/右偏移固定距離，使左右視覺平衡。
function renderTreeSVG(json) {
  let root;
  try { root = JSON.parse(json.trim()); }
  catch (e) { return `<pre><code>樹資料格式錯誤</code></pre>`; }

  const NODE_R  = 21;       // 節點圓半徑
  const H_UNIT  = 32;       // 水平基本單位
  const V_GAP   = 76;       // 層與層垂直間距
  const PAD     = 30;       // 邊界留白

  // ── 遞迴佈局：回傳該子樹的 {width, rootX}（皆以 H_UNIT 為單位）──
  // 做法：左子樹先排好佔據 [0, lw)，右子樹排在 [lw+gap, ...)，
  //       父節點 x = 左右子根的中點；單子節點則讓父在子的對側偏移一格，
  //       使整棵子樹仍保有對稱的視覺重心。
  function layout(node, depth) {
    node._d = depth;
    const L = node.l, R = node.r;

    // 葉節點：寬度 1，根在 0
    if (!L && !R) {
      node._w = 1;
      node._x = 0;
      return;
    }

    // 雙子：左右子樹各自佈局，並排放置
    if (L && R) {
      layout(L, depth + 1);
      layout(R, depth + 1);
      const gap = 1;                         // 左右子樹之間留 1 單位
      // 左子樹佔 [0, L._w)，右子樹整體右移 L._w + gap
      const shift = L._w + gap;
      offset(R, shift);
      node._w = L._w + gap + R._w;
      node._x = (L._x + R._x) / 2;           // 父 = 左右子根中點
      return;
    }

    // 單左子：左子樹佈局後，父放在「左子根右側一格」
    if (L) {
      layout(L, depth + 1);
      node._x = L._x + 1;                    // 父在左子根右邊一格
      // 整棵子樹寬度 = 左子樹寬度，但要確保涵蓋父節點 x
      node._w = Math.max(L._w, node._x + 1);
      return;
    }

    // 單右子：右子樹佈局後，父放在「右子根左側一格」
    {
      layout(R, depth + 1);
      // 父在右子根左邊一格；若會 < 0 則整體右移
      let px = R._x - 1;
      if (px < 0) { offset(R, -px); px = 0; }
      node._x = px;
      node._w = Math.max(R._w + (px < 0 ? -px : 0), node._x + 1,
                         R._x + 1);
      return;
    }
  }
  // 把以 node 為根的整棵子樹所有 _x 平移 dx
  function offset(node, dx) {
    if (!node) return;
    node._x += dx;
    offset(node.l, dx);
    offset(node.r, dx);
  }
  layout(root, 0);

  // 收集座標範圍
  let minX = Infinity, maxX = -Infinity, maxDepth = 0;
  (function scan(node) {
    if (!node) return;
    minX = Math.min(minX, node._x);
    maxX = Math.max(maxX, node._x);
    maxDepth = Math.max(maxDepth, node._d);
    scan(node.l); scan(node.r);
  })(root);

  const width  = (maxX - minX) * H_UNIT + PAD * 2 + NODE_R * 2;
  const height = maxDepth * V_GAP + PAD * 2 + NODE_R * 2;

  function cx(node) { return PAD + NODE_R + (node._x - minX) * H_UNIT; }
  function cy(node) { return PAD + NODE_R + node._d * V_GAP; }

  // 第三遍：產生連線與節點
  let edges = '', nodes = '';
  function draw(node) {
    if (!node) return;
    const x = cx(node), y = cy(node);
    ['l', 'r'].forEach(side => {
      const child = node[side];
      if (child) {
        edges += `<line x1="${x}" y1="${y}" x2="${cx(child)}" y2="${cy(child)}" `
               + `stroke="#3d4456" stroke-width="2"/>`;
        draw(child);
      }
    });
    const palette = {
      accent: ['#fbf3f0', '#8a3324', '#8a3324'],
      blue:   ['#eef4f7', '#1f5673', '#1f5673'],
      gold:   ['#faf5e6', '#a07e2c', '#7a5d1e'],
      dim:    ['#e8e3d6', '#b3a98f', '#8a8266'],
      ink:    ['#1a1f2c', '#1a1f2c', '#ffffff'],
    };
    const [fill, stroke, txt] = palette[node.t] || palette.ink;
    nodes += `<circle cx="${x}" cy="${y}" r="${NODE_R}" `
           + `fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`
           + `<text x="${x}" y="${y + 5}" text-anchor="middle" `
           + `font-size="15" font-weight="700" fill="${txt}">`
           + escapeHtml(String(node.v)) + `</text>`;
  }
  draw(root);

  return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" `
       + `style="max-width:${width}px;width:100%;font-family:'Noto Sans TC',sans-serif;">`
       + edges + nodes + `</svg>`;
}

/* ---------- 程式碼語法highlight（逐字元 tokenizer，不在 HTML 上做 regex）---------- */
function highlightCode(code, lang) {
  const kw = {
    c: ['int','char','void','return','if','else','for','while','do','struct','typedef','bool','long','double','float','define','include','sizeof','static','const','unsigned','break','continue','switch','case','NULL','true','false'],
    java: ['public','private','protected','class','int','void','return','if','else','for','while','do','new','static','final','abstract','extends','implements','import','package','this','super','boolean','double','String','char','long','float','try','catch','throw','throws','interface','null','true','false','break','continue'],
    python: ['def','return','if','elif','else','for','while','import','from','as','with','try','except','finally','class','None','True','False','and','or','not','in','is','lambda','break','continue','global','print'],
    javascript: ['function','return','if','else','for','while','let','const','var','new','class','this','try','catch','import','export','from','null','true','false','typeof','break','continue','console'],
    php: ['function','return','if','else','elseif','for','while','foreach','as','class','new','public','private','echo','true','false','null','require','include']
  };
  const list = new Set(kw[lang] || kw.c);

  let out = '';
  let i = 0;
  const n = code.length;
  // 包一段文字成指定 token 樣式（內容先 escape）
  const wrap = (cls, text) => `<span class="${cls}">${escapeHtml(text)}</span>`;

  const isWordChar = c => /[A-Za-z0-9_@]/.test(c);
  const isDigit = c => c >= '0' && c <= '9';

  while (i < n) {
    const c = code[i];
    const two = code.substr(i, 2);

    // 區塊註解 /* ... */
    if (two === '/*') {
      let j = code.indexOf('*/', i + 2);
      if (j === -1) j = n; else j += 2;
      out += wrap('tok-com', code.slice(i, j));
      i = j; continue;
    }
    // 行註解 //...
    if (two === '//') {
      let j = code.indexOf('\n', i);
      if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j));
      i = j; continue;
    }
    // 行註解 #...（Python；PHP 也用，C 的 #include 也歸此類顯示為註解色以外——改用關鍵字處理）
    if (c === '#' && (lang === 'python' || lang === 'php')) {
      let j = code.indexOf('\n', i);
      if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j));
      i = j; continue;
    }
    // 字串 "..." 或 '...'（含跳脫 \）
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n && code[j] !== c) {
        if (code[j] === '\\') j++;   // 跳過跳脫字元
        j++;
      }
      j = Math.min(j + 1, n);
      out += wrap('tok-str', code.slice(i, j));
      i = j; continue;
    }
    // 數字
    if (isDigit(c)) {
      let j = i;
      while (j < n && /[0-9.]/.test(code[j])) j++;
      out += wrap('tok-num', code.slice(i, j));
      i = j; continue;
    }
    // 識別字（可能是關鍵字）
    if (isWordChar(c) && !isDigit(c)) {
      let j = i;
      while (j < n && isWordChar(code[j])) j++;
      const word = code.slice(i, j);
      if (list.has(word)) out += wrap('tok-kw', word);
      else out += escapeHtml(word);
      i = j; continue;
    }
    // 其他單一字元
    out += escapeHtml(c);
    i++;
  }
  return out;
}

function codeBlockHtml(codeObj) {
  if (!codeObj) return '';
  const langLabel = {
    c: 'C', java: 'Java', python: 'Python',
    javascript: 'JavaScript', php: 'PHP'
  }[codeObj.lang] || codeObj.lang;
  return `<div class="code-block">
    <div class="code-head">
      <span class="dots"><span></span><span></span><span></span></span>
      <span>${langLabel}</span>
    </div>
    <pre><code>${highlightCode(codeObj.text, codeObj.lang)}</code></pre>
  </div>`;
}

/* ---------- 渲染題目卡 ---------- */
/* QFENCE：考題中的程式碼圍欄 ``` 轉成程式碼區塊（避免原樣顯示、長行撐破版面） */
function qFences(h) {
  return h.replace(/```[a-z]*\n([\s\S]*?)\n```/g, (m, c) =>
    '<pre style="background:#2b303b;color:#eee;padding:.7rem 1rem;border-radius:6px;overflow-x:auto;margin:.5rem 0;font-size:.85rem;white-space:pre">' + c + '</pre>');
}

function bodyHtml(q) {
  return `      <span class="section-label q">考題</span>
      <div class="q-question">${qFences(escapeHtml(q.question)).replace(/&lt;u&gt;([\s\S]*?)&lt;\/u&gt;/g, '<u>$1</u>')}</div>
      ${q.figure ? `<div class="q-figure" style="margin:.7rem 0">${q.figure}</div>` : ''}
      <span class="section-label a">詳解</span>
      <div class="q-answer">${renderMarkdown(q.answer)}</div>
      ${q.code ? codeBlockHtml(q.code) : ''}`;
}

function fillBody(card) {
  if (card.dataset.filled) return;
  const q = ALL_Q.find(x => x.id === card.dataset.id);
  if (!q) return;
  const box = card.querySelector('.q-body');
  box.innerHTML = bodyHtml(q);
  card.dataset.filled = '1';
  if (state.terms.length) highlightIn(box, state.terms);
}

function questionCard(q, forceOpen) {
  const t = TOPIC_INFO[q.topic] || { name: q.topicName, cls: '' };
  const sb = SUB_INFO[q.sub] || null;
  const isOpen = openIds.has(q.id) || !!forceOpen;
  return `<div class="q-card ${t.cls}${isOpen ? ' open' : ''}" data-id="${q.id}"${isOpen ? ' data-filled="1"' : ''}>
    <div class="q-header" onclick="toggleCard(this)"${sb ? ` style="border-left-color:${sb.color}"` : ''}>
      <div class="q-no">${q.no}</div>
      <div class="q-headmain">
        <div class="q-title">${escapeHtml(q.title)}</div>
        <div class="q-tags">
          <span class="tag tag-topic"${sb ? ` style="background:${sb.color}"` : ''}>${sb ? sb.name : t.name}</span>
          <span class="tag tag-year">${q.year}年</span>
          ${q.part ? `<span class="tag tag-part">${escapeHtml(q.part)}　第${q.no}題</span>` : ''}
          <span class="tag tag-score">${q.score}分</span>
        </div>
      </div>
      <div class="q-toggle">+</div>
    </div>
    <div class="q-body">${isOpen ? bodyHtml(q) : ''}</div>
  </div>`;
}

/* ---------- 篩選 ---------- */
function filterQuestions() {
  let list = ALL_Q.filter(q => state.topic === 'all' || q.sub === state.topic);
  if (state.terms.length) {
    // 多關鍵字 AND、全形半形統一、依相關度排序（標題 > 考題 > 詳解 > 程式碼）
    list = list
      .map((q, i) => ({ q, i, s: scoreFields(state.terms, searchFields(q)) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.i - b.i)
      .map(x => x.q);
  }
  return list;
}

/* ---------- 渲染主內容 ---------- */
function updateSearchInfo(count, autoOpen) {
  const el = document.getElementById('searchInfo');
  if (!state.terms.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  let h = `找到 <b>${count}</b> 題 ‧ 依相關度排序`;
  if (count > 30) h += ' ‧ 結果較多，已不自動展開詳解，可再加關鍵字縮小範圍';
  else h += ' ‧ 詳解中有符合的題目已自動展開並標黃';
  el.innerHTML = h;
  el.classList.add('show');
}

function render() {
  const list = filterQuestions();
  const wrap = document.getElementById('content');
  const searching = state.terms.length > 0;
  const autoOpen = searching && list.length <= 30;
  JUMP_ITEMS = [];
  updateSearchInfo(list.length, autoOpen);

  if (list.length === 0) {
    const msg = searching
      ? `找不到符合「${escapeHtml(state.search)}」的題目。可改用較短的關鍵字；多個關鍵字請用空格分開。`
      : '找不到符合條件的題目';
    wrap.innerHTML = `<div class="empty">
      <div class="big">📭</div>
      <p>${msg}</p>
    </div>`;
    buildJump();
    syncExpandBtn();
    return;
  }

  let html = '';

  if (searching) {
    html += `<div class="group">
      <div class="group-head">
        <span class="g-badge">搜尋</span>
        <span class="g-title">依相關度排序</span>
        <span class="g-meta">共 ${list.length} 題</span>
      </div>
      ${list.map(q => questionCard(q, autoOpen && bodyHit(q))).join('')}
    </div>`;
  } else if (state.mode === 'year') {
    JUMP_TITLE = '跳到年度';
    // 依年度分組
    const byYear = {};
    list.forEach(q => { (byYear[q.year] = byYear[q.year] || []).push(q); });
    const years = Object.keys(byYear).sort((a, b) => Number(b) - Number(a));
    years.forEach(yr => {
      const qs = byYear[yr];
      const yObj = ALL_YEARS.find(y => y.year === yr);
      const totalScore = qs.reduce((s, q) => s + q.score, 0);
      JUMP_ITEMS.push({ key: 'y' + yr, label: yr, sub: `${qs.length} 題` });
      html += `<div class="group" id="g-y${yr}">
        <div class="group-head">
          <span class="g-badge">${yr} 年</span>
          <span class="g-title">${escapeHtml(yObj.subject)}</span>
          <span class="g-meta">
            ${yObj.timeLimit ? '考試時間 ' + yObj.timeLimit + '<br>' : ''}
            本頁 ${qs.length} 題 / ${totalScore} 分
          </span>
        </div>
        ${yObj.note ? `<div class="group-note">※ ${escapeHtml(yObj.note)}</div>` : ''}
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  } else {
    JUMP_TITLE = '跳到主題';
    // 依主題（子主題）分組
    const bySub = {};
    list.forEach(q => { (bySub[q.sub] = bySub[q.sub] || []).push(q); });
    SUBTOPICS.forEach(st => {
      const qs = bySub[st.key];
      if (!qs || qs.length === 0) return;
      qs.sort((a, b) => Number(b.year) - Number(a.year));
      JUMP_ITEMS.push({ key: 't' + st.key, label: st.name, sub: `${qs.length} 題` });
      html += `<div class="group" id="g-t${st.key}">
        <div class="group-head">
          <span class="g-badge" style="background:${st.color}">${st.name}</span>
          <span class="g-title">相似概念彙整</span>
          <span class="g-meta">共 ${qs.length} 題<br>跨 ${new Set(qs.map(q => q.year)).size} 個年度</span>
        </div>
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  }

  wrap.innerHTML = html;
  if (searching) highlightIn(wrap, state.terms);
  buildJump();
  syncExpandBtn();
}

function jumpTo(key) {
  toggleJump(false);
  scrollToGroup(key);
}

/* ---------- 互動 ---------- */
function toggleCard(headerEl) {
  const card = headerEl.parentElement;
  const open = card.classList.toggle('open');
  if (open) fillBody(card);
  if (open) openIds.add(card.dataset.id); else openIds.delete(card.dataset.id);
  syncExpandBtn();
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  render();
}

function updateStatBar() {
  const scope = ALL_Q;
  const yearSet = new Set(scope.map(q => q.year));
  document.getElementById('statYear').textContent = yearSet.size;
  document.getElementById('statQ').textContent = scope.length;
  document.getElementById('statTopic').textContent = new Set(scope.map(q => q.sub)).size;
}

function rebuildTopicChips() {
  const scope = ALL_Q;
  const cnt = {};
  scope.forEach(q => cnt[q.sub] = (cnt[q.sub] || 0) + 1);
  const filterRow = document.getElementById('filterRow');
  let chips = `<button class="chip ${state.topic === 'all' ? 'active' : ''}" data-topic="all"
    onclick="setTopic('all')">全部<span class="c-count">${scope.length}</span></button>`;
  SUBTOPICS.forEach(st => {
    const n = cnt[st.key] || 0;
    if (!n) return;
    chips += `<button class="chip ${state.topic === st.key ? 'active' : ''}" data-topic="${st.key}"
      onclick="setTopic('${st.key}')">${st.name}<span class="c-count">${n}</span></button>`;
  });
  filterRow.innerHTML = chips;
}

function setTopic(topic) {
  state.topic = topic;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.topic === topic);
  });
  render();
}

/* 按鈕文字依「目前畫面上的卡片是否都已展開」決定，不再用獨立旗標 */
function updateCollapseFab() {
  const f = document.getElementById('collapseFab');
  if (f) f.classList.toggle('show', !!document.querySelector('.q-card.open'));
}
/* 全部收合：收起所有詳解，並讓「正在讀的那一題」留在原本的視窗位置，不會跳到別處 */
function collapseAllCards() {
  const open = [...document.querySelectorAll('.q-card.open')];
  if (!open.length) return;
  const ctrl = document.querySelector('.controls');
  const off = (ctrl && ctrl.getBoundingClientRect().bottom > 0 ? ctrl.offsetHeight : 0) + 12;
  const anchor = open.find(c => c.getBoundingClientRect().bottom > off) || open[open.length - 1];
  const want = Math.min(Math.max(anchor.getBoundingClientRect().top, off), window.innerHeight * 0.6);
  open.forEach(c => { c.classList.remove('open'); openIds.delete(c.dataset.id); });
  syncExpandBtn();
  const root = document.documentElement;
  root.style.scrollBehavior = 'auto';
  window.scrollBy(0, anchor.getBoundingClientRect().top - want);
  root.style.scrollBehavior = '';
}
function syncExpandBtn() {
  updateCollapseFab();
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  document.getElementById('btnExpand').textContent = allOpen ? '全部收合' : '全部展開';
}
function toggleExpandAll() {
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  cards.forEach(c => {
    c.classList.toggle('open', !allOpen);
    if (!allOpen) fillBody(c);
    if (allOpen) openIds.delete(c.dataset.id); else openIds.add(c.dataset.id);
  });
  syncExpandBtn();
}

/* ---------- 初始化 ---------- */
function init() {
  updateStatBar();
  rebuildTopicChips();

  bindSearch();

  // 回頂部
  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 600);
  });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
<script>
/* 工具列自動隱藏：往下捲動或滑鼠離開工具列就收起；滑鼠移到畫面最頂端才出現 */
(function () {
  const ctrl = document.querySelector('.controls');
  if (!ctrl) return;
  const touch = window.matchMedia('(hover: none)').matches;
  let lastY = window.scrollY, acc = 0, quiet = 0, hiddenAt = 0;
  const away = v => document.body.classList.toggle('ctl-away', v);
  const isHidden = () => ctrl.classList.contains('ctl-hidden');
  window.ctlShow = function () { ctrl.classList.remove('ctl-hidden'); away(false); acc = 0; };
  window.ctlHide = function () { if (isHidden()) return; ctrl.classList.add('ctl-hidden'); away(true); acc = 0; hiddenAt = Date.now(); };
  window.ctlQuiet = function (ms) { quiet = Date.now() + (ms || 250); };   // 程式內部捲動（跳轉、重新繪製）時暫停判斷
  function inHeader() {                       // 頁首、統計列還看得到時，工具列自然在原位，不收
    let prev = ctrl.previousElementSibling;
    while (prev && (prev.id === 'ctlHandle' || prev.id === 'ctlEdge')) prev = prev.previousElementSibling;
    return prev ? prev.getBoundingClientRect().bottom > 0 : window.scrollY < 120;
  }
  window.addEventListener('scroll', () => {
    const y = window.scrollY, dy = y - lastY; lastY = y;
    if (Date.now() < quiet) return;
    if (inHeader()) { ctrl.classList.remove('ctl-hidden'); away(false); acc = 0; return; }
    if (dy > 0) {
      acc = acc > 0 ? acc + dy : dy;
      if (acc > 8) window.ctlHide();
    } else if (dy < 0 && touch) {
      acc = acc < 0 ? acc + dy : dy;
      if (acc < -50 && isHidden()) window.ctlShow();
    }
  }, { passive: true });
  /* 點工具列上的按鈕會重新繪製內容、捲動高度改變，那一下不要誤判成往下捲 */
  ctrl.addEventListener('click', () => window.ctlQuiet(500));
  ctrl.addEventListener('keyup', () => window.ctlQuiet(500));
  /* 滑鼠移開工具列 → 收起（頁首還看得到時不收） */
  ctrl.addEventListener('mouseleave', () => { if (!inHeader()) window.ctlHide(); });
  /* 保險：游標快速甩出工具列時瀏覽器可能不送 mouseleave，所以也看游標位置 */
  document.addEventListener('mousemove', e => {
    if (!isHidden() && !inHeader() && e.clientY > ctrl.offsetHeight + 2) window.ctlHide();
  }, { passive: true });
  /* 滑鼠移到畫面最頂端 → 出現（剛收起 0.4 秒內不理會，避免游標剛好停在頂端時又彈出來） */
  const edge = document.getElementById('ctlEdge');
  if (edge) edge.addEventListener('mousemove', () => { if (Date.now() - hiddenAt > 400) window.ctlShow(); });
})();
</script>
