<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地方特考三等｜資訊處理・系統分析與設計 考古題詳解</title>
<style>/* ===== 關務四等考古題複習系統 — 樣式 ===== */

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink:        #1a1f2c;
  --ink-soft:   #3d4456;
  --paper:      #f4f1ea;
  --paper-warm: #ece6d8;
  --card:       #fffdf8;
  --line:       #d8d0bf;
  --accent:     #8a3324;   /* 朱紅 — 印章色 */
  --accent-2:   #1f5673;   /* 靛藍 */
  --gold:       #a07e2c;
  --shadow:     rgba(40,32,20,0.13);

  /* 主題分類色 */
  --t-db:   #1f5673;
  --t-ds:   #6a4c93;
  --t-prog: #2d6a4f;
  --t-sec:  #8a3324;
  --t-net:  --t-net;
  --t-net-c:#b5651d;
  --t-mis:  #4a5859;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(138,51,36,0.025) 31px, rgba(138,51,36,0.025) 32px);
}

/* ===== 頁首 ===== */
.site-header {
  background: var(--ink);
  color: var(--paper);
  padding: 2.4rem 1.5rem 2rem;
  text-align: center;
  border-bottom: 4px solid var(--accent);
  position: relative;
}
.site-header .kicker {
  font-size: .78rem; letter-spacing: .55em; text-indent: .55em;
  color: var(--gold); font-weight: 700; margin-bottom: .7rem;
}
.site-header h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900; font-size: clamp(1.6rem, 4.4vw, 2.7rem);
  letter-spacing: .06em; line-height: 1.3;
}
.site-header h1 .stamp {
  display: inline-block; border: 2.5px solid var(--accent);
  color: var(--accent); padding: .05em .3em; border-radius: 6px;
  transform: rotate(-4deg); margin: 0 .15em;
  font-size: .82em; background: rgba(244,241,234,0.06);
}
.site-header .sub {
  margin-top: .8rem; font-size: .9rem; color: #b8bcca; font-weight: 400;
  letter-spacing: .04em;
}

/* ===== 統計列 ===== */
.stat-bar {
  display: flex; justify-content: center; gap: 2.5rem; flex-wrap: wrap;
  background: var(--paper-warm); padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.stat-bar .stat { text-align: center; }
.stat-bar .num {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1.7rem; color: var(--accent); line-height: 1;
}
.stat-bar .lbl {
  font-size: .72rem; color: var(--ink-soft); letter-spacing: .15em;
  margin-top: .25rem;
}

/* ===== 控制列 ===== */
.controls {
  position: sticky; top: 0; z-index: 50;
  background: rgb(244,241,234);
  border-bottom: 1.5px solid var(--line);
  padding: .9rem 1.5rem;
  box-shadow: 0 3px 14px var(--shadow);
}
.controls-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.mode-switch {
  display: flex; border: 2px solid var(--ink); border-radius: 8px;
  overflow: hidden;
}
.mode-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem 1.1rem; font-size: .88rem; font-weight: 700;
  color: var(--ink); transition: all .18s;
}
.mode-switch button.active { background: var(--ink); color: var(--paper); }

.search-box {
  flex: 1; min-width: 180px; position: relative;
}
.search-box input {
  width: 100%; font-family: 'Noto Sans TC', sans-serif;
  padding: .55rem .9rem .55rem 2.2rem; font-size: .9rem;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink);
}
.search-box input:focus { outline: 2px solid var(--accent-2); border-color: transparent; }
.search-box::before {
  content: '🔍'; position: absolute; left: .7rem; top: 50%;
  transform: translateY(-50%); font-size: .85rem; opacity: .5;
}
.btn-expand {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--ink-soft); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 8px;
  padding: .5rem .9rem; font-size: .82rem; font-weight: 500;
  white-space: nowrap; transition: all .15s;
}
.btn-expand:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ===== 篩選晶片 ===== */
.filter-row {
  max-width: 1080px; margin: .7rem auto 0;
  display: flex; gap: .45rem; flex-wrap: wrap;
}
.chip {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 20px;
  padding: .3rem .85rem; font-size: .8rem; font-weight: 500;
  transition: all .15s;
}
.chip:hover { border-color: var(--ink-soft); }
.chip.active {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
}
.chip .c-count { opacity: .6; font-size: .92em; margin-left: .2em; }

/* ===== 主內容 ===== */
.wrap { max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

/* 群組標題（年度 / 主題） */
.group {
  margin-bottom: 2.6rem;
}
.group-head {
  display: flex; align-items: center; gap: .9rem;
  margin-bottom: 1.1rem; padding-bottom: .6rem;
  border-bottom: 2.5px solid var(--ink);
}
.group-head .g-badge {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  background: var(--ink); color: var(--paper);
  padding: .35rem .8rem; border-radius: 6px; font-size: 1.05rem;
  white-space: nowrap;
}
.group-head .g-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.15rem; color: var(--ink);
}
.group-head .g-meta {
  margin-left: auto; font-size: .76rem; color: var(--ink-soft);
  text-align: right; line-height: 1.5;
}
.group-note {
  font-size: .8rem; color: var(--accent-2); font-style: italic;
  margin: -.5rem 0 1rem; padding-left: .2rem;
}

/* ===== 題目卡 ===== */
.q-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 10px; margin-bottom: .9rem;
  box-shadow: 0 2px 8px var(--shadow);
  overflow: hidden; transition: box-shadow .2s;
}
.q-card:hover { box-shadow: 0 4px 16px var(--shadow); }

.q-header {
  display: flex; align-items: flex-start; gap: .8rem;
  padding: 1rem 1.2rem; cursor: pointer;
  border-left: 5px solid var(--line);
  transition: background .15s;
}
.q-card.t-db   .q-header { border-left-color: var(--t-db); }
.q-card.t-ds   .q-header { border-left-color: var(--t-ds); }
.q-card.t-prog .q-header { border-left-color: var(--t-prog); }
.q-card.t-sec  .q-header { border-left-color: var(--t-sec); }
.q-card.t-net  .q-header { border-left-color: var(--t-net-c); }
.q-card.t-mis  .q-header { border-left-color: var(--t-mis); }
.q-header:hover { background: var(--paper-warm); }

.q-no {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1rem; color: var(--paper); background: var(--ink-soft);
  min-width: 2.4rem; height: 2.4rem; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.q-headmain { flex: 1; min-width: 0; }
.q-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.02rem; color: var(--ink); line-height: 1.5;
}
.q-tags {
  display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .4rem;
  align-items: center;
}
.tag {
  font-size: .7rem; font-weight: 700; padding: .12rem .55rem;
  border-radius: 4px; letter-spacing: .03em;
}
.tag-topic { color: #fff; }
.t-db   .tag-topic, .tag.topic-db   { background: var(--t-db); }
.t-ds   .tag-topic, .tag.topic-ds   { background: var(--t-ds); }
.t-prog .tag-topic, .tag.topic-prog { background: var(--t-prog); }
.t-sec  .tag-topic, .tag.topic-sec  { background: var(--t-sec); }
.t-net  .tag-topic, .tag.topic-net  { background: var(--t-net-c); }
.t-mis  .tag-topic, .tag.topic-mis  { background: var(--t-mis); }
.tag-year {
  background: var(--paper-warm); color: var(--ink-soft);
  border: 1px solid var(--line);
}
.tag-score {
  background: transparent; color: var(--gold);
  border: 1px solid var(--gold);
}
.tag-part {
  background: var(--accent-2); color: #fff;
  font-weight: 500;
}
.q-toggle {
  flex-shrink: 0; font-size: 1.3rem; color: var(--ink-soft);
  transition: transform .25s; line-height: 1; margin-top: .4rem;
}
.q-card.open .q-toggle { transform: rotate(45deg); }

/* ===== 題目展開內容 ===== */
.q-body { display: none; padding: 0 1.2rem 1.4rem; }
.q-card.open .q-body { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.section-label {
  display: inline-block; font-family: 'Noto Serif TC', serif;
  font-weight: 700; font-size: .82rem; letter-spacing: .1em;
  padding: .25rem .8rem; border-radius: 4px; margin: 1.1rem 0 .6rem;
}
.section-label.q { background: var(--ink); color: var(--paper); }
.section-label.a { background: var(--accent); color: var(--paper); }

.q-question {
  background: var(--paper-warm); border-left: 3px solid var(--ink-soft);
  padding: .9rem 1.1rem; border-radius: 0 6px 6px 0;
  font-size: .93rem; white-space: pre-wrap; color: var(--ink-soft);
  font-feature-settings: "tnum";
}
.q-answer {
  font-size: .95rem; color: var(--ink);
}
.q-answer h4 {
  font-family: 'Noto Serif TC', serif; color: var(--accent);
  font-size: 1rem; margin: 1.1rem 0 .4rem;
  border-bottom: 1px dashed var(--line); padding-bottom: .2rem;
}
.q-answer p { margin: .55rem 0; }
.q-answer ul, .q-answer ol { margin: .5rem 0 .5rem 1.4rem; }
.q-answer li { margin: .3rem 0; }
.q-answer strong { color: var(--accent-2); font-weight: 700; }
.q-answer code {
  font-family: 'JetBrains Mono', monospace; font-size: .86em;
  background: var(--paper-warm); padding: .1em .35em;
  border-radius: 3px; color: var(--accent);
}
.q-answer table {
  border-collapse: collapse; width: 100%; margin: .8rem 0;
  font-size: .86rem;
  display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;  /* MOBILE_TABLE：手機寬度下表格可左右捲動 */
}
.q-figure { max-width: 100%; overflow-x: auto; }
.q-answer th, .q-answer td {
  border: 1px solid var(--line); padding: .4rem .6rem;
  text-align: left;
}
.q-answer th {
  background: var(--ink); color: var(--paper); font-weight: 700;
}
.q-answer tr:nth-child(even) td { background: var(--paper-warm); }

/* 程式碼/ASCII 區塊 */
.q-answer pre {
  background: #2b303b; color: #f2f0e9;
  font-family: 'JetBrains Mono', monospace; font-size: .85rem;
  line-height: 1.7; padding: 1rem 1.2rem; border-radius: 8px;
  overflow-x: auto; margin: .8rem 0;
  border-left: 3px solid var(--gold);
}
.q-answer pre code { background: none; color: inherit; padding: 0; }

/* 獨立程式碼區（code 欄位） */
.code-block {
  margin: 1rem 0; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--ink);
}
.code-head {
  background: var(--ink); color: var(--gold);
  font-family: 'JetBrains Mono', monospace; font-size: .76rem;
  padding: .4rem .9rem; font-weight: 500;
  display: flex; justify-content: space-between; align-items: center;
}
.code-head .dots { display: flex; gap: .3rem; }
.code-head .dots span {
  width: .6rem; height: .6rem; border-radius: 50%; display: block;
}
.code-head .dots span:nth-child(1) { background: #d4554a; }
.code-head .dots span:nth-child(2) { background: #d9a441; }
.code-head .dots span:nth-child(3) { background: #5a9e6f; }
.code-block pre {
  margin: 0; border-radius: 0; border-left: none;
  background: #2b303b;            /* 提亮背景，降低與文字的明度落差刺眼感 */
  color: #f2f0e9;                 /* 預設文字（變數、標點）改為近白，清楚可見 */
  font-size: .86rem; line-height: 1.7;
  padding: 1.1rem 1.3rem 1.1rem 1.7rem;   /* 左側多留白，程式碼不貼邊、不壓迫 */
}
/* 語法highlight — 高對比配色，深背景下皆清晰 */
.tok-kw  { color: #ff9d6f; font-weight: 700; }   /* 關鍵字：亮橘，最醒目 */
.tok-str { color: #b8e986; }                      /* 字串：亮綠 */
.tok-com { color: #9aa6b8; font-style: italic; }  /* 註解：提亮的灰藍，不再灰到看不見 */
.tok-num { color: #f7d56e; }                      /* 數字：亮黃 */
.tok-fn  { color: #82c8ff; }                      /* 函式：亮藍 */
.tok-typ { color: #ffd166; }                      /* 型別：金黃 */

/* ===== HTML 圖表（取代易跑版的 ASCII 圖）===== */
.html-diagram {
  margin: 1.1rem 0; padding: 1.3rem 1rem;
  background: var(--paper-warm);
  border: 1.5px solid var(--line); border-radius: 10px;
  overflow-x: auto;
}
/* 通用方框節點 */
.dg-box {
  display: inline-flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center;
  border: 2px solid var(--ink); border-radius: 8px;
  background: var(--card); padding: .55rem .9rem;
  font-size: .86rem; line-height: 1.5; font-weight: 500;
  min-width: 5.5rem;
}
.dg-box .dg-sub { font-size: .73rem; color: var(--ink-soft); font-weight: 400; }
.dg-box.accent { border-color: var(--accent); background: #fbf3f0; }
.dg-box.blue   { border-color: var(--accent-2); background: #eef4f7; }
.dg-box.gold   { border-color: var(--gold); background: #faf5e6; }
.dg-box.ink    { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dg-box.ink .dg-sub { color: #b8bcca; }

/* 排列容器 */
.dg-row { display: flex; align-items: center; justify-content: center;
  gap: .5rem; flex-wrap: wrap; }
.dg-col { display: flex; flex-direction: column; align-items: center;
  gap: .5rem; }
.dg-center { justify-content: center; }

/* 箭頭 */
.dg-arrow { font-size: 1.3rem; color: var(--accent); font-weight: 700;
  line-height: 1; padding: 0 .15rem; }
.dg-arrow.v { transform: rotate(90deg); margin: .1rem 0; }
.dg-arrow.bi::before { content: '◀▶'; }
.dg-arrow.down::before { content: '▼'; }
.dg-arrow.right::before { content: '▶'; }

/* 流程圖專用 */
.flow { display: flex; flex-direction: column; align-items: center; gap: 0; }
.flow-node {
  border: 2px solid var(--ink); background: var(--card);
  padding: .55rem 1.1rem; font-size: .86rem; text-align: center;
  font-weight: 500; max-width: 32rem; line-height: 1.55;
}
.flow-node.start, .flow-node.end {
  border-radius: 22px; background: var(--ink); color: var(--paper);
  font-weight: 700;
}
.flow-node.process { border-radius: 6px; }
.flow-node.io {
  border-radius: 6px; background: var(--paper-warm);
  border-style: dashed;
}
.flow-node.decision {
  background: #faf5e6; border-color: var(--gold);
  border-radius: 6px; font-weight: 700;
}
/* 連接線（直線 + 箭頭） */
.flow-conn { width: 2px; height: 1.6rem; background: var(--ink-soft);
  position: relative; }
.flow-conn::after {
  content: '▼'; position: absolute; bottom: -.3rem; left: 50%;
  transform: translateX(-50%); color: var(--ink-soft); font-size: .68rem;
}
/* 連接線旁的小標籤（如「否」「未出貨訂單」） */
.flow-edge {
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.flow-edge .lbl {
  font-size: .74rem; font-weight: 700; padding: .08rem .55rem;
  border-radius: 4px; position: relative; z-index: 1;
}
.flow-edge .lbl.yes { background: #2d6a4f; color: #fff; }
.flow-edge .lbl.no  { background: var(--accent); color: #fff; }
.flow-edge .lbl.plain {
  background: var(--card); color: var(--accent-2);
  border: 1px solid var(--line);
}
.flow-conn.short { height: .7rem; }
.flow-conn.short::after { display: none; }

/* 迴圈返回標記 —— 掛在決策節點下方，明確標示「往回」 */
.flow-loop {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .76rem; font-weight: 700;
  background: #eef4f7; color: var(--accent-2);
  border: 1.5px dashed var(--accent-2); border-radius: 20px;
  padding: .25rem .8rem; margin: .35rem 0;
}
.flow-loop::before { content: '⟲'; font-size: 1.05rem; }

.flow-label {
  font-size: .73rem; color: var(--accent-2); font-weight: 600;
  background: var(--card); padding: 0 .4rem; margin: .15rem 0;
}
/* 舊版分支樣式（保留相容，僅用於少數真正左右並排的場景） */
.flow-branch { display: flex; align-items: flex-start; gap: 2.5rem;
  justify-content: center; }
.flow-branch-arm { display: flex; flex-direction: column;
  align-items: center; gap: 0; }
.flow-yes, .flow-no {
  font-size: .76rem; font-weight: 700; padding: .1rem .5rem;
  border-radius: 4px; margin: .2rem 0;
}
.flow-yes { background: #2d6a4f; color: #fff; }
.flow-no  { background: var(--accent); color: #fff; }

/* ERD 專用形狀 */
.erd-entity {
  border: 2px solid var(--ink); background: var(--card);
  padding: .5rem 1.1rem; font-weight: 700; font-size: .9rem;
  border-radius: 4px; text-align: center;
}
.erd-rel {
  display: inline-flex; align-items: center; justify-content: center;
  width: 7rem; height: 4rem; background: #faf5e6;
  border: 2px solid var(--gold);
  transform: rotate(45deg); margin: 1rem;
}
.erd-rel > span {
  transform: rotate(-45deg); font-size: .8rem; font-weight: 700;
  text-align: center; line-height: 1.3;
}
.erd-attr {
  display: inline-block; border: 1.5px solid var(--accent-2);
  background: #eef4f7; border-radius: 50%;
  padding: .35rem .8rem; font-size: .76rem; text-align: center;
  color: var(--accent-2);
}
.empty .big { font-size: 2.5rem; margin-bottom: .5rem; }

/* 回頂部 */
.to-top {
  position: fixed; right: 1.5rem; bottom: 1.5rem;
  width: 3rem; height: 3rem; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 14px var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .25s;
  z-index: 60;
}
.to-top.show { opacity: 1; pointer-events: auto; }

/* 頁尾 */
.site-footer {
  background: var(--ink); color: #9aa0b0;
  text-align: center; padding: 2rem 1.5rem;
  font-size: .8rem; line-height: 1.8;
}
.site-footer strong { color: var(--gold); }

/* 手機 */
@media (max-width: 640px) {
  .stat-bar { gap: 1.4rem; }
  .controls-inner { gap: .6rem; }
  .search-box { order: 3; flex-basis: 100%; }
  .group-head { flex-wrap: wrap; }
  .group-head .g-meta { margin-left: 0; flex-basis: 100%; text-align: left; }
  .q-answer table { font-size: .78rem; }
  .q-answer pre, .code-block pre { font-size: .74rem; }
}

/* ===== 搜尋強化 / 跳轉面板（新增） ===== */
.search-box input { padding-right: 2.2rem; }
.search-clear {
  position: absolute; right: .35rem; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; color: var(--ink-soft);
  font-size: 1.05rem; line-height: 1; cursor: pointer;
  padding: .25rem .45rem; border-radius: 50%; display: none;
}
.search-clear.show { display: block; }
.search-clear:hover { background: var(--paper-warm); }
.search-info {
  max-width: 1100px; margin: .55rem auto 0;
  font-size: .8rem; color: var(--ink-soft); display: none;
}
.search-info.show { display: block; }

/* ===== 關務四等資訊處理 程式設計概要 — 全部關務年度 ===== */

{
  year: "112", exam: "local3",

      title: "醫療管理系統：規劃、設計、開發各階段的資安措施",
      score: 25,
      question: `你是一家醫院的資訊長，該院正在規劃重建使用多年的醫療管理系統。最近外界有發生一些資安事件使得該院的院長非常擔心醫療管理系統裡面的那些屬於特種個資的病歷資料跟病患的個人資料發生外洩。請你大致跟他說明一下，建議這次開發醫療管理系統的專案中，在規劃（Planning Phase）、設計（Design Phase）以及開發（Development Phase）的各個階段，可以採取什麼樣的措施，以防止這個系統未來發生危害資料安全的事件？（25 分）`,
      answer: `#### 一、核心觀念：資安要「內建」而非「外加」

病歷與病患個資屬個資法所稱的**特種個資**（醫療、病歷、健康檢查等），外洩的法律、聲譽與病安風險都極高。與其系統完成後再補強，不如把資安納入系統開發生命週期（Secure SDLC，亦稱安全左移 Shift-Left，或 Security by Design、Privacy by Design），讓每個階段都有明確的資安產出與查核點。以下以資安三要素（機密性、完整性、可用性）為主軸，向院長分階段說明。

\`\`\`htmldiagram
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:'Noto Sans TC',sans-serif;font-size:13px;margin:.4rem 0"><span style="background:#1f5673;color:#fff;padding:5px 10px;border-radius:6px">規劃<br><small>資安需求、風險、法遵、預算</small></span><span>→</span><span style="background:#8a3324;color:#fff;padding:5px 10px;border-radius:6px">設計<br><small>威脅建模、架構、存取控制、加密</small></span><span>→</span><span style="background:#2f6b4f;color:#fff;padding:5px 10px;border-radius:6px">開發<br><small>安全編碼、審查、測試、供應鏈</small></span><span>→</span><span style="background:#6a4c93;color:#fff;padding:5px 10px;border-radius:6px">上線與維運<br><small>弱點掃描、監控、事件應變</small></span></div>
\`\`\`

#### 二、規劃階段（Planning Phase）：先定目標、盤點風險

| 措施 | 內容 |
| --- | --- |
| 法規與標準盤點 | 個人資料保護法（特種個資）、醫療法與醫療機構電子病歷相關規定、資通安全管理法（公立醫院屬關鍵基礎設施或特定非公務機關時）、ISO 27001、ISO 27799（健康資訊安全）、HIPAA 等可參照標準 |
| 資料分類分級 | 盤點系統會處理的資料（病歷、檢驗影像、身分資料、健保資料、帳務），依敏感度分級，決定各級保護強度與保存年限 |
| 風險評鑑 | 辨識資產、威脅、弱點，估算可能性與衝擊；風險高者列為必要控制項目 |
| 隱私衝擊評估（PIA） | 評估蒐集目的、最小蒐集原則、使用範圍、第三方分享、當事人權利（查閱、更正、刪除） |
| 資安需求納入需求規格 | 把「須加密、須留存稽核軌跡、須多因子驗證、可用性 99.9% 以上、RTO 與 RPO 目標」寫成可驗證的非功能需求，也寫入 RFP 與契約 |
| 組織與責任 | 設專案資安負責人，建立資安與個資管理制度；明定資料擁有者、管理者與使用者責任 |
| 預算與時程 | 編列資安測試、滲透測試、教育訓練與稽核預算，避免為趕工犧牲資安 |
| 委外與供應鏈管理 | 廠商資格（ISO 27001、人員背景查核）、保密條款、資安事件通報時限、責任與賠償、弱點揭露與修補義務、原始碼與資料的歸屬與返還銷毀 |
| 營運持續與事件應變規劃 | 預先規劃備份備援、災難復原、事件通報與應變流程 |

#### 三、設計階段（Design Phase）：把控制措施設計進架構

| 面向 | 設計措施 |
| --- | --- |
| 威脅建模 | 以 STRIDE（偽冒、竄改、否認、資訊洩漏、阻斷服務、權限提升）對資料流程圖逐項找威脅，並決定對策 |
| 安全架構 | 網路分區（DMZ、應用區、資料庫區、醫療設備區）、最小開放埠、WAF、防火牆、資料庫不直接對外；與院外系統（健保署、雲端病歷交換）介接採專線或 VPN 與 API 閘道 |
| 身分驗證 | 醫事人員使用醫事人員卡或自然人憑證搭配密碼的多因子驗證；單一登入、逾時自動登出 |
| 授權與存取控制 | 角色型存取控制（RBAC）搭配屬性，落實最小權限與職務分離；原則是「有治療關係才可調閱」；緊急情況設「破窗」機制（Break-glass），可調閱但事後必審 |
| 資料保護 | 傳輸用 TLS 1.2 以上；儲存用 AES 等加密（資料庫、備份、行動裝置）；身分證字號與病歷號等欄位遮罩或去識別化；金鑰集中管理（HSM 或 KMS）並定期輪替 |
| 稽核軌跡 | 設計不可竄改的存取日誌（誰、何時、調閱誰的哪筆病歷、做了什麼），集中到 SIEM 並設異常告警（如短時間大量調閱、調閱名人病歷） |
| 資料生命週期 | 保存年限、到期去識別化或銷毀；測試環境不得使用真實病歷（用去識別化或合成資料） |
| 可用性與韌性 | 高可用叢集、異地備援、備份 3-2-1 原則（三份、兩種媒體、一份離線或異地）、備份定期還原演練；對抗勒索軟體要有不可變（immutable）備份 |
| 隱私設計 | 資料最小化、目的限定、病患同意管理與查詢自己被調閱紀錄的功能 |
| 設計審查 | 資安架構審查通過才可進入開發 |

#### 四、開發階段（Development Phase）：安全編碼與持續驗證

1. **安全編碼規範**：依 OWASP Top 10、CWE 與 CERT 規範，防範 SQL 注入（使用參數化查詢）、XSS、CSRF、失效的存取控制、不安全的反序列化、硬編碼密碼等；輸入驗證用白名單，錯誤訊息不洩漏內部資訊。
2. **程式碼審查與靜態分析（SAST）**：每次合併前同儕審查，CI 管線自動掃描。
3. **動態測試（DAST）、互動式測試與滲透測試**：在測試環境對執行中的系統掃描弱點，上線前由第三方做滲透測試。
4. **第三方元件與供應鏈管理（SCA）**：維護軟體物料清單（SBOM），追蹤開源元件已知漏洞（CVE），及時更新，避免類似 Log4Shell 的風險。
5. **機密管理**：密碼、金鑰、憑證不放在原始碼，使用密鑰保管庫；版本控制設分支保護與存取稽核。
6. **開發環境隔離與資料保護**：開發、測試、正式環境分離；開發人員不得接觸正式病歷資料。
7. **安全測試案例**：把權限越界、未授權調閱、暴力破解、逾時登出等寫成測試案例，納入回歸測試。
8. **教育訓練**：開發人員的安全編碼訓練，使用者（醫護人員）的資安與個資教育，防範社交工程與釣魚信。
9. **變更與組態管理**：安全基準組態（Hardening）、最小化服務、修補管理與變更審核。
10. **上線前驗收**：弱點掃描報告、滲透測試複測、資安與個資審查簽核通過才上線。

#### 五、上線後的延伸（簡述）

持續監控（SIEM、EDR）、定期弱點掃描與稽核、事件應變演練、定期權限盤點、日誌異常分析、委外廠商定期稽核，並依 PDCA 持續改善。

#### 六、對院長的結論

> 把資安當成「功能需求」而非「附加品」：規劃階段定風險與法遵、設計階段把存取控制、加密、稽核與備援蓋進架構、開發階段以安全編碼與多層測試確保實作到位。再加上人員教育與營運期監控，才能同時守住病歷的機密性、完整性與可用性。`
    },
    {
      id: "loc3-sa-112-2", no: "二", topic: "sec", topicName: "系統分析與設計",
      title: "測試腳本與測試資料由誰負責？分析師與程式設計師如何協作",
      score: 25,
      question: `在系統開發的過程中，測試的腳本與測試資料的擬訂是應該由系統分析師還是程式設計師主要負責？如果他們合作的話，你建議他們彼此間可以如何協作？（25 分）`,
      answer: `#### 一、結論先行

**不能一概而論，要看測試層級。**

- **單元測試**（測最小程式單位）：以**程式設計師**為主，因為最了解程式內部邏輯。
- **整合測試、系統測試、使用者驗收測試**：以**系統分析師**（或測試人員，通常由分析師主導）為主，因為測試依據是需求規格與設計文件，且要站在使用者與業務的角度驗證。
- 兩者並不是二選一，最好的做法是：**分析師負責「測什麼、預期結果是什麼」，程式設計師負責「怎麼自動化執行與診斷缺陷」**，並在不同階段交叉審查。

#### 二、各測試層級的主要負責人與測試計畫依據

| 測試層級 | 測試依據（計畫來源） | 主要負責 | 協作者 |
| --- | --- | --- | --- |
| 單元測試 | 詳細設計規格、程式規格 | 程式設計師 | 分析師審閱重要案例 |
| 整合測試 | 系統設計（架構、介面、模組關係） | 分析師與資深程式設計師共同 | 程式設計師提供介面細節與測試樁 |
| 系統測試 | 需求規格、系統分析模型 | 分析師或獨立測試團隊 | 程式設計師協助缺陷定位 |
| 驗收測試 | 使用者需求、契約與驗收準則 | 使用者主導、分析師協助 | 程式設計師修正缺陷 |

#### 三、為什麼分析師應主導上層測試的案例與資料

1. **需求的詮釋者**：分析師最清楚「系統應該做什麼」，能寫出涵蓋業務規則、例外與邊界的案例。
2. **避免球員兼裁判**：如果程式設計師同時寫程式又寫測試，容易照自己對規格的理解（甚至偏誤）寫測試，使錯誤被一併遺漏。由不同人擬測試，能提高發現缺陷機率。
3. **可追溯性**：測試案例對應需求編號（需求追蹤矩陣），確保每項需求至少有一個測試案例，分析師最適合維護這份對應。
4. **與使用者溝通**：測試資料需反映真實業務情境（例如特殊身分、跨月、退費），分析師與使用者容易對話。

#### 四、為什麼程式設計師也要參與

1. 最了解程式結構，能補充**白箱測試**案例（分支、迴圈、邊界、例外處理）。
2. 負責**測試自動化與測試工具**（JUnit、pytest、Selenium、CI 管線），把案例寫成可重複執行的腳本。
3. 能指出測試資料的**技術限制**（欄位長度、字元集、相依資料、效能）。
4. 缺陷出現時負責**根因分析與修正**。

1. **需求階段就開始（左移測試）**：分析師在撰寫需求時同步寫驗收準則（例如 Given-When-Then），程式設計師在需求審查會議中提出可測試性意見。
2. **分工共識，明確 RACI**：以表格定義每種文件與測試層級的負責（R）、核准（A）、諮詢（C）與知會（I）人員。
3. **分析師產出測試計畫與測試案例（黑箱）**：以等價分割、邊界值分析、決策表、狀態轉換、使用案例情境推導案例，並標明前置條件、輸入資料、操作步驟、預期結果。
4. **程式設計師補充白箱案例並自動化**：以覆蓋率（敘述、分支、路徑）檢視是否足夠，提供測試樁（Stub）、驅動程式（Driver）與模擬物件（Mock）。
5. **測試資料共同準備**：
   - 分析師定義資料情境（正常、邊界、錯誤、極端、特殊業務）；
   - 程式設計師與資料庫管理者負責產生、載入與重置（腳本化、可重複）；
   - 含個資的真實資料需**去識別化**或用合成資料；
   - 建立專屬測試環境與版本管理的測試資料集。
6. **交叉審查**：分析師審程式設計師的單元測試是否涵蓋規格，程式設計師審分析師的案例是否可執行、預期結果是否與設計一致。
7. **持續整合**：自動化測試納入 CI/CD，每次提交即跑，結果對雙方透明；缺陷追蹤系統（如 Jira）記錄重現步驟，分析師判斷是需求問題還是實作問題。
8. **定期溝通機制**：每日站立會議、缺陷檢討會、迭代回顧，避免「丟過牆」式的對立。
9. **共同擁有品質**：以「團隊負責品質」文化取代責任推諉；敏捷中常見做法是三劍客（業務、開發、測試）會議與測試驅動開發（TDD）、行為驅動開發（BDD），把規格即測試。

#### 四、關係與外鍵規則

3. **桌位 1 : N 訂單**：同一桌在不同時間有多張訂單。
4. **員工 1 : N 訂單**：記錄由哪位員工接單。
5. **訂單 1 : N 訂單明細**：明細為**弱實體**，需依附訂單，以訂單編號加序號為主鍵；訂單刪除時明細一併刪除（ON DELETE CASCADE）。
6. **商品 1 : N 訂單明細**：商品與訂單原本是多對多關係，透過「訂單明細」拆成兩個一對多；商品已被下單後不可直接刪除（ON DELETE RESTRICT），改以「是否供應」停售。
7. **訂單 1 : N 付款**：支援拆帳與多種付款方式。

#### 五、設計理由

- **正規化**：商品名稱、單價只存在商品表，訂單明細只存編號，避免更新異常；會員資料與訂單分開，更改電話不必改多筆訂單（達到第三正規化，3NF）。
- **明細保存單價**：屬於刻意的歷史快照，不是違反正規化，因為它代表「當時成交價」。
- **總金額為衍生欄位**：可由明細加總算得，但為了查詢效能與保存折扣後金額而保留，需以交易（Transaction）或觸發器維持一致。
- **完整性約束**：數量大於 0、單價不為負、訂單狀態用限定值（待製作、製作中、完成、取消）。
- **可擴充**：加入「優惠券」「庫存與原物料」「商品配方」「外送地址」等表，不影響現有結構。

#### 三、屬性（Attributes）與設計理由

| 屬性 | 型別 | 設計理由 |
| --- | --- | --- |
| 學號 studentId | 字串 | 唯一識別（識別碼），不可更改，是與其他類別關聯的依據 |
| 姓名 name | 字串 | 基本識別資料，供顯示與文件使用 |
| 生日 birthDate | 日期 | 儲存生日而不是年齡，年齡可由方法計算（避免資料過時，屬衍生資料） |
| 系所 department | 系所物件或代碼 | 表達學生所屬單位，與系所類別建立關聯 |
| 年級 grade | 整數 | 選課資格、畢業審查、學費規定會用到 |
| 狀態 status | 列舉 | 在學、休學、退學、畢業等，教學系統通常只對在學學生開放選課；使用列舉可限制值域 |
| 聯絡資料 contact | 聯絡資料物件 | 地址、電話、電子郵件，獨立成類別以便重用、驗證格式，並使學生類別保持精簡（組合關係） |
| 修課紀錄 enrollments | 修課紀錄清單 | 學生與課程是多對多，透過「修課紀錄」關聯類別保存學期與成績，不把成績塞進學生或課程類別 |

> 另外，如密碼、身分證字號等敏感資料，建議由獨立的帳號與個資類別管理，不放在學生類別，以降低外洩與耦合。

#### 四、方法（Methods）與設計理由

| 方法 | 作用 | 設計理由 |
| --- | --- | --- |
| 選課(課程)、退選(課程) | 檢查狀態為在學、學分上下限、衝堂、先修條件後，建立或取消修課紀錄 | 把業務規則放在擁有資料的物件裡（資訊專家原則），並維持物件的有效狀態；回傳布林值告知結果 |
| 查詢成績(學期) | 回傳該學期的修課成績 | 提供唯讀存取，內部資料不外露 |
| 計算 GPA() | 依修課紀錄與學分加權計算 | 衍生值以計算取得，不另存，避免不一致 |
| 更新聯絡資料(資料) | 驗證後更新 | 透過方法修改，可加入格式驗證與稽核 |
| 辦理休學() / 復學() | 改變狀態並檢查規則 | 狀態變更集中管理，避免外部任意改狀態 |
| 取得姓名() 等 getter | 讀取私有屬性 | 封裝；必要時才提供 setter，學號則不提供 setter |
| 建構子 Student(...) | 建立物件時要求必要欄位並初始化 | 確保物件一建立就處於合法狀態 |

#### 五、設計原則總結

1. **封裝與資訊隱藏**：屬性私有，經方法存取，規則集中，日後改內部結構不影響外部。
2. **高內聚**：只放學生本身的資料與行為，成績計算細節交修課紀錄，課程容量檢查交課程類別。
3. **低耦合**：與課程之間透過修課紀錄關聯類別，不直接依賴對方內部細節。
4. **可擴充**：若有大學部、研究所、交換生等差異，可用**繼承**（學生為父類別，研究生為子類別，增加指導教授、論文題目），並用**多型**處理不同的畢業規則。
5. **對應真實世界**：學生是教學系統的核心實體，同時扮演「選課者」角色；類別設計貼近領域詞彙，便於與使用者溝通。

public class Student {
    private final String studentId;
    private String name;
    private Status status;           // 在學、休學、退學、畢業
    private final List<Enrollment> enrollments = new ArrayList<>();

    public Student(String studentId, String name) {
        this.studentId = studentId;
        this.name = name;
        this.status = Status.ACTIVE;
    }

    public boolean enroll(Course c, String term) {
        if (status != Status.ACTIVE) return false;     // 只有在學可選課
        if (!c.hasSeat()) return false;                // 課程額滿
        enrollments.add(new Enrollment(this, c, term));
        return true;
    }

    public String getName() { return name; }
}

      answer: `#### 一、概念

- **內聚力（Cohesion）**：衡量**一個模組內部**各元素彼此關聯的緊密程度，越高越好。最佳是**功能內聚**（模組只做一件明確的事）。
- **耦合力（Coupling）**：衡量**模組之間**相依的程度，越低（鬆散）越好。最佳是**資料耦合**（只傳必要的簡單參數）。
- 設計目標：**高內聚、低耦合**，使系統易於理解、測試、維護與重用。

| 內聚（由好到差） | 說明 | 耦合（由好到差） | 說明 |
| --- | --- | --- | --- |
| 功能內聚 | 所有元素共同完成單一功能 | 無耦合 | 完全獨立 |
| 順序內聚 | 前一元素輸出是後一元素輸入 | 資料耦合 | 傳遞簡單資料參數 |
| 溝通內聚 | 元素處理同一份資料 | 標記耦合 | 傳整個資料結構但只用部分 |
| 程序內聚 | 元素依特定順序執行 | 控制耦合 | 傳控制旗標決定對方行為 |
| 時間內聚 | 同時間執行（如初始化） | 外部耦合 | 共用外部格式或裝置 |
| 邏輯內聚 | 邏輯上類似但功能不同 | 共同耦合 | 共用全域資料區 |
| 偶然內聚 | 元素毫無關聯 | 內容耦合 | 直接存取或修改對方內部 |

1. 「讀取員工資料」只負責由員工編號取得員工資料；「計算應發薪資」只負責依底薪、加給、加班費算出應發薪資；「計算扣繳稅額」只負責依薪資算稅；「列印薪資單」只負責輸出。
2. 每個模組**單一職責、可用一句動詞加受詞描述**（讀取員工資料、計算稅額），屬於**功能內聚**，這是最高的內聚等級。
3. 好處：容易測試（給定輸入就能驗證輸出）、容易重用（別的系統也可呼叫「計算扣繳稅額」）、稅法改變只需修改一個模組。
4. 反例（低內聚）：若合併成一個「處理薪資」模組，同時做讀檔、計算、算稅、列印、更新檔案，則成為程序或邏輯內聚，任何一項需求變動都要改整個模組。

#### 四、結論

> 結構圖中，**高內聚**表現在每個方塊只做一件事（功能內聚）；**鬆散耦合**表現在連線上只流動少量必要的資料（資料耦合）。兩者相輔相成：模組切得越單純，越容易只靠簡單參數就完成合作。`

**定義**：SLA 是服務提供者（委外廠商、雲端業者、內部 IT 單位）與服務需求者（機關）之間，以書面約定「**提供什麼服務、達到什麼水準、如何量測、未達標如何處理**」的協議，通常作為採購契約的附件。

**扮演的角色**

1. **把期待量化成可驗證的指標**：避免「系統要穩定」這類模糊要求。
2. **管理期望與劃分責任**：明確界定廠商與機關各自負責範圍（含資安責任）。
3. **契約執行與驗收的依據**：服務是否合格、付款是否核發，依指標與報告決定。
4. **激勵與制衡機制**：未達標的罰款、服務抵減、終止權；超標的獎勵。
5. **風險控管**：把可用性、資安事件、資料保護與營運持續等風險轉成契約義務。
6. **持續改善**：定期檢討報告，促進服務水準提升。

**常見指標與舉例**（以機關線上申辦系統委外維運為例）

| 構面 | SLA 條款舉例 |
| --- | --- |
| 可用性 | 每月系統可用率不低於 99.9%（每月計畫外停機不超過約 43 分鐘），維護時段須事先公告 |
| 效能 | 一般查詢 95% 的交易於 3 秒內回應；尖峰 1,000 位同時使用者仍符合 |
| 事件回應與修復 | 嚴重等級 1（系統全面中斷）：30 分鐘內回應，4 小時內恢復；等級 2：2 小時內回應，1 個工作天內處理 |
| 資安事件通報 | 發現資安事件後 1 小時內通知機關，依資通安全管理法通報時限配合；提交根因報告 |

| 罰則 | 可用率每低 0.1%，扣當月維運費 2%；連續三個月未達標得終止契約 |

**對資安的意義**：SLA 把資安要求（保密、事件通報、弱點修補、存取控管、資料返還與銷毀）寫成有時限、有罰則的義務，使委外風險可被追蹤與追責。

      answer: `#### 一、版本控制系統的三個重要特色（10 分）

版本控制系統（VCS）記錄檔案隨時間的變化，讓團隊能還原、比較與協同。三個核心特色：

| 特色 | 說明 | 舉例 |
| --- | --- | --- |
| 1. 版本歷史追蹤與還原 | 每次提交（commit）都保存一個**可識別的版本**，記錄誰、何時、改了什麼、為什麼（提交訊息）。可比較任兩版本的差異（diff）、回復到先前版本、標記里程碑（tag）如 v1.0 | 上線後發現新功能有錯，可一鍵回到前一個穩定版本；追查某行程式是誰在何時改的（blame） |
| 2. 多人協同與衝突處理 | 多人可同時修改同一專案，系統以鎖定或合併方式整合各人的變更；發生同一處被修改時提示**衝突**，由人決定合併結果；搭配權限控管 | A 改登入畫面、B 改資料庫模組，合併後互不影響；兩人改同一行則需手動解決衝突 |

**架構**：整個專案的**完整版本歷史只存在中央伺服器**一份；開發者本機只有某一版本的「工作副本」。要提交、看歷史、建分支都要連線到伺服器。

**代表**：Subversion（SVN）、CVS、Perforce、Microsoft TFVC。

**運作流程（以 SVN 為例）**

1. \`svn checkout\`：自中央倉庫取得工作副本。
2. 修改檔案後 \`svn update\` 取得別人最新變更並解決衝突。
3. \`svn commit\`：把變更送回中央倉庫，產生新的全域遞增版本號（r101、r102…）。
4. 可用 \`svn copy\` 建立 branches、tags 目錄，但分支屬「目錄複製」，合併較繁瑣。

| 優點 | 缺點 |
| --- | --- |
| 架構簡單，容易理解與管理 | 單點故障：伺服器掛掉或斷網就無法提交與看歷史 |
| 權限可細到目錄或檔案層級，集中管控 | 離線時無法提交，效能受網路影響 |
| 全域版本號直觀，適合需鎖定二進位檔（美術、CAD）的團隊 | 分支與合併較弱，鼓勵少用分支 |
| 倉庫備份只需備份一處 | 倉庫損壞時所有歷史可能遺失，須做好備份 |

**適用**：中央管控嚴格、團隊較固定、大量二進位資產（遊戲美術）、既有舊專案。

**架構**：每位開發者的電腦都有**完整倉庫的複本**（含全部歷史與分支）。「遠端倉庫」（GitHub、GitLab、Bitbucket）只是團隊約定的共用中心，不是技術上必要的主機。

**代表**：Git、Mercurial（Hg）、Bazaar。

**運作流程（以 Git 為例）**

1. \`git clone\`：複製遠端倉庫（含完整歷史）。
2. \`git checkout -b feature-x\` 或 \`git switch -c\`：在本機開分支；輕量且快速。
3. \`git add\` 與 \`git commit\`：在**本機**提交，可離線進行，並可多次小提交。
4. \`git pull\` 取得別人變更並合併或變基；\`git push\` 推送到遠端。
5. 透過 **Pull Request / Merge Request** 讓同儕做程式碼審查後再合併入主線。

| 優點 | 缺點 |
| --- | --- |
| 可離線工作，提交、查歷史、比較都在本機，速度快 | 學習曲線較陡（暫存區、rebase、reset 等概念） |
| 分支與合併非常輕量，鼓勵頻繁分支與平行開發 | 完整複本佔用較多本機空間，大型二進位檔需 Git LFS |
| 沒有單點故障，每份複本都是完整備份 | 缺少單一全域遞增版本號，須靠雜湊值與標籤 |
| 利於開源與大型分散團隊，貢獻者可 fork 後提 PR | 權限控管較依賴代管平台，細粒度需設計 |

**適用**：多數現代軟體專案、開源專案、遠端或跨時區協作、敏捷與 DevOps 流程。

#### 四、兩種架構比較

| 比較項目 | 集中式（SVN） | 分散式（Git） |
| --- | --- | --- |
| 歷史存放 | 只在中央伺服器 | 每個複本都有完整歷史 |
| 提交 | 直接送到中央，需連線 | 先提交到本機，之後再推送 |
| 離線工作 | 受限 | 可以 |
| 分支與合併 | 較重、較弱 | 輕量、強大 |
| 單點故障 | 有 | 無（可由任一複本還原） |
| 版本號 | 全域遞增整數 | 雜湊值（SHA） |
| 權限管理 | 集中、可到目錄層級 | 多由代管平台負責 |
| 典型情境 | 傳統企業、二進位檔 | 開源、敏捷、遠端團隊 |

#### 五、結論

> 版本控制的三大價值是：版本歷史可追溯與還原、多人協同與衝突控管、分支合併支援平行開發。集中式（SVN）架構單純、管控集中；分散式（Git）具備離線、快速、高韌性與強大分支能力，已成為主流。本專案若是多人、需平行開發且要審查流程，建議採用 Git 搭配 Pull Request。`

      question: `假設 ABC 專案採用敏捷方法開發，而你必須向其他成員說明敏捷開發的需求收集方式，請詳細說明下列三者，何謂使用者故事（user story）、情境（scenario）、故事板（storyboard）？並分別舉一實例。（30 分）`,
      answer: `#### 一、背景：敏捷的需求收集觀

敏捷開發不追求一次寫完厚重的規格書，而是**用輕量、貼近使用者、可隨時調整**的方式持續溝通需求。使用者故事、情境與故事板是三種由粗到細、由文字到圖像的工具，常搭配使用：**故事板呈現全貌 → 情境描述一次互動 → 使用者故事成為待辦項目（Backlog）並進入迭代**。

以下三個例子都以假設的 ABC 專案「**校園午餐線上訂餐 App**」為背景。

| 項目 | 使用者故事 | 情境 | 故事板 |
| --- | --- | --- | --- |
| 本質 | 一句話描述使用者想要的價值 | 一段敘述性的使用過程 | 一組連續畫面的草圖 |
| 形式 | 文字（卡片） | 文字（短篇敘事） | 圖像（分鏡） |
| 回答的問題 | 誰要什麼、為什麼 | 在什麼情境下怎麼用 | 互動如何一步步發生 |
| 規模 | 小，可於一個迭代完成 | 中，涵蓋一次完整任務 | 中到大，涵蓋流程與畫面 |
| 用途 | 產品待辦清單、規劃、估點、驗收 | 理解脈絡、發現需求與例外 | 與使用者確認流程與介面、早期回饋 |

#### 二、使用者故事（User Story）

**定義**：用使用者的語言，以一句話描述「**某類使用者想要某項功能，以達成某項價值**」，是敏捷（Scrum、XP）最常用的需求單位。它是「對話的承諾」，細節留待開發時與使用者討論。

**樣板**：

> 身為一個〈角色〉，我想要〈功能或目標〉，以便〈商業價值或原因〉。（As a ... I want ... so that ...）

**3C 構成**：卡片（Card，簡短文字）、對話（Conversation，細節靠溝通）、確認（Confirmation，驗收準則）。

**良好故事的 INVEST 原則**：獨立（Independent）、可協商（Negotiable）、有價值（Valuable）、可估算（Estimable）、夠小（Small）、可測試（Testable）。

**實例**

> **編號 US-07**：身為一個上班族學生，我想要在 App 上預先訂好午餐並指定取餐時間，以便下課後不用排隊。
>
> **驗收準則（Given-When-Then）**：
> - 假如我已登入並選好餐點，當我選擇 12:00 的取餐時段並完成付款，那麼系統應產生取餐碼並顯示預計完成時間。
> - 假如該時段已額滿，那麼系統應提示並建議最近的可用時段。
>
> **優先順序**：高；**估點**：5 點。

#### 三、情境（Scenario）

**定義**：以**具體的角色（常搭配人物誌 Persona）、特定的場景與目標**，用敘事方式描述使用者如何使用系統完成一項任務，包括使用的脈絡、步驟、遇到的問題與結果。比使用者故事更豐富，能幫助團隊看到「使用的真實情況」，發現隱藏需求與例外。

**組成**：人物、背景或動機、目標、操作過程、事件與例外、結果。

**實例（正常情境與例外）**

> 小美是大三學生，11:40 下課後只有 30 分鐘午休。她在走向教室的路上打開「校園訂餐」App，系統依她上次的習慣推薦雞腿便當。她選擇數量 1、取餐時間 12:00，用行動支付付款，手機立即顯示取餐碼。
>
> **例外**：她下單時 12:00 時段已額滿，系統提示最近可用的是 12:10，她接受後完成訂單。12:00 她到店出示 QR code 即可領取，不必排隊。
>
> **由情境導出的需求**：預約時段與額滿管理、行動支付、推薦、取餐碼與 QR code、時段額滿的替代建議。

#### 四、故事板（Storyboard）

**定義**：借用電影與動畫的分鏡手法，以**一連串依序排列的草圖畫面**，描繪使用者在系統上完成任務的過程，每格包含畫面、使用者行動與簡短說明。可為手繪草圖、低擬真原型或線框圖，目的是快速和使用者**確認流程與畫面互動**，不必先寫程式。

**特點**：低成本、易修改、容易溝通，可及早發現流程不順之處；也常作為 UI 設計與使用者測試的起點。

**實例（小美訂午餐的故事板）**

#### 五、三者的搭配與結論

1. **探索期**：用情境與故事板和使用者對話，找出任務、痛點與例外。
2. **規劃期**：把需求整理成使用者故事，排入產品待辦清單，估點並排優先順序。

#### 二、轉換型式（Conversion Style）

| 策略 | 做法 | 優點 | 缺點 |
| --- | --- | --- | --- |
| 直接轉換（Direct、Cold turkey、Abrupt） | 約定日期停用舊系統，立即啟用新系統 | 最快、最便宜；不必維護兩套 | 風險最高；一旦新系統有問題，業務可能中斷，需備援或回復計畫 |
| 平行轉換（Parallel） | 新舊系統**同時運作**一段期間，比對兩者結果，確認一致後才停用舊系統 | 風險最低，有舊系統可作後盾，容易驗證結果 | 成本最高、人員負擔重（雙重輸入與核對）；期間較長 |

#### 三、轉換場所（Conversion Location）

| 策略 | 做法 | 優點 | 缺點 |
| --- | --- | --- | --- |
| 試點轉換（Pilot） | 先選**一個或少數單位或地點**使用新系統，成功後再推廣 | 問題限於局部，影響小；可累積經驗、調整教育訓練 | 全面轉換時程拉長；試點與非試點需交換資料，可能要暫時介面；試點若不具代表性結論會偏誤 |
| 分階段轉換（Phased） | 依序（如依區域或部門）逐批轉換，每批的經驗可用於下一批 | 風險分散；可分批訓練與支援，資源負荷平均 | 總時程長；新舊並存期間要維護介面與資料同步 |
| 同時轉換（Simultaneous） | 所有地點**同一時間**轉換 | 時程短、不需新舊介面 | 影響面廣，出錯則全面受影響；需要大量同步支援人力 |

#### 四、轉換模組（Conversion Modules）

| 策略 | 做法 | 優點 | 缺點 |
| --- | --- | --- | --- |
| 整體系統轉換（Whole-system） | 一次轉換所有模組與功能 | 無需新舊模組間介面；轉換完成一步到位 | 一次性工作量大，風險集中，訓練壓力大 |
| 模組轉換（Modular） | 一個模組一個模組地陸續轉換（如先銷售，再庫存，再會計） | 逐步學習，降低單次風險；先上線的模組可較早產生效益 | 需要暫時性橋接介面；模組間相依性高時不易拆分；總期程較長 |

#### 五、風險、成本、時間的比較

| 策略 | 風險 | 成本 | 時間（總轉換期） |
| --- | --- | --- | --- |
| 直接轉換 | 高 | 低 | 短 |
| 平行轉換 | 低 | 高 | 中到長（並行期） |
| 試點轉換 | 低到中（局部風險） | 中（試點額外支援與介面） | 長（先試後推） |
| 分階段轉換 | 中（分散） | 中到高（多批支援、介面） | 長 |
| 同時轉換 | 高 | 中（短期須大量人力） | 短 |
| 整體系統轉換 | 高 | 低到中 | 短 |
| 模組轉換 | 低到中 | 中到高（橋接介面、多次上線） | 長 |

**一般規律**：風險與成本、時間常呈**取捨**關係：想降低風險，通常要付出更多成本與更長時間（例如平行、分階段、模組）；想縮短時間與成本，則要承擔較高風險（例如直接、同時、整體）。

#### 六、選擇策略時的考量

1. **業務關鍵性與可中斷程度**：醫療、金融、交易系統不可中斷，傾向平行或試點；內部輔助系統可用直接轉換。
2. **系統大小與複雜度**：大型多地點系統適合試點與分階段；模組相依性低則適合模組轉換。
3. **新舊系統差異**：差異大、使用者需大量學習時，宜採用漸進方式。
4. **資料轉換量與品質**：資料遷移、清理與驗證須納入計畫。
5. **組織資源**：訓練人力、支援人力、預算與時程。
6. **回復計畫**：不論哪種策略都須有失敗時的退場（Fallback）方案。

#### 七、結論

> 轉換型式決定「怎麼切」，轉換場所決定「在哪切」，轉換模組決定「切哪些功能」。三者可組合，但無單一最佳解，須依風險承受度、成本、時程與業務特性權衡。重要且不可中斷的系統，通常採「試點加平行」並搭配回復計畫。`

#### 二、驗收測試的目標

1. **確認系統滿足業務需求**：功能需求（該做的都有做）與非功能需求（效能、可用性、資安、相容性）都達到約定標準。
2. **確認系統適合實際使用**：在真實的工作流程、資料量與使用者操作習慣下可正常運作，介面與操作流程可被接受。
3. **取得使用者正式接受**：以測試結果作為驗收簽核、付款、交付與保固起算的依據（契約責任）。
4. **發現漏網缺陷與落差**：找出前面測試遺漏的問題，以及需求理解的落差。
5. **建立上線信心**：評估操作手冊、教育訓練、資料轉換、營運支援是否準備妥當，降低上線風險。

#### 三、驗收測試的兩個階段

| 項目 | Alpha 測試（α） | Beta 測試（β） |
| --- | --- | --- |
| 場所與環境 | 在開發單位或受控的測試環境進行 | 在使用者的實際工作環境進行 |
| 參與者 | 使用者代表加上開發團隊、分析師、測試人員在旁 | 部分真實使用者獨立操作，開發方不在旁邊 |
| 資料 | 模擬資料、測試資料 | 真實資料與真實作業（或接近真實） |
| 內容 | 重複並擴展系統測試，逐項驗證需求、功能、介面、文件；確認缺陷已修正 | 在真實營運情境中使用系統一段時間，檢驗效能、負載、相容性、操作習慣與文件適用性 |
| 目的 | 先在可控環境發現並修正嚴重問題，確保進入 Beta 前品質 | 取得真實使用回饋，發現環境與使用者行為造成的問題 |
| 問題處理 | 開發者可立即觀察、除錯 | 使用者回報，開發者分析後修正 |

> 補充：Dennis 教科書的說法是 Alpha 測試重複系統測試，由使用者驗證；Beta 測試則讓使用者以真實資料在實際營運環境中使用系統，兩階段完成後使用者決定是否接受系統。

#### 四、測試用例（Test Case）如何開發

1. **來源是需求，不是程式碼**：以需求規格、使用案例（Use Case）、使用者故事與驗收準則、業務規則與契約作為依據；非功能需求（效能、安全）也要轉成可量測的測試。
2. **由使用者與分析師共同擬定**：使用者最了解實際作業情境與例外，分析師協助將需求轉成結構化案例；程式設計師不應是主要作者（避免用自己的理解去驗自己）。
3. **開發步驟**：
   1. 擷取每個使用案例的主要流程（正常情境）、替代流程與例外流程；
   2. 為每個流程設計測試案例：編號、測試目的、前置條件、輸入資料、操作步驟、預期結果、實際結果、通過與否；
   3. 補充邊界值、無效輸入、權限、併發與資料量等案例（等價分割、邊界值分析、決策表）；
   4. 準備測試資料：使用真實或去識別化的代表性資料，涵蓋典型與極端情況；
   5. 建立需求追蹤矩陣（需求、使用案例、測試案例的對應），確保每項需求至少有一個案例；
   6. 定義**驗收準則**（如重大缺陷為零、一般缺陷少於約定數量、效能達標）；
   7. 與使用者審查、確認，核准後作為驗收依據。
4. **範例**（使用案例「學生線上選課」）：

| 案例編號 | 前置條件 | 輸入與步驟 | 預期結果 |
| --- | --- | --- | --- |
| AT-01 | 學生已登入，選課期間內 | 選擇有名額的課程並按下加選 | 加選成功，課表更新，名額減 1 |
| AT-02 | 同上，課程時間與已選課衝堂 | 加選該課程 | 系統拒絕並提示衝堂 |
| AT-03 | 選課期間已結束 | 嘗試加選 | 系統拒絕並提示不在選課期間 |
| AT-04 | 1,000 位學生同時選課 | 尖峰同時加選 | 95% 的請求在 3 秒內回應，無資料錯亂 |

#### 五、小結

> 驗收測試的目標是證明系統符合使用者需求並取得接受；採 Alpha 與 Beta 兩階段，由受控環境逐步走向真實環境；測試用例源自需求與使用案例，由使用者與分析師共同擬定，並以追蹤矩陣與驗收準則確保完整與客觀。`

      question: `受到疫情影響，支援線上教學的數位學習系統也越來越受到重視，發展上述系統的一組非功能需求，包括操作需求、效能需求、安全性需求和文化與政策需求，請針對這些需求加以說明。（25 分）`,
      answer: `#### 一、非功能需求的意義

非功能需求（Non-functional Requirements）描述系統「**做得多好**」而不是「做什麼」，是行為與品質上的限制。Dennis 等人將它分為四大類：**操作需求**、**效能需求**、**安全性需求**、**文化與政策需求**。對數位學習系統（LMS，如 Moodle、Teams 教學平台）而言，疫情期間全校同時線上上課、考試、繳交作業，這些需求特別重要。每條需求都應**具體、可量測、可驗收**。

| 類別 | 關注的問題 | 在數位學習系統的關鍵議題 |
| --- | --- | --- |
| 操作需求 | 系統在什麼環境和條件下運作 | 平台、裝置、整合與維運 |
| 效能需求 | 速度、容量、可靠度 | 回應時間、同時上線人數、可用性 |
| 安全性需求 | 誰能存取什麼、如何防護 | 身分驗證、授權、個資、考試誠信 |
| 文化與政策需求 | 組織、法規、文化與社會因素 | 語言、無障礙、著作權、校規 |

#### 二、操作需求（Operational Requirements）

說明系統必須能在何種技術與運作環境下運作、如何與其他系統整合與維護。

1. **多平台與多裝置**：支援 Windows、macOS、Android、iOS；主流瀏覽器（Chrome、Edge、Safari、Firefox）最新兩個版本；手機、平板、筆電都有適應式（RWD）介面。
2. **整合其他系統**：與校務系統單一登入（SSO）、學籍與選課資料自動同步、視訊會議工具（Zoom、Google Meet、Teams）、線上抄襲比對、雲端儲存整合。
3. **離線與弱網路**：低頻寬環境（偏鄉、行動網路）有降畫質模式；教材可下載、作業可離線編輯後上傳。
4. **維運與備援**：部署於校內機房或雲端；定時備份；系統更新以不中斷教學為原則，維護時間避開上課時段（例如每週日凌晨）。
5. **資料與標準**：支援 SCORM、xAPI、LTI 等教材與工具標準，方便匯入既有教材與第三方工具。
6. **技術支援**：提供使用手冊、客服、教師與學生培訓，以及 7×24 緊急聯絡窗口。

#### 三、效能需求（Performance Requirements）

說明系統的速度、容量與可靠度，須以數字表達。

1. **回應時間（Speed）**：頁面載入平均 2 秒內；上傳 100 MB 作業在一般校園網路下 1 分鐘內完成；線上測驗每題切換小於 1 秒。
2. **容量（Capacity）**：支援全校 20,000 名使用者；**同時上線 5,000 人**，同時視訊串流 1,000 人；單一課程可存放教材達 10 GB；錄影檔保存一學期。
3. **可用性與可靠度（Reliability）**：上課期間可用率不低於 99.5%；考試期間不低於 99.9%；系統故障後 30 分鐘內恢復（RTO）；資料遺失不超過 15 分鐘（RPO）。
4. **擴充性（Scalability）**：考試、選課尖峰能自動擴充資源（雲端彈性伸縮），日後使用者成長 50% 仍可運作。
5. **更新與一致性**：考試時間的伺服器時鐘同步，成績與繳交紀錄不得遺失或重複。
6. **壓力測試**：上線前以負載測試驗證上述指標，並設定監控與告警。

#### 四、安全性需求（Security Requirements）

說明系統的存取控制、保護與稽核。

1. **身分驗證（Authentication）**：帳號密碼加多因子驗證（特別是教師、管理者）；單一登入；密碼強度與逾時登出。
2. **授權（Authorization）**：角色分明（學生、教師、助教、管理者、家長），依最小權限；學生只能看自己的成績，教師只能管理自己的課程。
3. **資料保護**：傳輸使用 TLS、機敏資料（成績、個資、錄影）加密儲存；備份加密。
4. **個資保護與隱私**：遵守個人資料保護法，蒐集最小化；未成年學生資料特別保護；錄影僅限教學用途、限期保存。
5. **學術誠信與考試安全**：防止代考與作弊（防切換視窗、題庫亂數、限時、IP 或裝置限制、必要時人臉與環境監看，但須兼顧隱私比例原則）；防止他人旁聽或闖入視訊課堂（Zoom bombing）：密碼、等候室、控制螢幕共享權限。
6. **防禦與稽核**：防範惡意攻擊（DDoS、SQL 注入、XSS、勒索軟體）；記錄登入與重要操作（成績修改）日誌，定期弱點掃描與備份演練。
7. **內容管理**：上傳檔案防毒；不當內容通報與處理機制。

#### 五、文化與政策需求（Cultural and Political Requirements）

說明由組織文化、法規、政策與社會因素造成的需求，往往容易被忽略，卻會影響系統能否被接受。

1. **語言與在地化**：繁體中文介面為主，支援英文及外籍生、僑生、原住民語言（可選）；日期、時間、學期與成績制度符合本地習慣。
2. **無障礙（Accessibility）**：符合政府網站無障礙規範（WCAG 2.1 AA）：螢幕閱讀器、字幕、替代文字、鍵盤操作，照顧視障、聽障學生。
3. **法規與智慧財產**：著作權法（教材合理使用，避免未授權影片與教科書全文上傳）、個資法、教育部相關規定、資通安全管理法。
4. **校規與政策**：成績評定、出缺席規定、教學品質評鑑、遠距教學授課時數認定（如教育部遠距教學時數規範）、學生資料保存年限。
5. **組織文化**：教師數位素養差異大，介面須簡易、提供教育訓練；尊重教師教學自主，不強制單一教學方式；學生與家長溝通方式；是否允許錄影、錄影可否外流。
6. **數位落差與公平**：弱勢學生可能無電腦與網路，需借用設備、行動網路補助、離線方案，以避免教育不平等。
7. **社會與倫理**：避免演算法偏見、避免過度監控；使用者資料使用要透明、取得同意。
8. **採購與政府政策**：公立學校採購需符合政府採購法、國產或資安規範產品、優先使用開源或共同供應契約等。

#### 六、小結與撰寫需求的建議

| 品質要求 | 建議寫法（可驗收） |
| --- | --- |
| 模糊 | 「系統要快、要安全」 |
| 具體 | 「5,000 人同時上線，95% 的頁面請求在 3 秒內回應」「教師與管理者登入須雙因子驗證」「所有影片皆須有字幕」 |

> 非功能需求常決定系統成敗：功能再完整，若在期中考當天當機（效能）、成績外洩（安全）、視障生無法使用（文化與政策）、或手機打不開（操作），系統仍然失敗。因此應在需求階段就與利害關係人逐項確認，並轉為可量測的驗收準則。`

#### 二、導覽設計的原則

| 原則 | 說明 | 作法舉例 |
| --- | --- | --- |
| 1. 簡單、易學、少操作（Simplicity） | 使用者應不需閱讀手冊即可上手；降低完成任務所需的點擊與輸入 | 常用功能放最顯眼處；「三次點擊」原則（重要目標三次內可達）；預設值與自動完成 |
| 2. 一致性（Consistency） | 同樣的功能在不同畫面用相同位置、名稱、圖示、操作方式、顏色 | 全站同一個主選單與同一組快捷鍵；「儲存」永遠在同一位置，名稱一致 |
| 3. 預防錯誤（Error prevention） | 在使用者出錯之前就避免，而不是出錯後才責備 | 不可用的選項反灰；有破壞性的動作（刪除）要二次確認；可復原（Undo）；選項用下拉選單限制輸入 |
| 4. 清楚的回饋與位置感（Feedback） | 讓使用者隨時知道身處何處、剛才做了什麼、系統在忙什麼 | 目前頁籤高亮、麵包屑導覽、處理中進度條、成功與失敗訊息 |
| 5. 提供協助（Help） | 在需要時能得到說明 | 欄位旁提示、工具提示（Tooltip）、線上說明、搜尋、FAQ、聯絡客服 |
| 6. 適當的結構與分類 | 資訊依使用者心智模型組織，層次不要太深 | 選單項目以使用者任務分類；每層約 5 到 9 項（Miller 7±2）；寬而淺優於窄而深 |
| 7. 提供多種導覽方式 | 兼顧新手與熟手 | 選單加快捷鍵、搜尋、常用功能、最近使用、書籤；工具列與右鍵選單 |
| 8. 可逆與可退出 | 使用者可以隨時返回、取消、回首頁 | 每頁有「返回」「取消」「首頁」；瀏覽器上一頁正常運作 |
| 9. 清晰易讀的標籤與語言 | 用使用者的語言，不用內部術語 | 「我的課程」優於「CRS_LIST」；用動詞開頭的指令名稱 |
| 10. 可及性 | 支援不同能力、裝置的使用者 | 鍵盤可操作、足夠大的點擊區、足夠對比、螢幕閱讀器相容、行動裝置適應 |

**常見導覽元件**：選單列（Menu bar）、下拉與彈出式選單、工具列、標籤頁（Tabs）、麵包屑（Breadcrumb）、按鈕與連結、站內搜尋、站台地圖（Site map）、圖像地圖等。

**訊息設計（導覽中的回饋）**：錯誤訊息、確認訊息、通知訊息、延遲訊息、說明訊息；用語應簡短、具體、有禮貌，指出問題及解法，不責備使用者，不顯示程式內部錯誤碼。

#### 三、常犯的錯誤

| 常犯錯誤 | 為什麼有問題 | 改善方式 |
| --- | --- | --- |
| 1. 選單層級太深、太雜 | 使用者迷路、點很多次才到；重要功能被埋藏 | 扁平化、最多三層；重要功能上提 |
| 2. 單一層級項目過多 | 認知負荷過大，難以掃描 | 分組、分類，每組 5 到 9 項 |
| 3. 命名不清、不一致 | 同一功能在不同頁面叫不同名字，或用技術術語 | 統一用語，進行使用者測試（卡片分類） |
| 4. 位置與外觀不一致 | 使用者每頁都要重新學習 | 套用共同的版面樣板與設計系統 |
| 5. 沒有位置指示與返回路徑 | 使用者不知道自己在哪裡、無法回到上一層（死胡同） | 麵包屑、高亮目前位置、固定「首頁」與「返回」 |
| 6. 缺少回饋 | 按下按鈕沒反應、長時間處理沒顯示進度，使用者重複點擊 | 立即回應、載入動畫、成功或失敗訊息 |
| 7. 危險操作沒有確認或復原 | 誤刪資料難以挽回 | 二次確認、垃圾桶、復原 |
| 8. 不當的限制與強制路徑 | 強迫使用者按固定順序，不能跳過或回頭 | 容許彈性，提供捷徑與多入口 |
| 9. 錯誤訊息模糊或責怪使用者 | 「發生錯誤」「非法輸入」不知如何修正 | 說明原因與解法：「身分證字號須為 10 碼，第一碼為英文字母」 |
| 10. 把內部組織結構當成導覽結構 | 使用者不懂機關內部分課分組，找不到服務 | 以使用者任務與情境分類（例如「我要申請」「我要查詢」） |
| 11. 過度使用圖示或彈出視窗 | 圖示含意不明；彈出視窗打斷操作、被擋掉 | 圖示附文字；少用彈窗 |
| 12. 忽略不同使用者與裝置 | 新手找不到、熟手效率低；行動裝置無法操作 | 多種導覽路徑；響應式設計；無障礙 |
| 13. 缺少搜尋或搜尋品質差 | 資訊量大時使用者靠搜尋找東西 | 提供站內搜尋、容錯、建議詞 |

#### 四、設計與評估方法

1. 以使用者任務導向設計導覽結構，繪製站台地圖與導覽流程；
2. 以卡片分類（Card Sorting）決定分類與命名；
3. 製作低擬真原型，用「找到某功能需幾步」進行可用性測試；
4. 以啟發式評估（Nielsen 十大原則）檢查一致性、回饋、錯誤預防等。

#### 五、小結

> 良好的導覽讓使用者**知道自己在哪、能去哪、怎麼回來**。原則可歸納為簡單、一致、預防錯誤、提供回饋與協助、結構清楚；常見錯誤則是層級過深、命名不一、缺少位置與返回、沒有回饋或確認。設計時應從使用者的任務與心智模型出發，並以使用者測試持續驗證。`

      answer: `#### 一、平行作業（Parallel Operation）（3 分）

**定義**：新系統上線後，**舊系統不立刻停用**，兩套系統在一段期間內**同時處理相同的業務**，並比對兩者結果；確認新系統正確穩定後，才停用舊系統。

- 優點：風險最低；舊系統是現成的後盾，出問題可立即回到舊系統，容易驗證新系統的正確性。
- 缺點：成本高（雙重輸入、雙重維運、人力加倍）、作業負擔重、使用者容易混淆；若新舊系統邏輯不同，還需處理差異。
- 適合：不可中斷、錯誤代價高的系統，如薪資、帳務、結算。

#### 二、試行作業（Pilot Operation）（3 分）

**定義**：先選**部分單位、地點或使用者群**（試點）使用新系統，其他單位仍用舊系統；試點成功、問題改善後，再推廣到其他單位。

- 優點：把風險限制在局部，發生問題影響小；可在真實環境學習、修正系統與教育訓練教材，再複製經驗。
- 缺點：整體轉換期較長；試點與非試點需資料交換（可能要暫時介面）；試點若不具代表性，會誤判。
- 適合：多據點、多單位的組織。

#### 三、分段作業（Phased Operation）（3 分）

**定義**：把新系統依**功能模組或業務階段**切成數個部分，分階段逐步取代舊系統的對應部分（例如先換銷售，再換庫存，最後換採購與會員），直到完全取代。

- 優點：每階段範圍小，容易管理與訓練；先上線的模組可較早發揮效益；使用者逐步適應。
- 缺點：新舊並存期間需要橋接介面與資料同步；模組相依性高時難拆；總時程長。
- 適合：大型、模組化程度高、可分段交付的系統。

> 區別：**試行**是依「**地點或使用者**」切（先局部、後全面），**分段**是依「**功能或模組**」切，**平行**是依「**時間重疊**」（新舊同時跑）。

5. 舊系統老舊，新系統與舊系統資料格式不同，需要資料轉換；預算有限，預計 12 個月內完成。

**我建議採用：試行作業（再以分批方式推廣）**

理由：

1. **風險分散在可控範圍**：120 家門市同時換，一旦有缺陷（結帳當機、庫存扣錯、健保碼錯誤）會造成全台營業中斷。先選 3 家有代表性的門市（大型旗艦店、社區店、偏鄉小店）試用，問題限縮在 3 家。
2. **取得真實經驗**：實際營業才會遇到的情況（尖峰結帳、網路不穩、各種付款方式、健保卡讀取）只有試行才看得到；可據以修正系統、制定上線手冊與訓練教材。
3. **成本與資源合理**：不需 120 家都雙軌，總部支援人力集中在試點；試點成功再依區域分批複製，支援人力可輪流調度。
4. **符合門市不可停業**：試點店只在少數據點切換，並可保留舊系統作為緊急備援，營業不中斷。
5. **試行結果可作決策依據**：以事先訂好的成功準則（交易成功率、結帳時間、庫存誤差率、店員滿意度）判斷是否推廣，有數據可說服管理層。

**實施重點**：試點選擇要有代表性；試點期間每日回報問題；設定退場（回復）條件；試點與其他門市的資料（例如總部報表、跨店會員點數）需要暫時性資料同步機制；試點通過後以區域分批推廣。

**其他兩種策略的問題**

| 策略 | 在本情境的問題 |
| --- | --- |
| 平行作業 | 120 家門市每筆交易都要在新舊系統各輸入一次，收銀員負擔加倍、結帳時間變長、顧客排隊；雙軌維運與雙份硬體、人員加班成本高；兩系統結果不一致時要花大量時間查證；人員疲勞反而增加輸入錯誤。除非只用在「每日結帳與健保申報」這類少數關鍵環節短期核對，否則不實際 |
| 分段作業 | 要先換部分模組（如先換銷售），而銷售、庫存、採購、會員彼此資料緊密相依（賣出就要扣庫存、補貨要看銷售），在新舊混合期必須建置多個臨時介面並維持資料同步，開發與測試成本高、出錯點多；整體轉換時程長，且每一階段仍然是對全部 120 家門市同時上線，一旦某階段出問題，影響範圍仍然是全台 |

| 欄位 | 意義 |
| --- | --- |
| Backlog（待辦池） | 所有已知但尚未排入的需求與任務，不一定排序、不一定細化 |
| Queue（佇列、準備好） | 已評估、排好優先順序、定義清楚，隨時可開工的任務（Ready） |
| In Progress（進行中） | 正有人在做的任務，數量受 WIP 上限限制（可再分為開發中、測試中） |
| Done（完成） | 已完成並通過驗收的任務 |

#### 二、(一) 看板可幫助的專案管理工作（10 分）

1. **工作視覺化與透明化**：所有任務、負責人、狀態一目了然，團隊與主管不用開會就能掌握進度。
2. **進度追蹤與狀況掌握**：從任務在各欄位的分布，看到完成、進行與待辦的數量，評估是否落後。
3. **工作量與優先順序管理**：Backlog 排序、Queue 控制下一步做什麼，確保先做最有價值的工作；需求變動時隨時重排。
4. **限制 WIP，避免過載**：設定進行中上限，避免同時做太多事造成切換成本、品質下降與交期延遲。
5. **發現瓶頸與阻礙**：若某欄任務堆積（如「測試」欄卡住），表示該環節是瓶頸，可及時處理；被阻擋的任務可標記。
6. **改善流程與預測交期**：量測週期時間（Cycle Time）、前置時間（Lead Time）與流量（Throughput），用累積流量圖協助預估與持續改善。
7. **團隊溝通與協作**：每日站會對著看板討論；責任共享，工作分派自主。
8. **彈性回應變動**：不必等固定迭代，隨時可插入緊急任務（可設緊急通道 Swim lane）。
9. **資源配置**：依各欄負載調整人力，如測試人員不足就調人支援。

#### 三、(二) 進行中任務未滿的意涵與處置（15 分）

**意涵**

進行中欄位有「WIP 上限」。若實際數量**低於上限**，代表系統的**處理容量尚有空閒**，團隊有人手或時間可以接新工作；也可能是流程出了問題。可能原因：

| 可能原因 | 判斷方式 |
| --- | --- |
| 1. 上游供應不足：Queue 空了，沒有可做的「準備好」任務 | 看 Queue 是否為空，Backlog 還有任務卻未細化 |
| 2. 工作被阻塞：任務在等待外部（客戶回覆、環境、相依任務），成員無事可做 | 標示被阻塞的卡片 |
| 3. 下游瓶頸：完成後排隊等待驗收或測試，無人可接手，導致成員停下或無法放行 | 看後續欄位是否堆積 |
| 4. 人力能力與任務不匹配：Queue 中任務需要的技能，現有閒置人員不具備 | 技能矩陣 |
| 5. WIP 上限設太高或任務切太大、人員請假 | 檢視歷史流量 |
| 6. 正常的緩衝：刻意保留餘裕處理突發事件 | 與團隊討論 |

**處置（避免人力閒置與浪費）**

1. **先找出原因，再對症下藥**：觀察 Queue、阻塞與下游欄位，不要盲目塞工作。
2. **依「拉式」原則補工作**：閒置人員先從 Queue 取下一個最高優先任務；不要自己跳過優先順序隨意挑。
3. **補充 Queue**：若 Queue 空了，立刻從 Backlog 依優先順序挑選，並與產品負責人（PO）一起細化（Backlog Refinement）、拆分成小任務、定義完成條件，使其成為「準備好」的任務。
4. **協助解決下游瓶頸與阻塞（Swarming 群體協作）**：閒置者先去協助測試、程式碼審查、部署或排除阻礙，而不是再開新工作；先讓現有任務「完成」，比開新工作重要（Stop starting, start finishing）。
5. **處理被阻塞任務**：由管理者出面協調資源、溝通客戶、排除相依，必要時暫時換做其他任務。
6. **交叉訓練（Cross-training）**：培養多能力成員，使人力可在不同環節流動（開發者可做測試、寫文件）。
7. **運用閒置時間做有價值的非功能工作**：重構、自動化測試、技術債清理、文件、學習與教育訓練、改善流程（Kaizen）。但這些也應視為任務放上看板，並限量。
8. **調整 WIP 上限與任務大小**：若長期未滿，考慮調整上限或把大任務切小；若團隊規模確實變化，則重新設定上限。
9. **必要時重新配置人力**：將多餘人力調去支援其他瓶頸團隊或專案。
10. **持續監控**：用累積流量圖和週期時間檢討，確認問題是否改善。

> **提醒**：不要為了讓每個人都「滿載」而硬塞工作。排隊理論顯示，利用率接近 100% 會使等待時間急遽增加，並且降低應變彈性；看板追求的是**工作順暢流動**，不是人員忙碌度。因此處置的目標是讓價值順利流向完成，而不是讓人一直有事做。

#### 四、結論

> 看板使工作可視、可限制、可流動，協助追蹤進度、控管 WIP、辨識瓶頸。若進行中任務未達上限，代表有可利用的產能，管理者應檢查上游供應、阻塞與下游瓶頸，優先補足 Queue、協助收尾與排除阻礙，並透過交叉訓練與改善工作利用閒置資源，同時避免過度滿載。`

      answer: `#### 一、(一) 資料流程圖的組成元件（4 分）

資料流程圖（Data Flow Diagram, DFD）由**四種基本元件**組成：

1. **外部實體**（External Entity，又稱終端、來源與目的地）
2. **處理程序**（Process）
3. **資料儲存**（Data Store）
4. **資料流**（Data Flow）

#### 二、(二) 各元件表達的意義（10 分）

| 元件 | Gane-Sarson 符號 | Yourdon-DeMarco 符號 | 表達的意義 | 命名與規則 |
| --- | --- | --- | --- | --- |
| 外部實體 | 方形 | 方形 | 系統邊界**以外**，與系統交換資料的人、組織或其他系統；是資料的來源（Source）或目的地（Sink）。例：讀者、館員、銀行 | 用名詞；不屬於系統內部，不描述其內部處理；不會直接與其他外部實體或資料儲存連線 |
| 處理程序 | 圓角方形（分成編號區與名稱區） | 圓形（泡泡） | 把輸入的資料流**轉換**成輸出的資料流的活動，如計算、驗證、判斷、彙總。例：辦理借書 | 用「動詞加受詞」；有編號（1.0、2.0）；至少一個輸入與一個輸出（避免黑洞：只有輸入；奇蹟：只有輸出） |
| 資料儲存 | 兩端開口的長方形，左側為 D 編號 | 兩條平行線 | 資料**靜止存放**的地方，可以是檔案、資料庫表、帳冊。例：讀者檔、借閱紀錄檔 | 用名詞；有編號（D1、D2）；資料儲存**只能與處理程序**之間有資料流（不能直接連外部實體，也不能連另一資料儲存） |
| 資料流 | 帶箭頭的線 | 帶箭頭的線 | 資料在元件之間的**移動**及其內容（箭頭為方向），例：借書請求、借書單 | 線上標註資料名稱（名詞）；同一條線只代表一種資料；不表示控制或順序 |

**補充**：

- 資料流程圖畫的是「資料的流動與轉換」，**不是**程式流程圖（不表達判斷順序、迴圈與時間）。
- 分層：背景圖（Context Diagram）→ 第 0 層 → 第 1 層…，上下層需**平衡**（輸入輸出資料流一致）。
- 常見錯誤：黑洞、奇蹟、灰洞（輸出無法由輸入產生）、資料流未命名、資料儲存直接連外部實體。

#### 三、(三) 自設情境與資料流程圖（10 分）

**情境假設：大學圖書館的借還書系統**

1. 讀者持讀者證到櫃檯借書或還書，館員負責新書採編與館藏維護。
2. 借書時，系統先驗證讀者身分（讀者檔有此人，且未被停權）；通過後查詢館藏狀態，若書可借則建立借閱紀錄，並更新館藏狀態為「借出」，印出借書單。
3. 還書時，系統查出該書的未還借閱資料，若逾期則計算罰款，更新館藏狀態為「在架」，並給讀者還書收據。
4. 館員新增或修改館藏資料，系統維護館藏檔並回報結果。
5. 外部實體：讀者、館員。資料儲存：讀者檔（D1）、館藏檔（D2）、借閱紀錄檔（D3）。

(一) 請說明類別間有那四種關係？（4 分）

      answer: `#### 一、(一) 類別間的四種關係（4 分）

| 關係 | UML 符號 | 意義 | 例子 |
| --- | --- | --- | --- |
| 關聯（Association） | 實線，可有箭頭、關聯名稱、多重性 | 類別的物件之間有連結、知道彼此（一般性的「使用、擁有」） | 客戶下訂單（客戶 1 對 訂單 0..*） |
| 聚合（Aggregation） | 實線加**空心菱形**在整體端 | 「整體與部分」關係，部分可獨立於整體存在（弱擁有，has-a） | 書籍分類聚合書籍：分類刪除，書還在 |
| 組合／合成（Composition） | 實線加**實心菱形**在整體端 | 較強的整體與部分，部分的生命週期隨整體而生滅（強擁有） | 訂單組合訂單明細：訂單刪除，明細一併消失 |
| 泛化／一般化（Generalization，即繼承） | 實線加**空心三角形**指向父類別 | 「是一種」（is-a）關係，子類別繼承父類別的屬性與方法，並可擴充或覆寫 | VIP 會員與一般會員是客戶的子類別 |

> 另有「相依（Dependency）」虛線箭頭（暫時性使用），也有教材把聚合與組合合稱為聚合而改列相依，以題意「四種」來說，上表最常見。

#### 二、(二) 類別的三種類型（3 分）

物件導向分析（以 Jacobson 的 OOSE、RUP 為代表）把類別依其在系統中的**角色**分成三種：

1. **邊界類別**（Boundary Class）：系統與外界（使用者、外部系統）的介面。
2. **控制類別**（Control Class）：協調與控制流程的類別。
3. **實體類別**（Entity Class）：代表問題領域中需持久保存的資料與業務。

#### 三、(三) 三種類別主要負責的工作（9 分）

| 類別 | 主要負責 | 說明與例子 | UML 構型 |
| --- | --- | --- | --- |
| 邊界類別 | 處理系統與**參與者（使用者或外部系統）之間的互動** | 接收使用者輸入、顯示輸出，把外界的請求轉成系統內部的訊息；不處理業務規則。例：登入畫面、訂購畫面、報表、對銀行系統的介面類別 | «boundary» |
| 控制類別 | **協調**邊界類別與實體類別，**控制使用案例的流程** | 接收邊界的請求，決定呼叫哪些實體、依什麼順序、進行交易管理、做運算與商業邏輯的流程控制；本身通常不保存資料。例：訂購控制（建立訂單、檢查庫存、確認付款）、登入控制 | «control» |
| 實體類別 | **保存與管理業務資料**及其基本行為 | 代表現實世界的概念，具有屬性與與資料相關的操作，通常需要持久化（存入資料庫），生命週期較長。例：客戶、訂單、書籍 | «entity» |

**三者合作**：使用者 → 邊界類別 → 控制類別 → 實體類別（資料）；回應則沿反向顯示。這樣的分工（類似 MVC 的 View、Controller、Model）使介面、流程、資料互相獨立，介面更換不影響商業邏輯、資料結構變動也不影響畫面。

#### 四、(四) 自設情境與類別圖（10 分）

**情境假設：網路書店訂購系統**

1. 客戶（分為一般會員與 VIP 會員）可瀏覽書籍，建立訂單，一張訂單可包含多筆訂單明細。

      score: 25,
      question: `當與使用者進行需求導出時（requirements elicitation），促進性應用規格技術（Facilitated Application Specification Techniques，以下簡稱 FAST）是一種常用的方法，請解釋何謂 FAST 並描述 FAST 施行之一般性規則（general rules）為何？（25 分）`,
      answer: `#### 一、FAST 是什麼

需求導出（elicitation）常見的問題是：使用者說不清楚、開發者聽不懂，或各部門意見互相衝突。**FAST（Facilitated Application Specification Techniques，促進性應用規格技術）** 是一種以**團隊會議**為核心的需求導出方法：由開發人員與客戶（使用者、出資者、業務代表）**一起、面對面、在同一場有引導者主持的會議中**，共同找出問題、提出解決方案要素、協商不同做法，並訂出初步的需求規格。

它源自 IBM 的 JAD（Joint Application Design，聯合應用設計），後來由 Pressman 等人整理為 FAST。重點有三：

1. 把原本「分頭訪談、再回頭彙整」改為**一次聚焦的集體協商**，縮短需求蒐集時間。
2. 由**引導者（facilitator）** 控制會議節奏，避免被職位高者或大嗓門者主導。
3. 用**定義機制**（白板、海報、便利貼、投影片、共享文件、線上白板）把想法即時可視化、共同確認。

#### 二、FAST 施行的一般性規則（General Rules）

| 規則 | 說明 |
| --- | --- |
| 1. 開發者與客戶共同參與 | 會議由軟體工程師（分析師、設計者）與客戶、使用者共同召開並出席，雙方都對結果負責 |
| 2. 訂定準備與參與規則 | 事前訂好會議規範：準時、不批評他人提案、一次一人發言、先發散後收斂、決議需記錄 |
| 3. 議程要「夠正式又夠彈性」 | 議程要涵蓋所有重要議題，但又要寬鬆到能鼓勵自由發想（類似腦力激盪） |
| 4. 由引導者控制會議 | 引導者可以是客戶、開發人員或外部中立人士，負責掌握時間、引出意見、化解衝突，本身不偏袒任何一方 |
| 5. 使用定義機制 | 用工作表、海報、便利貼、電子佈告欄、線上虛擬空間等記錄與展示想法，所有人看得到同一份東西 |
| 6. 目標明確 | 目標是在有利於達成共識的氣氛下：找出問題、提出解法要素、協商方案、並明列初步的需求集合 |

#### 三、FAST 的一般執行流程

\`\`\`

**會議之前**
1. 由客戶或業務代表寫一至二頁的「產品需求說明」，說明想解決的問題。
2. 決定會議時間、地點，選出引導者，挑選與會者（涵蓋業務、技術、使用者、管理者），並事前發出產品需求說明。
3. 要求每位與會者事前準備清單：與系統相關的**物件（實體）**、**服務（功能）**、**限制**、**效能準則**（速度、準確度等）。

**會議之中**
1. 各人展示自己的清單，貼在牆上或共享畫面，**先不評論**。
2. 小組討論、合併重複項，縮減成一份共識清單。
3. 分組針對清單項目撰寫**迷你規格（mini-specification）**，說明每個項目的細節。
4. 各人另列**驗證準則（validation criteria）**，說明如何確認需求被滿足。
5. 針對衝突與不足之處協商，由引導者導向共識，最後整合成完整規格草案。

**會議之後**：整理成需求規格書，交由與會者確認與簽核，列入變更管理。

#### 四、舉例：校園選課系統

與會者：教務處承辦人、教師代表、學生代表、系統分析師、資料庫管理者；引導者由中立的資訊中心主管擔任。
- 物件清單：學生、課程、開課班別、選課單、學分。
- 服務清單：登入、查詢課程、加選、退選、衝堂檢查、人數上限檢查。
- 限制：開學前兩週加退選、每學期上限 25 學分。
- 效能準則：選課開始尖峰期可同時 3,000 人在線，查詢回應 3 秒內。
- 迷你規格範例：「加選」＝輸入課號，若已額滿或衝堂則拒絕並顯示原因。

#### 五、優缺點

| 面向 | 優點 | 缺點／風險 |
| --- | --- | --- |
| 溝通 | 雙方面對面，快速消除誤解，需求衝突當場協商 | 需要一次湊齊關鍵人員，排程不易 |
| 效率 | 短時間內產出共識需求，縮短蒐集週期 | 需事前準備，會議失控會流於空談 |
| 品質 | 使用者有參與感，較易接受成果，需求完整度高 | 容易被強勢者主導，沈默者的意見被忽略（需引導者平衡） |
| 適用 | 需求不明確、利害關係人多的系統 | 利害關係人很分散、遠端時需用線上工具輔助 |

#### 六、結論

FAST 的精神是「**共同參與、引導者主持、可視化記錄、當場達成共識**」。只要掌握上述一般規則，就能把需求導出從個人訪談提升為團隊協作，減少後期需求變更。`

      answer: `#### 一、何謂敏捷式專案管理

**敏捷式專案管理（Agile Project Management）** 是以《敏捷宣言》（Agile Manifesto，2001）價值觀為基礎的專案管理方式：把專案切成**短週期的反覆迭代**，每個週期都交付可運作的成果，透過**持續的客戶回饋**與**自我組織的小團隊**，快速適應需求的變動。

《敏捷宣言》的四項價值：
1. **個人與互動**重於流程與工具。
2. **可運作的軟體**重於詳盡的文件。
3. **客戶合作**重於合約協商。
4. **回應變化**重於遵循計畫。

（左邊的項目也有價值，但右邊的價值更重要。）

#### 二、與傳統專案管理的主要差異

| 比較面向 | 傳統（預測型、瀑布式）專案管理 | 敏捷式專案管理 |
| --- | --- | --- |
| 基本假設 | 需求可事先確定，變更是例外 | 需求會變，變更是常態且歡迎 |
| 計畫方式 | 一開始做完整詳細計畫，依計畫執行 | 滾動式規劃：先做高階路線圖，每個迭代再詳細規劃 |
| 開發流程 | 階段循序：需求→設計→開發→測試 | 每個迭代都包含需求、設計、開發、測試 |
| 交付時機 | 專案結束才一次交付 | 每 1 至 4 週交付可用增量，早期上線、早期回饋 |
| 範圍、時間、成本 | 範圍固定，時間與成本隨之變動 | 時間（時間盒）與成本固定，範圍（優先順序）可調整 |
| 客戶參與 | 需求與驗收階段才參與 | 全程參與，固定審查與回饋 |
| 管理角色 | 專案經理指揮與控制 | 團隊自我組織，管理者是促進者（Scrum Master）與障礙排除者 |
| 文件 | 完整正式文件為主 | 夠用即可的文件，重視面對面溝通 |
| 進度衡量 | 依計畫完成百分比、里程碑 | 以可運作軟體、燃盡圖、速率（velocity）衡量 |
| 風險處理 | 前期風險分析，後期發現問題成本高 | 短迭代及早暴露風險，持續調整 |
| 適用 | 需求穩定、法規嚴格、硬體整合 | 需求不明確、變動大、需快速上市 |

#### 三、如何施行敏捷式專案管理（以 Scrum 為例）

**1. 組成團隊與角色**
- **產品負責人（Product Owner）**：代表客戶，維護產品待辦清單並排定優先順序。
- **Scrum Master**：協助團隊遵守流程、排除障礙。
- **開發團隊**：5 至 9 人的跨職能團隊，自我組織，共同負責交付。

**2. 建立與維護產品待辦清單（Product Backlog）**：以使用者故事（As a ... I want ... so that ...）描述需求，並用故事點（story point）估算大小，按價值與風險排序。

**3. 迭代（Sprint）規劃**：固定長度（1 至 4 週），在 Sprint 規劃會議中選出可完成的項目放進 Sprint 待辦清單（Sprint Backlog），並訂出**完成定義（Definition of Done）**。

**4. 每日站立會議（Daily Scrum）**：每天 15 分鐘，每人回答「昨天做了什麼、今天要做什麼、遇到什麼障礙」。

**5. 追蹤進度**：使用任務板（看板）與**燃盡圖（Burn-down Chart）**，監看剩餘工作量；以過去幾個迭代的**速率（velocity）** 預測交付時間。

**6. Sprint 審查（Review）**：向客戶展示可運作的增量，蒐集回饋並調整待辦清單。

**7. Sprint 回顧（Retrospective）**：團隊檢討「做得好、要改進、下次試什麼」，持續改善流程。

**8. 支撐的工程實踐**：持續整合（CI）、自動化測試、測試驅動開發（TDD）、重構、成對程式設計、程式碼審查。

**9. 變更管理**：新需求加入待辦清單依優先順序排入下一個迭代；Sprint 進行中原則上不更動範圍。

**10. 規模化與政府採購的調整**：多團隊可用 SAFe、LeSS 或 Scrum of Scrums 協調；採購合約可用固定時間盒／人月，以迭代驗收分期付款。

#### 四、結論與注意事項

敏捷不是「不計畫」，而是**把計畫分成多次小規模、持續修正的計畫**。成功的關鍵是：客戶要持續參與、團隊要有紀律與自動化測試、組織文化要容許變化與透明。若專案需求完全固定且法規要求嚴格文件，則可以採用**混合式（Hybrid）** 方式：前期用傳統方式做規格與架構，開發階段採敏捷迭代。`

      answer: `#### 一、何謂圈複雜度

**圈複雜度（Cyclomatic Complexity）**，由 Thomas McCabe 於 1976 年提出，是以程式的**控制流程圖（Control Flow Graph, CFG）** 為基礎的軟體度量，用來衡量程式中**線性獨立路徑（linearly independent paths）** 的數量，也就是程式邏輯的複雜程度。數值越大，分支越多、越難理解、越難測試。

三種等價的計算方式（P 為連通成分數，單一程式 P=1）：

| 方法 | 公式 | 說明 |
| --- | --- | --- |
| 邊與節點法 | V(G) = E − N + 2P | E 為邊數，N 為節點數 |
| 判斷節點法 | V(G) = 判斷（Predicate）節點數 + 1 | 每個 if、while、for、case，以及「且」「或」連接的各個條件，各算一個判斷 |
| 區域法 | V(G) = 控制流程圖封閉區域數（含外部區域） | 平面圖的區域數 |

#### 二、範例程式（共 20 行）

讀入 n 個整數，統計正數、負數的個數，以及大於 100 的個數。

\`\`\`c
#include <stdio.h>

int main(void) {
    int n, i, x;
    int pos = 0, neg = 0, big = 0;

    scanf("%d", &n);
    for (i = 0; i < n; i++) {
        scanf("%d", &x);
        if (x > 0) {
            pos++;
            if (x > 100)
                big++;
        } else if (x < 0) {
            neg++;
        }
    }
    printf("positive=%d negative=%d big=%d\\n", pos, neg, big);
    return 0;
}

#### 四、圈複雜度對軟體維護的主要功用

| 用途 | 說明 |
| --- | --- |
| 預測可維護性與缺陷風險 | 複雜度越高，越難理解、越容易在修改時引入錯誤；一般建議單一函式 V(G) 在 10 以內 |
| 估算測試工作量 | V(G) 是基本路徑測試所需測試案例數的下限，可用來估算回歸測試成本 |
| 找出需要重構的熱點 | 掃描整個專案，將 V(G) 過高的函式列為優先重構、拆分對象 |
| 輔助程式碼審查與品質閘門 | 在 CI 中設定門檻（如 >15 告警），避免複雜度持續惡化 |
| 評估變更風險 | 要修改的函式越複雜，影響分析與回歸測試要越嚴謹 |
| 協助人力與交接規劃 | 複雜模組需要更資深人員維護，也是交接時文件的重點 |

常見判讀區間：

| V(G) | 風險評估 |
| --- | --- |
| 1 至 10 | 簡單，風險低 |
| 11 至 20 | 中等複雜，風險中等 |
| 21 至 50 | 複雜，風險高，應考慮拆分 |
| 大於 50 | 幾乎無法測試，風險極高 |

#### 五、限制

圈複雜度只衡量控制流程，不反映資料結構、命名可讀性、巢狀深度、模組間耦合等；它也不等於路徑覆蓋（路徑數可能遠大於 V(G)）。因此應與程式行數、耦合度、測試覆蓋率等度量搭配使用。`

**執行步驟**
1. 各模組獨立完成開發與單元測試。
2. 等所有模組都完成，一次整合成完整系統。
3. 針對整體系統執行測試，找出問題後除錯。

**優點**

| 優點 | 說明 |
| --- | --- |
| 簡單直接 | 不需要規劃整合順序，不需撰寫大量**驅動程式（Driver）與替身程式（Stub）** |
| 小系統效率高 | 模組數少、介面簡單時，整合快速，總成本低 |
| 測試人員可專注 | 只在最後階段集中測試，人力安排單純 |
| 一次接近真實環境 | 一開始就在完整系統上測試，能直接看到整體行為 |

**缺點**

| 缺點 | 說明 |
| --- | --- |
| 錯誤難以定位 | 所有模組同時整合，出錯時難以判斷問題出在哪個模組或介面 |
| 太晚發現介面問題 | 要等所有模組完成才開始整合測試，介面不一致的問題很晚才暴露，修改成本高 |
| 風險集中 | 一次爆發大量錯誤，修了一個又牽出另一個，進度不可控 |
| 難以平行 | 前期人員等候，後期集中壓力，需要重測次數多 |
| 可能漏測 | 不易確保每個介面和路徑都被測到 |
| 不適合大型系統 | 模組多、耦合複雜時幾乎不可行 |

**與漸進式整合比較**：自頂向下（Top-down）、自底向上（Bottom-up）、三明治（Sandwich）整合都是逐步加入模組，錯誤容易定位，較早發現介面問題，因此是大型系統的主流；大爆炸法僅建議用於小型系統、或模組已高度成熟且介面簡單的情形。

#### 二、⑵ 操作設定檔（10 分）

**定義**：**操作設定檔（Operational Profile，亦譯作作業輪廓）** 由 John Musa 提出，是對系統**實際使用方式的量化描述**：列出系統各種操作（功能、輸入類別、使用情境）及其**發生機率（或使用頻率）**，也就是「使用者實際上會怎麼用這個系統」。

**如何產生（Musa 的五步驟）**

1. **找出客戶類型**：誰付錢買系統（如銀行）。
2. **找出使用者類型**：誰實際使用（櫃員、顧客、系統管理者）。
3. **找出系統模式**：正常、尖峰、維護、故障復原等。
4. **找出功能清單**：每個使用者類型要做的功能。
5. **找出操作與其發生機率**：依據舊系統日誌、使用者調查、市場資料、專家估計或試用版統計，算出每個操作占整體的比例，機率合計為 1。

範例（自動提款機）：

| 操作 | 發生機率 |
| --- | --- |
| 提款 | 0.55 |
| 查詢餘額 | 0.25 |
| 轉帳 | 0.12 |
| 存款 | 0.06 |
| 修改密碼 | 0.02 |
| 合計 | 1.00 |

**主要用途**

| 用途 | 說明 |
| --- | --- |
| 產生有代表性的測試案例 | 依機率分配測試資源，常用功能多測，罕用功能少測 |
| 軟體可靠度測試 | 以接近實際使用的負載測試並估算失效率（MTTF），預測可靠度 |
| 效能與負載測試 | 提供真實的使用比例，用於容量規劃與壓力測試 |
| 決定開發與測試資源分配 | 高頻功能多投入開發與驗證 |
| 判斷是否可發布 | 以操作設定檔下的失效強度與可靠度目標作為發布依據 |
| 支援需求與設計取捨 | 找出高使用率功能，優先優化或簡化 |

**注意**：操作設定檔應隨使用行為改變而更新；罕見但關鍵（如安全、緊急停止）的功能不能只依機率低而不測，需另設風險導向的測試。`

| 子項 | 內容 |
| --- | --- |

**驗收測試的做法**：分 Alpha（機關內部）與 Beta（外勤人員實地試用）兩階段；依事先寫好的驗收準則與測試案例，由使用者簽核。

#### 四、執行建議

1. **先擬測試計畫**：範圍、環境、時程、人員、進出準則（如：重大缺陷為零、測試案例通過率 95% 以上）。
2. **測試案例可追蹤**：每個需求至少有對應的測試案例（需求追蹤矩陣）。
3. **使用接近真實的環境與去識別化測資**，避免使用真實敏感資料。
4. **缺陷管理**：嚴重程度分級，修正後做回歸測試。
5. **自動化**：單元測試、API 測試與回歸測試優先自動化。
6. **試運行與切換計畫**：驗收通過後先小範圍試行，再全面上線，並備妥回復計畫。

#### 五、結論

我會建議依序進行**單元、整合、系統（含安全、效能、相容性與離線）、使用者驗收**四層測試，並對每次修改實施回歸測試。理由是：每層對應不同階段的錯誤來源，越早發現、修正成本越低；而對外勤情蒐系統而言，安全性、行動裝置相容性與離線處理是上線後最容易出事的風險點，必須特別測。`

圖是一個**物料（庫存）管理資料庫**的關聯式綱要，九個表格之間全是「1 對多」（一端是 1，多端是 ∞），外鍵放在多端：

#### 二、ER 模型（Chen 表示法）

轉換原則：**「主表＋明細表」的結構，在 ER 中是主表與物料之間的多對多（M:N）關係，明細表就是這個關係本身，數量、單價等欄位成為關係的屬性**；其他 1 對多的連線則成為一般的 1:N 關係。

| 分類 | 物料類別—物料 | 1:N | 一個類別含多種物料，一種物料只屬於一個類別；物料表的「類別」是 FK |
| 供應 | 供應商—入庫單 | 1:N | 一個供應商可以有多張入庫單，一張入庫單只來自一個供應商；入庫表的「供應商」是 FK |
| 入庫明細 | 物料—入庫單 | M:N | 一張入庫單可以入庫多種物料，一種物料可出現在多張入庫單；關係屬性為數量、入庫單價；轉成表格即「入庫明細」，PK 為明細單號，FK 為入庫單號、物料編碼 |
| 出庫明細 | 物料—出庫單 | M:N | 一張出庫單可以領多種物料，一種物料可出現在多張出庫單；關係屬性為數量、成本價；轉成表格即「出庫明細」 |
| 依據 | 製令單—出庫單 | 1:N | 一張製令單（生產命令）可以對應多張出庫單，一張出庫單依據一張製令單；出庫表的「製令單號」是 FK |
| 領料 | 生產單位—出庫單 | 1:N | 一個生產單位可以領料多次，每張出庫單由一個單位領料；出庫表的「領料單位」是 FK |

#### 四、業務流程的說明

- **入庫流程**：供應商交貨（採購單號、送貨單號）→ 開立入庫單 → 逐項寫入入庫明細（物料、數量、單價）→ 物料庫存數增加。
- **出庫流程**：生產單位依製令單領料 → 開立出庫單 → 逐項寫入出庫明細（物料、數量、成本價）→ 物料庫存數減少。
- 物料表的庫存數是一個**累計（衍生）欄位**，可由「入庫明細數量總和 − 出庫明細數量總和」推得，實務上為了查詢效率直接存放，但要注意與明細的一致性（例如以交易或觸發程式更新）。

**結論**：此資料庫有物料類別、物料、供應商、入庫單、出庫單、製令單、生產單位七個實體，透過分類、供應、入庫明細、出庫明細、依據、領料六個關係連結；兩個明細表是物料與入出庫單之間多對多關係的實作。`

| 請假天數 d | 需核可者 |
| --- | --- |

| 1 < d ≤ 3（超過一天、三天以內） | 課長、處長 |

#### 二、決策表（Decision Table）

條件（Condition）與動作（Action）以規則（Rule）欄呈現，Y 代表條件成立、X 代表要執行該動作。

| 項目 | 規則 1 | 規則 2 | 規則 3 |

| **條件**：1 < 天數 ≤ 3 | N | Y | N |
| **條件**：天數 > 3 | N | N | Y |
| **動作**：課長核可 | X | X | X |
| **動作**：處長核可 | - | X | X |
| **動作**：協理核可 | - | - | X |

| 項目 | 規則 1 | 規則 2 | 規則 3 |
| --- | --- | --- | --- |
| 天數 d | ≤ 1 | 1 < d ≤ 3 | > 3 |
| 課長 | X | X | X |
| 處長 | - | X | X |
| 協理 | - | - | X |

#### 五、結構化英文（Structured English）

結構化英文使用 IF、ELSE、DO 等關鍵字與縮排，描述處理邏輯。

\`\`\`text
PROCEDURE Leave_Approval
    READ leave_days
    IF leave_days <= 1 THEN
        REQUIRE approval of Section_Chief
    ELSE
        IF leave_days <= 3 THEN
            REQUIRE approval of Section_Chief
            REQUIRE approval of Division_Director
        ELSE
            REQUIRE approval of Section_Chief
            REQUIRE approval of Division_Director
            REQUIRE approval of Associate_Vice_President
        ENDIF
    ENDIF
    SEND application to the required approvers in order
END PROCEDURE
\`\`\`

| 參與者 | 房東 |
| 簡述 | 房東將可出租的房間或公寓登錄到系統，供學生搜尋 |

**怎麼讀這張圖**

| 圖形現象 | 意義 | 管理者的因應 |
| --- | --- | --- |
| 實際線在理想線上方 | 進度落後 | 檢視障礙，必要時與產品負責人協商縮小範圍 |

本例判讀：前半段落後（第 6 天落差最大，約 13 點），第 6 天加入了新需求，後段團隊加速，最終在第 10 天剛好燒完，如期完成。

| 作用 | 說明 |
| --- | --- |
| 進度可視化與透明 | 全體成員與客戶一眼看見進度，不必讀報表 |
| 預警 | 實際線偏離理想線時，及早發現風險並調整 |
| 預測完成時間 | 依實際線斜率外推，預估能否在迭代或發布日前完成 |
| 範圍變動的證據 | 向利害關係人說明範圍增加如何影響進度 |
| 促進自我管理 | 團隊每天查看，自發檢討障礙與工作分配 |
| 回顧改進依據 | Sprint 回顧時比對歷次圖形，改進估算與規劃 |
| 計算團隊速率 | 配合每個 Sprint 完成點數，推估下一次可承諾的量 |

#### 四、類型與限制

- **Sprint 燃盡圖**：單一迭代；**Release 燃盡圖**：整個發布計畫（以 Sprint 為單位）。
- **燃起圖（Burn-up Chart）**：同時畫「完成工作量」與「總範圍」兩條線，範圍變動更清楚，常與燃盡圖互補。

User Story 是敏捷開發用來描述需求的簡短句子，從**使用者的角度**說明「誰需要什麼功能、為什麼需要」。它不是完整規格，而是**對話的承諾**（a promise for a conversation）：細節在開發時由團隊與客戶面對面釐清。

#### 二、標準樣板

> **As a** <角色（Role）>，**I want** <目標／功能（Goal）>，**so that** <效益／原因（Benefit）>。
>
> 身為 <角色>，我想要 <做某件事>，以便 <獲得某個價值>。

| 樣板欄位 | 回答的問題 | 重點 |
| --- | --- | --- |
| 角色（Who） | 誰需要？ | 具體的使用者類型，避免寫成「使用者」 |
| 目標（What） | 想做什麼？ | 描述使用者要達成的事，不是技術實作 |
| 效益（Why） | 為什麼？ | 說明商業價值，幫助排優先順序與找出替代方案 |

**完整的 User Story 通常包含「3C」**：
1. **卡片（Card）**：把故事寫在一張索引卡上，字數少，只放重點。
2. **對話（Conversation）**：開發時與客戶持續討論細節。
3. **確認（Confirmation）**：以**驗收條件（Acceptance Criteria）** 定義何謂完成，常用 Given-When-Then 格式。

**好故事的 INVEST 原則**

| 字母 | 原則 | 說明 |
| --- | --- | --- |
| I | Independent 獨立 | 故事之間盡量不相依，可任意排序 |
| N | Negotiable 可協商 | 細節可討論，不是合約 |
| V | Valuable 有價值 | 對使用者或客戶有價值 |
| E | Estimable 可估算 | 團隊能估出大小 |
| S | Small 夠小 | 一個迭代內可完成 |
| T | Testable 可測試 | 有明確的驗收條件 |

#### 三、範例：大學圖書館借閱系統

**情境假設**：大學圖書館要建置線上借閱系統，產品負責人與學生代表一起訂出需求，其中一個故事如下。

**開發團隊的後續做法**

1. 與學生代表對話，確認「預約」是否需排隊、是否可取消。

#### 四、其他寫法

- **Job Story**：When <情境>, I want to <動機>, so I can <期望結果>，強調情境。
- 反例：「系統要使用 MySQL」是技術限制而非使用者故事；「使用者要有很好的畫面」不具體、不可測試。`

#### 二、四種測試與其依據

| 測試層級 | 測試對象 | 擬定測試計畫所依據的程序或文件 | 測試焦點 | 通常負責人 |
| --- | --- | --- | --- | --- |
| 單元測試 | 單一程式、函式或類別（模組） | **詳細設計文件**：程式規格、模組設計（演算法、偽碼、流程圖）、類別設計、資料結構與介面規格 | 內部邏輯、路徑與分支、邊界值、錯誤處理（白箱為主） | 程式設計者 |
| 整合測試 | 模組組合後的介面與互動 | **系統設計（架構設計）文件**：系統架構圖、結構圖、模組與介面規格、通訊與循序圖、資料流程與資料庫設計 | 模組間資料傳遞、呼叫順序、介面一致性、整合後行為 | 開發團隊、測試人員 |
| 系統測試 | 整個已整合的系統 | **系統分析（需求規格）文件**：軟體需求規格書（SRS）、功能與非功能需求、使用案例、系統分析模型 | 功能、效能、安全、可靠度、相容性、復原（黑箱） | 獨立測試團隊 |
| 使用者驗收測試 | 在使用者環境中的整個系統 | **使用者需求與契約文件**：使用者需求書、業務流程、驗收準則、契約與規格、系統請購文件 | 是否滿足真實業務需要、是否可以上線 | 使用者、客戶代表（開發者協助） |

#### 三、說明

1. **單元測試依詳細設計**：詳細設計描述每個模組內部做什麼，據此可設計出能覆蓋每條邏輯路徑的測試案例（如判定覆蓋、條件覆蓋、邊界值），並撰寫驅動程式（Driver）與替身程式（Stub）。
2. **整合測試依系統（高階）設計**：系統設計決定了模組如何切分與連接，因此整合測試的順序（由上而下、由下而上、三明治）和測試介面的案例，從設計文件的架構及介面規格導出。
3. **系統測試依系統需求規格**：系統測試要證明「系統做對事」，必須回到需求規格書逐條驗證功能與非功能需求；每個需求都至少對應一個測試案例，用**需求追蹤矩陣**確保沒有遺漏。
4. **驗收測試依使用者需求與契約**：驗收是從使用者與客戶角度，依原始需求、驗收準則與契約規範判斷是否收貨，測試案例通常是真實業務情境，並由使用者簽核。

#### 四、舉例：圖書館借閱系統

| 層級 | 依據文件中的內容 | 測試案例例子 |
| --- | --- | --- |
| 單元 | 詳細設計：計算逾期罰款函式的演算法 | 逾期 0 天、1 天、30 天、負數日期 |
| 整合 | 系統設計：借閱模組呼叫會員模組與館藏模組的介面 | 借書時會員停權，館藏狀態是否保持不變 |
| 系統 | SRS：「系統須在 3 秒內回應借書要求」 | 100 位同時借書，回應時間量測 |
| 驗收 | 使用者需求：館員可在期末一次處理畢業生離館手續 | 館員實際用真實流程辦理，確認可用 |

#### 五、結論

「**單元對詳細設計、整合對系統設計、系統對需求規格、驗收對使用者需求**」。這個對應關係使測試能與開發平行規劃、可追溯需求，並使各階段的缺陷在對應層級被發現。`

#### 二、哪一個物件導向特性使疊代漸增適合物件導向開發

**答案重點：封裝（Encapsulation，連同資訊隱藏與模組化）。**

物件把**資料與操作該資料的方法包裝在同一個類別**中，內部實作隱藏，只以公開的介面與外界互動。因此：

1. **局部修改，不波及全局**：每次疊代修改或新增功能時，只影響相關類別的內部，不會牽動其他類別，使反覆修改成本低、風險小。
2. **類別可獨立開發與測試**：每個類別（物件）是自成一體的單位，可在某次疊代中先做完一部分、單獨測試，再整合進系統；這正是「漸增」所需要的條件。
3. **介面穩定，內部可演進**：早期疊代可用簡易實作，後續疊代再替換為完整實作，只要公開介面不變，其他部分不受影響。
4. **低耦合、高內聚**：封裝使類別之間以訊息溝通，降低耦合，適合多人、多次疊代分工。
5. **模型一致**：從分析的類別、設計的類別到程式的類別，是同一套概念持續細化，不需要像結構化方法那樣在階段之間轉換表示法，因此反覆回頭修改模型很自然。

**其他特性的輔助作用**

| 特性 | 對疊代漸增的幫助 |
| --- | --- |
| 繼承（Inheritance） | 以既有類別為基礎擴充新子類別，新增功能不必重寫舊程式，易於「漸增」 |
| 多型（Polymorphism） | 新增一種子類別，呼叫端程式不必修改，符合開放封閉原則 |
| 抽象化 | 先以抽象類別或介面定義架構，後續疊代再補實作 |
| 重用 | 前次疊代產出的類別可在下次疊代直接使用 |

#### 三、舉例：線上購物系統

- 第 1 次疊代：實作「會員」與「商品」類別，完成登入與瀏覽。
- 第 2 次疊代：新增「購物車」與「訂單」類別，完成下單。
- 第 3 次疊代：新增「付款」介面與信用卡、行動支付兩個實作類別。因為訂單類別只透過付款介面呼叫，新增付款方式不用修改訂單類別。

每次疊代都新增一批可執行功能，且舊類別因封裝而大致不受影響，這就是疊代漸增與物件導向的契合點。

#### 四、結論

RUP 的第三個特點是**疊代與漸增式開發**；物件導向的**封裝（資訊隱藏）** 讓類別成為可獨立修改、測試、組合的單位，使系統可以一次一小塊地成長與修正，所以特別適合。`

3. 每個套件內再畫細部類別圖：例如打開「訂單管理」，內有訂單、訂單明細、購物車三個類別及其關聯。

**切割的步驟**
1. 找出相關度高的使用案例或類別（如共用資料、同一業務、同一變更原因）。
2. 為每組取一個簡短、有意義的名稱，形成套件。
3. 分析套件間的相依，盡量讓相依方向單向、避免循環。
4. 對每個套件再畫較小的使用案例圖或類別圖。

#### 三、簡短名稱代表什麼：內聚力（Cohesion）

為套件取一個簡短的名稱（如「訂單管理」）而能清楚表達其用途，表示**套件內的元素彼此緊密相關，共同完成同一個明確的責任**，也就是具有**高內聚力（High Cohesion）**。如果名稱必須取成「雜項」「其他」「共用」，或需要用很長的詞（如「訂單與會員及發票處理」），通常代表套件內容混雜、內聚力低，應重新切割。

| 比較 | 高內聚 | 低內聚 |
| --- | --- | --- |
| 套件內容 | 都是訂單處理相關的類別 | 訂單、公司公告、報表、字串工具混在一起 |
| 命名 | 一個簡短名詞即可概括 | 需要「與」「及」或籠統名稱 |
| 變更 | 同一需求只改一個套件 | 一個需求要改多個套件 |
| 重用 | 整包可被重用 | 難以單獨取用 |

**與耦合力（Coupling）的搭配**：好的子系統切割應同時追求**套件內高內聚、套件間低耦合**。套件圖可以直接檢視耦合：箭頭越少越簡單、沒有循環相依越好。

#### 四、補充：切割原則

| 原則 | 說明 |
| --- | --- |
| 共同封閉 | 會因同一原因而一起變更的類別放在同一套件 |
| 共同重用 | 會一起被重用的類別放在同一套件 |
| 無循環相依 | 套件相依圖不應有環，必要時引入介面反轉相依 |
| 穩定相依 | 相依方向指向較穩定的套件 |
| 大小適中 | 一個套件約含 5 至 10 個類別，利於理解 |

#### 五、結論

使用 **UML 套件圖**可將過於複雜的使用案例圖與類別圖切成子系統或模組；套件能用簡短名稱概括，表示其內部具有**高內聚力**。再搭配低耦合的套件間相依，系統才容易理解、分工與維護。`

#### 二、逐項回答

**1. 使用案例觀點是從哪 3 者的角度描述系統行為？（10 分）**

答：從**使用者（最終使用者）、系統分析師、測試者**三者的角度，描述系統所提供的功能與行為，也就是「系統要做什麼」。

- 使用者：關注系統提供哪些服務、如何操作。
- 系統分析師：以使用案例捕捉並確認需求，作為分析、設計的起點。
- 測試者：以使用案例及其情境作為擬定系統測試與驗收測試案例的依據。
- 主要 UML 圖：使用案例圖，並以循序圖、活動圖補充情境。
- 它位於中心，是其他四個觀點的共同依據：每個觀點都必須能支援這些使用案例，所以稱為「+1」。

**2. 流程觀點強調何種需求？可用 UML 的何種圖呈現？（10 分）**

答：流程觀點強調**非功能性需求**，特別是**效能、可擴充性、並行（同時處理）、同步、容錯、吞吐量**，描述系統執行時的**動態行為與程序（process）、執行緒之間的溝通與協調**。關係人主要是系統整合者。

- 可使用**活動圖（Activity Diagram）** 表示程序的流程、並行與同步（分叉、合併）。
- 亦常搭配**循序圖（Sequence Diagram）、通訊圖、狀態機圖（State Machine Diagram）** 呈現物件間的互動與狀態變化。
- 例：訂單系統中「付款處理」與「庫存扣減」可同時進行，需用活動圖的分叉與合併表示並行，並分析尖峰時每秒可處理的訂單數。

**3. 實際觀點採用何者的角度？（10 分）**

答：採用**系統工程師（System Engineer）** 的角度，描述**最後部署的實際系統架構**，也就是軟體元件如何對應到實體的硬體節點（伺服器、網路設備、終端裝置）以及節點之間的通訊連線。

- 關注：系統拓樸、可用性（備援、負載平衡）、可靠度、傳輸效能、安裝與部署。
- 可使用 UML 的**部署圖（Deployment Diagram）**，並可搭配元件圖表示軟體元件部署到哪個節點。
- 例：網頁伺服器節點部署前端元件，應用伺服器節點部署訂單元件，資料庫伺服器節點部署資料庫，各節點以 HTTPS、JDBC 連線。

#### 三、五個觀點總整理

| 觀點 | 關係人 | 關注重點 | 常用 UML 圖 |
| --- | --- | --- | --- |
| 邏輯觀點 Logical | 最終使用者、分析設計人員 | 系統提供的功能，以類別與物件的抽象結構來呈現 | 類別圖、物件圖、狀態機圖、循序圖、通訊圖 |
| 開發觀點 Development | 程式設計師、軟體管理者 | 軟體在開發環境的組織、模組、套件與分層、程式碼結構 | 套件圖、元件圖 |
| 流程觀點 Process | 系統整合者 | 非功能需求：效能、並行、同步、可擴充性 | 活動圖、循序圖、狀態機圖 |
| 實際觀點 Physical | 系統工程師 | 軟體對應到硬體的部署、拓樸、網路 | 部署圖 |
| 使用案例觀點 Use Case（+1） | 使用者、分析師、測試者 | 系統行為與情境，串聯並驗證其他四個觀點 | 使用案例圖、活動圖、循序圖 |

> 說明：下圖依原題附圖重繪：邏輯觀點（左上）、流程觀點（右上）、開發觀點（左下）、實際觀點（右下）圍繞中央的使用案例觀點。

#### 四、為何需要多個觀點

單一種圖無法同時滿足使用者、程式設計師、系統整合者、系統工程師等不同關係人的關切；4+1 以多個觀點分別描述，各自簡潔，再用使用案例保持一致，讓整體架構文件既完整又容易溝通。`

      answer: `#### 一、設計說明

**資料抽象化**：把真實世界的「人」抽象成 Person 這個抽象資料型態（Abstract Data Type, ADT），由**資料（屬性）** 與**對資料的操作（方法）** 組成：

| --- | --- | --- |
| 屬性（資料） | name、address、phone | 宣告為私有（private），外部不能直接存取，達到封裝與資訊隱藏 |
| 輸入操作 | setPerson() | 把外部的資料存入物件，改變物件狀態 |
| 輸出操作 | getName()、getAddress()、getPhone() | 把物件內的資料取出回傳給外部，不改變物件狀態 |

#### 二、虛擬碼

\`\`\`text
CLASS Person
    PRIVATE name    : String      // 姓名
    PRIVATE address : String      // 地址
    PRIVATE phone   : String      // 電話號碼

    // 輸入操作：由外部把資料存入物件
    PROCEDURE setPerson(inName, inAddress, inPhone)
        name    <- inName
        address <- inAddress
        phone   <- inPhone
    END PROCEDURE

    // 輸出操作：把物件內的資料回傳給外部
    FUNCTION getName() RETURNS String
        RETURN name
    END FUNCTION

    FUNCTION getAddress() RETURNS String
        RETURN address
    END FUNCTION

    FUNCTION getPhone() RETURNS String
        RETURN phone
    END FUNCTION
END CLASS

// 使用方式
p <- NEW Person
p.setPerson("王小明", "台北市中正區", "0912345678")
PRINT p.getName(), p.getAddress(), p.getPhone()
\`\`\`

#### 三、操作的輸入與輸出分類

| 操作 | 類型 | 參數 | 回傳 | 說明 |
| --- | --- | --- | --- | --- |
| setPerson(inName, inAddress, inPhone) | **輸入** | 姓名、地址、電話 | 無 | 將資料寫入物件（設定者，setter / mutator） |
| getName() | **輸出** | 無 | 姓名 | 讀出姓名（取得者，getter / accessor） |
| getAddress() | **輸出** | 無 | 地址 | 讀出地址 |
| getPhone() | **輸出** | 無 | 電話號碼 | 讀出電話號碼 |

判斷方式：**資料由外部流入物件的為輸入**（參數傳進來、改變屬性）；**資料由物件流出給外部的為輸出**（以回傳值傳出）。

#### 四、設計理由

1. **封裝**：屬性私有，外界只能透過四個公開操作存取，所以將來若電話格式要改（例如加入區碼檢查），只需修改 Person 內部。
2. **資料驗證集中**：可在 setPerson 中檢查，例如姓名不可為空、電話只能是數字，確保物件資料的有效性。
3. **介面穩定**：get 系列操作僅回傳資料而不更動物件，使用者容易理解，也較安全。
4. **可擴充**：之後可加入 Student、Employee 繼承 Person，重用這四個操作。

加入驗證的 setPerson 虛擬碼：

\`\`\`text
PROCEDURE setPerson(inName, inAddress, inPhone)
    IF inName is empty THEN
        RAISE error "姓名不可為空"
    END IF
    IF inPhone contains non-digit THEN
        RAISE error "電話僅能為數字"
    END IF
    name    <- inName
    address <- inAddress
    phone   <- inPhone
END PROCEDURE
\`\`\`

typedef struct {
    char name[32];

**執行程序**

1. **整體需求分析與架構設計**：蒐集全部（或大部分）需求，訂出系統整體架構與模組介面。
2. **需求分組與排序**：依優先順序、風險、相依性把需求分成若干增量；通常「核心且高價值、高風險」的功能放在最前面。
3. **逐一增量開發**：每個增量各自經過詳細設計、編碼、單元與整合測試，並與前一版整合做回歸測試。
4. **交付與上線**：每一增量完成後交付使用者實際使用，蒐集回饋。
5. **重複至完成**：回饋可修正後續增量的內容與順序，直到全部功能完成。

**原則**

- 需求與架構先行，避免各增量接不起來。
- 每個增量規模小、時間短，可獨立測試與交付。
- 先交付核心功能，再逐步擴充。
- 後續增量不得破壞已交付功能（需回歸測試）。
- 各增量之間的相依性要低，介面要事先定義清楚。

**強調重點**

| 重點 | 說明 |
| --- | --- |
| 早期交付價值 | 第一版就有可用的核心功能，使用者可及早受益 |
| 風險分散 | 把風險拆到各增量，高風險部分先做、先驗證 |
| 使用者回饋 | 以實際使用經驗修正後續增量，降低需求誤解 |
| 架構穩定 | 整體架構在前期決定，增量只是填入功能 |
| 人力彈性 | 可依人力分批投入，不需一次投入全部人員 |

#### 二、與瀑布模式在應用上的差異（10 分）

| 比較項目 | 瀑布模式（Waterfall） | 漸增模式（Incremental） |
| --- | --- | --- |
| 開發流程 | 各階段依序進行一次：需求、設計、實作、測試、維護 | 整體需求與架構一次，之後每個增量各做一輪設計到測試 |
| 交付時間 | 全部完成後才交付一次 | 分批交付，早期即有可用版本 |
| 需求變動 | 需求須早期凍結，後期變更成本高 | 後續增量可吸收部分變更，彈性較高 |
| 風險 | 問題到後期整合測試才暴露，風險集中 | 風險分散，高風險部分提早驗證 |
| 使用者參與 | 主要在需求與驗收階段 | 每次增量交付都能回饋 |
| 人力與資金 | 前期需一次投入較多 | 可分期投入，現金流壓力較小 |
| 管理與文件 | 管理簡單、文件完整、容易稽核 | 需管理版本與整合、回歸測試，管理較複雜 |
| 適用情境 | 需求明確穩定、規模不大或法規要求嚴格的系統 | 需求大致明確但希望早期上線、規模較大或可分模組的系統 |

**例子**：開發電子商務系統，若採瀑布，須待訂購、付款、出貨全部完成才上線；若採漸增，可先交付「商品瀏覽與訂購」（增量 1），再加「線上付款」（增量 2）與「出貨與物流追蹤」（增量 3），營運單位及早開始接單並依實際使用提出修正。

**結論**：漸增模式是「瀑布式的需求與架構規劃」加上「分批交付」，兼顧控管與彈性；需求高度不確定時則需進一步搭配原型或敏捷方法。`

      question: `資料庫若沒有適當的設計，於資料維護時可能造成異常現象，包括新增異常、刪除異常及修改異常。請分別舉例說明這三種異常。（25 分）`,
      answer: `#### 一、異常的成因

當一張表格把**多種實體的資料混在一起**（違反正規化，存在部分相依或遞移相依），就會有資料重複與資料綁在一起的問題，造成資料維護時的三種異常（Anomaly）。解法是**正規化（Normalization）**，把表格拆成各自單純的表格。

#### 二、舉例的資料表

假設一張「修課」表，主鍵為（學號, 課程代號）：

\`\`\`text
修課(學號, 課程代號, 課程名稱, 授課老師, 成績)

學號    課程代號  課程名稱    授課老師  成績
S001    C101      資料庫      王老師    85
S002    C101      資料庫      王老師    78
S001    C102      系統分析    李老師    90
\`\`\`

問題：課程名稱與授課老師只相依於課程代號（部分相依），卻與學生成績存放在同一列。

#### 三、三種異常

| 異常 | 定義 | 上例的情形 |
| --- | --- | --- |
| 新增異常（Insertion Anomaly） | 想新增某筆資料，卻因為缺少其他不相關的主鍵欄位而無法新增 | 新開一門課 C103 網路安全，尚無學生選修，學號為空，但學號是主鍵的一部分不可為 NULL，所以課程資料無法單獨新增 |
| 刪除異常（Deletion Anomaly） | 刪除某筆資料時，連帶失去其他不該被刪除的資訊 | 學生 S001 退選 C102，若刪除該列，而 S001 是唯一選修者，則「C102 系統分析、李老師」這門課的資料也隨之消失 |
| 修改異常（Update Anomaly） | 同一份資料重複儲存在多列，修改時漏改某些列造成資料不一致 | C101 課程改由張老師授課，必須更新所有 C101 的列；若只改了其中一列，同一門課會出現王老師與張老師兩種授課老師，資料互相矛盾 |

#### 四、再舉一例（訂單）

訂單表「訂單(訂單編號, 商品編號, 商品名稱, 單價, 顧客姓名, 顧客電話, 數量)」：

- **新增異常**：新上架商品尚無人下單，沒有訂單編號，無法新增商品名稱與單價。
- **刪除異常**：刪除某顧客唯一的一張訂單，會連同該顧客的姓名與電話一併消失。
- **修改異常**：顧客更改電話，須修改其所有訂單列，漏改就會出現同一顧客兩支電話。

#### 五、解決方式：正規化

\`\`\`text
課程(課程代號 PK, 課程名稱, 授課老師)
學生(學號 PK, 姓名 ...)
修課(學號 FK, 課程代號 FK, 成績)   主鍵 = (學號, 課程代號)
\`\`\`

      question: `於軟體系統的建置階段必須進行程式撰寫、測試與系統文件整備等，其中的測試有所謂的單元（unit）測試，請問以物件導向設計的軟體系統而言，單元測試一般可分為那兩種？請分別說明之。兩種單元測試的計畫來源（test plan source）為何？請分別列出。（20 分）`,
      answer: `#### 一、單元測試的意義

單元測試（Unit Testing）針對系統中最小的可測試單位進行測試。在物件導向系統中，單位是**類別（Class）及其方法（Method）**；測試重點是單一類別或方法是否依設計正確運作，通常由程式設計師在編碼時就先做。

#### 二、單元測試的兩種（依測試設計的依據分）

| 種類 | 又稱 | 說明 | 測試方法 |
| --- | --- | --- | --- |
| 黑箱測試（Black-Box Testing） | 功能測試、規格導向測試 | 只看輸入與輸出，不看程式內部寫法；檢查類別或方法**是否做到規格要求** | 等價類別分割、邊界值分析、錯誤猜測 |
| 白箱測試（White-Box Testing） | 結構測試、玻璃箱測試、邏輯導向測試 | 依據**程式內部的邏輯結構**設計測試資料，檢查每條路徑、每個判斷是否被走過 | 敘述涵蓋、分支（判斷）涵蓋、條件涵蓋、路徑涵蓋、基本路徑測試（圈複雜度） |

**物件導向的特點**：對方法而言，兩種測試都適用；對類別而言，因為物件有狀態，還要測試方法呼叫順序對物件狀態的影響，繼承時子類別也要重新測試被覆寫的方法。

**小例子**：方法 \`int grade(int score)\` 規定 0 到 100 分，60 分以上及格。
- 黑箱：選 -1、0、59、60、100、101 等邊界值，檢查結果是否符合規格，不管程式如何寫。
- 白箱：依程式的 if 分支設計資料，確保「小於 0」「及格」「不及格」「大於 100」每個分支都至少執行一次。

#### 三、兩種單元測試的測試計畫來源（Test Plan Source）

測試計畫（要測什麼、用什麼資料、預期結果是什麼）必須有依據，兩者來源不同：

| 測試種類 | 測試計畫來源 |
| --- | --- |
| 黑箱測試 | 方法與類別的**規格文件**，也就是設計階段產出的類別圖與類別規格（方法簽章、前置與後置條件）、使用案例描述、需求規格書 |
| 白箱測試 | 方法的**程式內部邏輯**，也就是原始程式碼、詳細設計的程序邏輯（流程圖、虛擬碼、結構化英文），以及由此導出的控制流程圖與圈複雜度 |

**關聯**：單元測試往上是整合測試（來源是系統設計與架構、程式間介面），再往上是系統測試（來源是系統需求與使用案例）與驗收測試（來源是使用者需求與驗收準則）。越底層越偏向程式內部，越高層越偏向使用者需求。

**結論**：物件導向單元測試分為黑箱與白箱兩種，黑箱的計畫來源是規格，白箱的計畫來源是程式碼與程序邏輯，兩者互補，才能同時檢查「做對的事」與「把事做對」。`

輸出（Output）包括報表、畫面、圖表等，是使用者實際看到系統價值的地方。

| 1. 了解報表（輸出）的用途 | 先弄清楚**誰用、為何用、怎麼用、多久用一次、用在何處**，再決定內容與格式 | 倉管每天揀貨用的出貨清單要依儲位排序；主管月會用的是摘要圖表，不必列出每一筆明細 |
| 2. 管理資訊負載 | 資訊要夠用但不過量，避免使用者被資料淹沒 | 只放必要欄位；分組與小計；重要資訊在前；分頁或可展開明細；以顏色或粗體標示重點，但不濫用 |
| 3. 減少偏誤（Minimize Bias） | 輸出的呈現方式不應誤導使用者的判斷 | 圖表座標軸要從 0 起算；比較用相同尺度；不用誇張的 3D 或配色；清楚標示資料來源、日期與單位 |

另外常見的補充：版面一致（標題、頁碼、日期、欄位對齊位置固定），並考慮不同媒介（紙本、螢幕、行動裝置）的特性。

#### 二、五種輸出類型（15 分）

| 類型 | 說明 | 例子 |
| --- | --- | --- |
| 1. 明細報表（Detail Report） | 列出每一筆交易或每筆資料的詳細內容，通常用於作業層 | 每日銷售明細表，列出每張訂單與商品 |
| 2. 摘要報表（Summary Report） | 將明細依某些條件**彙總**（總計、小計、平均），提供管理層看趨勢 | 月銷售彙總：依商品類別統計金額與百分比 |
| 3. 例外報表（Exception Report） | 只列出**不符合預期或超過門檻**的資料，讓管理者聚焦於問題 | 庫存低於安全存量的商品清單；逾期未付款的訂單 |
| 4. 回收文件（Turnaround Document） | 系統產生的輸出，使用者填寫或修改後，**再輸回系統**作為輸入 | 水電費繳費單、寄出的盤點表，填入實際數量後掃描回傳 |
| 5. 圖表（Graph） | 以圖形呈現資料，易於看出趨勢、比例與比較 | 折線圖看營收趨勢、長條圖比較分店業績、圓餅圖看市占率 |

**補充**：輸出也可依媒介分為紙本報表、螢幕畫面、網頁與電子郵件、語音等；例外報表常搭配即時警示，圖表常嵌在摘要報表與儀表板中。

**結論**：好的輸出設計要先了解使用情境，控制資訊量，並以公正的方式呈現；再依使用者層級選擇明細、摘要、例外、回收文件或圖表等合適的輸出類型。`

      question: `物件導向的設計樣式（design pattern）可幫助軟體開發者解決軟體設計的問題並提高軟體品質，低耦合度樣式（low coupling pattern）可保持類別之間最低的耦合度。高耦合度類別表示該類別需依賴其他很多個類別，和很多個類別之間有各種類別關係，可以使用封裝（encapsulation）來降低耦合度。例如：如下所示之訂購商品系統通訊圖，客戶類別擁有訂單類別，三個類別間相互依賴。如讓訂單類別來建立訂單明細類別，可降低類別間的耦合度，其好處是當實作需要更改訂單明細類別時，只會影響到訂單類別，而不會影響到客戶類別，請畫出低耦合度樣式的通訊圖。（20 分）
（附圖：訂購商品系統通訊圖，客戶、訂單、項目[i]：訂單明細三個物件，訊息 1：<<create>>、2：<<create>> *[每一個商品]、2.1：附加() *[每一個商品]。）`,
      answer: `> 說明：先依原題附圖重畫「改善前」的高耦合版本（客戶同時認識訂單與訂單明細），再畫出題目要求的「改善後」低耦合版本。

#### 一、低耦合度樣式的概念

**耦合度（Coupling）** 指一個類別對其他類別的依賴程度。依賴越多，其他類別一改動，這個類別就容易跟著受影響。低耦合度樣式的作法是：**把建立或操作某物件的責任，交給本來就最了解它、與它關係最密切的類別**，用封裝把細節藏在該類別內，其他類別只需知道這個類別即可。

#### 三、圖的說明

| 訊息 | 發送者到接收者 | 意義 |
| --- | --- | --- |
| 1：«create» | 客戶到訂單 | 客戶要下單時，只要請求建立一個訂單物件 |
| 2：«create» *[每一個商品] | 訂單到項目[i]：訂單明細 | 訂單**自己**針對每一個購買商品，建立一個訂單明細物件（* 為迭代，[ ] 內為迭代條件） |
| 2.1：附加() *[每一個商品] | 訂單內部 | 訂單把剛建立的明細加入自己的明細集合；因為由訂單自己建立與保管，不必再讓客戶操作 |

#### 四、耦合度比較

| 項目 | 改善前（客戶建立訂單與明細） | 改善後（訂單建立明細） |
| --- | --- | --- |
| 客戶依賴的類別 | 訂單、訂單明細（2 個） | 訂單（1 個） |
| 類別之間的依賴 | 客戶、訂單、訂單明細三者互相依賴 | 客戶到訂單，訂單到訂單明細，呈單向鏈狀 |
| 修改訂單明細的影響 | 客戶、訂單都可能要改 | 只影響訂單 |
| 封裝 | 訂單明細的建立細節暴露給客戶 | 訂單明細被訂單封裝，外界看不到 |
| 其他好處 | 無 | 訂單最了解自己的明細，符合資訊專家（Information Expert）原則，也較易重用與測試 |

**結論**：讓訂單類別建立訂單明細類別，可將類別間的依賴減為客戶到訂單、訂單到明細的單向關係，達到題目要求的低耦合效果。`

      question: `物件導向設計的主要工作是進行互動塑模（interaction modeling），其主要目的為何？請問進行類別屬性、行為和類別關係的細部設計建立設計模型（Design Model）類別圖的基本步驟為何？（30 分）`,
      answer: `#### 一、互動塑模的主要目的（10 分）

**互動塑模**是以**循序圖（Sequence Diagram）、通訊圖（Communication Diagram）** 等互動圖，描述**物件之間如何傳遞訊息、合作**完成一個使用案例的過程。

主要目的：

1. **說明使用案例如何由物件合作實現**：把使用案例的每個步驟，分配給參與的物件，呈現呼叫順序。
2. **找出類別的責任與操作（方法）**：圖中每一個訊息，都對應到接收物件所屬類別必須提供的方法，由此決定類別行為。
3. **找出類別之間的關係**：兩物件之間有訊息往來，代表其類別之間需要有關聯或相依，由此決定類別關係與多重性。
4. **找出尚缺的類別**：為了讓互動順利，常需要加入邊界類別、控制類別或資料存取類別。
5. **驗證與改善設計**：檢視互動是否合理，發現耦合過高、責任不當等問題，再套用設計樣式（如低耦合、高內聚）調整。
6. **作為類別圖與程式碼的橋樑**：互動圖是分析模型到詳細設計類別圖的重要依據，也是撰寫與測試程式的藍圖。

#### 二、建立設計模型類別圖的基本步驟（20 分）

設計模型類別圖是以分析階段的概念類別圖為基礎，加入與實作有關的細節而成。

\`\`\`htmldiagram
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:'Noto Sans TC',sans-serif;font-size:13px;margin:.4rem 0"><span style="background:#1f5673;color:#fff;padding:5px 10px;border-radius:6px">1 屬性<br><small>型態、可見度</small></span><span>→</span><span style="background:#8a3324;color:#fff;padding:5px 10px;border-radius:6px">2 方法<br><small>簽章、參數</small></span><span>→</span><span style="background:#2f6b4f;color:#fff;padding:5px 10px;border-radius:6px">3 關係<br><small>關聯、繼承</small></span><span>→</span><span style="background:#6a4c93;color:#fff;padding:5px 10px;border-radius:6px">4 設計類別<br><small>邊界、控制、實體</small></span><span>→</span><span style="background:#a07e2c;color:#fff;padding:5px 10px;border-radius:6px">5 套用樣式<br><small>低耦合、高內聚</small></span><span>→</span><span style="background:#b5651d;color:#fff;padding:5px 10px;border-radius:6px">6 檢查<br><small>對照互動圖</small></span></div>
\`\`\`

| 步驟 | 工作內容 | 例子（訂單類別） |
| --- | --- | --- |
| 1. 決定類別屬性 | 為每個類別補上屬性的名稱、**資料型態、可見度（+公開、-私有、#保護）、預設值**，並消除冗餘 | \`- 訂單編號 : String\`、\`- 訂購日期 : Date\` |
| 2. 決定類別行為（方法） | 依互動圖的訊息與使用案例，為類別定義方法的名稱、**參數、回傳型態、可見度**，必要時加入前置與後置條件 | \`+ 新增明細(商品, 數量) : void\`、\`+ 計算總額() : double\` |
| 3. 細部設計類別關係 | 決定類別之間的**關聯、聚合與組合、繼承（一般化）、相依**，並標示**多重性與導覽方向** | 客戶 1 對 0..* 訂單；訂單組合 1..* 訂單明細 |
| 4. 加入設計階段的類別 | 補上實作所需的**邊界類別（畫面）、控制類別、資料存取類別、輔助類別**，並決定介面與抽象類別 | 訂單畫面、訂單控制器、訂單資料存取物件 |
| 5. 套用設計樣式與原則 | 檢查耦合與內聚，運用低耦合、高內聚、資訊專家、單例、工廠等設計樣式調整類別責任 | 由訂單建立訂單明細（降低客戶的耦合） |
| 6. 檢查與精鍊 | 對照循序圖與通訊圖、使用案例，確認每個訊息皆有對應方法、類別圖足以支援所有案例；必要時反覆修正，再作為程式撰寫依據 | 檢查所有訊息都已有接收方法 |

**實務重點**

- 設計模型不是一次完成，是**與互動圖交替反覆（迭代）** 修正的結果。
- 屬性、方法的細節程度要配合所用程式語言（例如型態名稱、介面、泛型）。
- 要檢查類別圖是否符合 **封裝、高內聚、低耦合** 等設計品質。

**結論**：互動塑模讓設計者看見物件如何合作，並導出類別的方法與關係；再依「屬性、方法、關係、設計類別、套用樣式、檢查」的步驟將分析類別圖細化為可實作的設計類別圖。`

      answer: `#### （一）資料操作語言 DML（5 分）

**意涵**：資料庫語言中，用來**存取與操作表格內資料**的指令集合，對資料列進行查詢、新增、修改與刪除。它不改變表格結構（改結構的是 DDL 資料定義語言；授權的是 DCL）。

| 指令 | 用途 |
| --- | --- |
| SELECT | 查詢資料 |
| INSERT | 新增資料 |
| UPDATE | 修改資料 |
| DELETE | 刪除資料 |

\`\`\`sql
INSERT INTO student(sid, name) VALUES ('S001', '王小明');
UPDATE student SET name = '王大明' WHERE sid = 'S001';
SELECT * FROM student WHERE sid = 'S001';
DELETE FROM student WHERE sid = 'S001';
\`\`\`

#### （二）委外需求建議書 RFP（5 分）

**意涵**：機關（需求方）將資訊系統**委託外部廠商開發或維運**時，所撰寫並公告給廠商的文件，說明機關要什麼，邀請廠商提出建議書與報價。廠商據此提出「建議書」（供應商提案），機關再依評選結果決標簽約。

| RFP 常見內容 | 說明 |
| --- | --- |
| 專案背景與目標 | 為何要做、預期效益 |
| 工作範圍與需求規格 | 功能與非功能需求（效能、安全、可用性） |
| 時程與交付項目 | 里程碑、文件與系統 |
| 技術與資安要求 | 平台、標準、資安與個資保護、保密 |
| 驗收與保固條件 | 驗收標準、保固期、SLA |
| 廠商資格與評選標準 | 實績、人力、財務、評分項目與權重 |
| 契約與付款條件 | 計價方式、罰則、智慧財產權 |

RFP 是委外專案成敗的關鍵文件：需求寫得清楚，廠商報價才有共同基準，之後驗收才有依據。

#### （三）繼承 Inheritance（5 分）

**意涵**：物件導向的重要機制，**子類別（Subclass）自動擁有父類別（Superclass）的屬性與方法**，並可新增或覆寫（Override）自己的屬性與方法。它表達「是一種（is-a）」的關係，目的是**程式碼重用**並支援多型。

\`\`\`java
class Employee {
    String name;
    double base() { return 30000; }
}
class Manager extends Employee {   // Manager 繼承 Employee
    double bonus;
    double base() { return 50000; } // 覆寫父類別方法
}
\`\`\`

UML 類別圖以空心三角形箭頭由子類別指向父類別（一般化 Generalization）。

#### （四）主鍵 Primary Key（5 分）

**意涵**：關聯式資料庫中，**能唯一識別表格中每一筆資料列**的欄位或欄位組合。主鍵的限制：

1. **唯一性**：不能有兩列相同的主鍵值。
2. **非空值**：不可為 NULL（實體完整性）。
3. 應**最小化**（不含多餘欄位）、值穩定不常變動。

每張表只能有一個主鍵（可由多欄位組成複合鍵）；其他表以**外鍵（Foreign Key）** 參照主鍵建立關聯。例如學生表主鍵為學號，修課表主鍵為（學號, 課程代號）。

\`\`\`sql
CREATE TABLE student (
    sid  VARCHAR(10) PRIMARY KEY,
    name VARCHAR(30) NOT NULL
);
\`\`\`

#### （五）中介或詮釋資料 Metadata（5 分）

**意涵**：「**關於資料的資料**」，用來描述資料本身的結構、意義、來源、格式與用途，使資料易於理解、管理、搜尋與共享。

| 類型 | 例子 |
| --- | --- |
| 技術型 | 資料庫表格與欄位名稱、資料型態、長度、主鍵與外鍵、索引 |
| 業務型 | 欄位的業務定義、單位、編碼規則、資料擁有者 |
| 管理型 | 建立時間、修改者、版本、存取權限、更新頻率 |

例子：一張照片的 EXIF（拍攝時間、相機型號、GPS）；資料庫的資料字典（Data Dictionary）與系統目錄（System Catalog）；網頁的 meta 標籤。資料倉儲與資料治理都需要 Metadata 管理。`

      question: `當開發一應用軟體系統時，我們常使用到系統開發生命週期（System Development Life Cycle, SDLC）的觀念，請說明下圖所表示的意義為何？（25 分）
（附圖：由中心向外旋轉的紅色螺旋線，依順時針方向分為系統規劃、系統分析、系統設計、系統建置、系統維運五個部分。）`,
      answer: `#### 一、圖所表示的意義

圖是 SDLC 的**螺旋式（Spiral）或迭代式（Iterative）表示法**：

1. **五個階段**：系統規劃、系統分析、系統設計、系統建置、系統維運，沿螺旋**順時針**依序進行。
2. **每繞一圈就是一次迭代**：不是一次把五個階段做完就結束，而是反覆繞圈，每一圈都產出一個更完整的系統版本（原型、第一版、第二版……）。
3. **圈越往外越大**：象徵每一輪迭代的系統範圍、投入成本與完成度逐漸擴大；螺旋中心是最初的小規模構想，外圈是完整上線並持續維運的系統。
4. **維運之後回到規劃**：螺旋線在維運後接到下一圈的規劃，表示維運中產生的新需求、問題與改善想法，會成為下一輪的起點，系統是持續演進的。

#### 二、五個階段的內容

| 階段 | 核心問題 | 主要工作 | 主要產出 |
| --- | --- | --- | --- |
| 系統規劃（Planning） | 為什麼要做、值不值得做 | 辨識需求與問題、定義目標與範圍、可行性分析、成本與風險評估、排程 | 專案計畫、可行性報告 |
| 系統分析（Analysis） | 系統要做什麼 | 蒐集與分析需求、現行系統研究、建立需求模型（DFD、使用案例、ERD） | 需求規格、邏輯模型 |
| 系統設計（Design） | 系統怎麼做 | 架構、資料庫、程式與介面設計、安全與硬體網路規劃 | 系統設計書 |
| 系統建置（Implementation） | 把設計變成可用系統 | 程式撰寫、測試、資料轉換、教育訓練、上線 | 完整系統、測試報告、手冊 |
| 系統維運（Maintenance and Operation） | 系統如何穩定使用與改善 | 日常運作與備份、修錯、功能強化、效能與資安維護、評估汰換 | 維護紀錄、變更申請、績效報告 |

#### 三、螺旋式的優點與注意事項

| 項目 | 說明 |
| --- | --- |
| 風險導向 | 每圈開頭都評估風險，先做風險最高的部分（例如技術不確定的功能），問題早發現早處理 |
| 使用者早期參與 | 每圈產出可試用的版本，使用者回饋可立刻納入下一圈，降低「做出來不是要的」的風險 |
| 適合情境 | 需求不明確、專案大而複雜、技術風險高、可分批上線的系統 |
| 與瀑布式比較 | 瀑布式五個階段只走一次、前一階段完成才進下一階段，變更成本高；螺旋式反覆走，能容納變更 |
| 注意事項 | 專案管理較複雜，要控制每圈的範圍與完成標準，避免無止境迭代、成本與時程失控；風險評估需要有經驗的人員 |

      answer: `#### 一、多型的意義

**多型（Polymorphism，意為「多種形態」）**：不同類別的物件，收到**同一個訊息（呼叫同名方法）** 時，**各自以適合自己的方式回應**，執行不同的實作。呼叫者只需知道共同的父類別或介面，不必知道物件實際屬於哪個子類別。

多型建立在**繼承**與**方法覆寫（Override）** 之上，並以**動態繫結（Dynamic Binding）** 在執行期決定實際執行哪一個版本。它與封裝、繼承並稱物件導向三大特性。

#### 二、套用到本題：每月計算核發薪資

| 員工類型 | 薪資計算方式 |
| --- | --- |
| 全職員工 | 依職級與年資計算薪資，扣退撫金 |
| 兼職員工 | 依職級與年資，並乘上工作時數比例（本例以每月 160 小時為全職基準），扣退撫金 |
| 臨時員工 | 依職級與年資，比照全職，但不扣退撫金 |

**設計**：定義父類別 Employee，內含共同屬性（姓名、職級、年資）與抽象方法 salary()；全職、兼職、臨時三個子類別各自覆寫 salary()。

abstract class Employee {
    protected String name; protected int grade; protected int years;
    Employee(String n, int g, int y) { name = n; grade = g; years = y; }
    double base() { return 30000 + grade * 2000 + years * 500; }   // 示意公式
    double pension(double pay) { return pay * 0.08; }              // 退撫金示意 8%
    abstract double salary();                                       // 每種員工各自實作
}
class FullTime extends Employee {
    FullTime(String n, int g, int y) { super(n, g, y); }
    double salary() { return base() - pension(base()); }
}
class PartTime extends Employee {
    int hours;
    PartTime(String n, int g, int y, int h) { super(n, g, y); hours = h; }
    double salary() { double pay = base() * hours / 160.0; return pay - pension(pay); }
}
class Temp extends Employee {
    Temp(String n, int g, int y) { super(n, g, y); }
    double salary() { return base(); }                              // 不扣退撫金
}
public class Payroll {
    public static void main(String[] a) {
        Employee[] list = { new FullTime("王大明", 5, 10), new PartTime("李小華", 3, 4, 80), new Temp("張小美", 2, 1) };
        double total = 0;
        for (Employee e : list) {
            double s = e.salary();     // 多型：同一行程式，依實際物件執行不同版本
            total += s;
        }
        System.out.println(total);
    }
}

#### 三、多型的好處（在本例）

| 好處 | 說明 |
| --- | --- |
| 簡化呼叫端 | 月底核發程式只寫 \`e.salary()\`，不必用 if 或 switch 判斷員工種類 |
| 易於擴充 | 新增「約聘員工」只要新增子類別並覆寫 salary()，核發主程式完全不用修改（開放封閉原則） |
| 降低耦合 | 呼叫端只依賴 Employee，不依賴具體子類別 |
| 提高維護性 | 各類員工的算法各自封裝，改動一種不影響其他 |

**反面對照**：沒有多型時，核發程式要寫 \`if (type == 全職) ... else if (type == 兼職) ...\`，每增加一種員工就要改主程式，容易出錯。

#### 四、多型的種類（補充）

1. **子類型多型（覆寫）**：本題所用，執行期決定。
2. **多載（Overload）**：同名方法、參數不同，編譯期決定，例如 \`salary(int month)\`、\`salary()\`。
3. **參數化多型（泛型）**：同一份程式碼適用不同型態。

**結論**：多型使核發薪資時能以一致的方式對待不同員工物件，而由各物件自行決定計算方法，達到彈性、可擴充與易維護。`

軟體專案管理常從幾個構面來看（常見的 4P：人員 People、產品 Product、**流程 Process**、專案 Project）。其中**作業流程構面（Process Dimension）** 指的是：**專案要經過哪些步驟、依什麼順序、產出什麼成果、由誰負責、如何管控**，也就是把專案的工作定義成一套標準化、可重複、可管理的「作業程序」。

| 面向 | 說明 |
| --- | --- |
| 活動與順序 | 專案從啟動到結案的階段及各階段活動 |
| 產出（交付物） | 每個階段要交出的文件與成果（計畫書、規格書、程式、測試報告） |
| 角色與責任 | 誰負責、誰審核、誰核准 |
| 查核點與審查 | 里程碑與品質關卡，通過才能進入下一步 |
| 管理活動 | 範圍、時程、成本、品質、風險、變更、溝通與採購管理貫穿全程 |
| 流程改善 | 透過 CMMI 等成熟度模型標準化與持續改善 |

好的作業流程使專案**可預期、可控制、可稽核**，尤其在多方參與的外包專案中，是雙方溝通與責任劃分的共同基礎。
